    <div class="card flat stack-sm" style="background:var(--surface-2);border:0">
      <div class="row between"><span class="muted small">Média geral (as 5 provas)</span><b class="mono" style="font-size:1.8rem;color:${media === null ? "var(--ink-3)" : media >= meta ? "var(--good)" : "var(--warn)"}">${media === null ? "—" : media.toFixed(1)}</b></div>
      ${media !== null ? `${bar(media/1000, media >= meta ? "var(--good)" : "var(--warn)")}<span class="small">${media >= meta ? `Acima da sua meta de ${meta}. Continue assim!` : `Faltam ${Math.round(meta - media)} pontos para a meta de ${meta}.`}</span>` : `<span class="small muted">Faça a prova completa (dias 1 e 2), uma prova oficial ou salve uma redação para completar o boletim.</span>`}
    </div>
    <div class="row"><button class="btn sm" data-go="oficial">${icon("exam")} Fazer prova oficial</button><button class="btn sm" data-go="simulado">Prova completa do app</button>${have.length ? `<button class="btn ghost sm" data-act="notas-calc">Usar no simulador do SISU</button>` : ""}</div>
    <p class="xs faint">A nota do ENEM usa a TRI, que considera quais questões você acertou. Aqui a nota é uma estimativa a partir do número de acertos, com base em faixas típicas de edições anteriores. A nota real pode variar.</p>
  </section>`;
}

/* ---------- provas oficiais com cartão-resposta ---------- */
const OFICIAL = [["2024","D1"],["2024","D2"],["2023","D1"],["2023","D2"]];
const pdfURL = (y, d) => `https://download.inep.gov.br/enem/provas_e_gabaritos/${y}_PV_impresso_${d}_${d === "D1" ? "CD1" : "CD7"}.pdf`;
const gabURL = (y, d) => `https://download.inep.gov.br/enem/provas_e_gabaritos/${y}_GB_impresso_${d}_${d === "D1" ? "CD1" : "CD7"}.pdf`;
function ofKey(y, d){ return `${y}-${d}`; }
function ofState(y, d){ S.oficial = S.oficial || {}; const k = ofKey(y,d); S.oficial[k] = S.oficial[k] || {ans:{}, lang:"ing", res:null}; return S.oficial[k]; }
function gabarito(y, n, lang){ const g = GAB[y]; if (n <= 5) return (lang === "esp" ? g.esp : g.ing)[n-1]; return g.resto[n-6]; }
function ofAreas(d){ return d === "D1" ? [["lin",1,45],["hum",46,90]] : [["nat",91,135],["mat",136,180]]; }
function vOficial(){
  return `<div class="stack-lg">
    ${topnav("Provas oficiais do ENEM", "simulado")}
    <section class="hero stack stagger"><span class="eyebrow">Prova de verdade</span><h1>Refaça o ENEM de 2023 e 2024</h1><p class="muted">Abra o caderno azul oficial do INEP (PDF gratuito), resolva no papel ou na tela e marque as respostas no cartão-resposta do app. No final, o app corrige com o gabarito oficial e estima sua nota.</p></section>
    <div class="card stack"><h3>Como fazer</h3><ol class="steps-list"><li>Separe 5h30 (dia 1) ou 5h (dia 2), como na prova real.</li><li>Toque em <b>Abrir caderno azul</b>. É o PDF oficial do INEP.</li><li>Toque em <b>Cartão-resposta</b> e marque suas respostas.</li><li>Toque em <b>Corrigir</b> para ver acertos, erros e a nota estimada.</li></ol></div>
    <div class="grid2 stagger">${OFICIAL.map(([y,d]) => { const st = ofState(y,d), n = Object.keys(st.ans).length; return `<div class="card stack">
      <div class="row between"><span class="eyebrow">ENEM ${y} · ${d === "D1" ? "1º dia" : "2º dia"}</span>${st.res ? `<span class="tag" style="background:var(--good-soft);color:var(--good)">Corrigida</span>` : n ? `<span class="tag">${n}/90 marcadas</span>` : ""}</div>
      <h3>${d === "D1" ? "Linguagens e Ciências Humanas" : "Ciências da Natureza e Matemática"}</h3>
      ${st.res ? `<div class="row">${ofAreas(d).map(([a]) => `<span class="tag" style="${cs(a)};background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)">${AREAS[a].nome}: ${st.res[a].ok} acertos · ~${st.res[a].tri}</span>`).join("")}</div>` : `<p class="small muted">${d === "D1" ? "90 questões + redação · 5h30" : "90 questões · 5h"} · caderno azul</p>`}
      <div class="grid2" style="grid-template-columns:1fr 1fr"><a class="btn sm" href="${pdfURL(y,d)}" target="_blank" rel="noopener">${icon("download")} Caderno azul</a><button class="btn primary sm" data-cartao="${y}:${d}">Cartão-resposta</button></div>
    </div>`; }).join("")}</div>
    <p class="xs faint">As provas e os gabaritos são publicações oficiais e gratuitas do INEP. O app não copia as questões: ele só usa o gabarito oficial para corrigir o seu cartão-resposta.</p>
  </div>`;
}
function vCartao(){
  const [y, d] = [R.y, R.d], st = ofState(y, d), done = !!st.res;
  const rows = [];
  ofAreas(d).forEach(([a, from, to]) => {
    rows.push(`<h3 class="cartao-h" style="${cs(a)}"><span class="area-lbl" style="${cs(a)}">${AREAS[a].longo}</span><span class="xs faint">questões ${from} a ${to}</span></h3>`);
    const cells = [];
    for (let n = from; n <= to; n++) {
      const g = gabarito(y, n, st.lang), mine = st.ans[n];
      cells.push(`<div class="qrow"><span class="qn mono">${pad(n)}</span>${"ABCDE".split("").map(L => {
        let cls = "";
        if (done) { if (g === "X") cls = "anul"; else if (L === g) cls = "right"; else if (L === mine) cls = "wrongpick"; }
        return `<button class="bub ${cls}" data-bub="${n}:${L}" aria-pressed="${mine === L}" ${done ? "disabled" : ""} aria-label="Questão ${n}, alternativa ${L}">${L}</button>`;
      }).join("")}${done && g === "X" ? `<span class="xs faint">anulada</span>` : ""}</div>`);
    }
    rows.push(`<div class="cartao-grid">${cells.join("")}</div>`);
  });
  const marked = Object.keys(st.ans).length;
  return `<div class="stack-lg">
    ${topnav(`ENEM ${y} · ${d === "D1" ? "1º dia" : "2º dia"}`, "oficial")}
    ${done ? ofResultHTML(y, d, st) : `<div class="card stack">
      <div class="row between"><span class="small muted">Caderno <b>azul</b> · <span id="cmarked">${marked}</span>/90 marcadas</span><a class="btn ghost sm" href="${pdfURL(y,d)}" target="_blank" rel="noopener">${icon("download")} Abrir prova</a></div>
      ${d === "D1" ? `<div class="field"><span class="small">Língua estrangeira (questões 1 a 5)</span><div class="seg"><button data-lang="ing" aria-pressed="${st.lang === "ing"}">Inglês</button><button data-lang="esp" aria-pressed="${st.lang === "esp"}">Espanhol</button></div></div>` : ""}
    </div>`}
    <section class="cartao">${rows.join("")}</section>
    ${done ? `<button class="btn block" data-act="of-refazer">Apagar marcações e refazer</button>` : `<div class="sticky-cta"><button class="btn primary block" style="min-height:56px" data-act="of-corrigir">${icon("check", 2.4)} Corrigir prova</button></div>`}
    ${R.ofConfirm ? `<div class="confirm"><span>Você deixou ${90 - marked} questões em branco. No ENEM, em branco é erro garantido. Quer corrigir mesmo assim?</span><div class="row"><button class="btn danger" data-act="of-corrigir-sim">Corrigir assim</button><button class="btn" data-act="of-voltar">Voltar e marcar</button></div></div>` : ""}
  </div>`;
}
function ofCorrigir(){
  const [y, d] = [R.y, R.d], st = ofState(y, d), res = {};
  ofAreas(d).forEach(([a, from, to]) => {
    let ok = 0, valid = 0;
    for (let n = from; n <= to; n++) { const g = gabarito(y, n, st.lang); if (g === "X") continue; valid++; if (st.ans[n] === g) ok++; }
    res[a] = {ok, valid, tri:triEstimate(a, ok, valid)};
    setNota(a, res[a].tri, `ENEM ${y}`);
  });
  st.res = res; R.ofConfirm = false; save();
  const total = Object.values(res).reduce((s,x) => s + x.ok, 0);
  render(); window.scrollTo(0,0);
  addXP(40 + total);
  if (total >= 45) setTimeout(confetti, 300);
}
function ofResultHTML(y, d, st){
  const wrong = [];
  ofAreas(d).forEach(([a, from, to]) => { for (let n = from; n <= to; n++) { const g = gabarito(y, n, st.lang); if (g !== "X" && st.ans[n] !== g) wrong.push(n); } });
  return `<section class="card pad-lg stack stagger">
    <span class="eyebrow">Resultado · gabarito oficial</span>
    <div class="grid2">${ofAreas(d).map(([a]) => { const r = st.res[a]; return `<div class="row nowrap" style="gap:14px">${ring(r.ok / r.valid, 86, 9, `<span>${r.ok}</span>`, AREAS[a].cor)}<div class="stack-xs"><span class="area-lbl" style="${cs(a)}">${AREAS[a].nome}</span><b class="mono" style="font-size:1.6rem">~${r.tri}</b><span class="xs muted">${r.ok} de ${r.valid} acertos</span></div></div>`; }).join("")}</div>
    <p class="small muted">Questões para revisar: ${wrong.length ? wrong.map(n => `<b class="mono">${n}</b>`).join(", ") : "nenhuma. Gabaritou!"}. No cartão abaixo, verde é a resposta certa e vermelho é o que você marcou errado.</p>
    ${d === "D1" ? `<button class="btn area" style="${cs("red")}" data-red-tab="escrever">Agora escreva a redação desse dia</button>` : ""}
  </section>`;
}

/* ---------- prova completa com as questões do app ---------- */
function startFullDay(day){
  const pick = a => shuffle(QUESTIONS.filter(q => q.a === a)).slice(0, 45).map(q => q.id);
  const ids = day === 1 ? pick("lin").concat(pick("hum")) : pick("nat").concat(pick("mat"));
  startQuiz("sim", ids, {minutes: day === 1 ? 330 : 300, full: day});
}

/* ---------- lembretes: agenda, notificações e ligação ---------- */
const DAYCODES = ["SU","MO","TU","WE","TH","FR","SA"];
function appURL(){ return HOSTED ? location.origin + location.pathname : "https://goncalvesrafaelag-dot.github.io/gabarito-enem-2026/"; }
function icsText(){
  const [h, m] = (S.settings.studyTime || "19:00").split(":");
  const t = today0(), until = parseYMD(S.settings.d2);
  const dt = `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}T${h}${m}00`;
  const un = `${until.getFullYear()}${pad(until.getMonth()+1)}${pad(until.getDate())}T235900`;
  const days = DAYCODES.filter((_, i) => S.settings.days[i]).join(",");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Gabarito ENEM 2026//PT-BR","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:gabarito-estudo-${Date.now()}@gabarito`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART:${dt}`, `DURATION:PT${Math.max(1, S.settings.hours)}H`, `RRULE:FREQ=WEEKLY;BYDAY=${days};UNTIL=${un}`,
    "SUMMARY:📞 Gabarito ligando: hora de estudar!", `DESCRIPTION:Opa! Tá na hora de estudar para o ENEM. Abra o app e faça as tarefas de hoje: ${appURL()}`,
    `URL:${appURL()}`,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:📞 Hora de estudar!","TRIGGER:-PT0M","END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Daqui a 10 minutos: estudo do ENEM","TRIGGER:-PT10M","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function downloadICS(){
  if (!HOSTED) return toast("Baixar arquivos funciona na versão do app no GitHub Pages.");
  const blob = new Blob([icsText()], {type:"text/calendar"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lembretes-estudo-enem.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast("Abra o arquivo baixado para adicionar os alarmes à agenda.");
}
function gcalURL(){
  const [h, m] = (S.settings.studyTime || "19:00").split(":");
  const t = today0(), s = new Date(t); s.setHours(+h, +m, 0, 0); const e = new Date(s.getTime() + Math.max(1, S.settings.hours) * 3600000);
  const f = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const until = parseYMD(S.settings.d2), un = `${until.getFullYear()}${pad(until.getMonth()+1)}${pad(until.getDate())}`;
  const days = DAYCODES.filter((_, i) => S.settings.days[i]).join(",");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("📞 Gabarito ligando: hora de estudar!") +
    "&dates=" + f(s) + "/" + f(e) + "&details=" + encodeURIComponent("Abra o app e faça as tarefas de hoje: " + appURL()) +
    "&recur=" + encodeURIComponent(`RRULE:FREQ=WEEKLY;BYDAY=${days};UNTIL=${un}`);
}
function lembretesHTML(){
  const perm = ("Notification" in window) ? Notification.permission : "indisponível";
  return `<section class="card pad-lg stack" id="lembretes">
    <div class="row between"><div class="stack-xs"><span class="eyebrow">Para não esquecer</span><h2>Lembretes e ligação</h2></div><span style="color:var(--fire)">${icon("phone")}</span></div>
    <p class="small muted">No horário de estudo, o <b>Professor Gabarito</b> “liga” quando você abre o app, e o celular toca um alarme na agenda.</p>
    <label class="field"><span>Horário de estudo</span><input type="time" id="studyTime" value="${S.settings.studyTime || "19:00"}"></label>
    <label class="checkline"><input type="checkbox" id="remindOn" ${S.settings.remind !== false ? "checked" : ""}><span>Receber a ligação do Professor Gabarito no horário de estudo</span></label>
    <div class="stack-sm">
      <a class="btn primary block" href="${gcalURL()}" target="_blank" rel="noopener">${icon("cal")} Criar alarmes no Google Agenda</a>
      <button class="btn block" data-act="ics">${icon("download")} Baixar alarmes para qualquer agenda (iPhone e outros)</button>
      <button class="btn block" data-act="notif">${icon("bell")} ${perm === "granted" ? "Notificações ativadas" : "Ativar notificações do app"}</button>
      <button class="btn ghost block" data-act="call-test">${icon("phone")} Testar a ligação agora</button>
    </div>
    <p class="xs faint">O alarme da agenda funciona mesmo com o app fechado. As notificações do app aparecem quando ele está aberto ou em segundo plano.</p>
  </section>`;
}
let ringCtx = null, ringTimer = null, vibTimer = null;
function ring_start(){
  try {
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beepOnce = () => { [0, .35].forEach(s => { const o = ringCtx.createOscillator(), g = ringCtx.createGain(); o.type = "sine"; o.frequency.value = 660; const o2 = ringCtx.createOscillator(); o2.frequency.value = 880; o2.connect(g); o.connect(g); g.connect(ringCtx.destination); const t = ringCtx.currentTime + s; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.15, t + .02); g.gain.setValueAtTime(.15, t + .28); g.gain.linearRampToValueAtTime(0, t + .3); o.start(t); o2.start(t); o.stop(t + .31); o2.stop(t + .31); }); };
    beepOnce(); ringTimer = setInterval(beepOnce, 2200);
  } catch(e) {}
  vibrate([600,300,600]); vibTimer = setInterval(() => vibrate([600,300,600]), 2200);
}
function ring_stop(){ clearInterval(ringTimer); clearInterval(vibTimer); try { ringCtx && ringCtx.close(); } catch(e) {} ringCtx = null; vibrate(0); }
function callMessage(){
  const rec = recommended(), nm = S.name || "futuro psicólogo";
  const streak = streakNow();
  return `Opa, ${nm}! Aqui é o Professor Gabarito. Tá na hora de estudar! ${streak ? `Você está com ${streak === 1 ? "1 dia de sequência" : streak + " dias seguidos"}, não vai quebrar a sequência agora, né? ` : ""}Hoje a gente começa por ${rec ? rec.t : "uma revisão rápida"}. São só uns 50 minutinhos. Faltam ${Math.max(0, diffDays(today0(), parseYMD(S.settings.d1)))} dias para o ENEM. Bora?`;
}
function showCall(){
  if ($("#callScreen")) return;
  const el = document.createElement("div"); el.id = "callScreen"; el.className = "call";
  el.innerHTML = `<div class="call-top"><span class="eyebrow" style="color:rgba(255,255,255,.7)">Chamada recebida</span><div class="call-av"><span>Ψ</span></div><h1 style="color:#fff">Professor Gabarito</h1><p style="color:rgba(255,255,255,.75)" id="callStatus">ligando…</p></div>
    <div class="call-btns" id="callBtns"><div class="stack-xs" style="align-items:center"><button class="call-btn no" data-act="call-no" aria-label="Recusar">${icon("phone", 2.2)}</button><span>Recusar</span></div><div class="stack-xs" style="align-items:center"><button class="call-btn yes" data-act="call-yes" aria-label="Atender">${icon("phone", 2.2)}</button><span>Atender</span></div></div>`;
  document.body.appendChild(el);
  ring_start();
}
function answerCall(){
  ring_stop();
  const msg = callMessage();
  $("#callStatus").textContent = "em ligação · 00:00";
  let s = 0; const tmr = setInterval(() => { s++; const st = $("#callStatus"); if (st) st.textContent = `em ligação · ${pad(Math.floor(s/60))}:${pad(s%60)}`; else clearInterval(tmr); }, 1000);
  $("#callBtns").outerHTML = `<div class="call-msg"><p id="callText"></p><div class="stack-sm" style="width:100%"><button class="btn white block" data-act="call-go">${icon("play")} Bora estudar!</button><button class="btn block" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)" data-act="call-later">Me liga em 10 minutos</button></div></div>`;
  const out = $("#callText"); let i = 0;
  const type = setInterval(() => { if (!out || i > msg.length) return clearInterval(type); out.textContent = msg.slice(0, i++); }, 22);
  try { const u = new SpeechSynthesisUtterance(msg); u.lang = "pt-BR"; u.rate = 1.02; u.pitch = 1; const v = speechSynthesis.getVoices().find(v => /pt(-|_)BR/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e) {}
}
function endCall(snoozeMin){
  ring_stop(); try { speechSynthesis.cancel(); } catch(e) {}
  const el = $("#callScreen"); if (el) el.remove();
  if (snoozeMin) { S.snooze = Date.now() + snoozeMin * 60000; save(); toast(`Beleza! Eu te ligo de novo em ${snoozeMin} minutos.`); }
}
function studyDue(){
  if (!S.setup || S.settings.remind === false) return false;
  const now = new Date(), [h, m] = (S.settings.studyTime || "19:00").split(":").map(Number);
  const t = ymd(today0());
  if (!S.settings.days[now.getDay()]) return false;
  if (S.snooze && Date.now() < S.snooze) return false;
  if (S.snooze && Date.now() >= S.snooze) { S.snooze = 0; S.called = S.called || {}; delete S.called[t]; }
  if (now.getHours() * 60 + now.getMinutes() < h * 60 + m) return false;
  if ((S.called || {})[t]) return false;
  return todayXP() < S.settings.goal;
}
function checkCall(){
  if (!studyDue()) return;
  S.called = S.called || {}; S.called[ymd(today0())] = 1; save();
  if (document.visibilityState === "visible") showCall();
  else notify("📞 Professor Gabarito está ligando", "Opa! Tá na hora de estudar. Toque aqui para começar a lição de hoje.");
}
function notify(title, body){
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const opts = {body, icon:"icon-192.png", badge:"icon-192.png", tag:"estudo", requireInteraction:true, vibrate:[500,200,500]};
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opts));
    else new Notification(title, opts);
  } catch(e) {}
}
async function askNotif(){
  if (!("Notification" in window)) return toast("Este navegador não permite notificações. Use os alarmes da agenda.");
  if (!HOSTED) return toast("As notificações funcionam na versão do app no GitHub Pages.");
  const p = await Notification.requestPermission();
  if (p === "granted") { toast("Notificações ativadas!"); notify("Tudo certo!", "Vou te lembrar no horário de estudo."); }
  else toast("Sem permissão. Os alarmes da agenda continuam funcionando.");
  render();
}
setInterval(checkCall, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(checkCall, 800); });

/* ---------- instalar como app ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (R.v === "inicio") render(); });
function installHTML(){
  if (!HOSTED || matchMedia("(display-mode: standalone)").matches || S.hideInstall) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<section class="card row nowrap" style="gap:14px"><span class="brand-mark" style="flex:none">Ψ</span><div class="grow stack-xs"><b>Instale o app no celular</b><span class="small muted">${installEvt ? "Fica com ícone na tela inicial e abre direto, sem navegador." : ios ? "No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”." : "No Chrome: menu ⋮ e depois “Instalar app” ou “Adicionar à tela inicial”."}</span></div>${installEvt ? `<button class="btn primary sm" data-act="install">Instalar</button>` : `<button class="icon-btn" data-act="hide-install" aria-label="Fechar">${icon("x")}</button>`}</section>`;
}
if (HOSTED && "serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }

/* =========================================================
   INÍCIO DO APP
   ========================================================= */
T.left = MODES[T.mode][0]*60;
if (!S.plan) generatePlan();
checkBadges(); modalQueue.length = 0;
const h0 = location.hash.slice(1);
R = {v: ["estudar","plano","redacao","perfil","simulado","flash","foco","prova"].includes(h0) ? h0 : "inicio"};
try { history.replaceState(R, "", "#" + R.v); } catch(e) {}
render();
setTimeout(checkCall, 1500);

</script>

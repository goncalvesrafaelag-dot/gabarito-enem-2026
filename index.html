DATA.push({id:"arit", a:"mat", nome:"Aritmética e Álgebra", lessons:[
{t:"Razão, proporção e regra de três", inc:"A", r:"O assunto mais frequente da prova de Matemática. Receitas, mapas, velocidades e divisões proporcionais.", v:"razão proporção regra de três enem aula",
c:[
"## Razão e proporção",
"- **Razão** é uma comparação por divisão: a/b. Exemplo: numa sala com 12 meninas e 18 meninos, a razão meninas:meninos é 12/18 = 2/3.",
"- **Proporção** é a igualdade entre razões: a/b = c/d → **a·d = b·c** (produto dos meios = produto dos extremos).",
"## Grandezas diretamente proporcionais",
"Quando uma aumenta, a outra aumenta na **mesma razão**. Exemplos: quantidade de ingredientes × número de porções; distância × combustível.",
"> Receita para 4 pessoas usa 300 g de farinha. Para 10 pessoas: 300/4 = x/10 → x = 750 g.",
"## Grandezas inversamente proporcionais",
"Quando uma aumenta, a outra **diminui** na mesma razão. O produto é constante. Exemplos: velocidade × tempo; número de operários × dias de obra.",
"> 6 pedreiros fazem um muro em 10 dias. 12 pedreiros fazem em: 6 × 10 = 12 × x → x = 5 dias.",
"## Regra de três composta",
"Quando há três ou mais grandezas:",
"1. Monte a tabela com as grandezas em colunas.",
"2. Compare **cada** grandeza com a da incógnita: diretamente (D) ou inversamente (I) proporcional?",
"3. Inverta as frações das grandezas inversas e multiplique.",
"> 5 máquinas produzem 400 peças em 8 horas. Quantas peças 10 máquinas produzem em 6 horas? Máquinas: D; horas: D. x = 400 × (10/5) × (6/8) = 400 × 2 × 0,75 = 600 peças.",
"## Divisão proporcional",
"Dividir 900 reais entre duas pessoas na proporção 4 e 5: somam-se as partes (4 + 5 = 9), divide-se (900 ÷ 9 = 100) e multiplica-se: 400 e 500.",
"> Dica ENEM: antes de calcular, pense se o resultado deve aumentar ou diminuir. Isso já elimina alternativas."
],
q:[
["Uma receita de bolo para 6 pessoas usa 3 ovos e 450 g de farinha. Para 10 pessoas, a quantidade de farinha necessária é",["600 g","675 g","750 g","800 g","900 g"],2,"450/6 = 75 g por pessoa. 75 × 10 = 750 g."],
["Com velocidade média de 80 km/h, uma viagem dura 3 horas. Com velocidade média de 60 km/h, a mesma viagem duraria",["2 h 15 min","3 h 30 min","4 h","4 h 30 min","5 h"],2,"Velocidade e tempo são inversamente proporcionais: 80 × 3 = 60 × t → t = 4 h."],
["Uma herança de R$ 60.000,00 será dividida entre três irmãos em partes proporcionais às idades 10, 12 e 18 anos. O mais velho receberá",["R$ 15.000,00","R$ 18.000,00","R$ 20.000,00","R$ 24.000,00","R$ 27.000,00"],4,"Soma das partes: 10 + 12 + 18 = 40. Cada parte vale 60.000 ÷ 40 = 1.500. O mais velho recebe 18 × 1.500 = R$ 27.000,00."],
["Oito torneiras enchem um tanque em 9 horas. Quantas horas 12 torneiras iguais levariam para encher o mesmo tanque?",["4","5","6","12","13,5"],2,"Inversamente proporcionais: 8 × 9 = 12 × t → t = 72 ÷ 12 = 6 horas."],
["4 impressoras imprimem 1.200 páginas em 5 horas. Quantas páginas 6 impressoras iguais imprimem em 4 horas?",["1.200","1.280","1.440","1.600","1.800"],2,"Ambas as grandezas são diretas: 1.200 × (6/4) × (4/5) = 1.200 × 1,5 × 0,8 = 1.440 páginas."]
]},
{t:"Porcentagem", inc:"A", r:"Aumentos, descontos, variações sucessivas e porcentagem de porcentagem.", v:"porcentagem aumentos e descontos sucessivos enem aula",
c:[
"## O que é",
"Porcentagem é uma razão com denominador 100: 25% = 25/100 = 0,25.",
"- 10% de um valor: basta dividir por 10. 1%: dividir por 100.",
"- 35% de 80 = 0,35 × 80 = 28.",
"## Fator multiplicativo (o segredo!)",
"- **Aumento de p%:** multiplique por (1 + p/100). Aumento de 15% → × 1,15.",
"- **Desconto de p%:** multiplique por (1 − p/100). Desconto de 30% → × 0,70.",
"## Variações sucessivas",
"Multiplique os fatores. **Não some as porcentagens!**",
"> Aumento de 20% e depois desconto de 20%: 1,2 × 0,8 = 0,96 → o valor final é 4% **menor** que o inicial.",
"> Dois aumentos de 10%: 1,1 × 1,1 = 1,21 → aumento total de 21%.",
"## Descobrir a porcentagem de variação",
"**Variação % = (valor novo − valor antigo) ÷ valor antigo × 100.**",
"> Um produto passou de R$ 50 para R$ 65: (65 − 50) ÷ 50 = 0,30 = aumento de 30%.",
"## Descobrir o valor original",
"Se um produto custa R$ 84 após um desconto de 30%, então 0,70 × x = 84 → x = R$ 120.",
"## Pontos percentuais",
"Se a taxa de desemprego passou de 10% para 12%, ela subiu **2 pontos percentuais**, mas **20%** em termos relativos (2 ÷ 10). O ENEM adora essa diferença."
],
q:[
["Um celular de R$ 1.500,00 está com 12% de desconto no pagamento à vista. O preço à vista é",["R$ 1.180,00","R$ 1.300,00","R$ 1.320,00","R$ 1.350,00","R$ 1.488,00"],2,"1.500 × 0,88 = R$ 1.320,00."],
["Um salário teve aumento de 10% em janeiro e de 5% em julho. O aumento acumulado no ano foi de",["15%","15,5%","16%","14,5%","50%"],1,"1,10 × 1,05 = 1,155 → 15,5% de aumento acumulado."],
["O preço de um produto subiu 25% e, depois, caiu 20%. Em relação ao preço original, o preço final",["ficou 5% maior.","ficou 5% menor.","ficou igual.","ficou 45% maior.","ficou 10% menor."],2,"1,25 × 0,80 = 1,00: o preço final é igual ao original."],
["Após um desconto de 25%, uma camiseta passou a custar R$ 45,00. Seu preço original era",["R$ 56,25","R$ 60,00","R$ 65,00","R$ 70,00","R$ 33,75"],1,"0,75 × x = 45 → x = 60."],
["Em uma cidade, a taxa de desemprego passou de 8% para 10%. É correto afirmar que ela aumentou",["2%","2 pontos percentuais, o que corresponde a um aumento relativo de 25%.","10 pontos percentuais.","20%.","18%."],1,"A diferença é de 2 pontos percentuais; em termos relativos, 2 ÷ 8 = 0,25 = 25%."]
]},
{t:"Matemática financeira", inc:"A", r:"Juros simples e compostos, comparação de planos de pagamento e financiamentos.", v:"juros simples e compostos matemática financeira enem aula",
c:[
"## Termos",
"- **Capital (C):** o valor inicial. **Taxa (i):** porcentagem por período. **Tempo (t):** número de períodos. **Montante (M):** valor final = capital + juros.",
"- **Atenção:** a taxa e o tempo precisam estar na mesma unidade (ao mês com meses, ao ano com anos).",
"## Juros simples",
"Os juros são calculados sempre sobre o capital inicial, e crescem de forma linear (como uma PA).",
"- **J = C · i · t** e **M = C + J**.",
"> R$ 2.000 a 3% ao mês por 5 meses: J = 2.000 × 0,03 × 5 = R$ 300; M = R$ 2.300.",
"## Juros compostos",
"“Juros sobre juros”: a cada período, os juros incidem sobre o montante anterior, com crescimento exponencial (como uma PG). É o sistema usado por bancos, cartões e financiamentos.",
"- **M = C · (1 + i)ᵗ**",
"> R$ 1.000 a 10% ao mês por 3 meses: M = 1.000 × 1,1³ = 1.000 × 1,331 = R$ 1.331.",
"## Comparação",
"No primeiro período, simples e compostos rendem igual. Depois, os compostos rendem cada vez mais.",
"## Situações comuns no ENEM",
"- **Comparar planos:** à vista com desconto x parcelado. Calcule o total pago em cada opção.",
"- **Cartão de crédito e cheque especial:** juros compostos altíssimos. O endividamento cresce rápido.",
"- **Inflação:** reduz o poder de compra. Um rendimento real positivo precisa superar a inflação.",
"> Ligação com a redação: endividamento das famílias e apostas on-line (bets) são temas atuais."
],
q:[
["Um empréstimo de R$ 5.000,00 a juros simples de 2% ao mês será pago após 6 meses. O montante é",["R$ 5.200,00","R$ 5.600,00","R$ 6.000,00","R$ 5.630,81","R$ 6.200,00"],1,"J = 5.000 × 0,02 × 6 = 600. M = 5.600."],
["Um capital de R$ 2.000,00 aplicado a juros compostos de 5% ao mês, após 2 meses, gera o montante de",["R$ 2.100,00","R$ 2.200,00","R$ 2.205,00","R$ 2.210,00","R$ 2.250,00"],2,"M = 2.000 × 1,05² = 2.000 × 1,1025 = R$ 2.205,00."],
["Uma TV custa R$ 2.000,00 à vista ou em 10 parcelas de R$ 230,00. Quanto se paga a mais no parcelado?",["R$ 30,00","R$ 230,00","R$ 300,00","R$ 2.300,00","R$ 200,00"],2,"10 × 230 = 2.300. A diferença é 2.300 − 2.000 = R$ 300,00."],
["A diferença entre juros simples e compostos é que, nos compostos,",["os juros são calculados sempre sobre o capital inicial.","os juros de cada período são calculados sobre o montante acumulado.","não há cobrança de juros.","o crescimento é linear.","a taxa diminui com o tempo."],1,"Nos juros compostos, os juros de cada período se incorporam ao capital: juros sobre juros."],
["Uma dívida de R$ 1.000,00 no cartão de crédito cresce a juros compostos de 10% ao mês. Sem pagamento, após 3 meses ela será de",["R$ 1.300,00","R$ 1.310,00","R$ 1.331,00","R$ 1.030,00","R$ 1.210,00"],2,"1.000 × 1,1³ = 1.000 × 1,331 = R$ 1.331,00."]
]},
{t:"Grandezas, medidas e escalas", inc:"A", r:"Conversões de unidades, áreas, volumes, capacidade e escalas de mapas e maquetes.", v:"conversão de unidades escala enem matemática aula",
c:[
"## Conversões básicas",
"- **Comprimento:** km → hm → dam → m → dm → cm → mm (cada degrau × 10).",
"- **Área:** cada degrau × **100**. 1 m² = 10.000 cm²; 1 km² = 1.000.000 m²; 1 hectare = 10.000 m².",
"- **Volume:** cada degrau × **1.000**. 1 m³ = 1.000 dm³ = 1.000.000 cm³.",
"- **Capacidade:** **1 dm³ = 1 L**, **1 m³ = 1.000 L**, 1 cm³ = 1 mL.",
"- **Massa:** 1 t = 1.000 kg; 1 kg = 1.000 g.",
"- **Tempo:** 1 h = 60 min = 3.600 s. Cuidado: **1,5 h = 1 h 30 min**, e não 1 h 50 min!",
"## Escalas",
"**Escala = medida no desenho ÷ medida real** (na mesma unidade).",
"> Planta na escala 1:50 → 1 cm no desenho = 50 cm no real. Uma parede de 8 cm no desenho mede 4 m.",
"## Escala de área e de volume (pegadinha clássica!)",
"Se o comprimento é multiplicado por **k**:",
"- a **área** é multiplicada por **k²**;",
"- o **volume** é multiplicado por **k³**.",
"> Uma maquete na escala 1:100: 1 cm² na maquete = 10.000 cm² = 1 m² no real. Um cubo com aresta dobrada tem volume 8 vezes maior.",
"## Notação científica e ordens de grandeza",
"Números muito grandes ou pequenos: a × 10ⁿ (1 ≤ a < 10). Exemplos: 3.200.000 = 3,2 × 10⁶ e 0,00045 = 4,5 × 10⁻⁴."
],
q:[
["Um aquário tem 60 cm de comprimento, 30 cm de largura e 40 cm de altura. Sua capacidade é de",["7,2 L","72 L","720 L","7.200 L","130 L"],1,"V = 60 × 30 × 40 = 72.000 cm³. Como 1.000 cm³ = 1 L, são 72 L."],
["Um terreno retangular de 200 m por 150 m tem área de",["3 hectares","30 hectares","0,3 hectare","300 hectares","35 hectares"],0,"Área = 30.000 m². Como 1 hectare = 10.000 m², são 3 hectares."],
["Na planta de uma casa, na escala 1:50, um quarto mede 8 cm por 6 cm. A área real do quarto é",["12 m²","24 m²","48 m²","14 m²","120 m²"],0,"8 cm → 4 m e 6 cm → 3 m. Área = 4 × 3 = 12 m²."],
["Uma caixa em forma de cubo teve a aresta triplicada. Seu volume ficou",["3 vezes maior","6 vezes maior","9 vezes maior","27 vezes maior","12 vezes maior"],3,"O volume varia com o cubo da escala linear: 3³ = 27."],
["Um corredor completou uma prova em 1,75 hora. Esse tempo equivale a",["1 h 75 min","1 h 45 min","1 h 07 min","1 h 57 min","1 h 30 min"],1,"0,75 h × 60 = 45 min. Portanto, 1 h 45 min."]
]},
{t:"Sequências: PA e PG", inc:"M", r:"Progressões aritméticas e geométricas, termo geral e soma.", v:"progressão aritmética geométrica enem aula",
c:[
"## Progressão Aritmética (PA)",
"Cada termo é o anterior **mais** uma constante r (razão). Exemplo: 3, 7, 11, 15... (r = 4).",
"- **Termo geral:** aₙ = a₁ + (n − 1)·r.",
"- **Soma dos n termos:** Sₙ = (a₁ + aₙ)·n ÷ 2.",
"> Uma pessoa guarda R$ 10 na 1ª semana, R$ 15 na 2ª, R$ 20 na 3ª... Na 20ª semana: a₂₀ = 10 + 19 × 5 = R$ 105. Total guardado: (10 + 105) × 20 ÷ 2 = R$ 1.150.",
"## Progressão Geométrica (PG)",
"Cada termo é o anterior **multiplicado** por uma constante q (razão). Exemplo: 2, 6, 18, 54... (q = 3).",
"- **Termo geral:** aₙ = a₁·qⁿ⁻¹.",
"- **Soma finita:** Sₙ = a₁·(qⁿ − 1) ÷ (q − 1).",
"- **Situações:** crescimento de bactérias, juros compostos, depreciação, propagação de mensagens em redes.",
"## Como identificar",
"- Diferença constante entre os termos → **PA** (crescimento linear).",
"- Razão constante entre os termos → **PG** (crescimento exponencial).",
"## Padrões e figuras",
"O ENEM mostra sequências de figuras (palitos, quadradinhos) e pede o número de peças na figura 50, por exemplo. Descubra quanto aumenta a cada passo e aplique o termo geral."
],
q:[
["Em uma sequência de figuras, a 1ª tem 4 palitos, a 2ª tem 7, a 3ª tem 10, e assim por diante. A 30ª figura terá",["88 palitos","90 palitos","91 palitos","94 palitos","120 palitos"],2,"PA com a₁ = 4 e r = 3. a₃₀ = 4 + 29 × 3 = 91."],
["Uma cultura de bactérias dobra a cada hora. Começando com 500 bactérias, após 5 horas haverá",["2.500","5.000","8.000","16.000","32.000"],3,"PG de razão 2: 500 × 2⁵ = 500 × 32 = 16.000."],
["Um estudante resolve 10 questões no 1º dia e aumenta 2 questões por dia. Em 15 dias ele terá resolvido no total",["360","330","300","250","390"],0,"a₁₅ = 10 + 14 × 2 = 38. Soma = (10 + 38) × 15 ÷ 2 = 360."],
["A sequência 5, 15, 45, 135... é uma",["PA de razão 10","PG de razão 3","PA de razão 3","PG de razão 10","sequência sem padrão"],1,"Cada termo é o anterior multiplicado por 3: PG de razão 3."],
["O 10º termo da PA 2, 9, 16, 23... é",["63","65","70","72","58"],1,"a₁₀ = 2 + 9 × 7 = 65."]
]},
{t:"Equações, sistemas e MMC/MDC", inc:"B", r:"Traduzir problemas para a linguagem algébrica, resolver sistemas e usar múltiplos e divisores.", v:"equações sistemas lineares mmc mdc enem aula",
c:[
"## Traduzindo o problema",
"O maior desafio é transformar texto em equação:",
"- “o dobro de um número” → 2x; “a metade” → x/2; “um número somado a 5” → x + 5; “três números consecutivos” → x, x + 1, x + 2.",
"## Equação do 1º grau",
"Isole a incógnita fazendo a mesma operação dos dois lados. 3x + 7 = 22 → 3x = 15 → x = 5.",
"## Sistemas lineares",
"Duas incógnitas e duas equações. Resolva por **substituição** (isole uma variável e substitua na outra) ou por **adição** (some as equações para eliminar uma variável).",
"> Um estacionamento tem 30 veículos entre carros e motos, com 100 rodas no total. c + m = 30 e 4c + 2m = 100. Substituindo m = 30 − c: 4c + 60 − 2c = 100 → c = 20 carros e 10 motos.",
"## MMC: quando as coisas voltam a coincidir",
"Use MMC para eventos periódicos que se repetem juntos.",
"> Um ônibus passa a cada 12 min e outro a cada 18 min. Saíram juntos às 8h. MMC(12, 18) = 36 → vão coincidir de novo às 8h36.",
"## MDC: dividir no maior tamanho igual possível",
"> Cortar fitas de 48 cm e 60 cm em pedaços iguais, do maior tamanho possível, sem sobras: MDC(48, 60) = 12 cm.",
"## Números e operações",
"Frações, decimais, dízimas, potências e raízes aparecem dentro dos problemas. Treine as operações básicas sem calculadora: a prova não permite o uso dela."
],
q:[
["Em um estacionamento há carros e motos, num total de 25 veículos e 80 rodas. O número de carros é",["10","12","15","18","20"],2,"c + m = 25 e 4c + 2m = 80. Com m = 25 − c: 4c + 50 − 2c = 80 → 2c = 30 → c = 15."],
["Dois remédios devem ser tomados, um a cada 6 horas e outro a cada 8 horas. Se foram tomados juntos às 7h, voltarão a ser tomados juntos às",["13h","15h","19h","7h do dia seguinte","14h"],3,"MMC(6, 8) = 24 horas. Então os dois remédios coincidem de novo 24 h depois: às 7h do dia seguinte."],
["Um marceneiro quer cortar duas tábuas de 90 cm e 120 cm em pedaços iguais, do maior tamanho possível e sem sobras. Cada pedaço terá",["10 cm","15 cm","20 cm","30 cm","60 cm"],3,"MDC(90, 120) = 30 cm."],
["A soma de três números consecutivos é 72. O maior deles é",["23","24","25","26","22"],2,"x + (x + 1) + (x + 2) = 72 → 3x + 3 = 72 → x = 23. O maior é 25."],
["Ana tem o triplo da idade de Bia. Daqui a 10 anos, Ana terá o dobro da idade de Bia. A idade atual de Ana é",["10","20","30","40","15"],2,"a = 3b e a + 10 = 2(b + 10). 3b + 10 = 2b + 20 → b = 10 e a = 30."]
]}
]});

DATA.push({id:"est", a:"mat", nome:"Estatística e Probabilidade", lessons:[
{t:"Estatística e leitura de gráficos", inc:"A", r:"Média, mediana, moda, desvio padrão e interpretação de tabelas e gráficos.", v:"estatística média moda mediana enem aula",
c:[
"## Medidas de tendência central",
"- **Média aritmética:** soma dos valores ÷ quantidade.",
"- **Média ponderada:** soma de (valor × peso) ÷ soma dos pesos. É a forma de calcular a nota do SISU com pesos por área!",
"- **Mediana:** o valor **central** com os dados **em ordem**. Com uma quantidade par de dados, é a média dos dois centrais.",
"- **Moda:** o valor que mais se repete. Pode haver mais de uma moda ou nenhuma.",
"> Dados: 2, 3, 3, 5, 7, 10. Média = 30 ÷ 6 = 5. Mediana = (3 + 5) ÷ 2 = 4. Moda = 3.",
"## Por que a mediana importa",
"A média é sensível a valores extremos. Numa empresa com 9 funcionários ganhando R$ 2.000 e um diretor ganhando R$ 50.000, a média é R$ 6.800, mas a **mediana** (R$ 2.000) representa melhor a realidade da maioria.",
"## Medidas de dispersão",
"- **Amplitude:** maior valor − menor valor.",
"- **Variância e desvio padrão:** medem o quanto os dados se afastam da média. **Desvio padrão menor = dados mais regulares e homogêneos.**",
"> Se dois atletas têm a mesma média e o ENEM pergunta qual é o mais regular, escolha o de menor desvio padrão.",
"## Gráficos",
"- **Barras e colunas:** comparar categorias.",
"- **Linhas:** evolução no tempo.",
"- **Setores (pizza):** partes de um todo (somam 100% ou 360°).",
"- **Histograma:** frequência por faixas.",
"- **Cuidado:** leia os eixos, as unidades e as legendas. Um eixo que não começa no zero exagera as diferenças."
],
q:[
["As notas de um aluno foram 5, 8, 6, 9 e 7. A média e a mediana são, respectivamente,",["7 e 6","7 e 7","7 e 8","6 e 7","35 e 7"],1,"Soma = 35, média = 7. Em ordem: 5, 6, 7, 8, 9, e a mediana é 7."],
["Os salários de uma pequena empresa são: R$ 1.500 (4 funcionários), R$ 2.000 (3 funcionários) e R$ 20.000 (1 sócio). A medida que melhor representa o salário típico é",["a média, que é R$ 4.000","a mediana, que é R$ 1.750","o maior salário","a soma dos salários","a amplitude"],1,"Média = (6.000 + 6.000 + 20.000) ÷ 8 = 4.000, distorcida pelo sócio. Os valores centrais (4º e 5º) são 1.500 e 2.000 → mediana 1.750."],
["No SISU, uma universidade usa pesos: Redação 3, Linguagens 2 e Humanas 1. Um candidato tirou 800, 700 e 600, respectivamente. Sua média ponderada é",["700","716,67","733,33","750","680"],2,"(800 × 3 + 700 × 2 + 600 × 1) ÷ 6 = (2.400 + 1.400 + 600) ÷ 6 = 4.400 ÷ 6 ≈ 733,33."],
["Dois atletas têm a mesma média de pontos por jogo. O atleta A tem desvio padrão 2 e o B, desvio padrão 8. Pode-se concluir que",["B é mais regular.","A é mais regular, pois seus resultados variam menos.","os dois são igualmente regulares.","A tem média maior.","B nunca pontua."],1,"Menor desvio padrão indica dados mais próximos da média, isto é, mais regularidade."],
["A moda do conjunto 4, 7, 7, 2, 9, 7, 4 é",["4","5,7","7","9","2"],2,"O valor que mais aparece é o 7 (três vezes)."]
]},
{t:"Probabilidade", inc:"A", r:"Chance de eventos, eventos independentes, “e” e “ou”, complementar e probabilidade condicional.", v:"probabilidade enem aula",
c:[
"## Definição",
"**P(A) = casos favoráveis ÷ casos possíveis.** Vai de 0 (impossível) a 1 (certo), ou de 0% a 100%.",
"> Um dado: P(sair número par) = 3/6 = 1/2.",
"## Evento complementar",
"**P(não A) = 1 − P(A).** Muito útil em perguntas com “pelo menos um”.",
"> Probabilidade de sair pelo menos uma cara em 3 lançamentos de moeda: 1 − P(nenhuma cara) = 1 − (1/2)³ = 1 − 1/8 = 7/8.",
"## Regra do “e” (multiplicação)",
"Para eventos independentes acontecerem juntos: **P(A e B) = P(A) × P(B).**",
"> Tirar 6 em dois dados: 1/6 × 1/6 = 1/36.",
"## Regra do “ou” (adição)",
"**P(A ou B) = P(A) + P(B) − P(A e B).** Se os eventos não podem ocorrer juntos, basta somar.",
"> Numa carta de baralho (52 cartas), P(ser rei ou copas) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13.",
"## Sem reposição",
"Se o item sorteado não volta, o total diminui.",
"> Urna com 3 bolas vermelhas e 2 azuis. Tirar 2 vermelhas seguidas sem reposição: 3/5 × 2/4 = 6/20 = 3/10.",
"## Probabilidade condicional",
"Quando já se sabe que algo aconteceu, o espaço amostral diminui. **P(A | B) = P(A e B) ÷ P(B).** Muito usado em tabelas com dados de pesquisas.",
"> Dica: monte uma tabela ou uma árvore de possibilidades. Isso evita erros de contagem."
],
q:[
["Em uma urna há 4 bolas vermelhas, 5 azuis e 3 verdes. Sorteando uma bola, a probabilidade de ela ser azul é",["1/3","5/12","5/7","1/5","7/12"],1,"Total = 12 bolas. P(azul) = 5/12."],
["Ao lançar dois dados comuns, a probabilidade de a soma ser 7 é",["1/12","1/9","1/6","7/36","1/36"],2,"Pares com soma 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6 casos de 36 = 1/6."],
["Uma moeda é lançada 4 vezes. A probabilidade de sair pelo menos uma coroa é",["1/16","1/4","1/2","15/16","3/4"],3,"P(nenhuma coroa) = (1/2)⁴ = 1/16. Então P(pelo menos uma) = 1 − 1/16 = 15/16."],
["De uma caixa com 6 canetas azuis e 4 pretas, retiram-se 2 canetas sem reposição. A probabilidade de ambas serem pretas é",["4/25","2/15","16/100","1/5","3/10"],1,"4/10 × 3/9 = 12/90 = 2/15."],
["Numa turma, 60% dos alunos são meninas. Entre as meninas, 50% querem cursar Psicologia. Escolhendo um aluno ao acaso, a probabilidade de ser uma menina que quer cursar Psicologia é",["30%","50%","60%","110%","10%"],0,"0,60 × 0,50 = 0,30 = 30%."]
]},
{t:"Análise combinatória", inc:"M", r:"Princípio fundamental da contagem, permutações, arranjos e combinações.", v:"análise combinatória permutação combinação enem aula",
c:[
"## Princípio Fundamental da Contagem (PFC)",
"Se uma decisão tem **m** opções e outra tem **n**, há **m × n** possibilidades. É a base de tudo!",
"> 3 camisetas e 4 calças → 3 × 4 = 12 combinações de roupa.",
"> Senha com 4 dígitos (0 a 9, podendo repetir): 10 × 10 × 10 × 10 = 10.000.",
"## Fatorial",
"n! = n × (n − 1) × ... × 1. Exemplo: 5! = 120. Por definição, 0! = 1.",
"## Permutação (todos em fila)",
"- **Simples:** Pₙ = n!. Anagramas de AMOR: 4! = 24.",
"- **Com repetição:** divida pelos fatoriais das repetições. Anagramas de ARARA: 5! ÷ (3! × 2!) = 10.",
"## Arranjo (a ordem importa)",
"Aₙ,ₚ = n! ÷ (n − p)!. Exemplo: escolher presidente e vice entre 10 pessoas: 10 × 9 = 90.",
"## Combinação (a ordem NÃO importa)",
"**Cₙ,ₚ = n! ÷ [p! × (n − p)!].** Exemplo: escolher 3 pessoas para uma comissão entre 8: C₈,₃ = 56.",
"## Como decidir: a ordem importa?",
"Troque a ordem dos escolhidos. Se o resultado **muda** (presidente e vice, pódio, senha), use arranjo ou PFC. Se **não muda** (comissão, grupo de amigos, salada de frutas), use combinação.",
"> Na dúvida, use o PFC e, se a ordem não importar, divida pelo número de formas de ordenar os escolhidos."
],
q:[
["Uma lanchonete oferece 4 tipos de pão, 5 de recheio e 3 de bebida. O número de combos diferentes (1 pão, 1 recheio e 1 bebida) é",["12","20","60","120","15"],2,"PFC: 4 × 5 × 3 = 60."],
["Quantos anagramas tem a palavra ENEM?",["6","12","24","4","8"],1,"4 letras com o E repetido 2 vezes: 4! ÷ 2! = 24 ÷ 2 = 12."],
["De um grupo de 7 pessoas, deseja-se escolher 3 para formar uma equipe. O número de equipes possíveis é",["21","35","210","343","42"],1,"A ordem não importa: C₇,₃ = 7! ÷ (3! × 4!) = 35."],
["Numa corrida com 8 atletas, de quantas formas pode ser formado o pódio (1º, 2º e 3º lugares)?",["24","56","336","512","40.320"],2,"A ordem importa: 8 × 7 × 6 = 336."],
["Uma senha é formada por 2 letras (entre 26) seguidas de 3 algarismos (0 a 9), podendo repetir. O número de senhas possíveis é",["676.000","26.000","6.760","67.600","1.757.600"],0,"26 × 26 × 10 × 10 × 10 = 676 × 1.000 = 676.000."]
]}
]});

DATA.push({id:"func", a:"mat", nome:"Funções e Trigonometria", lessons:[
{t:"Funções de 1º e 2º grau", inc:"A", r:"Gráficos, taxa de variação, raízes, vértice e problemas de máximo e mínimo.", v:"função afim função quadrática enem aula",
c:[
"## O que é função",
"Uma relação em que cada valor de x (entrada) gera **um único** valor de y (saída). Exemplo: o valor da corrida de táxi depende dos quilômetros rodados.",
"## Função afim (1º grau): f(x) = ax + b",
"- O gráfico é uma **reta**.",
"- **a** = taxa de variação (quanto y muda quando x aumenta 1). a > 0: crescente; a < 0: decrescente.",
"- **b** = valor inicial (onde a reta corta o eixo y).",
"> Táxi: bandeirada de R$ 5 + R$ 2,50 por km → f(x) = 2,5x + 5. Para 12 km: f(12) = 35 reais.",
"- Para achar a lei a partir de dois pontos: a = (y₂ − y₁) ÷ (x₂ − x₁).",
"## Função quadrática (2º grau): f(x) = ax² + bx + c",
"- O gráfico é uma **parábola**. Com a > 0, a concavidade é para cima (tem valor **mínimo**); com a < 0, para baixo (tem valor **máximo**).",
"- **Raízes:** fórmula de Bhaskara, x = (−b ± √Δ) ÷ 2a, com Δ = b² − 4ac.",
"- **Vértice:** **xᵥ = −b ÷ 2a** e yᵥ = f(xᵥ) (ou −Δ ÷ 4a).",
"> Problemas de **lucro máximo, área máxima, altura máxima** de um projétil: calcule o vértice!",
"## Lendo gráficos",
"Identifique onde a função cresce, decresce, é máxima, é mínima ou é zero. Compare duas funções pelo ponto em que as retas se cruzam (o ponto de equilíbrio: onde dois planos custam o mesmo)."
],
q:[
["Um plano de celular cobra R$ 30,00 fixos mais R$ 0,50 por minuto. Um cliente que pagou R$ 75,00 falou",["45 minutos","90 minutos","100 minutos","150 minutos","60 minutos"],1,"30 + 0,5x = 75 → 0,5x = 45 → x = 90 minutos."],
["O plano A cobra R$ 20,00 + R$ 2,00 por hora, e o plano B cobra R$ 50,00 + R$ 0,50 por hora. Os dois custam o mesmo com",["10 horas","15 horas","20 horas","30 horas","25 horas"],2,"20 + 2x = 50 + 0,5x → 1,5x = 30 → x = 20 horas."],
["Uma bola é lançada e sua altura é h(t) = −5t² + 20t, com h em metros e t em segundos. A altura máxima é",["10 m","15 m","20 m","25 m","40 m"],2,"tᵥ = −20 ÷ (2 × −5) = 2 s. h(2) = −20 + 40 = 20 m."],
["A receita de uma loja é R(x) = −2x² + 200x, com x o preço do produto. A receita é máxima quando o preço é",["R$ 25,00","R$ 50,00","R$ 100,00","R$ 200,00","R$ 75,00"],1,"xᵥ = −200 ÷ (2 × −2) = 50."],
["Uma função afim passa pelos pontos (0, 3) e (2, 11). Sua lei é",["f(x) = 3x + 4","f(x) = 4x + 3","f(x) = 11x + 2","f(x) = 2x + 3","f(x) = 8x + 3"],1,"a = (11 − 3) ÷ (2 − 0) = 4 e b = 3. Então f(x) = 4x + 3."]
]},
{t:"Exponencial e logaritmo", inc:"M", r:"Crescimento e decaimento exponencial, logaritmos e escalas logarítmicas.", v:"função exponencial logaritmo enem aula",
c:[
"## Função exponencial: f(x) = a·bˣ",
"A variável está no **expoente**. Descreve crescimentos e decaimentos rápidos.",
"- **b > 1:** crescimento (bactérias, população, juros compostos, viralização nas redes).",
"- **0 < b < 1:** decaimento (meia-vida radioativa, remédio no sangue, depreciação de um carro).",
"> Um remédio perde metade da concentração a cada 6 h. Após 24 h (4 meias-vidas), resta (1/2)⁴ = 1/16 da dose.",
"## Logaritmo",
"É a operação inversa da potência: **log_b a = x ⇔ bˣ = a**. Pergunta: “a que expoente devo elevar b para obter a?”",
"- log₁₀ 1.000 = 3, porque 10³ = 1.000.",
"- log₂ 32 = 5, porque 2⁵ = 32.",
"## Propriedades",
"- log(a·b) = log a + log b",
"- log(a/b) = log a − log b",
"- log(aⁿ) = n·log a",
"## Escalas logarítmicas (caem muito!)",
"- **pH:** pH = −log[H⁺]. Cada unidade é um fator de 10.",
"- **Escala Richter:** um terremoto de magnitude 7 tem amplitude **10 vezes** maior que um de 6.",
"- **Decibéis:** 20 dB a mais significa intensidade **100 vezes** maior.",
"## Resolvendo equações exponenciais",
"Iguale as bases: 2ˣ = 64 → 2ˣ = 2⁶ → x = 6. Se não der, use logaritmo: 3ˣ = 20 → x = log 20 ÷ log 3."
],
q:[
["Uma população de 1.000 bactérias triplica a cada hora. Após 4 horas, a população será",["4.000","12.000","27.000","81.000","64.000"],3,"1.000 × 3⁴ = 1.000 × 81 = 81.000."],
["O valor de log₂ 64 é",["5","6","8","32","12"],1,"2⁶ = 64, então log₂ 64 = 6."],
["Um terremoto de magnitude 8 na escala Richter, comparado a um de magnitude 6, tem amplitude",["2 vezes maior","20 vezes maior","100 vezes maior","1.000 vezes maior","8 vezes maior"],2,"A escala é logarítmica de base 10: 2 unidades = 10² = 100 vezes."],
["Um carro de R$ 80.000,00 desvaloriza 10% ao ano. Após 2 anos, seu valor será",["R$ 64.000,00","R$ 64.800,00","R$ 72.000,00","R$ 60.000,00","R$ 70.000,00"],1,"80.000 × 0,9² = 80.000 × 0,81 = R$ 64.800,00."],
["Se 5ˣ = 125, então x vale",["3","5","25","15","2"],0,"125 = 5³, então x = 3."]
]},
{t:"Trigonometria", inc:"M", r:"Seno, cosseno e tangente no triângulo retângulo, ângulos notáveis e funções periódicas.", v:"trigonometria triângulo retângulo enem aula",
c:[
"## No triângulo retângulo",
"Tem um ângulo de 90°. O lado oposto a ele é a **hipotenusa** (o maior lado); os outros dois são os **catetos**.",
"- **sen θ = cateto oposto ÷ hipotenusa**",
"- **cos θ = cateto adjacente ÷ hipotenusa**",
"- **tg θ = cateto oposto ÷ cateto adjacente**",
"> Macete: “SOH-CAH-TOA” (Seno = Oposto/Hipotenusa; Cosseno = Adjacente/Hipotenusa; Tangente = Oposto/Adjacente).",
"## Ângulos notáveis",
"- **30°:** sen = 1/2; cos = √3/2; tg = √3/3.",
"- **45°:** sen = cos = √2/2; tg = 1.",
"- **60°:** sen = √3/2; cos = 1/2; tg = √3.",
"(Aproximações: √2 ≈ 1,41 e √3 ≈ 1,73.)",
"## Aplicações típicas",
"- Altura de um prédio ou árvore sabendo a distância e o ângulo de visão (use a tangente).",
"- Rampas de acessibilidade: a inclinação é limitada pela norma (a tangente do ângulo).",
"- Comprimento de escadas e cabos de sustentação.",
"## Funções trigonométricas",
"Seno e cosseno são funções **periódicas**: repetem-se em ciclos. Modelam **marés**, **rodas-gigantes**, ondas, estações do ano e batimentos cardíacos. Em f(t) = A + B·sen(ωt), o valor máximo é A + B e o mínimo é A − B."
],
q:[
["Uma pessoa, a 30 m de um prédio, vê o topo sob um ângulo de 45°. Desprezando a altura dos olhos, a altura do prédio é",["15 m","30 m","45 m","60 m","30√2 m"],1,"tg 45° = h ÷ 30 = 1 → h = 30 m."],
["Uma escada de 10 m está apoiada num muro formando 60° com o chão. A altura atingida no muro é aproximadamente (use √3 ≈ 1,73)",["5 m","7,1 m","8,65 m","10 m","17,3 m"],2,"sen 60° = h ÷ 10 → h = 10 × 0,865 = 8,65 m."],
["Um avião decola com ângulo de 30° em relação ao solo e voa 2.000 m em linha reta. A altura atingida é",["500 m","1.000 m","1.730 m","2.000 m","4.000 m"],1,"sen 30° = h ÷ 2.000 → h = 2.000 × 0,5 = 1.000 m."],
["A altura da maré em um porto é dada por h(t) = 3 + 2·sen(πt/6), em metros. A altura máxima da maré é",["2 m","3 m","5 m","6 m","1 m"],2,"O seno vale no máximo 1: h = 3 + 2 × 1 = 5 m."],
["Em um triângulo retângulo, o cateto oposto a um ângulo mede 6 cm e a hipotenusa, 10 cm. O seno desse ângulo é",["0,6","0,8","0,75","1,67","6"],0,"sen = 6 ÷ 10 = 0,6."]
]}
]});

DATA.push({id:"geom", a:"mat", nome:"Geometria", lessons:[
{t:"Geometria plana", inc:"A", r:"Áreas, perímetros, Pitágoras, semelhança de triângulos e ângulos.", v:"geometria plana áreas pitágoras enem aula",
c:[
"## Áreas principais",
"- **Quadrado:** L². **Retângulo:** b × h.",
"- **Triângulo:** b × h ÷ 2. **Paralelogramo:** b × h.",
"- **Trapézio:** (B + b) × h ÷ 2. **Losango:** D × d ÷ 2.",
"- **Círculo:** π·r². **Comprimento da circunferência:** 2·π·r. (Use π ≈ 3 ou 3,14, conforme o enunciado.)",
"> Figuras complexas: divida em figuras conhecidas e some, ou calcule o total e subtraia a parte que falta.",
"## Teorema de Pitágoras",
"No triângulo retângulo: **a² = b² + c²** (hipotenusa ao quadrado = soma dos quadrados dos catetos).",
"- Ternas famosas: **3, 4, 5**; 6, 8, 10; 5, 12, 13.",
"- Diagonal do quadrado: L√2. Altura do triângulo equilátero: L√3 ÷ 2.",
"## Semelhança de triângulos",
"Triângulos com ângulos iguais têm **lados proporcionais**. Usado para medir alturas pela sombra.",
"> Um poste projeta uma sombra de 6 m no mesmo momento em que uma pessoa de 1,8 m projeta uma sombra de 1,2 m. Altura do poste: h/6 = 1,8/1,2 → h = 9 m.",
"## Ângulos e polígonos",
"- A soma dos ângulos internos de um triângulo é **180°**.",
"- A soma dos ângulos internos de um polígono de n lados é **(n − 2) × 180°**.",
"- **Mosaicos (pisos):** só triângulos equiláteros, quadrados e hexágonos regulares cobrem o plano sozinhos, porque seus ângulos (60°, 90°, 120°) dividem 360°.",
"## Perímetro",
"É a soma dos lados, usada para cercas, rodapés e molduras. Não confunda com área!"
],
q:[
["Um terreno retangular de 20 m por 15 m será gramado, exceto um canteiro circular de 2 m de raio. Usando π = 3, a área gramada é",["288 m²","300 m²","312 m²","276 m²","294 m²"],0,"Retângulo: 300 m². Círculo: 3 × 2² = 12 m². Gramado: 300 − 12 = 288 m²."],
["Uma TV tem tela de 48 polegadas de largura e 36 de altura. A medida da diagonal é",["50 polegadas","60 polegadas","64 polegadas","72 polegadas","84 polegadas"],1,"d² = 48² + 36² = 2.304 + 1.296 = 3.600 → d = 60 polegadas."],
["Uma árvore projeta uma sombra de 12 m no mesmo instante em que uma estaca de 2 m projeta uma sombra de 3 m. A altura da árvore é",["6 m","8 m","9 m","18 m","4,5 m"],1,"Semelhança: h/12 = 2/3 → h = 8 m."],
["A soma dos ângulos internos de um hexágono é",["360°","540°","720°","900°","1.080°"],2,"(6 − 2) × 180° = 720°."],
["Uma praça circular tem raio de 10 m. Usando π = 3,14, o comprimento da cerca ao redor da praça é",["31,4 m","62,8 m","314 m","100 m","125,6 m"],1,"C = 2 × 3,14 × 10 = 62,8 m."]
]},
{t:"Geometria espacial", inc:"A", r:"Volumes de prismas, cilindros, cones, pirâmides e esferas, planificações e vistas.", v:"geometria espacial volumes enem aula",
c:[
"## Volumes",
"- **Prisma e paralelepípedo:** V = área da base × altura. Uma caixa: comprimento × largura × altura.",
"- **Cubo:** V = a³.",
"- **Cilindro:** V = π·r²·h. (Caixas-d’água, latas, canos.)",
"- **Pirâmide e cone:** V = (área da base × altura) ÷ 3. Um cone tem **1/3** do volume do cilindro de mesma base e altura.",
"- **Esfera:** V = 4·π·r³ ÷ 3.",
"> Lembre-se: 1 m³ = 1.000 L e 1 dm³ = 1 L.",
"## Áreas de superfície",
"Para saber quanto material gastar (embalagem, pintura), some as áreas das faces. A **planificação** é a figura “aberta” do sólido. Por exemplo, o cilindro planificado é formado por 2 círculos e 1 retângulo.",
"## Vistas e projeções",
"O ENEM mostra um sólido e pede a **vista de cima, de frente ou de lado** (projeção ortogonal). Imagine uma luz vindo de uma direção e a sombra que se forma.",
"## Relação de Euler",
"Em poliedros convexos: **V − A + F = 2** (vértices − arestas + faces). Um cubo tem 8 − 12 + 6 = 2.",
"## Proporções",
"Se todas as medidas de um sólido dobram, o volume fica **8 vezes** maior (2³). Muito cobrado em embalagens e maquetes."
],
q:[
["Uma caixa-d’água cilíndrica tem raio de 1 m e altura de 2 m. Usando π = 3, sua capacidade é",["3.000 L","6.000 L","2.000 L","12.000 L","600 L"],1,"V = 3 × 1² × 2 = 6 m³ = 6.000 L."],
["Um copo em forma de cone e uma lata cilíndrica têm a mesma base e a mesma altura. Para encher a lata usando o copo, são necessários",["2 copos","3 copos","4 copos","6 copos","1 copo e meio"],1,"O volume do cone é 1/3 do volume do cilindro de mesma base e altura."],
["Uma piscina de 10 m de comprimento, 5 m de largura e 1,5 m de profundidade tem capacidade de",["75 L","750 L","7.500 L","75.000 L","16.500 L"],3,"V = 10 × 5 × 1,5 = 75 m³ = 75.000 L."],
["Um poliedro convexo tem 12 vértices e 30 arestas. O número de faces é",["18","20","22","16","42"],1,"V − A + F = 2 → 12 − 30 + F = 2 → F = 20."],
["Uma fábrica dobrou todas as medidas de uma embalagem em forma de paralelepípedo. A capacidade da nova embalagem é",["2 vezes maior","4 vezes maior","6 vezes maior","8 vezes maior","16 vezes maior"],3,"O volume cresce com o cubo do fator: 2³ = 8."]
]}
]});

DATA.push({id:"curso", a:"red", nome:"Curso de Redação", lessons:[
{t:"Como a redação do ENEM funciona", inc:"A", r:"O que é cobrado, como a nota é dada e o que zera o texto.", v:"redação enem como funciona competências",
c:[
"## A tarefa",
"Você vai escrever um **texto dissertativo-argumentativo em prosa**, sobre um **problema social brasileiro**, com até **30 linhas**, na norma-padrão, e terminar com uma **proposta de intervenção** que respeite os direitos humanos. A prova traz uma frase-tema e alguns textos motivadores (reportagens, gráficos, leis) para inspirar, e não para copiar.",
"## A nota: 0 a 1000",

"- **C1 — Norma-padrão:** gramática, ortografia, pontuação.",

c:[
"## Tema x assunto",
"O **assunto** é amplo (por exemplo, “saúde mental”). O **tema** é um **recorte** específico: “O estigma associado às doenças mentais na sociedade brasileira” (ENEM 2020). Falar só de “saúde mental” em geral é **tangenciar**, o que derruba muito a nota nas competências 2, 3 e 5.",
"## Passo a passo",
"1. **Grife as palavras-chave** do tema. No exemplo: *estigma*, *doenças mentais*, *sociedade brasileira*.",
"2. **Identifique o problema.** Qual é a situação negativa? O preconceito que afasta as pessoas do tratamento.",
"3. **Veja o recorte.** O tema fala de “desafios”, “caminhos”, “persistência”, “impactos”? Isso orienta o texto.",
"4. **Leia os textos motivadores** buscando dados e ideias, mas **não copie** frases: as linhas copiadas são desconsideradas.",
"5. **Faça perguntas:** Por que o problema existe? Quem é afetado? Quais as consequências? Quem pode resolver?",
"## Fuga x tangenciamento",
"- **Fuga total:** escrever sobre outro assunto → nota zero.",
"- **Tangenciamento:** escrever sobre o assunto geral sem abordar o recorte → nota baixa (C2 limitada a 40 pontos).",
"> Regra prática: use as palavras-chave do tema (ou sinônimos claros) na introdução, no início de cada desenvolvimento e na conclusão.",
"## O “Brasil” no tema",
"Quase todos os temas terminam com “no Brasil” ou “na sociedade brasileira”. **Traga o problema para a realidade brasileira**: dados, leis e fatos do Brasil."
],

{t:"A introdução nota 1000", inc:"A", r:"Contextualização com repertório, tese clara e anúncio dos argumentos.", v:"como fazer introdução redação enem nota 1000",
c:[
"## A função da introdução",
"Apresentar o tema, mostrar seu **ponto de vista (tese)** e **anunciar** o caminho do texto. Um corretor que lê uma boa introdução já sabe o que esperar.",
"## A estrutura em 3 partes",
"1. **Contextualização com repertório:** uma citação, fato histórico, obra, lei ou dado ligado ao tema.",
"2. **Apresentação do problema e tese:** mostre que o problema existe no Brasil e diga sua posição.",
"3. **Anúncio dos argumentos:** as duas causas (ou aspectos) que você vai desenvolver.",
"## Exemplo",
"> “Segundo a Constituição Federal de 1988, a educação é direito de todos e dever do Estado. Na prática, porém, a evasão escolar no ensino médio ainda é um problema persistente no Brasil, o que compromete o futuro de milhões de jovens. Esse cenário decorre, sobretudo, da necessidade de trabalhar precocemente e da falta de sentido que muitos estudantes veem na escola.”",
"## Dicas",
"- **3 a 5 linhas** são suficientes. Não gaste 10 linhas na introdução.",
"- O repertório precisa **conversar com o tema**; nada de citação “coringa” sem relação.",
"- Evite perguntas retóricas, primeira pessoa (“eu acho”) e frases vagas como “desde os primórdios da humanidade”.",
"- Os argumentos anunciados devem ser **os mesmos** desenvolvidos depois, na mesma ordem.",
"## Modelos de abertura",
"- **Citação:** “De acordo com o filósofo X, ...”.",
"- **Alusão histórica:** “Durante a Revolução Industrial, ...”.",
"- **Obra cultural:** “No filme/livro X, ...”.",
"- **Legislação:** “A Constituição Federal garante...”.",
"- **Dado:** “Segundo o IBGE, ...” (use apenas dados que você conhece com segurança)."
],

c:[
"## Dois parágrafos, dois argumentos",
"Cada parágrafo de desenvolvimento defende **um** dos argumentos anunciados na introdução. É aqui que se ganham os pontos das competências 2 e 3.",
"## A estrutura de cada parágrafo (7 a 9 linhas)",
"1. **Tópico frasal:** a primeira frase já apresenta a ideia do parágrafo. “Em primeiro lugar, a desinformação alimenta preconceitos sobre quem sofre de transtornos mentais.”",
"2. **Fundamentação com repertório:** um autor, uma lei, um fato histórico ou um dado que sustenta a ideia.",
"3. **Explicação e análise:** o mais importante! Mostre **como** o repertório se relaciona com o tema e **por que** isso causa o problema. Não basta citar.",
"4. **Fechamento:** uma frase que conclui o parágrafo e o liga à tese.",
"## Repertório produtivo x repertório de enfeite",
"- **Enfeite:** “Como disse Platão, o importante é o conhecimento.” (citação solta, que não ajuda o argumento)",
"- **Produtivo:** “O sociólogo Erving Goffman explica que o estigma reduz a pessoa a um rótulo. Isso ocorre com quem tem depressão, visto apenas como ‘fraco’, o que o leva a esconder os sintomas.”",
"## Tipos de argumento",
"- **Causa e consequência:** o que gera o problema e o que ele provoca.",
"- **Exemplificação:** casos concretos e fatos.",
"- **Comparação:** com outros países ou épocas.",
"- **Dados:** números de fontes confiáveis (IBGE, OMS, Ipea), mas nunca invente dados!",
"- **Autoridade:** especialistas e pensadores.",
"> Ponto de atenção: argumento não é opinião solta. Toda afirmação precisa ser explicada e sustentada."
],

c:[
"## A função da conclusão",
"Retomar a tese e apresentar uma **proposta de intervenção** para o problema discutido. É a única parte da redação avaliada por uma competência inteira (a C5).",
"## Os 5 elementos da proposta",
"1. **Agente:** quem vai executar a ação. Seja específico: “o Ministério da Educação” é melhor que “o governo”.",
"2. **Ação:** o que será feito.",
"3. **Meio/modo:** como será feito, por meio de quê.",
"4. **Finalidade/efeito:** para quê, qual resultado se espera.",
"5. **Detalhamento:** uma informação a mais sobre qualquer um dos elementos (quem é o agente, como é o meio, exemplo da ação...).",
"> Cada elemento vale 40 pontos na C5. Com os 5 elementos válidos, você garante 200.",
"## Exemplo analisado",
"> “Portanto, cabe ao **Ministério da Saúde** [agente] **ampliar o número de Centros de Atenção Psicossocial** [ação], **por meio do aumento de repasses aos municípios** [meio], **a fim de garantir atendimento antes que as crises se agravem** [finalidade]. Esses centros, **que oferecem acompanhamento multiprofissional gratuito** [detalhamento], são essenciais para a cidadania.”",
"## Boas práticas",
"- A proposta deve **resolver os problemas** apontados nos argumentos. Se você falou de desinformação, proponha algo contra a desinformação.",
"- Você pode fazer **duas propostas** (uma para cada argumento), mas uma proposta completa já garante a nota.",
"- **Agentes possíveis:** ministérios, Governo Federal, escolas, mídia, ONGs, famílias, empresas, Congresso Nacional.",
"- **Não desrespeite os direitos humanos**: nada de pena de morte, tortura, “justiça com as próprias mãos” ou exclusão de grupos.",
"- **Evite** propostas vagas como “o governo deve fazer mais” ou “a sociedade precisa se conscientizar”."
],

{t:"Coesão: conectivos e retomadas", inc:"A", r:"Como ligar as ideias sem repetir palavras, para garantir os 200 pontos da Competência 4.", v:"coesão redação enem conectivos competência 4",
c:[
"## O que a C4 avalia",
"O uso de **conectivos** (entre parágrafos e dentro deles) e de **retomadas** (pronomes, sinônimos, expressões) para que o texto flua. Para 200 pontos: repertório diversificado de recursos coesivos e **poucas inadequações**.",
"## Conectivos entre parágrafos (o “esqueleto”)",
"- Início do D1: “Em primeiro lugar”, “Primordialmente”, “Em primeira análise”.",
"- Início do D2: “Além disso”, “Ademais”, “Outrossim”, “Somado a isso”.",
"- Início da conclusão: “Portanto”, “Dessa forma”, “Logo”, “Em suma”.",
"## Conectivos dentro dos parágrafos",
"- **Causa:** porque, visto que, uma vez que, haja vista.",
"- **Consequência:** consequentemente, de modo que, por conseguinte.",
"- **Oposição:** entretanto, contudo, no entanto, todavia.",
"- **Exemplificação e explicação:** por exemplo, isto é, ou seja, nesse sentido.",
"- **Conclusão parcial:** assim, dessa maneira, desse modo.",
"## Retomadas (evite repetições)",
"- **Pronomes:** isso, esse, tal, o qual, cujo.",
"- **Sinônimos:** estudantes → alunos → jovens.",
"- **Expressões resumitivas:** “esse cenário”, “tal conjuntura”, “essa problemática”, “o quadro supracitado”.",
"## Erros comuns que tiram pontos",
"- Repetir o mesmo conectivo (“além disso” três vezes).",
"- Usar conectivo com o sentido errado (“portanto” onde deveria haver oposição).",
"- Frases sem nenhum conectivo, todas soltas.",
"- Excesso de conectivos rebuscados sem necessidade, o que deixa o texto artificial.",
"> Meta: pelo menos um conectivo no início de cada parágrafo e dois ou três dentro de cada um."
],

{t:"Norma-padrão: os erros que mais tiram pontos", inc:"A", r:"Crase, vírgula, concordância, grafias confusas e marcas de oralidade.", v:"erros comuns redação enem gramática crase vírgula",
c:[
"## Crase",
"Ocorre na junção da preposição **a** com o artigo **a**. Dica: troque por uma palavra masculina. Se virar “ao”, use crase.",
"- “Vou **à** escola” → “vou **ao** colégio” ✓. “Refiro-me **à** lei” ✓.",
"- **Não use** antes de palavra masculina, de verbo, de pronomes como “esta” e “ela”, nem em “a partir de”.",
"## Vírgula",
"- **Nunca** separe o sujeito do verbo: “Os jovens brasileiros, enfrentam...” ✗.",
"- Use vírgula depois de conectivos no início da frase: “Além disso, ...”.",
"- Use vírgula para isolar apostos e expressões explicativas: “Paulo Freire, educador brasileiro, defendia...”.",
"- Use vírgula antes de “mas”, “porém”, “pois” (explicativo).",
"## Concordância",
"- **Verbal:** o verbo concorda com o sujeito. “**Existem** muitos problemas” ✓; “**Há** muitos problemas” ✓ (haver no sentido de existir não vai para o plural). “Faz dez anos” ✓.",
"- **Nominal:** “É **necessária** a criação” / “É **necessário** criar”.",
"## Grafias que confundem",
"- **Mal** (oposto de bem) x **mau** (oposto de bom).",
"- **Há** (tempo passado, existir) x **a** (tempo futuro, distância): “há dois anos”, “daqui a dois anos”.",
"- **Por que** (pergunta) · **porque** (explicação) · **por quê** (fim de frase) · **o porquê** (substantivo).",
"- **Onde** (lugar físico) x **em que** / **no qual** (situações): “a sociedade **em que** vivemos”.",
"- **A fim de** (finalidade) x **afim** (semelhante).",
"## Registro formal",
"- **Evite:** “a gente” (use “nós” ou “a sociedade”), “tipo”, “né”, “tá”, “pra”, gírias, abreviações e **primeira pessoa do singular** (“eu acho”).",
"- Prefira períodos curtos e completos. Frases longas demais geram erros de estrutura.",
"> A C1 tolera no máximo 1 falha de estrutura sintática e 2 desvios para a nota 200. Revise sempre ao passar a limpo!"
],

"## Por que ter um banco",
"Na hora da prova não dá para pesquisar. Quem chega com **8 a 12 repertórios bem entendidos**, organizados por eixo, adapta-os a quase qualquer tema.",
"## Repertórios versáteis (entenda bem cada um!)",
"- **Constituição Federal de 1988:** art. 5º (igualdade), art. 6º (direitos sociais), art. 196 (saúde), art. 205 (educação), art. 225 (meio ambiente). Serve para quase todo tema.",
"- **Zygmunt Bauman, modernidade líquida:** relações e valores frágeis e passageiros. Temas de tecnologia, consumo, relações.",
"- **Byung-Chul Han, sociedade do cansaço:** excesso de desempenho gera esgotamento. Temas de saúde mental, trabalho, redes.",
"- **Michel Foucault, panóptico e sociedade disciplinar:** vigilância e controle. Temas de dados, redes sociais, privacidade.",
"- **Émile Durkheim, anomia e fato social:** ausência de normas e coesão social. Temas de violência e crise de valores.",

c:[
"## A Psicologia como ciência",

"## As grandes escolas",
"- **Behaviorismo (comportamentalismo):** estuda o **comportamento observável**. **Watson** e **Skinner**: condicionamento operante, reforço e punição. **Pavlov**: condicionamento clássico (o cão que saliva ao ouvir a campainha).",
"- **Psicanálise:** **Sigmund Freud**. O **inconsciente** influencia nosso comportamento. Id, ego e superego; mecanismos de defesa; interpretação dos sonhos. Influenciou o Surrealismo.",
"- **Gestalt:** “o todo é diferente da soma das partes”. Estuda a percepção (ilusões de óptica).",
"- **Humanismo:** **Carl Rogers** e **Abraham Maslow** (pirâmide das necessidades). Foco no potencial humano e na autorrealização.",
"- **Cognitivismo:** estuda pensamento, memória, atenção e linguagem. Base da Terapia Cognitivo-Comportamental (TCC).",
"## Desenvolvimento humano",
"- **Jean Piaget:** estágios do desenvolvimento cognitivo (sensório-motor, pré-operatório, operatório concreto, operatório formal). A criança constrói o conhecimento ativamente.",
"- **Lev Vygotsky:** o desenvolvimento é **social e cultural**. **Zona de desenvolvimento proximal**: o que a criança consegue fazer com ajuda.",
"## Bases biológicas",
"Emoções, memória e comportamento dependem do **sistema nervoso**: neurônios, sinapses e neurotransmissores (dopamina, serotonina). O **sistema límbico** (amígdala, hipocampo) participa das emoções e da memória. O estresse crônico eleva o **cortisol**.",

],

"## Estereótipo, preconceito e discriminação",
"- **Estereótipo:** crença generalizada sobre um grupo (“todo X é assim”).",
"- **Preconceito:** atitude ou julgamento negativo prévio, sem conhecer a pessoa.",
"- **Discriminação:** ação que trata alguém de forma desigual por pertencer a um grupo.",
"## Experimentos clássicos",
"- **Conformidade (Solomon Asch, anos 1950):** muitas pessoas deram respostas claramente erradas sobre o tamanho de linhas só para concordar com o grupo. Mostra a força da pressão social.",
"- **Obediência à autoridade (Stanley Milgram, 1961):** muitos participantes aplicaram o que acreditavam ser choques elétricos fortes em outra pessoa porque um pesquisador mandou. Dialoga com a “banalidade do mal” de Hannah Arendt.",
"- **Efeito espectador:** quanto mais pessoas presenciam uma emergência, menor a chance de alguém ajudar, porque a responsabilidade se dilui.",
"## Identidade e grupos",
"- Tendemos a favorecer o nosso grupo (endogrupo) e a desconfiar dos outros (exogrupo). Isso ajuda a explicar a polarização política e as bolhas nas redes sociais.",
"- **Viés de confirmação:** buscamos e acreditamos mais em informações que confirmam o que já pensamos. É o combustível das fake news.",
"## Ética na pesquisa",
"Experimentos como o de Milgram hoje seriam considerados antiéticos. Atualmente, as pesquisas com seres humanos exigem **consentimento informado** e aprovação de comitês de ética.",

function numVal(t){
  const m = String(t).replace(/R\$\s?/, "").match(/^\s*(\d+(?:\.\d{3})*(?:,\d+)?)(?:\s*\/\s*(\d+))?/);
  if (!m) return null;
  const v = parseFloat(m[1].replace(/\./g, "").replace(",", "."));
  return m[2] ? v / +m[2] : v;
}
function arrange(opts, c, seed){
  const idx = opts.map((_, i) => i), nums = opts.map(numVal);
  if (nums.every(v => v !== null)) idx.sort((a, b) => nums[a] - nums[b]);
  else {
    let h = 2166136261; for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  }
  return {o: idx.map(i => opts[i]), c: idx.indexOf(c)};
}

function lessonQueues(){
  const q = {};
  for (const a of ENEM_AREAS) {
    const subs = DATA.filter(s => s.a === a), out = [];
    for (const lvl of ["A","M","B"]) {
      const lists = subs.map(s => LESSONS.filter(L => L.s === s && L.inc === lvl));
      for (let k = 0, more = true; more; k++) { more = false; for (const Ls of lists) if (Ls[k]) { out.push(Ls[k]); more = true; } }
    }
    q[a] = out.filter(L => !isDone(L.id)).concat(out.filter(L => isDone(L.id)));
  }
  q.hum = LESSONS.filter(L => L.a === "psi" && !isDone(L.id)).concat(q.hum);
  const red = LESSONS.filter(L => L.a === "red");
  q.red = red.filter(L => !isDone(L.id));
  return q;
}
function generatePlan(){
  const st = S.settings;
  const start = today0(), d1 = parseYMD(st.d1), d2 = parseYMD(st.d2);
  const nBlocks = Math.max(1, Math.round(st.hours * 60 / 50));
  const order = [1,2,3,4,5,6,0].filter(d => st.days[d]);
  const simDay = order[order.length-1], redDay = order[Math.floor((order.length-1)/2)];
  const Qs = lessonQueues(), ptr = {lin:0,hum:0,nat:0,mat:0,red:0};
  const credit = {lin:0,hum:0,nat:0,mat:0,red:0};
  let redT = 0, temaPtr = 0, simPtr = 0;
  const days = [], same = (a,b) => a.getTime() === b.getTime();
  for (let d = new Date(start); d <= d2; d = addDays(d,1)) {
    const key = ymd(d), wd = d.getDay();
    if (same(d,d1) || same(d,d2)) { days.push({date:key, type:"prova", phase:"Prova", blocks:[{a:"geral", k:"prova", t: same(d,d1) ? "1º dia: Linguagens, Humanas e Redação" : "2º dia: Natureza e Matemática"}]}); continue; }
    if (same(addDays(d,1),d1) || same(addDays(d,1),d2)) {
      days.push({date:key, type:"vespera", phase:"Véspera", blocks:[{a:"geral",k:"leve",t:"Revisar só os erros anotados (no máximo 1 hora)"},{a:"geral",k:"leve",t:"Separar documento com foto e caneta preta de tubo transparente"},{a:"geral",k:"leve",t:"Descansar e dormir cedo"}]});
      continue;
    }
    if (!st.days[wd]) continue;
    const afterD1 = d > d1, left = diffDays(d, afterD1 ? d2 : d1);
    const phase = afterD1 ? "Entre as provas" : left <= 21 ? "Reta final" : left <= 56 ? "Aprofundamento" : "Base";
    const areas = afterD1 ? ["nat","mat"] : ["lin","hum","nat","mat","red"].filter(a => st.w[a] > 0);
    if (!areas.length) areas.push("mat");
    const blocks = [];
    if (st.simulado && wd === simDay && order.length > 1) {
      const sa = afterD1 ? ["nat","mat"] : ENEM_AREAS;
      const n = Math.max(1, nBlocks - 1);
      for (let i = 0; i < n; i++) { const a = sa[simPtr++ % sa.length]; blocks.push({a, k:"sim", t:`Simulado de ${AREAS[a].nome}`}); }
      if (nBlocks > 1) blocks.push({a:"geral", k:"erros", t:"Refazer as questões que você errou"});
      days.push({date:key, type:"sim", phase, blocks}); continue;
    }
    let i0 = 0;
    if (!afterD1 && wd === redDay && st.w.red > 0) { blocks.push({a:"red", k:"redacao", t:TEMAS_TREINO[temaPtr++ % TEMAS_TREINO.length]}); i0 = 1; }
    const w = a => afterD1 ? 1 : st.w[a];
    const sumW = areas.reduce((s,a) => s + w(a), 0);
    for (let i = i0; i < nBlocks; i++) {
      areas.forEach(a => credit[a] += w(a));
      let pick = areas[0]; for (const a of areas) if (credit[a] > credit[pick]) pick = a;
      credit[pick] -= sumW;
      if (pick === "red") {
        const L = Qs.red[ptr.red++];
        blocks.push(L ? {a:"red", k:"licao", lid:L.id, s:L.s.nome, t:L.t} : {a:"red", k:"redt", t:RED_TREINO[redT++ % RED_TREINO.length]});
        continue;
      }
      const q = Qs[pick], n = ptr[pick]++, L = q[n % q.length];
      blocks.push({a:L.a, k:(n >= q.length || (!afterD1 && left <= 7)) ? "rev" : "licao", lid:L.id, s:L.s.nome, t:L.t});
    }
    days.push({date:key, type:"estudo", phase, blocks});
  }
  S.plan = {created: ymd(start), days};
  S.done = {};
  planWeek = null;
  save();
}

function countUp(el){
  const to = +el.dataset.count; if (reduced() || !to) { el.textContent = to.toLocaleString("pt-BR"); return; }
  const t0 = performance.now(), dur = 900;
  (function f(t){ const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString("pt-BR"); if (k < 1) requestAnimationFrame(f); })(t0);
}

function renderContent(arr){
  let html = "", list = null, ol = null;
  const flush = () => { if (list) { html += `<ul>${list.join("")}</ul>`; list = null; } if (ol) { html += `<ol>${ol.join("")}</ol>`; ol = null; } };
  arr.forEach(line => {
    if (line.startsWith("- ")) { if (ol) flush(); (list = list || []).push(`<li>${md(line.slice(2))}</li>`); return; }
    if (/^\d+\. /.test(line)) { if (list) flush(); (ol = ol || []).push(`<li>${md(line.replace(/^\d+\.\s/, ""))}</li>`); return; }
    flush();
    if (line.startsWith("## ")) html += `<h2>${md(line.slice(3))}</h2>`;
    else if (line.startsWith("> ")) html += `<div class="callout">${icon("bulb")}<p>${md(line.slice(2))}</p></div>`;
    else html += `<p>${md(line)}</p>`;
  });
  flush();
  return html;
}

let Q = null, simTick = null;

  if (src === "sim" && Q.minutes) { Q.deadline = Date.now() + Q.minutes * 60000; stopSimTimer(); simTick = setInterval(paintSimTimer, 1000); }
  go("quiz", {src});
}
function stopSimTimer(){ clearInterval(simTick); simTick = null; }
function paintSimTimer(){
  if (!Q || !Q.deadline) return;
  const left = Math.max(0, Math.round((Q.deadline - Date.now()) / 1000));
  const el = $("#qtimer"); if (el) el.textContent = `${pad(Math.floor(left/60))}:${pad(left%60)}`;
  if (left <= 0) { stopSimTimer(); toast("O tempo acabou!"); finishQuiz(); }
}

  const title = Q.src === "licao" ? esc(LBYID[Q.lid].t) : Q.src === "erros" ? "Caderno de erros" : "Simulado";

  }
  return `<div class="stack-lg" style="--c:${color}">
    <div class="topnav"><button class="icon-btn" data-act="q-quit" aria-label="Sair">${icon("x", 2.2)}</button><div class="grow stack-xs"><span class="xs muted" style="font-weight:700">${title}</span><div class="qbar">${segs}</div></div>${sim && Q.deadline ? `<span class="mono" id="qtimer" style="font-weight:700">--:--</span>` : `<span class="mono small muted">${Q.idx+1}/${Q.qids.length}</span>`}</div>
    <section class="stack ${a ? "" : "stagger"}">
      <span class="area-lbl" style="${cs(q.a)}">${AREAS[q.a].nome} · ${esc(LBYID[q.lid].s.nome)}</span>
      <p class="qtext">${esc(q.q)}</p>

        let cls = "";

  if (T.phase === "foco") { S.focus.log.push({t:today0().getTime(), m:MODES[T.mode][0], a:T.area}); T.phase = "pausa"; T.left = MODES[T.mode][1]*60; if (R.v === "foco") render(); addXP(20); toast("Bloco concluído! Faça uma pausa."); }
  else { T.phase = "foco"; T.left = MODES[T.mode][0]*60; if (R.v === "foco") render(); toast("Fim da pausa. Bora voltar!"); }
}

const STEPS = [
  ["Introdução","Repertório + problema + tese + anúncio dos 2 argumentos. De 3 a 5 linhas."],
  ["Desenvolvimento 1","Tópico frasal com o 1º argumento, repertório, explicação ligando ao tema e fechamento. De 7 a 9 linhas."],
  ["Desenvolvimento 2","Comece com um conectivo de adição (Além disso...). 2º argumento, repertório, explicação e fechamento. De 7 a 9 linhas."],
  ["Conclusão","Retome a tese e faça a proposta: agente + ação + meio + finalidade + detalhamento. De 5 a 7 linhas."]
];
const essayText = () => S.draft.mode === "guiado" ? S.draft.parts.filter(p => p.trim()).join("\n") : S.draft.text;
const essayScore = () => COMPETENCIAS.reduce((s,c) => s + c.checks.filter((_,i) => S.evalc[`${c.n}-${i}`]).length * 40, 0);
const lineCount = txt => txt.split("\n").reduce((s,l) => s + (l.trim() ? Math.max(1, Math.ceil(l.length / 68)) : 0), 0);
const STOP = new Set("a o e é de da do das dos em no na nos nas um uma uns umas para por com sem que se ao aos à às como mais mas ou sua seu suas seus isso esse essa este esta ser são foi pelo pela pelos pelas entre sobre também quando muito já não nem há ter tem desse dessa nesse nessa deve devem forma modo assim brasil brasileira brasileiro sociedade".split(" "));
function analyze(){
  const txt = essayText(), low = txt.toLowerCase(), items = [];
  const lines = lineCount(txt), paras = txt.split("\n").filter(p => p.trim()).length;
  const words = (low.match(/[a-záàâãéêíóôõúç]+/g) || []);
  if (!txt.trim()) return {items:[{st:"warn", t:"Comece a escrever para ver a análise automática."}], lines, paras, words:0};
  items.push(lines <= 7 ? {st:"bad", t:`Cerca de ${lines} linhas. Com 7 ou menos, a redação vale zero.`} : lines > 30 ? {st:"bad", t:`Cerca de ${lines} linhas. O máximo é 30.`} : lines < 20 ? {st:"warn", t:`Cerca de ${lines} linhas. O ideal é de 25 a 30.`} : {st:"ok", t:`Cerca de ${lines} linhas: bom tamanho.`});
  items.push(paras === 4 ? {st:"ok", t:"4 parágrafos: estrutura ideal."} : {st:"warn", t:`${paras} parágrafo(s). O modelo mais seguro tem 4: introdução, dois de desenvolvimento e conclusão.`});
  const temaW = S.draft.tema.toLowerCase().match(/[a-záàâãéêíóôõúç]+/g).filter(w => w.length > 4 && !STOP.has(w));
  const found = temaW.filter(w => low.includes(w.slice(0, Math.max(5, w.length - 2))));
  items.push(found.length >= Math.ceil(temaW.length * .6) ? {st:"ok", t:"Você retoma as palavras-chave do tema."} : {st:"warn", t:`Retome mais as palavras-chave do tema: ${temaW.filter(w => !found.includes(w)).slice(0,4).join(", ")}.`});
  const allCon = CONECTIVOS.flatMap(c => c[1].split(",").map(x => x.trim().toLowerCase())).filter(x => x.length > 2);
  const usedCon = [...new Set(allCon.filter(c => new RegExp("(^|[^a-záàâãéêíóôõúç])" + c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "([^a-záàâãéêíóôõúç]|$)").test(low)))];
  items.push(usedCon.length >= 8 ? {st:"ok", t:`${usedCon.length} conectivos diferentes: ótima coesão.`} : usedCon.length >= 4 ? {st:"warn", t:`${usedCon.length} conectivos diferentes. Tente chegar a 8 ou mais, variando os tipos.`} : {st:"bad", t:"Poucos conectivos. Use um no início de cada parágrafo e outros dentro deles."});
  const rep = /(segundo|de acordo com|conforme|constituição|lei |estatuto|filósof|sociólog|pensador|autor|obra|livro|filme|série|ibge|oms|onu|“)/i.test(txt);
  items.push(rep ? {st:"ok", t:"Há sinais de repertório (autor, lei, obra ou dado). Lembre de explicar a ligação com o tema."} : {st:"warn", t:"Não encontrei repertório. Cite um autor, lei, obra ou fato e explique a relação com o tema."});
  const last = txt.split("\n").filter(p => p.trim()).slice(-1)[0] || "", ll = last.toLowerCase();
  const agente = /(minist[ée]rio|governo|estado|poder p[úu]blico|escola|m[íi]dia|ongs?\b|fam[íi]lia|congresso|secretaria|prefeitura|empresas|universidades|sociedade civil|instituiç)/.test(ll);
  const acao = /(deve|devem|cabe a|cabe ao|é necessário que|é preciso que|precisa|precisam)/.test(ll);
  const meio = /(por meio d|mediante|através d|por intermédio d|com o auxílio d|a partir d)/.test(ll);
  const fin = /(a fim de|para que|com o objetivo de|com o intuito de|com a finalidade de|visando)/.test(ll);
  const det = /(,\s*(que|a qual|o qual|como|isto é|ou seja)\b|por exemplo)/.test(ll);
  const pe = [["agente",agente],["ação",acao],["meio",meio],["finalidade",fin],["detalhamento",det]];
  const got = pe.filter(x => x[1]).length;
  items.push(got === 5 ? {st:"ok", t:"Proposta com os 5 elementos (agente, ação, meio, finalidade e detalhamento)."} : {st: got >= 3 ? "warn" : "bad", t:`A conclusão parece ter ${got} de 5 elementos. Falta: ${pe.filter(x => !x[1]).map(x => x[0]).join(", ")}.`});
  const oral = low.match(/(^|[^a-z])(a gente|tipo assim|né|tá|pra|vc|pq|eu acho|eu penso|na minha opinião)(?=[^a-z]|$)/g);
  items.push(oral ? {st:"bad", t:`Evite marcas de oralidade ou 1ª pessoa: ${[...new Set(oral.map(x => x.trim()))].slice(0,4).join(", ")}.`} : {st:"ok", t:"Sem marcas de oralidade nem 1ª pessoa do singular."});
  const freq = {}; words.filter(w => w.length > 4 && !STOP.has(w)).forEach(w => freq[w] = (freq[w] || 0) + 1);
  const rep2 = Object.entries(freq).filter(([w,n]) => n >= 4 && !temaW.includes(w)).sort((a,b) => b[1] - a[1]).slice(0,3);
  items.push(rep2.length ? {st:"warn", t:`Palavras repetidas: ${rep2.map(([w,n]) => `${w} (${n}x)`).join(", ")}. Use sinônimos ou pronomes.`} : {st:"ok", t:"Sem repetições excessivas de palavras."});
  return {items, lines, paras, words:words.length};
}
function refreshAnalysis(){
  const box = $("#analysis"); if (!box) return;
  const r = analyze();
  box.innerHTML = r.items.map(i => `<div class="check-item"><span class="st ${i.st}">${i.st === "ok" ? "✓" : i.st === "warn" ? "!" : "×"}</span><span>${esc(i.t)}</span></div>`).join("");
  const lc = $("#lc"); if (lc) lc.textContent = `~${r.lines}/30 linhas · ${r.words} palavras`;
  $$("[data-plc]").forEach(el => { const p = S.draft.parts[+el.dataset.plc] || ""; el.textContent = `~${lineCount(p)} linhas`; });
}

function calcMedia(){
  const c = S.calc, ks = ["lin","hum","nat","mat","red"];
  const sp = ks.reduce((s,a) => s + (+c.pesos[a] || 0), 0) || 1;
  return ks.reduce((s,a) => s + (+c.notas[a] || 0) * (+c.pesos[a] || 0), 0) / sp;
}
function updateMedia(){
  const m = calcMedia(), diff = Math.round(m - (+S.settings.meta || 750)), col = diff >= 0 ? "var(--good)" : "var(--warn)";
  const o = $("#mediaOut"); if (!o) return;
  o.textContent = m.toFixed(1); o.style.color = col;
  const b = o.closest(".card").querySelector(".bar"); b.style.setProperty("--c", col); b.firstElementChild.style.width = Math.min(100, m / 10) + "%";
  $("#metaMsg").textContent = diff >= 0 ? `Você está ${diff} pontos acima da meta. Continue assim!` : `Faltam ${-diff} pontos para a meta. A redação é o caminho mais rápido para subir a média.`;
}

const TRI = {
  lin:[[0,300],[10,380],[15,430],[20,480],[25,530],[30,580],[35,635],[40,700],[45,820]],
  hum:[[0,310],[10,400],[15,455],[20,510],[25,560],[30,615],[35,675],[40,745],[45,845]],
  nat:[[0,320],[10,440],[15,500],[20,555],[25,605],[30,660],[35,720],[40,790],[45,870]],
  mat:[[0,330],[5,390],[10,470],[15,555],[20,625],[25,690],[30,750],[35,810],[40,880],[45,960]]
};
function triEstimate(a, ok, total){
  const x = total ? ok / total * 45 : 0, A = TRI[a];
  for (let i = 1; i < A.length; i++) if (x <= A[i][0]) { const [x0,y0] = A[i-1], [x1,y1] = A[i]; return Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0)); }
  return A[A.length-1][1];
}

{t:"Trabalho, desigualdade e movimentos sociais", inc:"A", r:"Transformações do trabalho, estratificação social, cidadania e lutas por direitos.", v:"sociologia do trabalho desigualdade movimentos sociais enem aula",
c:[
"## O mundo do trabalho",
"- **Taylorismo e fordismo:** controle do tempo, especialização, produção em massa e trabalho repetitivo e alienante.",
"- **Toyotismo:** flexibilidade, trabalhador polivalente, metas, terceirização.",
"- **Precarização e uberização:** empregos sem carteira assinada, contratos temporários, trabalho por aplicativo, ausência de direitos e renda instável.",
"- **Automação e inteligência artificial:** substituição de funções e necessidade de requalificação.",
"- **Trabalho de cuidado:** o trabalho doméstico e de cuidado, feito principalmente por mulheres e sem remuneração, é invisibilizado. Foi o tema da redação do ENEM 2023.",
"## Desigualdade e estratificação",
"- **Estratificação social:** divisão da sociedade em camadas. Nas **castas**, não há mobilidade; nos **estamentos**, a mobilidade é mínima; nas **classes**, a mobilidade é possível.",
"- **Mobilidade social:** ascensão ou queda entre camadas.",
"- O Brasil é um dos países mais **desiguais** do mundo, com desigualdades de renda, raça, gênero e região que se sobrepõem (**interseccionalidade**).",
"## Cidadania",
"Para **T. H. Marshall**, a cidadania moderna se formou em etapas: **direitos civis** (liberdade, propriedade, ir e vir), **políticos** (votar e ser votado) e **sociais** (educação, saúde, trabalho). No Brasil, José Murilo de Carvalho mostrou que essa ordem foi diferente: os direitos sociais vieram com Vargas antes da plena democracia.",
"## Movimentos sociais",
"Ações coletivas organizadas para conquistar ou defender direitos:",
"- Movimento **operário** e sindical.",
"- Movimento **feminista** (voto, igualdade salarial, combate à violência).",
"- Movimento **negro** (combate ao racismo, cotas, valorização da cultura afro-brasileira).",
"- Movimentos **indígenas** (demarcação de terras), **LGBTQIA+**, **MST** (reforma agrária), ambientalistas.",
"- **Movimento antimanicomial:** luta pelo fim dos manicômios e por um tratamento humanizado em liberdade. Resultou na **Lei da Reforma Psiquiátrica (Lei 10.216/2001)** e nos CAPS.",
"> Ligação com Psicologia: a Luta Antimanicomial (18 de maio) é uma conquista histórica da psicologia brasileira e um ótimo repertório para redação."
],
q:[
["Motoristas de aplicativo trabalham sem vínculo empregatício, arcam com os custos do veículo e não têm férias remuneradas. Esse fenômeno é chamado de",["fordismo","uberização do trabalho","taylorismo","servidão","corporativismo"],1,"A uberização descreve o trabalho sob demanda por plataformas, com precarização dos direitos."],
["Segundo T. H. Marshall, a cidadania é composta por direitos",["civis, políticos e sociais.","apenas eleitorais.","religiosos e morais.","exclusivamente econômicos.","militares e diplomáticos."],0,"Marshall descreveu três dimensões da cidadania, conquistadas historicamente."],
["O movimento antimanicomial no Brasil defende",["a construção de mais hospícios.","o fim dos manicômios e o tratamento humanizado em serviços abertos, como os CAPS.","a internação obrigatória de todos os pacientes.","o fim do SUS.","a proibição da psicologia."],1,"A luta antimanicomial resultou na Lei 10.216/2001, que redirecionou o cuidado em saúde mental para serviços comunitários."],
["Em uma sociedade de castas, a mobilidade social é",["alta e incentivada.","praticamente inexistente, pois a posição é definida pelo nascimento.","igual à das sociedades de classes.","definida por eleições.","determinada apenas pelo mérito."],1,"Nas castas, a posição social é hereditária e fixa."]
]},
{t:"Estado, poder, mídia e cidadania", inc:"M", r:"Formas de Estado e de governo, democracia, Bourdieu, controle social e a mídia.", v:"estado poder democracia bourdieu sociologia enem aula",
c:[
"## O Estado moderno",
"Para Weber, o Estado é a instituição que detém o **monopólio do uso legítimo da força** em um território.",
"- **Formas de governo:** monarquia e república.",
"- **Sistemas de governo:** presidencialismo (o presidente é chefe de Estado e de governo, como no Brasil) e parlamentarismo (o primeiro-ministro governa).",
"- **Regimes:** democrático (eleições livres, direitos, pluralismo) e autoritário ou totalitário.",
"## Democracia",
"- **Representativa:** o povo elege representantes.",
"- **Participativa ou direta:** plebiscitos, referendos, projetos de lei de iniciativa popular (como a Lei da Ficha Limpa), conselhos e orçamento participativo.",
"- A democracia depende de imprensa livre, instituições independentes e cidadãos informados.",
"## Pierre Bourdieu",
"- **Capital cultural:** conhecimentos, gostos e diplomas herdados da família, que dão vantagem na escola. A escola tende a **reproduzir** as desigualdades.",
"- **Violência simbólica:** dominação que acontece de forma sutil, aceita como natural pelos dominados (por exemplo, considerar “feio” o sotaque de uma região).",
"- **Habitus:** disposições incorporadas que orientam o modo de agir e de pensar.",
"## Controle social e desvio",
"- **Controle social:** mecanismos que levam as pessoas a seguir normas. Pode ser formal (leis, polícia) ou informal (família, opinião pública).",
"- **Socialização:** processo pelo qual aprendemos as normas. **Primária** na família; **secundária** na escola, no trabalho e na mídia.",
"## Mídia e poder",
"A mídia forma opinião, define a agenda pública e pode reforçar estereótipos. As redes sociais ampliaram vozes, mas também a desinformação e os discursos de ódio.",
"> Ligação com Psicologia: socialização, formação da identidade e estigma são conceitos compartilhados entre a Sociologia e a Psicologia Social."
],
q:[

["Uma lei proposta por cidadãos com coleta de assinaturas, como a Lei da Ficha Limpa, é exemplo de",["democracia participativa.","regime totalitário.","dominação carismática.","monarquia absolutista.","socialização primária."],0,"A iniciativa popular permite que os cidadãos proponham leis diretamente."],
["Segundo Weber, o que define o Estado é",["a religião oficial.","o monopólio do uso legítimo da força em um território.","a existência de um rei.","a economia de mercado.","a presença de partidos políticos."],1,"O Estado é a única instituição autorizada a usar a força de forma legítima."],
["A aprendizagem das normas e valores que ocorre primeiro na família é chamada de",["socialização primária","controle formal","violência simbólica","anomia","mobilidade social"],0,"A família é o primeiro agente de socialização. A escola, o trabalho e a mídia atuam na secundária."]
]}

{t:"Ecologia", inc:"A", r:"Cadeias alimentares, fluxo de energia, ciclos, relações ecológicas e impactos ambientais.", v:"ecologia enem biologia aula",
c:[
"## Conceitos básicos",
"- **População:** indivíduos da mesma espécie numa área. **Comunidade:** todas as populações de uma área. **Ecossistema:** comunidade + ambiente físico.",
"- **Habitat:** onde a espécie vive (o “endereço”). **Nicho ecológico:** o papel dela no ecossistema (a “profissão”).",
"## Cadeias e teias alimentares",
"- **Produtores** (plantas, algas) fazem fotossíntese. **Consumidores** (primários, secundários...) se alimentam de outros seres. **Decompositores** (fungos, bactérias) reciclam a matéria.",
"- **Fluxo de energia:** é unidirecional e diminui a cada nível trófico; só cerca de **10%** passa adiante, pois o restante se perde como calor. Por isso as cadeias são curtas.",
"- **Matéria:** circula, é reciclada.",
"## Biomagnificação (bioacumulação)",
"Substâncias não degradáveis, como **mercúrio**, **DDT** e metais pesados, se acumulam nos tecidos e ficam **mais concentradas nos níveis tróficos mais altos**. Predadores de topo, como grandes peixes, aves de rapina e o ser humano, são os mais afetados.",
"## Ciclos biogeoquímicos",
"- **Carbono:** a fotossíntese retira CO₂ do ar; a respiração, a decomposição e a queima de combustíveis devolvem.",
"- **Nitrogênio:** as plantas não absorvem o N₂ do ar. Bactérias **fixadoras** (como as das raízes de leguminosas, a exemplo da soja e do feijão) transformam N₂ em compostos úteis. Por isso a **adubação verde** e a rotação com leguminosas enriquecem o solo.",
"- **Água:** evaporação, transpiração, condensação e precipitação.",
"## Relações ecológicas",
"- **Harmônicas:** mutualismo (ambos ganham e dependem um do outro, como os liquens), protocooperação (ambos ganham, sem dependência), comensalismo (um ganha, o outro não perde), inquilinismo.",
"- **Desarmônicas:** predação, parasitismo, competição, amensalismo.",
"## Impactos ambientais",
"- **Eutrofização:** excesso de nutrientes (esgoto, fertilizantes) → explosão de algas → a luz não passa e as algas morrem → a decomposição por bactérias aeróbicas consome o O₂ → peixes morrem.",
"- **Espécies invasoras:** sem predadores naturais, se multiplicam e desequilibram o ambiente.",
"- **Sucessão ecológica:** colonização gradual de um ambiente, das espécies pioneiras até a comunidade clímax."
],

{t:"Saúde, doenças e imunização", inc:"A", r:"Viroses, bacterioses, protozooses e verminoses, formas de transmissão, prevenção, vacinas e soros.", v:"doenças enem biologia parasitologia aula",
c:[
"## Como pensar",
"No ENEM, o foco é a **transmissão** e a **prevenção**, especialmente o saneamento básico. Saber o agente causador e o vetor já resolve a maioria das questões.",
"## Viroses (causadas por vírus)",
"- **Dengue, zika, chikungunya e febre amarela urbana:** transmitidas pelo mosquito **Aedes aegypti**. Prevenção: eliminar **água parada**. Zika na gravidez pode causar microcefalia.",
"- **Gripe, covid-19, sarampo:** transmissão respiratória. Prevenção com vacinas.",
"- **HIV/aids e hepatite B:** sexual, sanguínea e vertical (da mãe para o bebê). Prevenção com preservativo e seringas descartáveis.",
"- **Antibióticos não funcionam contra vírus.**",

"- **Tuberculose:** transmissão pelo ar; vacina BCG.",
"- **Leptospirose:** urina de **rato** em água de enchente.",
"- **Cólera:** água e alimentos contaminados; prevenção com saneamento.",
"- **Tétano:** ferimentos com objetos contaminados; vacina antitetânica.",
"- **Sífilis:** transmissão sexual; tratamento com antibióticos.",
"## Protozooses (causadas por protozoários)",
"- **Malária:** mosquito **Anopheles** (prego), comum na Amazônia.",
"- **Doença de Chagas:** fezes do **barbeiro** (Triatoma) no local da picada; também pela ingestão de alimentos contaminados, como caldo de cana e açaí.",
"- **Leishmaniose:** mosquito-palha.",
"- **Amebíase e giardíase:** água e alimentos contaminados.",
"## Verminoses",
"- **Esquistossomose:** larvas saem do **caramujo** e penetram a pele em água doce contaminada por fezes.",
"- **Ascaridíase (lombriga):** ingestão de ovos.",
"- **Teníase:** comer carne de porco ou boi mal cozida com cisticercos. **Cisticercose:** ingerir **ovos** da tênia do porco (água ou alimentos contaminados).",
"- **Ancilostomose (amarelão):** larvas penetram a pele; prevenção: usar calçados.",
"## Vacina x soro",
"- **Vacina:** contém antígenos (agente morto, atenuado ou partes dele). O corpo produz anticorpos e **células de memória**: é imunidade **ativa**, duradoura e **preventiva**.",
"- **Soro:** contém **anticorpos prontos**: é imunidade **passiva**, imediata e temporária, usada em **tratamentos** (picada de cobra, tétano).",
"- **Imunidade de rebanho:** com muitos vacinados, o agente circula menos e protege também quem não pode se vacinar.",

["A principal medida de combate à dengue, à zika e à chikungunya é",["tomar antibióticos.","eliminar recipientes com água parada, onde o Aedes se reproduz.","cozinhar bem a carne.","evitar banhos em rios.","usar calçados."],1,"As três viroses são transmitidas pelo Aedes aegypti, cujas larvas se desenvolvem em água parada."],

{t:"Genética", inc:"A", r:"Leis de Mendel, cruzamentos, grupos sanguíneos, herança ligada ao sexo e do DNA à proteína.", v:"genética leis de mendel enem aula",
c:[
"## Conceitos",
"- **Gene:** trecho de DNA com a informação para uma característica. **Alelos:** versões diferentes de um mesmo gene.",
"- **Genótipo:** a constituição genética (AA, Aa, aa). **Fenótipo:** a característica que se manifesta (genótipo + ambiente).",
"- **Homozigoto:** alelos iguais (AA ou aa). **Heterozigoto:** alelos diferentes (Aa).",
"- **Dominante:** aparece mesmo em dose única (A). **Recessivo:** só aparece em dose dupla (aa).",
"## 1ª Lei de Mendel (segregação)",
"Cada característica é determinada por um **par de alelos**, que se **separam** na formação dos gametas. Cada gameta leva só um alelo.",
"- **Aa × Aa** → 1/4 AA, 2/4 Aa, 1/4 aa → proporção fenotípica **3:1** (3 dominantes para 1 recessivo).",
"- **Aa × aa** → 1/2 Aa, 1/2 aa → proporção 1:1.",
"> Dica: pais “normais” que têm um filho com doença recessiva são obrigatoriamente heterozigotos (Aa).",
"## 2ª Lei de Mendel",
"Genes em cromossomos diferentes se distribuem de forma independente. **AaBb × AaBb** → proporção 9:3:3:1. Para calcular, multiplique as probabilidades de cada gene separadamente.",
"## Grupos sanguíneos",
"- **Sistema ABO:** alelos Iᴬ, Iᴮ (codominantes) e i (recessivo). Tipo A (IᴬIᴬ ou Iᴬi), B (IᴮIᴮ ou Iᴮi), AB (IᴬIᴮ), O (ii).",
"- **Doador universal:** O− (sem antígenos A, B e Rh). **Receptor universal:** AB+.",
"- **Fator Rh e eritroblastose fetal:** mãe Rh− com feto Rh+ pode produzir anticorpos anti-Rh após o primeiro parto, que atacam as hemácias de um segundo filho Rh+. É prevenida com injeção de anti-Rh na mãe após o parto.",
"## Herança ligada ao sexo",
"Genes no cromossomo **X**. **Daltonismo** e **hemofilia** são recessivos ligados ao X, por isso são mais comuns em **homens** (XY), que têm apenas um X. A mulher (XX) precisa de dois alelos alterados.",
"## Do DNA à proteína",
"- **Replicação:** DNA → DNA. **Transcrição:** DNA → RNA mensageiro. **Tradução:** RNA → proteína (nos ribossomos).",
"- **Mutação:** alteração no DNA, fonte de variabilidade genética."
],

{t:"Evolução", inc:"A", r:"Lamarck, Darwin, neodarwinismo, especiação e exemplos atuais de seleção natural.", v:"evolução darwin lamarck seleção natural enem aula",
c:[
"## Lamarckismo (refutado)",
"Jean-Baptiste de Lamarck propôs duas ideias:",
"- **Lei do uso e desuso:** órgãos muito usados se desenvolvem e os pouco usados atrofiam.",
"- **Herança dos caracteres adquiridos:** as características adquiridas durante a vida seriam passadas aos filhos. Exemplo clássico: a girafa esticaria o pescoço e os filhos nasceriam com pescoço maior.",
"- **Por que está errado:** mudanças no corpo durante a vida não alteram o DNA dos gametas. Um fisiculturista não tem filhos musculosos por isso.",
"## Darwinismo",
"Charles Darwin (“A Origem das Espécies”, 1859), com Alfred Wallace:",
"- Os indivíduos de uma população **variam**.",
"- Nascem mais indivíduos do que o ambiente pode sustentar, então há **competição**.",
"- Os mais **adaptados** ao ambiente sobrevivem e se reproduzem mais: é a **seleção natural**.",
"- As características favoráveis se tornam mais comuns ao longo das gerações.",
"- **O ambiente não cria as variações, ele apenas seleciona as que já existem.**",
"## Neodarwinismo (teoria sintética)",
"Une Darwin à genética: as **mutações** e a **recombinação genética** (na reprodução sexuada) geram a variabilidade; a **seleção natural** atua sobre ela.",
"## Exemplos que caem muito",
"- **Bactérias resistentes a antibióticos:** o antibiótico mata as sensíveis; as que já eram resistentes sobrevivem e se multiplicam. O uso incorreto de antibióticos acelera o processo.",
"- **Insetos resistentes a inseticidas.**",
"- **Mariposas na Revolução Industrial (melanismo industrial):** com a fuligem, as escuras ficaram camufladas e aumentaram na população.",
"## Especiação e evidências",
"- **Especiação:** isolamento geográfico → acúmulo de diferenças → isolamento reprodutivo → novas espécies.",
"- **Evidências:** fósseis, órgãos homólogos (mesma origem, como o braço humano e a asa do morcego), órgãos análogos (mesma função, origem diferente, como a asa da ave e a do inseto), semelhanças no DNA.",
"> Pegadinha: frases como “a bactéria se adaptou ao antibiótico” ou “para sobreviver, desenvolveu resistência” têm raciocínio lamarckista. Procure a alternativa que fala em seleção de variações preexistentes."
],
q:[
["Uma população de insetos foi tratada com inseticida por anos e hoje a maioria é resistente. A explicação darwinista é que",["o inseticida provocou mutações para a resistência.","os insetos se esforçaram para resistir.","os insetos já resistentes sobreviveram e se reproduziram mais.","a resistência adquirida foi passada aos filhos.","o inseticida perdeu o efeito sozinho."],2,"A variação já existia; o inseticida eliminou os sensíveis e selecionou os resistentes."],
["A ideia de que características adquiridas durante a vida são transmitidas aos descendentes pertence a",["Darwin","Mendel","Lamarck","Wallace","Watson e Crick"],2,"É a lei da herança dos caracteres adquiridos, de Lamarck, hoje refutada."],
["O braço humano e a asa do morcego têm a mesma origem embrionária, mas funções diferentes. São órgãos",["análogos","homólogos","vestigiais","artificiais","convergentes"],1,"Órgãos homólogos têm origem comum e indicam parentesco evolutivo."],
["Segundo o neodarwinismo, as principais fontes de variabilidade genética são",["o uso e o desuso dos órgãos.","as mutações e a recombinação genética.","a vontade dos organismos.","a alimentação e o clima.","as vacinas."],1,"Mutações criam novos alelos e a recombinação gera novas combinações, e a seleção natural atua sobre elas."]
]},
{t:"Citologia e metabolismo energético", inc:"M", r:"A célula, suas organelas, a membrana, divisão celular, fotossíntese, respiração e fermentação.", v:"citologia fotossíntese respiração celular enem aula",
c:[
"## Tipos de célula",
"- **Procarionte:** sem núcleo organizado e sem organelas membranosas. São as bactérias.",
"- **Eucarionte:** com núcleo e organelas. Animais, plantas, fungos e protozoários.",
"- A **célula vegetal** tem parede celular (celulose), cloroplastos e um grande vacúolo.",
"## Organelas principais",
"- **Mitocôndria:** respiração celular (produção de ATP). Tem DNA próprio e é herdada da mãe.",
"- **Cloroplasto:** fotossíntese.",
"- **Ribossomo:** síntese de proteínas.",
"- **Retículo endoplasmático:** o rugoso produz proteínas; o liso produz lipídios e desintoxica.",
"- **Complexo golgiense:** armazena, modifica e secreta substâncias.",
"- **Lisossomo:** digestão intracelular.",
"## Membrana plasmática",
"- **Transporte passivo** (sem gasto de energia, a favor do gradiente): **difusão** e **osmose** (a água passa do meio menos concentrado para o mais concentrado).",
"- **Transporte ativo** (com gasto de ATP, contra o gradiente): a bomba de sódio e potássio.",
"> Aplicação: salgar a carne conserva porque a osmose retira água dos microrganismos. Uma hemácia em água pura incha e pode estourar.",
"## Metabolismo energético",
"- **Fotossíntese:** 6CO₂ + 6H₂O + luz → C₆H₁₂O₆ + 6O₂. Ocorre nos cloroplastos e transforma energia luminosa em química.",
"- **Respiração celular aeróbica:** C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energia (ATP). Etapas: glicólise (no citoplasma), ciclo de Krebs e cadeia respiratória (nas mitocôndrias).",
"- **Fermentação:** sem oxigênio, com menos energia. **Alcoólica** (leveduras): produz etanol e CO₂, usada no pão, na cerveja e no álcool combustível. **Lática** (bactérias e músculos em esforço intenso): produz ácido lático, usada no iogurte e no queijo.",
"## Divisão celular",
"- **Mitose:** 1 célula → 2 células iguais, com o mesmo número de cromossomos. Serve para crescimento e regeneração. O câncer é mitose descontrolada.",
"- **Meiose:** 1 célula → 4 células com metade dos cromossomos (gametas). O crossing-over gera variabilidade."
],
q:[
["Ao colocar sal sobre fatias de pepino, elas murcham e liberam água. Esse fenômeno é explicado pela",["fotossíntese","osmose","fermentação","mitose","respiração aeróbica"],1,"A água sai das células (meio menos concentrado) para o meio externo salgado (mais concentrado)."],
["A massa do pão cresce por causa do gás produzido por leveduras. Esse gás e o processo são, respectivamente,",["O₂ e fotossíntese","CO₂ e fermentação alcoólica","N₂ e respiração","CO₂ e fermentação lática","H₂ e mitose"],1,"As leveduras fermentam o açúcar e liberam CO₂, que faz a massa crescer, e etanol."],
["A organela responsável pela respiração celular e produção da maior parte do ATP é",["o ribossomo","o cloroplasto","a mitocôndria","o lisossomo","o complexo golgiense"],2,"O ciclo de Krebs e a cadeia respiratória ocorrem nas mitocôndrias."],
["A divisão celular que origina gametas com metade do número de cromossomos é a",["mitose","meiose","fotossíntese","fermentação","replicação"],1,"A meiose reduz o número de cromossomos pela metade e gera variabilidade genética."]
]},
{t:"Fisiologia humana e sistema nervoso", inc:"M", r:"Sistemas do corpo humano, hormônios e o sistema nervoso, base biológica do comportamento.", v:"fisiologia humana sistema nervoso enem aula",
c:[
"## Sistemas que mais caem",
"- **Digestório:** a digestão começa na boca (amilase salivar), continua no estômago (proteínas, com ácido clorídrico) e no intestino delgado (a maior parte da digestão e da absorção, com a bile do fígado e as enzimas do pâncreas).",
"- **Respiratório:** trocas gasosas nos alvéolos pulmonares (O₂ entra no sangue, CO₂ sai).",
"- **Cardiovascular:** coração com 4 cavidades; a circulação é dupla e completa (sangue arterial e venoso não se misturam).",
"- **Excretor:** os rins filtram o sangue e produzem urina, eliminando ureia e regulando a água e os sais.",
"## Sistema endócrino (hormônios)",
"- **Insulina** (pâncreas): baixa a glicose no sangue. **Glucagon:** aumenta a glicose. **Diabetes:** falta de insulina (tipo 1) ou resistência a ela (tipo 2).",
"- **Adrenalina** (suprarrenais): reação de luta ou fuga (acelera o coração e aumenta a glicose).",
"- **Cortisol:** hormônio do estresse. Em excesso e por muito tempo, prejudica a imunidade, o sono e a memória.",
"- **Tireoide:** T3 e T4 regulam o metabolismo (o iodo no sal previne o bócio).",
"## Sistema nervoso",
"- **Neurônio:** dendritos (recebem), corpo celular e axônio (conduz o impulso elétrico).",
"- **Sinapse:** comunicação entre neurônios por **neurotransmissores**. **Dopamina** (prazer, recompensa, motivação), **serotonina** (humor, sono, apetite), noradrenalina (atenção, alerta), acetilcolina (músculos, memória), GABA (inibição, calma).",
"- **Sistema nervoso central:** encéfalo e medula. **Periférico:** nervos e gânglios.",
"- **Sistema nervoso autônomo:** o **simpático** prepara para ação e estresse (acelera o coração, dilata as pupilas); o **parassimpático** promove relaxamento e digestão.",
"- **Arco reflexo:** resposta rápida pela medula, sem passar pelo cérebro (tirar a mão do fogo).",
"## Drogas e cérebro",
"Muitas drogas atuam nas sinapses. Estimulantes (cocaína, anfetaminas, cafeína), depressoras (álcool, calmantes) e perturbadoras (LSD, maconha em altas doses). A **dependência** está ligada ao sistema de recompensa da dopamina.",
"> Ligação com Psicologia: este é o conteúdo de Biologia mais importante para quem quer fazer Psicologia! Neurotransmissores e o sistema nervoso são a base da neurociência e da psicofarmacologia."
],
q:[
["Uma pessoa leva um susto: o coração acelera, as pupilas dilatam e a respiração fica rápida. Essas respostas são comandadas",["pelo sistema nervoso parassimpático.","pelo sistema nervoso simpático e pela adrenalina.","pela insulina.","pelo sistema digestório.","pelo arco reflexo da medula apenas."],1,"O simpático e a adrenalina preparam o corpo para a reação de luta ou fuga."],
["O neurotransmissor mais associado ao sistema de recompensa, ao prazer e à motivação, e envolvido na dependência química, é a",["insulina","dopamina","ureia","amilase","bile"],1,"A dopamina participa do circuito de recompensa, que muitas drogas estimulam de forma exagerada."],
["No diabetes tipo 1, o organismo não produz quantidade suficiente de",["adrenalina","insulina","glucagon","cortisol","serotonina"],1,"Sem insulina, a glicose não entra bem nas células e se acumula no sangue."],
["Ao encostar a mão numa panela quente, a pessoa a retira antes mesmo de sentir dor. Isso acontece por causa",["do arco reflexo, integrado na medula espinal.","da ação do hormônio insulina.","da digestão no estômago.","da filtração nos rins.","da produção de glucagon."],0,"No arco reflexo, a resposta é coordenada pela medula, sem passar primeiro pelo cérebro."]
]},
{t:"Biotecnologia", inc:"M", r:"DNA recombinante, transgênicos, clonagem, células-tronco, CRISPR, PCR e vacinas de mRNA.", v:"biotecnologia transgênicos células-tronco enem aula",
c:[
"## Engenharia genética",
"Manipulação do DNA para obter produtos ou organismos com características desejadas.",
"- **DNA recombinante:** inserir um gene de um organismo em outro. Exemplo clássico: o gene da **insulina humana** colocado em bactérias, que passam a produzi-la em grande escala para diabéticos.",
"- **Enzimas de restrição:** “tesouras” que cortam o DNA em pontos específicos.",
"- **Transgênicos (OGMs):** organismos que recebem genes de outra espécie. Por exemplo, soja resistente a herbicida e milho Bt, que produz uma proteína inseticida. Debate: aumento da produção x riscos ambientais, uso de agrotóxicos e dependência de sementes patenteadas.",
"## Clonagem",
"Produção de indivíduos geneticamente idênticos. A **ovelha Dolly** (1996) foi o primeiro mamífero clonado a partir de uma célula adulta, por transferência nuclear.",
"## Células-tronco",
"Células indiferenciadas capazes de se transformar em vários tipos de células. **Embrionárias** (mais versáteis, com debate ético) e **adultas** (medula óssea, cordão umbilical). Uso em terapias e na medicina regenerativa.",
"## Técnicas modernas",
"- **PCR:** multiplica trechos de DNA. É usada em testes de covid, exames de paternidade e na perícia criminal.",
"- **Teste de DNA:** compara sequências para identificar pessoas.",
"- **CRISPR-Cas9:** edição genética precisa, que permite “recortar e colar” genes.",
"- **Vacinas de RNA mensageiro:** levam instruções para as células produzirem uma proteína do vírus, que ativa a imunidade. O mRNA **não altera o DNA** da pessoa.",
"> Temas éticos, como transgênicos, clonagem humana e edição de embriões, costumam aparecer em questões interdisciplinares."
],
q:[
["Bactérias que receberam o gene humano da insulina e passaram a produzir esse hormônio são exemplo de",["clonagem reprodutiva","organismos transgênicos com DNA recombinante","células-tronco embrionárias","mutação espontânea","fermentação lática"],1,"A inserção de um gene humano em bactérias é tecnologia de DNA recombinante."],
["A técnica usada para multiplicar pequenas quantidades de DNA, útil em testes de covid e perícias, é a",["PCR","clonagem","fotossíntese","mitose","eletrólise"],0,"A PCR (reação em cadeia da polimerase) amplifica trechos de DNA em laboratório."],
["As células-tronco são promissoras para a medicina porque",["são células totalmente especializadas.","podem se diferenciar em vários tipos celulares.","são encontradas apenas em bactérias.","não possuem DNA.","não se dividem."],1,"Sua capacidade de originar diferentes tecidos permite pesquisas em regeneração de órgãos."],
["Sobre as vacinas de RNA mensageiro, é correto afirmar que",["alteram o DNA da pessoa vacinada.","levam instruções para as células produzirem uma proteína do vírus, estimulando a imunidade.","contêm o vírus vivo e ativo.","funcionam como antibióticos.","são soros com anticorpos prontos."],1,"O mRNA é lido pelos ribossomos, produz a proteína viral e o sistema imune aprende a reconhecê-la; ele não entra no núcleo."]
]},
{t:"Botânica", inc:"B", r:"Grupos de plantas, estruturas, hormônios vegetais e fisiologia.", v:"botânica enem biologia aula",
c:[
"## Os quatro grupos de plantas",
"- **Briófitas (musgos):** sem vasos condutores, pequenas, dependem de água para reprodução, vivem em locais úmidos.",
"- **Pteridófitas (samambaias):** com vasos condutores, sem sementes; os esporos ficam sob as folhas.",
"- **Gimnospermas (pinheiros, araucária):** com **sementes nuas** (sem fruto) e grão de pólen.",
"- **Angiospermas:** com **flores e frutos**, que protegem a semente. São o grupo mais diverso.",
"## Estruturas",
"- **Xilema:** leva água e sais minerais das raízes às folhas (seiva bruta).",
"- **Floema:** leva os açúcares produzidos na fotossíntese (seiva elaborada).",
"- **Estômatos:** poros nas folhas que controlam as trocas gasosas e a **transpiração**. Fecham em situações de seca para economizar água.",
"## Hormônios vegetais",
"- **Auxina:** crescimento, **fototropismo** (curvar-se em direção à luz) e enraizamento.",
"- **Etileno:** **amadurecimento dos frutos**. Por isso embrulhar frutas em jornal ou colocá-las junto de frutas maduras acelera o amadurecimento.",
"- **Giberelina:** crescimento do caule e germinação.",
"- **Citocinina:** divisão celular.",
"- **Ácido abscísico:** dormência e fechamento dos estômatos.",
"## Polinização e dispersão",
"Polinização pelo vento, por insetos (abelhas), aves e morcegos. A perda de polinizadores, como o declínio das abelhas, ameaça a produção de alimentos."
],
q:[
["Para acelerar o amadurecimento de bananas, é comum embrulhá-las em jornal. Isso ocorre porque o jornal concentra o",["oxigênio","etileno liberado pelos frutos","gás carbônico da fotossíntese","nitrogênio do ar","vapor de água"],1,"O etileno é um gás que estimula o amadurecimento; retido, ele age mais rápido."],
["O grupo vegetal que possui sementes, mas não forma frutos, é o das",["briófitas","pteridófitas","gimnospermas","angiospermas","algas"],2,"As gimnospermas, como o pinheiro, têm sementes “nuas”, sem fruto."],
["O tecido que transporta a seiva bruta (água e sais minerais) das raízes às folhas é o",["floema","xilema","parênquima","estômato","súber"],1,"O xilema conduz a seiva bruta; o floema conduz a seiva elaborada."],
["Em dias muito secos, as plantas fecham os estômatos para",["aumentar a fotossíntese.","reduzir a perda de água por transpiração.","absorver mais luz.","produzir etileno.","liberar sementes."],1,"O fechamento dos estômatos diminui a transpiração e evita a desidratação."]
]}
]});

{t:"Química ambiental", inc:"A", r:"Efeito estufa, chuva ácida, camada de ozônio, tratamento de água e resíduos.", v:"química ambiental enem aula",
c:[
"## Poluição do ar",
"- **Efeito estufa:** gases como CO₂ (queima de combustíveis fósseis e desmatamento), CH₄ (metano, da pecuária e de aterros) e N₂O retêm calor. A intensificação causa o aquecimento global.",
"- **Chuva ácida:** gases **SO₂** (queima de carvão e combustíveis com enxofre) e **NOₓ** (motores) reagem com a água e formam ácidos sulfúrico e nítrico. Efeitos: corrosão de monumentos de mármore (CaCO₃), acidificação de lagos e solos.",
"- **Camada de ozônio (O₃):** protege contra a radiação ultravioleta. Foi destruída por **CFCs** (gases de aerossóis e geladeiras antigas). O Protocolo de Montreal (1987) proibiu os CFCs, e a camada está se recuperando.",
"- **Monóxido de carbono (CO):** tóxico, liga-se à hemoglobina e impede o transporte de O₂.",
"## Tratamento de água (ETA)",
"1. **Coagulação e floculação:** adição de sulfato de alumínio e cal; formam-se flocos que agrupam as impurezas.",
"2. **Decantação:** os flocos pesados se depositam.",
"3. **Filtração:** camadas de areia, cascalho e carvão.",
"4. **Desinfecção:** **cloração**, que mata microrganismos.",
"5. **Fluoretação:** o flúor previne cáries.",
"## Tratamento de esgoto",
"Remove matéria orgânica, principalmente com bactérias que a decompõem. Esgoto sem tratamento causa eutrofização e doenças.",
"## Resíduos e soluções",
"- **Lixões** contaminam solo e água com o **chorume**. **Aterros sanitários** têm impermeabilização e captação de gases.",
"- **Reciclagem** e **biodegradação.** Plásticos convencionais demoram centenas de anos para se degradar; os **microplásticos** já estão nos oceanos e nos alimentos.",
"- **Biocombustíveis** (etanol, biodiesel): renováveis; o CO₂ liberado foi absorvido pela planta durante o crescimento.",
"- **Pilhas e baterias** contêm metais pesados (mercúrio, chumbo, cádmio) e exigem descarte especial."
],
q:[
["Estátuas de mármore (CaCO₃) em cidades industriais apresentam desgaste acelerado. A causa mais provável é",["a camada de ozônio.","a chuva ácida, formada a partir de SO₂ e NOₓ.","o excesso de oxigênio no ar.","a fotossíntese das plantas.","o efeito estufa natural."],1,"Os ácidos da chuva ácida reagem com o carbonato de cálcio do mármore, corroendo-o."],
["Na estação de tratamento de água, a etapa que elimina microrganismos é a",["floculação","decantação","filtração","cloração","fluoretação"],3,"O cloro é um desinfetante que mata bactérias e outros microrganismos."],
["Os CFCs foram proibidos por",["aumentarem a acidez da chuva.","destruírem a camada de ozônio, que filtra a radiação ultravioleta.","serem inflamáveis.","causarem eutrofização.","produzirem chorume."],1,"Os CFCs liberam cloro na estratosfera, que destrói as moléculas de O₃."],
["O etanol é considerado um combustível renovável porque",["não libera CO₂ na combustão.","é produzido a partir da cana, que absorve CO₂ ao crescer e pode ser replantada.","é extraído do petróleo.","não precisa de oxigênio para queimar.","é feito de carvão mineral."],1,"A fonte é renovável e parte do CO₂ emitido é compensada pela fotossíntese das próximas plantações."]
]},
{t:"Estequiometria e mol", inc:"A", r:"Contar partículas pela massa: mol, massa molar, proporções, reagente limitante, pureza e rendimento.", v:"estequiometria mol enem química aula",
c:[
"## O mol",
"**1 mol** = **6,02 × 10²³** partículas (constante de Avogadro). É como “dúzia”, só que para átomos e moléculas.",
"- **Massa molar (g/mol):** soma das massas atômicas. Exemplo: H₂O = 2(1) + 16 = **18 g/mol**. CO₂ = 12 + 2(16) = **44 g/mol**.",
"- **Número de mols:** n = massa ÷ massa molar.",
"- **Volume de gás:** nas condições normais de temperatura e pressão (CNTP), 1 mol de gás ocupa cerca de **22,4 L**.",
"## Como resolver (roteiro)",
"1. Escreva e **balanceie** a equação.",
"2. Os **coeficientes** mostram a proporção em mols.",
"3. Converta o que foi dado para mol, faça a regra de três e converta para a unidade pedida.",
"> Exemplo: CH₄ + 2O₂ → CO₂ + 2H₂O. Queimando 16 g de CH₄ (1 mol), forma-se 1 mol de CO₂ = 44 g.",
"## Casos especiais",
"- **Reagente limitante:** o que acaba primeiro e limita a quantidade de produto. O outro está em **excesso**.",
"- **Pureza:** se uma amostra de 100 g tem 80% de pureza, só 80 g reagem.",
"- **Rendimento:** se a reação rende 90%, forma-se 90% do produto calculado teoricamente.",
"## Lei de Lavoisier",
"Em sistema fechado, a massa se conserva: “Na natureza nada se cria, nada se perde, tudo se transforma”."
],
q:[

{t:"Soluções e concentrações", inc:"A", r:"Concentração comum, molaridade, diluição, ppm e propriedades coligativas.", v:"soluções concentração diluição enem química aula",
c:[
"## Conceitos",
"**Solução** = **soluto** (o que é dissolvido) + **solvente** (o que dissolve, geralmente a água). A **solubilidade** é a quantidade máxima de soluto que se dissolve numa quantidade de solvente, a uma certa temperatura.",
"## Formas de expressar a concentração",
"- **Concentração comum:** C = massa do soluto (g) ÷ volume da solução (L). Unidade: g/L.",
"- **Molaridade:** M = mols do soluto ÷ volume da solução (L). Unidade: mol/L.",
"- **Relação:** C = M × massa molar.",
"- **Título ou porcentagem:** massa do soluto ÷ massa da solução. O álcool 70% tem 70 partes de álcool em 100.",
"- **ppm (partes por milhão):** para quantidades muito pequenas, como poluentes na água. 1 ppm ≈ 1 mg/L em água.",
"## Diluição",
"Acrescentar solvente: a quantidade de soluto **não muda**, só o volume aumenta.",
"**C₁ × V₁ = C₂ × V₂**",
"> Exemplo: 100 mL de suco a 40 g/L diluídos até 400 mL → C₂ = 40 × 100 ÷ 400 = 10 g/L.",
"## Mistura de soluções do mesmo soluto",
"C_final = (C₁V₁ + C₂V₂) ÷ (V₁ + V₂).",
"## Propriedades coligativas",
"Dependem da **quantidade** de partículas dissolvidas:",
"- **Ebulioscopia:** a água com sal ferve a uma temperatura maior.",
"- **Crioscopia:** a água com soluto congela a uma temperatura menor (sal nas estradas com neve, aditivo no radiador).",
"- **Tonoscopia:** menor pressão de vapor.",
"- **Osmoscopia:** pressão osmótica, importante no soro fisiológico (0,9% de NaCl, isotônico ao sangue)."
],
q:[
["Um rótulo indica que um soro tem 9 g de NaCl por litro. Em 500 mL desse soro há",["0,9 g","4,5 g","9 g","18 g","45 g"],1,"C = 9 g/L. Em 0,5 L: 9 × 0,5 = 4,5 g."],
["300 mL de uma solução de 0,6 mol/L foram diluídos até 900 mL. A nova concentração é",["0,1 mol/L","0,2 mol/L","0,3 mol/L","1,8 mol/L","0,6 mol/L"],1,"C₁V₁ = C₂V₂ → 0,6 × 300 = C₂ × 900 → C₂ = 0,2 mol/L."],
["Ao adicionar sal à água do macarrão, a temperatura de ebulição",["diminui.","aumenta.","não se altera.","cai para 0 °C.","varia só com a panela."],1,"A presença de soluto eleva a temperatura de ebulição (ebulioscopia)."],
["A análise de um rio encontrou 2 ppm de chumbo. Isso significa aproximadamente",["2 g de chumbo por litro.","2 mg de chumbo por litro de água.","2 kg por litro.","2% de chumbo.","2 mol por litro."],1,"Em soluções aquosas diluídas, 1 ppm corresponde a cerca de 1 mg/L."]
]},
{t:"Química orgânica", inc:"A", r:"Cadeias carbônicas, funções orgânicas, isomeria, reações, polímeros e petróleo.", v:"química orgânica funções orgânicas enem aula",
c:[
"## O carbono",
"É **tetravalente** (faz 4 ligações) e forma cadeias longas e variadas, base da vida e de combustíveis, plásticos e remédios.",
"## Funções orgânicas (reconheça o grupo)",
"- **Hidrocarboneto:** só C e H (metano, gasolina, GLP).",
"- **Álcool:** –OH ligado a carbono saturado (etanol).",
"- **Fenol:** –OH ligado ao anel aromático.",
"- **Aldeído:** –CHO na ponta da cadeia (formol).",
"- **Cetona:** C=O no meio da cadeia (acetona).",
"- **Ácido carboxílico:** –COOH (ácido acético, do vinagre).",
"- **Éster:** –COO– (aromas de frutas, gorduras).",
"- **Éter:** –O– entre carbonos.",
"- **Amina:** derivada da amônia, com N (cheiro de peixe).",
"- **Amida:** C=O ligado a N (ureia, proteínas).",
"> Moléculas de remédios e hormônios no ENEM costumam ter várias funções ao mesmo tempo. Procure grupo por grupo.",
"## Isomeria",
"Mesma fórmula molecular, estruturas diferentes. **Plana** (cadeia, posição, função) e **espacial**: geométrica (cis/trans) e **óptica** (carbono quiral, com 4 ligantes diferentes). Dois isômeros ópticos podem ter efeitos diferentes no corpo, como no caso da talidomida.",
"## Reações importantes",
"- **Combustão:** combustível + O₂ → CO₂ + H₂O + energia.",
"- **Esterificação:** ácido carboxílico + álcool → éster + água.",
"- **Saponificação:** gordura (éster) + base forte (NaOH) → **sabão** + glicerol.",
"- **Transesterificação:** óleo + álcool → **biodiesel**.",
"## Sabão e detergente",
"Têm uma parte **polar** (se liga à água) e uma **apolar** (se liga à gordura). Formam **micelas**, que envolvem a gordura e permitem removê-la com água.",
"## Polímeros e petróleo",
"- **Polímeros:** macromoléculas formadas por monômeros repetidos. Plásticos (PE, PVC, PET), borracha, náilon. Os naturais incluem proteínas, amido e celulose.",
"- **Petróleo:** mistura de hidrocarbonetos, separada por **destilação fracionada** (GLP, gasolina, querosene, diesel, óleos, asfalto)."
],
q:[
["O vinagre contém ácido acético. A função orgânica desse composto é",["álcool","éster","ácido carboxílico","cetona","amina"],2,"O ácido acético tem o grupo –COOH, característico dos ácidos carboxílicos."],
["A reação entre uma gordura e uma base forte, como NaOH, que produz sabão e glicerol, é a",["esterificação","saponificação","combustão","polimerização","destilação"],1,"Saponificação é a hidrólise básica de ésteres de ácidos graxos, que origina o sabão."],
["O sabão remove a gordura porque suas moléculas",["são totalmente apolares.","têm uma parte polar, que interage com a água, e uma apolar, que interage com a gordura.","são totalmente polares.","reagem com a água produzindo gás.","dissolvem apenas sais."],1,"A estrutura anfifílica forma micelas que envolvem a gordura e a arrastam com a água."],
["A separação do petróleo em GLP, gasolina, querosene e diesel é feita por",["filtração","decantação","destilação fracionada","centrifugação","cromatografia em papel"],2,"As frações têm pontos de ebulição diferentes e são separadas em torres de destilação fracionada."]
]},
{t:"Termoquímica", inc:"M", r:"Reações que liberam ou absorvem calor, entalpia, Lei de Hess e poder calorífico.", v:"termoquímica entalpia enem aula",
c:[
"## Entalpia (H)",
"É a energia armazenada nas substâncias. A variação **ΔH = H(produtos) − H(reagentes)** indica se a reação libera ou absorve calor.",
"- **Exotérmica:** libera calor, **ΔH < 0**. Exemplos: combustão, respiração, dissolução de NaOH, condensação.",
"- **Endotérmica:** absorve calor, **ΔH > 0**. Exemplos: fotossíntese, cozimento, evaporação, compressa fria (nitrato de amônio na água).",
"> Macete: “exo” = sai calor do sistema, e o ambiente esquenta. “Endo” = entra calor, e o ambiente esfria.",
"## Lei de Hess",
"O ΔH depende só dos estados **inicial e final**, e não do caminho. É possível somar equações intermediárias para obter o ΔH de uma reação. Se inverter a equação, troque o sinal do ΔH; se multiplicar, multiplique também o ΔH.",
"## Energia de ligação",
"- **Quebrar ligações absorve energia** (endotérmico); **formar ligações libera energia** (exotérmico).",
"- ΔH = energia das ligações quebradas − energia das ligações formadas.",
"## Poder calorífico",
"Energia liberada por massa de combustível. Comparar combustíveis é assunto frequente: o hidrogênio tem altíssimo poder calorífico e produz só água; a gasolina libera mais energia por litro que o etanol, mas o etanol é renovável.",
"## Fatores que alteram a velocidade (cinética)",
"Temperatura, concentração, superfície de contato (um comprimido triturado dissolve mais rápido) e **catalisador** (diminui a energia de ativação sem ser consumido; as enzimas são catalisadores biológicos)."
],
q:[
["A queima do carvão na churrasqueira é uma reação",["endotérmica, com ΔH > 0.","exotérmica, com ΔH < 0.","sem variação de energia.","que absorve calor do ambiente.","de fotossíntese."],1,"A combustão libera energia na forma de calor: exotérmica, com ΔH negativo."],
["Compressas frias instantâneas funcionam porque a dissolução do sal que contêm é",["exotérmica","endotérmica","nuclear","espontaneamente explosiva","uma combustão"],1,"O processo absorve calor do ambiente e da pele, o que causa a sensação de frio."],
["Segundo a Lei de Hess, a variação de entalpia de uma reação",["depende do caminho percorrido.","depende apenas dos estados inicial e final.","é sempre positiva.","é sempre zero.","depende do catalisador."],1,"O ΔH é uma função de estado: só importam o início e o fim."],
["Um comprimido efervescente triturado reage mais rápido na água do que inteiro porque",["tem mais massa.","tem maior superfície de contato.","perde o catalisador.","a temperatura diminui.","a reação se torna endotérmica."],1,"Triturar aumenta a área exposta ao reagente, o que acelera a reação."]
]},
{t:"Eletroquímica", inc:"M", r:"Oxirredução, pilhas, eletrólise, corrosão e proteção de metais.", v:"eletroquímica pilha eletrólise enem aula",
c:[
"## Oxirredução",
"- **Oxidação:** perda de elétrons; o número de oxidação (NOX) **aumenta**.",
"- **Redução:** ganho de elétrons; o NOX **diminui**.",
"- Quem se oxida é o **agente redutor**; quem se reduz é o **agente oxidante**.",
"## Pilha (célula galvânica)",
"Transforma energia **química em elétrica** de forma **espontânea**.",
"- **Ânodo:** polo **negativo**, onde ocorre a **oxidação**. O metal é corroído e perde massa.",
"- **Cátodo:** polo **positivo**, onde ocorre a **redução**. O metal se deposita e ganha massa.",
"- Os elétrons fluem do ânodo para o cátodo pelo fio.",
"- Quem tem maior potencial de redução se reduz; o outro se oxida.",
"> Macete: “**A**nodo = **O**xidação” (vogal com vogal); “**C**átodo = **R**edução” (consoante com consoante).",
"## Eletrólise",
"Transforma energia **elétrica em química** de forma **não espontânea**, com gerador externo. Usos: produção de alumínio, cloro, soda cáustica e **galvanoplastia** (revestir objetos com metal, como cromação e prateação).",
"## Corrosão e proteção",
"- A **ferrugem** é a oxidação do ferro na presença de água e oxigênio. A maresia (sal) acelera o processo.",
"- **Proteções:** pintura, **galvanização** (revestir com zinco) e **metal de sacrifício**: um metal mais reativo, como zinco ou magnésio, se oxida no lugar do ferro. É usado em cascos de navios e tubulações.",
"## Baterias",
"Baterias de lítio (celulares, carros elétricos) são recarregáveis: na recarga, ocorre eletrólise. Pilhas e baterias exigem descarte correto por conter metais pesados."
],
q:[
["Em uma pilha, o eletrodo onde ocorre a oxidação e que perde massa é o",["cátodo, polo positivo","ânodo, polo negativo","cátodo, polo negativo","ânodo, polo positivo","ponte salina"],1,"No ânodo, o metal se oxida, liberando elétrons e íons para a solução."],
["Placas de zinco são presas ao casco de aço de navios para evitar a corrosão. O zinco funciona como",["catalisador","metal de sacrifício, oxidando-se no lugar do ferro","agente oxidante","isolante elétrico","solvente"],1,"O zinco é mais reativo, oxida-se preferencialmente e protege o ferro."],
["A eletrólise é um processo",["espontâneo que gera eletricidade.","não espontâneo que usa energia elétrica para provocar reações químicas.","exclusivamente biológico.","de separação física.","que não envolve elétrons."],1,"Na eletrólise, uma fonte externa força uma reação de oxirredução não espontânea."],
["Na oxidação, uma espécie química",["ganha elétrons e seu NOX diminui.","perde elétrons e seu NOX aumenta.","ganha prótons.","não sofre alteração.","perde nêutrons."],1,"Oxidar é perder elétrons, o que aumenta o número de oxidação."]
]},
{t:"Equilíbrio químico, ácidos, bases e pH", inc:"M", r:"Reações reversíveis, Le Chatelier, funções inorgânicas e a escala de pH.", v:"equilíbrio químico ph ácidos e bases enem aula",
c:[
"## Funções inorgânicas",
"- **Ácidos:** liberam H⁺ em água (HCl, H₂SO₄). Sabor azedo; tornam o tornassol vermelho.",
"- **Bases:** liberam OH⁻ (NaOH, Mg(OH)₂ do leite de magnésia). Sabor adstringente; sensação escorregadia.",
"- **Sais:** vêm da **neutralização** (ácido + base → sal + água). Exemplo: NaCl.",
"- **Óxidos:** compostos com oxigênio. Os ácidos (CO₂, SO₂) formam a chuva ácida; os básicos (CaO, a cal) corrigem a acidez do solo.",
"## Escala de pH",
"- **pH = −log[H⁺]**. A 25 °C: **pH < 7 ácido**, **pH = 7 neutro**, **pH > 7 básico**.",
"- Cada unidade de pH corresponde a um fator de **10 vezes**. Um pH 3 é 10 vezes mais ácido que um pH 4 e 100 vezes mais ácido que um pH 5.",
"- **pH + pOH = 14.**",
"- **Exemplos:** suco gástrico ≈ 2, refrigerante ≈ 3, café ≈ 5, sangue ≈ 7,4, água sanitária ≈ 12.",
"## Equilíbrio químico",
"Em reações reversíveis, o equilíbrio ocorre quando as velocidades direta e inversa se igualam e as concentrações ficam constantes.",
"- **Princípio de Le Chatelier:** quando o equilíbrio é perturbado, o sistema se desloca para **compensar** a perturbação.",
"- Aumentar a concentração de um reagente desloca para os produtos.",
"- Aumentar a temperatura favorece o sentido **endotérmico**.",
"- Aumentar a pressão favorece o lado com **menos mols de gás**.",
"- O catalisador **não desloca** o equilíbrio; só faz chegar a ele mais rápido.",
"## Aplicações",
"- **Antiácidos** (bases fracas) neutralizam o excesso de ácido no estômago.",
"- **Calagem:** adição de cal ao solo ácido para corrigir o pH.",
"- **Tampão:** solução que resiste a variações de pH; o sangue é tamponado pelo sistema bicarbonato.",
"- **Refrigerante:** ao abrir a garrafa, a pressão cai, o equilíbrio do CO₂ se desloca e o gás escapa."
],
q:[
["Uma solução de pH 3 é quantas vezes mais ácida que outra de pH 5?",["2 vezes","10 vezes","20 vezes","100 vezes","1.000 vezes"],3,"Cada unidade de pH equivale a um fator de 10: duas unidades = 10 × 10 = 100 vezes."],
["Para aliviar a azia, causada pelo excesso de ácido no estômago, usa-se um antiácido. A reação envolvida é de",["oxidação","neutralização entre ácido e base","combustão","fermentação","polimerização"],1,"O antiácido (base fraca) neutraliza o ácido clorídrico do estômago, formando sal e água."],
["Em um equilíbrio químico, aumentar a concentração de um reagente faz o sistema",["parar a reação.","deslocar-se no sentido de formar mais produtos.","deslocar-se no sentido dos reagentes.","aumentar a temperatura.","destruir o catalisador."],1,"Pelo princípio de Le Chatelier, o sistema consome o excesso de reagente formando produtos."],
["Um agricultor adiciona cal (CaO) ao solo muito ácido para",["aumentar a acidez.","elevar o pH e corrigir a acidez do solo.","produzir chuva ácida.","eliminar o nitrogênio.","diminuir a quantidade de água."],1,"A cal é um óxido básico que neutraliza a acidez do solo (calagem)."]
]},
{t:"Propriedades da matéria, misturas e ligações", inc:"M", r:"Estados físicos, densidade, separação de misturas, ligações químicas e polaridade.", v:"separação de misturas ligações químicas polaridade enem aula",
c:[
"## Estados físicos e mudanças",
"Fusão (sólido → líquido), vaporização (líquido → gás), condensação, solidificação e sublimação (sólido → gás, como a naftalina e o gelo-seco). Substâncias puras mudam de estado a uma temperatura constante; misturas não.",
"## Densidade",
"d = m ÷ V. O menos denso flutua: o óleo flutua na água e o gelo flutua na água líquida (a água se expande ao congelar).",
"## Separação de misturas",
"- **Heterogêneas:** **filtração** (sólido de líquido, como o coador de café), **decantação** (água e óleo, com funil de separação), **centrifugação** (separação do sangue, máquina de lavar), **catação**, **peneiração**, **separação magnética**.",
"- **Homogêneas:** **destilação simples** (sólido dissolvido em líquido, como obter água do mar), **destilação fracionada** (líquidos com pontos de ebulição diferentes, como petróleo e álcool), **evaporação** (salinas), **cromatografia** (pigmentos).",
"## Ligações químicas",
"- **Iônica:** metal + ametal, com transferência de elétrons (NaCl). Sólidos com alto ponto de fusão que conduzem eletricidade quando dissolvidos ou fundidos.",
"- **Covalente:** ametal + ametal, com compartilhamento de elétrons (H₂O, CO₂).",
"- **Metálica:** entre metais, com um “mar de elétrons” livres. Conduzem eletricidade e calor e são maleáveis.",
"## Polaridade e solubilidade",
"- **Semelhante dissolve semelhante:** o polar dissolve polar (sal e açúcar em água); o apolar dissolve apolar (gordura em gasolina).",
"- A **água é polar**. Óleos e gorduras são **apolares**, por isso não se misturam com a água.",
"- **Pontes de hidrogênio:** interações fortes entre moléculas de água, que explicam seu alto ponto de ebulição e a tensão superficial."
],
q:[
["Para obter água potável a partir da água do mar em um navio, o processo adequado é",["filtração","decantação","destilação simples","centrifugação","peneiração"],2,"A destilação simples evapora a água e a condensa, deixando o sal para trás."],
["Uma mancha de gordura não sai só com água, mas sai com gasolina. Isso se explica porque",["a gordura é polar como a água.","a gordura é apolar e se dissolve em solvente apolar, como a gasolina.","a gasolina é iônica.","a água é apolar.","a gordura é um sal."],1,"Semelhante dissolve semelhante: gordura e gasolina são apolares."],
["O gelo flutua na água líquida porque",["é mais denso que a água líquida.","é menos denso que a água líquida.","tem a mesma densidade.","é feito de outra substância.","contém ar comprimido."],1,"Ao congelar, a água forma uma estrutura com mais espaços, fica menos densa e flutua."],
["O processo usado em laboratórios para separar os componentes do sangue por rotação rápida é a",["destilação","centrifugação","sublimação","filtração","evaporação"],1,"A centrifugação acelera a separação de componentes com densidades diferentes."]
]},
{t:"Radioatividade", inc:"B", r:"Emissões alfa, beta e gama, meia-vida, fissão, fusão e aplicações.", v:"radioatividade meia-vida enem aula",
c:[
"## Emissões radioativas",
"Núcleos instáveis emitem radiação para se estabilizar.",
"- **Alfa (α):** 2 prótons e 2 nêutrons. Pouco penetrante; é barrada por uma folha de papel. O número de massa cai 4 e o atômico cai 2.",
"- **Beta (β):** um elétron emitido pelo núcleo. É mais penetrante. O número atômico aumenta 1.",
"- **Gama (γ):** onda eletromagnética muito penetrante; exige chumbo ou concreto para ser barrada.",
"## Meia-vida",
"Tempo para **metade** dos núcleos radioativos de uma amostra decair. Depois de 1 meia-vida resta 1/2; depois de 2, 1/4; depois de 3, 1/8.",
"> Exemplo: 80 g de um isótopo com meia-vida de 5 anos. Após 15 anos (3 meias-vidas): 80 → 40 → 20 → 10 g.",
"- **Carbono-14** (meia-vida ≈ 5.730 anos): usado para datar fósseis e objetos orgânicos antigos.",
"## Fissão x fusão",
"- **Fissão:** divisão de núcleos pesados (urânio-235), com enorme liberação de energia. É usada em usinas nucleares (Angra dos Reis) e na bomba atômica. Gera lixo radioativo.",
"- **Fusão:** união de núcleos leves (hidrogênio → hélio). É a energia do Sol e das estrelas.",
"## Aplicações e riscos",
"- **Medicina:** radioterapia contra o câncer, exames (iodo-131 para a tireoide, PET scan) e esterilização de materiais.",
"- **Agricultura:** conservação de alimentos por irradiação.",
"- **Acidentes:** Chernobyl (1986, Ucrânia), **césio-137 em Goiânia (1987)**, quando um aparelho de radioterapia abandonado foi aberto e contaminou pessoas, e Fukushima (2011, Japão)."
],
q:[
["Uma amostra de 64 g de um isótopo com meia-vida de 2 dias restará com quanto após 8 dias?",["32 g","16 g","8 g","4 g","2 g"],3,"8 dias = 4 meias-vidas: 64 → 32 → 16 → 8 → 4 g."],
["A datação de fósseis e objetos orgânicos antigos utiliza o",["urânio-235","carbono-14","césio-137","iodo-131","cobalto-60"],1,"Organismos vivos incorporam carbono-14; após a morte, ele decai com meia-vida conhecida."],
["A energia produzida no Sol vem de reações de",["fissão nuclear","fusão nuclear","combustão","eletrólise","oxidação do ferro"],1,"No Sol, núcleos de hidrogênio se fundem formando hélio e liberando enorme energia."],
["O acidente radiológico de Goiânia, em 1987, envolveu o",["urânio","césio-137","plutônio","carbono-14","iodo-131"],1,"Uma cápsula de césio-137 de um aparelho de radioterapia abandonado foi aberta, contaminando pessoas."]
]}
]});

DATA.push({id:"fis", a:"nat", nome:"Física", lessons:[
{t:"Eletricidade e consumo de energia", inc:"A", r:"Corrente, tensão, resistência, potência, conta de luz e circuitos residenciais.", v:"eletrodinâmica potência elétrica consumo enem aula",
c:[
"## Grandezas básicas",
"- **Corrente elétrica (i):** fluxo de cargas. i = Q ÷ Δt. Unidade: ampère (A).",
"- **Tensão ou diferença de potencial (U):** “empurrão” nas cargas. Unidade: volt (V). No Brasil, as tomadas são de 127 V ou 220 V.",
"- **Resistência (R):** oposição à passagem da corrente. Unidade: ohm (Ω).",
"## Lei de Ohm",
"**U = R × i**",
"## Potência elétrica",
"**P = U × i = R × i² = U² ÷ R.** Unidade: watt (W).",
"## Energia consumida (a conta de luz)",
"**E = P × Δt**. Com P em **kW** e o tempo em **horas**, o resultado sai em **kWh**, a unidade da conta de luz.",
"> Exemplo: chuveiro de 4.000 W (4 kW) ligado 30 min por dia (0,5 h) durante 30 dias: E = 4 × 0,5 × 30 = 60 kWh. A R$ 0,80 o kWh, custa R$ 48,00.",
"## O chuveiro elétrico",
"Como a tensão é fixa, P = U² ÷ R: **menor resistência significa maior potência**. Na posição “inverno”, a resistência é menor, passa mais corrente e o chuveiro esquenta mais (e consome mais).",
"## Associação de resistores",
"- **Série:** a mesma corrente passa por todos; R_eq = R₁ + R₂ + ... Se um queima, todos apagam (pisca-pisca antigo).",
"- **Paralelo:** a mesma tensão em todos; 1/R_eq = 1/R₁ + 1/R₂ + ... Se um queima, os outros continuam. **É assim a instalação das casas.**",
"## Segurança",
"- **Fusíveis e disjuntores** desligam o circuito quando a corrente passa do limite, evitando incêndios.",
"- **Efeito Joule:** a corrente aquece os fios. Os usos são chuveiro, ferro de passar e torradeira.",
"- **Choque elétrico:** é a corrente que passa pelo corpo que causa o dano. O fio terra desvia a corrente.",
"- **Eficiência:** lâmpadas de LED convertem mais energia em luz e menos em calor que as incandescentes."
],
q:[
["Um aparelho de 1.500 W fica ligado 2 horas por dia durante 30 dias. O consumo mensal é de",["45 kWh","90 kWh","900 kWh","3.000 kWh","30 kWh"],1,"E = 1,5 kW × 2 h × 30 = 90 kWh."],
["Ao mudar o chuveiro da posição “verão” para “inverno”, a água sai mais quente porque",["a resistência aumenta e a potência diminui.","a resistência diminui e a potência aumenta.","a tensão da rede aumenta.","a corrente diminui.","o chuveiro passa a usar gás."],1,"Com tensão fixa, P = U²/R: diminuir a resistência aumenta a potência dissipada."],
["Em uma residência, quando uma lâmpada queima, as outras continuam acesas. Isso ocorre porque estão ligadas em",["série","paralelo","curto-circuito","corrente contínua","um único fio"],1,"Na associação em paralelo, cada aparelho tem seu próprio caminho de corrente."],
["Uma lâmpada de 60 W ligada em 120 V é percorrida por uma corrente de",["0,5 A","2 A","60 A","120 A","7.200 A"],0,"P = U × i → 60 = 120 × i → i = 0,5 A."]
]},
{t:"Energia, trabalho e potência", inc:"A", r:"Formas de energia, conservação, potência, rendimento e usinas.", v:"energia mecânica conservação usinas enem física aula",
c:[
"## Formas de energia mecânica",
"- **Cinética:** Ec = m·v² ÷ 2. É a energia do movimento. Dobrar a velocidade **quadruplica** a energia, por isso o excesso de velocidade é tão perigoso em batidas.",
"- **Potencial gravitacional:** Ep = m·g·h. É a energia da altura.",
"- **Potencial elástica:** Ee = k·x² ÷ 2 (molas, elásticos).",
"## Conservação da energia",
"A energia não é criada nem destruída; ela se **transforma**. Sem atrito, a energia mecânica (Ec + Ep) se conserva. Com atrito, parte vira calor, que não se perde: apenas se dissipa.",
"> Exemplo: um objeto cai de 5 m. Ep = Ec → m·g·h = m·v²/2 → v = √(2·10·5) = 10 m/s.",
"## Trabalho e potência",
"- **Trabalho:** τ = F·d (força ao longo de um deslocamento). Unidade: joule (J).",
"- **Potência:** P = energia ÷ tempo. Unidade: watt (W = J/s). Quem faz o mesmo trabalho em menos tempo tem mais potência.",
"- **Rendimento:** η = energia útil ÷ energia total. É sempre menor que 100%, porque parte da energia se perde como calor.",
"## Usinas e transformações de energia",
"- **Hidrelétrica:** potencial gravitacional da água → cinética → elétrica (turbina + gerador).",
"- **Termelétrica:** química (combustível) → térmica → cinética (vapor move a turbina) → elétrica. Emite CO₂.",
"- **Nuclear:** nuclear → térmica → cinética → elétrica.",
"- **Eólica:** cinética do vento → elétrica.",
"- **Solar fotovoltaica:** luminosa → elétrica, **diretamente**, sem turbina.",
"- **Solar térmica:** aquece a água, sem gerar eletricidade.",
"> O ENEM adora perguntar a sequência de transformações de energia numa usina ou num aparelho."
],
q:[
["Em uma usina termelétrica a carvão, a sequência de transformações de energia é",["luminosa → elétrica","química → térmica → cinética → elétrica","eólica → elétrica","nuclear → luminosa","potencial → química"],1,"A queima libera calor, o vapor gira a turbina e o gerador produz eletricidade."],
["Se a velocidade de um carro dobra, sua energia cinética",["também dobra.","fica quatro vezes maior.","fica igual.","cai pela metade.","triplica."],1,"Ec = mv²/2: com v dobrado, v² fica quatro vezes maior."],
["Um motor recebe 1.000 J de energia e realiza 700 J de trabalho útil. Seu rendimento é",["30%","70%","100%","143%","7%"],1,"η = 700 ÷ 1000 = 0,7 = 70%. Os outros 300 J se dissipam, principalmente como calor."],
["A forma de geração que transforma a luz diretamente em energia elétrica, sem turbinas, é a",["hidrelétrica","termelétrica","solar fotovoltaica","nuclear","eólica"],2,"As placas fotovoltaicas convertem a energia luminosa diretamente em corrente elétrica."]
]},
{t:"Ondulatória e som", inc:"A", r:"Tipos de onda, equação fundamental, qualidades do som, espectro eletromagnético e fenômenos.", v:"ondulatória som espectro eletromagnético enem aula",
c:[
"## O que é uma onda",
"Uma perturbação que **transporta energia sem transportar matéria**.",
"- **Mecânicas:** precisam de um meio material, como o som e as ondas no mar. Não se propagam no vácuo.",
"- **Eletromagnéticas:** não precisam de meio e se propagam no vácuo à velocidade da luz (c = 3 × 10⁸ m/s). São a luz, as ondas de rádio, as micro-ondas e os raios X.",
"- **Transversais** (vibração perpendicular à propagação, como a luz) e **longitudinais** (vibração na mesma direção, como o som).",
"## Equação fundamental",
"**v = λ × f**. λ é o comprimento de onda (m) e f é a frequência (Hz, oscilações por segundo). **A frequência não muda quando a onda passa de um meio para outro**; o que muda é a velocidade e o comprimento de onda.",
"## Qualidades do som",
"- **Altura:** depende da **frequência**. Grave = baixa frequência; agudo = alta frequência. (Não confunda com “volume”!)",
"- **Intensidade:** depende da **amplitude** e da energia: forte ou fraco. Medida em **decibéis** (dB); sons acima de ~85 dB por muito tempo prejudicam a audição.",
"- **Timbre:** a “assinatura” de cada fonte. Permite distinguir um violão de um piano tocando a mesma nota.",
"- Audição humana: de ~20 Hz a 20.000 Hz. Abaixo é **infrassom**; acima, **ultrassom** (usado em exames e por morcegos e golfinhos).",
"## Espectro eletromagnético",
"Da menor para a maior frequência (e energia): **rádio → micro-ondas → infravermelho → luz visível → ultravioleta → raios X → raios gama**. As mais energéticas (UV, X, gama) são **ionizantes** e podem danificar o DNA.",
"## Fenômenos ondulatórios",
"- **Reflexão:** eco e sonar.",
"- **Refração:** mudança de velocidade ao trocar de meio.",
"- **Difração:** contornar obstáculos; ouvimos alguém atrás do muro.",
"- **Interferência:** fones com cancelamento de ruído.",
"- **Ressonância:** um corpo vibra com amplitude máxima quando recebe ondas na sua frequência natural (uma taça que quebra com a voz, sintonizar o rádio).",
"- **Efeito Doppler:** a frequência percebida muda quando a fonte se aproxima (mais aguda) ou se afasta (mais grave). Exemplo: a sirene da ambulância."
],
q:[
["Uma estação de rádio transmite em 100 MHz (1 × 10⁸ Hz). Sendo a velocidade da onda 3 × 10⁸ m/s, o comprimento de onda é",["0,3 m","3 m","30 m","300 m","1 m"],1,"λ = v ÷ f = 3 × 10⁸ ÷ 1 × 10⁸ = 3 m."],
["Um cantor muda de uma nota grave para uma aguda. A grandeza física que aumentou foi a",["amplitude","frequência","intensidade","velocidade no ar","timbre"],1,"A altura do som (grave ou agudo) depende da frequência."],
["Quando uma ambulância se aproxima, a sirene parece mais aguda; ao se afastar, mais grave. Esse fenômeno é o",["efeito Doppler","eco","ressonância","difração","efeito Joule"],0,"O movimento da fonte altera a frequência percebida pelo observador: efeito Doppler."],
["O som não se propaga no espaço sideral (vácuo) porque",["é uma onda eletromagnética.","é uma onda mecânica e precisa de um meio material.","tem velocidade infinita.","é absorvido pelas estrelas.","sua frequência é muito alta."],1,"Ondas mecânicas precisam de partículas para vibrar; no vácuo não há meio."]
]},
{t:"Dinâmica: leis de Newton", inc:"A", r:"Inércia, F = m·a, ação e reação, atrito, peso e movimento circular.", v:"leis de newton dinâmica enem física aula",
c:[
"## 1ª Lei: inércia",
"Um corpo tende a manter seu estado de repouso ou de movimento retilíneo uniforme se a força resultante for zero.",
"> Aplicações: o passageiro é jogado para a frente numa freada brusca (por isso o **cinto de segurança** e o **encosto de cabeça**); a toalha puxada rápido sem derrubar a louça.",
"## 2ª Lei: princípio fundamental",
"**F_resultante = m × a**. Quanto maior a massa, mais força é preciso para acelerar. Unidade: newton (N).",
"- **Peso:** P = m × g (g ≈ 10 m/s² na Terra). **Massa** (kg) é a quantidade de matéria e não muda; **peso** (N) é a força da gravidade e muda de planeta para planeta.",
"## 3ª Lei: ação e reação",
"Toda ação gera uma reação de **mesma intensidade, mesma direção e sentido oposto**, em **corpos diferentes** (por isso não se anulam).",
"> Exemplos: ao andar, empurramos o chão para trás e o chão nos empurra para a frente. O foguete expele gases para baixo e é empurrado para cima.",
"## Atrito",
"Força que se opõe ao deslizamento. Fat = μ × N. Os pneus e os calçados precisam de atrito para funcionar. O freio **ABS** evita o travamento das rodas, mantendo o atrito estático (maior que o cinético) e o controle do carro.",
"## Movimento circular",
"Para fazer uma curva é preciso uma **força centrípeta** apontando para o centro: Fc = m·v² ÷ r. Em estrada molhada, o atrito diminui e o carro tende a sair pela tangente.",
"## Impulso e quantidade de movimento",
"Q = m × v. O **airbag** e as zonas de deformação aumentam o tempo de colisão e diminuem a força sobre os ocupantes (I = F × Δt)."
],
q:[
["Numa freada brusca, passageiros sem cinto são projetados para a frente. Isso é explicado pela",["1ª lei de Newton (inércia)","3ª lei de Newton (ação e reação)","lei da gravitação","lei de Ohm","lei de Hooke"],0,"Pela inércia, o corpo tende a continuar em movimento mesmo quando o carro para."],
["Uma força resultante de 20 N atua sobre um corpo de 4 kg. A aceleração adquirida é de",["0,2 m/s²","5 m/s²","16 m/s²","24 m/s²","80 m/s²"],1,"a = F ÷ m = 20 ÷ 4 = 5 m/s²."],
["Um astronauta de 70 kg vai à Lua, onde a gravidade é cerca de 1/6 da terrestre. Na Lua,",["sua massa e seu peso ficam iguais aos da Terra.","sua massa continua 70 kg, mas seu peso diminui.","sua massa diminui para cerca de 12 kg.","seu peso aumenta.","ele não tem massa."],1,"A massa não muda; o peso (P = m·g) diminui porque a gravidade é menor."],
["O airbag reduz lesões em colisões porque",["diminui a massa do passageiro.","aumenta o tempo de parada, reduzindo a força sobre o corpo.","elimina a inércia.","aumenta a velocidade do carro.","anula a gravidade."],1,"Com o mesmo impulso distribuído num intervalo de tempo maior, a força média é menor."]
]},
{t:"Termologia", inc:"M", r:"Temperatura, calor, escalas, calorimetria, propagação de calor e máquinas térmicas.", v:"termologia calorimetria propagação de calor enem aula",
c:[
"## Temperatura x calor",
"- **Temperatura:** mede a agitação das partículas.",
"- **Calor:** energia térmica **em trânsito**, que passa sempre do corpo mais quente para o mais frio, até o **equilíbrio térmico**.",
"## Escalas",
"**C/5 = (F − 32)/9 = (K − 273)/5**. A água congela a 0 °C (32 °F; 273 K) e ferve a 100 °C (212 °F; 373 K) ao nível do mar. Uma variação de 1 °C equivale a uma variação de 1 K.",
"## Calorimetria",
"- **Calor sensível** (muda a temperatura): **Q = m·c·ΔT**. O c é o calor específico. A água tem c alto (1 cal/g·°C): demora a esquentar e a esfriar, por isso regula o clima das regiões litorâneas.",
"- **Calor latente** (muda o estado, com temperatura constante): **Q = m·L**.",
"## Propagação do calor",
"- **Condução:** por contato, partícula a partícula, principalmente em sólidos. Metais são bons condutores; madeira, isopor e lã são isolantes.",
"- **Convecção:** por correntes de fluidos. O ar quente sobe e o frio desce; por isso o **ar-condicionado fica no alto** e o aquecedor fica embaixo. Também explica as brisas marítimas.",
"- **Irradiação:** por ondas eletromagnéticas (infravermelho), inclusive no vácuo. É o calor do Sol.",
"> A garrafa térmica combate as três: vácuo entre as paredes (condução e convecção) e superfícies espelhadas (irradiação).",
"## Dilatação térmica",
"Corpos se expandem ao aquecer. Por isso existem **juntas de dilatação** em pontes e trilhos. A água é uma exceção entre 0 °C e 4 °C.",
"## Máquinas térmicas",
"Transformam calor em trabalho (motores a combustão, usinas). A **2ª lei da termodinâmica** diz que nenhuma máquina térmica tem rendimento de 100%: parte do calor sempre é rejeitada para a fonte fria."
],
q:[
["Os aparelhos de ar-condicionado são instalados na parte alta dos cômodos porque",["o ar frio sobe e se espalha pelo teto.","o ar frio, mais denso, desce e cria correntes de convecção.","a condução é mais eficiente no alto.","a irradiação só ocorre perto do teto.","o calor não se propaga no chão."],1,"O ar resfriado é mais denso e desce, enquanto o quente sobe: convecção."],
["Para aquecer 200 g de água (c = 1 cal/g·°C) de 20 °C para 70 °C são necessárias",["1.000 cal","4.000 cal","10.000 cal","14.000 cal","200 cal"],2,"Q = m·c·ΔT = 200 × 1 × 50 = 10.000 cal."],
["Na garrafa térmica, as paredes espelhadas reduzem a perda de calor por",["condução","convecção","irradiação","dilatação","evaporação"],2,"Superfícies espelhadas refletem a radiação infravermelha."],
["Segundo a 2ª lei da termodinâmica, uma máquina térmica",["pode ter rendimento de 100%.","nunca transforma todo o calor recebido em trabalho.","não precisa de fonte fria.","cria energia do nada.","funciona sem diferença de temperatura."],1,"Sempre há calor rejeitado para a fonte fria, então o rendimento é menor que 100%."]
]},
{t:"Óptica e visão", inc:"M", r:"Reflexão, refração, espelhos, lentes, defeitos da visão e cores.", v:"óptica lentes defeitos da visão enem aula",
c:[
"## Princípios",
"A luz se propaga em linha reta em meios homogêneos. Isso explica as sombras e os eclipses.",
"## Reflexão",
"- **Espelho plano:** imagem virtual, do mesmo tamanho, simétrica e invertida lateralmente (por isso “AMBULÂNCIA” é escrito ao contrário no capô).",
"- **Espelho côncavo:** pode ampliar (espelho de maquiagem) ou concentrar a luz (faróis, fornos solares).",
"- **Espelho convexo:** imagem menor e campo visual maior (retrovisores de moto, espelhos de garagem e de supermercado).",
"## Refração",
"Mudança de velocidade e de direção da luz ao passar de um meio para outro. **n = c ÷ v** (índice de refração).",
"> Exemplos: o lápis parece quebrado dentro do copo d’água; a piscina parece mais rasa do que é; a miragem no asfalto quente.",
"- **Reflexão total:** a luz fica presa no meio mais refringente. É o princípio das **fibras ópticas**.",
"- **Dispersão:** a luz branca se separa em cores ao atravessar o prisma ou as gotas de chuva (arco-íris).",
"## Lentes e defeitos da visão",
"- **Miopia:** o olho é alongado e a imagem se forma **antes** da retina; a pessoa não enxerga bem de longe. Correção com lente **divergente**.",
"- **Hipermetropia:** a imagem se forma **depois** da retina; a pessoa não enxerga bem de perto. Correção com lente **convergente**.",
"- **Presbiopia (vista cansada):** perda de flexibilidade do cristalino com a idade. Lente convergente.",
"- **Astigmatismo:** curvatura irregular da córnea. Lente cilíndrica.",
"## Cores",
"Um objeto tem a cor da luz que ele **reflete**. Uma camiseta vermelha reflete o vermelho e absorve as outras cores. Sob luz azul, ela parece preta. O preto absorve quase tudo e esquenta mais ao sol."
],
q:[
["Uma pessoa enxerga bem de perto, mas vê borrado o quadro da sala. Ela tem",["hipermetropia, corrigida com lente convergente.","miopia, corrigida com lente divergente.","presbiopia, corrigida com lente divergente.","astigmatismo, corrigido com espelho.","daltonismo, corrigido com lente colorida."],1,"Na miopia, a imagem de objetos distantes se forma antes da retina; a lente divergente corrige."],
["Os espelhos de garagens e os retrovisores de motos são convexos porque",["ampliam as imagens.","oferecem maior campo visual.","concentram a luz do sol.","formam imagens reais.","eliminam a reflexão."],1,"Espelhos convexos formam imagens menores, mas mostram uma área muito maior."],
["As fibras ópticas transmitem luz por longas distâncias graças ao fenômeno de",["difração","reflexão total","dispersão","absorção","polarização"],1,"A luz reflete totalmente nas paredes internas da fibra e segue por ela."],
["Uma bandeira verde iluminada apenas por luz vermelha aparecerá",["verde","vermelha","escura, quase preta","amarela","branca"],2,"O pigmento verde absorve o vermelho e não há luz verde para refletir; a bandeira parece escura."]
]},
{t:"Hidrostática", inc:"M", r:"Densidade, pressão, Stevin, Pascal e o empuxo de Arquimedes.", v:"hidrostática empuxo pressão enem aula",
c:[
"## Densidade e pressão",
"- **Densidade:** d = m ÷ V (água ≈ 1 g/cm³ = 1.000 kg/m³).",
"- **Pressão:** p = F ÷ A. A mesma força numa área menor produz uma pressão maior. É por isso que a faca afiada corta, o salto fino afunda na areia e o sapato de neve não afunda.",
"## Pressão nos líquidos: Teorema de Stevin",
"**p = p_atm + d·g·h**. A pressão aumenta com a profundidade: **a cada 10 m de água, cerca de +1 atm**. Por isso as barragens são mais largas na base e os mergulhadores sentem pressão nos ouvidos.",
"- **Vasos comunicantes:** um líquido atinge a mesma altura em recipientes ligados (caixa-d’água, mangueira de nível do pedreiro).",
"## Pressão atmosférica",
"Diminui com a altitude. Em lugares altos, a água ferve abaixo de 100 °C (o feijão demora mais para cozinhar), por isso se usa a panela de pressão.",
"## Princípio de Pascal",
"Uma pressão aplicada num líquido em equilíbrio se transmite **integralmente** a todos os pontos. Aplicação: **prensa e elevador hidráulico**, **freio hidráulico**. F₁/A₁ = F₂/A₂: uma pequena força num pistão pequeno gera uma grande força no pistão grande.",
"## Princípio de Arquimedes: empuxo",
"Todo corpo imerso num fluido recebe uma força vertical para cima igual ao **peso do fluido deslocado**: **E = d_fluido × V_submerso × g**.",
"- Se o peso é maior que o empuxo, o corpo afunda. Se o empuxo é igual ao peso, ele flutua.",
"- Um navio de aço flutua porque seu formato oco desloca muita água.",
"- No Mar Morto, a água é mais densa (muito sal), o empuxo é maior e as pessoas flutuam com facilidade."
],
q:[
["Um mergulhador está a 20 m de profundidade no mar. A pressão total sobre ele é de aproximadamente",["1 atm","2 atm","3 atm","20 atm","0,5 atm"],2,"1 atm do ar + 1 atm a cada 10 m de água: 1 + 2 = 3 atm."],
["O elevador hidráulico dos postos de gasolina, que ergue carros com uma força pequena, funciona com base no princípio de",["Arquimedes","Pascal","Stevin","Newton","Ohm"],1,"A pressão aplicada se transmite pelo líquido; áreas diferentes multiplicam a força."],
["Um navio de aço flutua, embora o aço seja mais denso que a água, porque",["o aço perde massa na água.","seu formato oco desloca um volume de água cujo peso equilibra o peso do navio.","a água do mar não exerce empuxo.","o navio é mais leve que o ar.","a gravidade é menor no mar."],1,"O casco oco desloca muita água, gerando empuxo suficiente para equilibrar o peso."],
["A faca afiada corta com mais facilidade porque",["aumenta a força aplicada.","concentra a força numa área menor, aumentando a pressão.","diminui a densidade do alimento.","aumenta o empuxo.","reduz a gravidade."],1,"p = F/A: menor área de contato significa maior pressão."]
]},
{t:"Cinemática", inc:"M", r:"Velocidade média, MRU, MRUV, queda livre e leitura de gráficos.", v:"cinemática velocidade média mruv enem aula",
c:[
"## Velocidade média",
"**v = Δs ÷ Δt**. Para converter, divida km/h por **3,6** para obter m/s e multiplique m/s por 3,6 para obter km/h (72 km/h = 20 m/s).",
"> Pegadinha: a velocidade média de uma viagem é a distância total dividida pelo tempo total, não a média das velocidades dos trechos.",
"## Movimento uniforme (MU)",
"Velocidade constante: **s = s₀ + v·t**. O gráfico s × t é uma reta inclinada e o gráfico v × t é uma reta horizontal.",
"## Movimento uniformemente variado (MUV)",
"Aceleração constante (a = Δv ÷ Δt):",
"- **v = v₀ + a·t**",
"- **s = s₀ + v₀·t + a·t² ÷ 2**",
"- **Torricelli:** v² = v₀² + 2·a·Δs (quando o tempo não é dado).",
"- No gráfico v × t, a **área** sob a curva é o deslocamento e a **inclinação** é a aceleração.",
"## Queda livre",
"Sem resistência do ar, todos os corpos caem com a mesma aceleração, **g ≈ 10 m/s²**, independentemente da massa. Uma pena e um martelo caem juntos no vácuo (experimento feito na Lua).",
"## Segurança no trânsito",
"- **Distância de parada** = distância de reação (o carro anda durante o tempo de reflexo do motorista) + distância de frenagem (proporcional a v²).",
"- Álcool e celular aumentam o tempo de reação. Radares e limites de velocidade existem porque a distância de frenagem cresce muito com a velocidade."
],
q:[
["Um ônibus percorre 180 km em 2 h 30 min. Sua velocidade média é",["60 km/h","72 km/h","75 km/h","90 km/h","45 km/h"],1,"v = 180 ÷ 2,5 = 72 km/h."],
["Um carro a 108 km/h está a quantos metros por segundo?",["10 m/s","20 m/s","30 m/s","36 m/s","388,8 m/s"],2,"108 ÷ 3,6 = 30 m/s."],

{t:"Magnetismo e eletromagnetismo", inc:"B", r:"Ímãs, campo magnético, indução eletromagnética, geradores, motores e transformadores.", v:"eletromagnetismo indução geradores enem aula",
c:[
"## Ímãs",
"- Todo ímã tem polo **norte** e polo **sul**. Polos iguais se repelem e diferentes se atraem.",
"- Quebrar um ímã gera dois ímãs menores: **não existe monopolo magnético**.",
"- A **Terra** funciona como um grande ímã. A agulha da bússola aponta para o polo norte geográfico, que é, na verdade, um polo sul magnético.",
"## Eletricidade gera magnetismo (Oersted)",
"Corrente elétrica cria **campo magnético** ao seu redor. Aplicações: **eletroímã** (guindastes de ferro-velho, campainhas), alto-falantes, ressonância magnética.",
"## Magnetismo gera eletricidade: indução (Faraday)",
"A **variação** do fluxo magnético numa bobina gera corrente elétrica. É a base de quase toda a eletricidade que usamos:",
"- **Geradores:** turbinas (movidas por água, vapor ou vento) giram ímãs ou bobinas → corrente elétrica. Presentes em todas as usinas, exceto a solar fotovoltaica.",
"- **Transformadores:** aumentam ou diminuem a tensão da corrente **alternada**. Nas linhas de transmissão, a tensão é elevada para reduzir as perdas.",
"- **Carregador por indução** de celular, dínamo de bicicleta, fogão de indução.",
"## Motor elétrico",
"Faz o caminho inverso do gerador: a corrente numa bobina dentro de um campo magnético gera força e rotação (**elétrica → mecânica**). Presente em ventiladores, liquidificadores e carros elétricos."
],
q:[
["O funcionamento dos geradores das usinas hidrelétricas baseia-se na",["lei de Ohm","indução eletromagnética","lei da inércia","reflexão total","dilatação térmica"],1,"O giro da turbina provoca variação do fluxo magnético nas bobinas e induz corrente elétrica."],
["Um motor elétrico de liquidificador transforma energia",["mecânica em elétrica","elétrica em mecânica","térmica em elétrica","química em luminosa","luminosa em elétrica"],1,"O motor usa a força magnética sobre correntes para produzir movimento de rotação."],
["Ao quebrar um ímã ao meio, obtém-se",["um polo norte e um polo sul separados.","dois ímãs menores, cada um com polo norte e polo sul.","dois pedaços sem magnetismo.","apenas polos sul.","um monopolo magnético."],1,"Não existem monopolos: cada pedaço vira um novo ímã completo."],
["Os transformadores das linhas de transmissão servem para",["transformar corrente alternada em contínua.","alterar a tensão elétrica, elevando-a para reduzir perdas no transporte.","gerar energia do nada.","armazenar energia como baterias.","produzir luz."],1,"Com alta tensão e baixa corrente, as perdas por efeito Joule nos fios são menores."]
]}
]});

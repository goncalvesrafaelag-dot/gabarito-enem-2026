DATA.push({id:"hbr", a:"hum", nome:"História do Brasil", lessons:[
{t:"Brasil Colônia", inc:"A", r:"De 1500 a 1808: exploração, açúcar, ouro, escravidão e resistência.", v:"brasil colônia enem história aula",
c:[
"## A lógica colonial",
"O Brasil foi organizado para gerar lucro para Portugal. Pelo **pacto colonial** (exclusivo metropolitano), a colônia só podia comerciar com a metrópole, fornecendo matérias-primas e comprando produtos manufaturados.",
"## Organização administrativa",
"- **Capitanias hereditárias (1534):** terras divididas entre donatários, que deviam colonizá-las com recursos próprios. A maioria fracassou; Pernambuco e São Vicente prosperaram.",
"- **Governo-Geral (1548):** centralizou a administração. Tomé de Sousa fundou Salvador (1549), a primeira capital. Com ele vieram os jesuítas.",
"## Economia",
"- **Pau-brasil:** extração com trabalho indígena por escambo (troca).",
"- **Açúcar (séculos XVI–XVII):** plantation no Nordeste, com latifúndio, monocultura, exportação e mão de obra africana escravizada.",
"- **Mineração (século XVIII):** ouro e diamantes em Minas Gerais. Houve interiorização, crescimento urbano (Vila Rica), transferência da capital para o Rio de Janeiro (1763) e impostos pesados como o quinto e a derrama.",
"## Escravidão e resistência",
"Cerca de 4 a 5 milhões de africanos foram trazidos à força ao Brasil, o maior destino do tráfico negreiro. A resistência foi constante: fugas, revoltas e **quilombos**. **Palmares** (Alagoas) resistiu por quase um século; Zumbi foi morto em 20 de novembro de 1695, data hoje celebrada como Dia da Consciência Negra. Os povos indígenas também resistiram à escravização e à ocupação de suas terras.",
"## Revoltas coloniais",
"- **Nativistas** (sem objetivo de independência): Revolta de Beckman (1684), Guerra dos Emboabas (1707–09), Guerra dos Mascates (1710), Revolta de Vila Rica (1720).",
"- **Separatistas:** **Inconfidência Mineira** (1789), da elite mineira, inspirada no Iluminismo e na independência dos EUA; Tiradentes foi executado em 1792. **Conjuração Baiana** (1798), dos Alfaiates, popular, com participação de negros e defesa do fim da escravidão.",
"> A Conjuração Baiana era mais radical que a Mineira porque defendia a abolição e a igualdade."
],
q:[
["O sistema em que a colônia só podia comercializar com a metrópole era chamado de",["livre-comércio","pacto colonial","Poder Moderador","coronelismo","política dos governadores"],1,"O pacto colonial garantia a Portugal o monopólio do comércio com o Brasil."],
["A economia açucareira colonial caracterizava-se por",["pequenas propriedades e trabalho livre.","latifúndio, monocultura, exportação e trabalho escravizado.","indústrias têxteis e mercado interno.","agricultura familiar voltada ao consumo local.","mineração de ouro no litoral."],1,"A plantation açucareira combinava grandes propriedades, um único produto, exportação e escravidão."],
["Diferentemente da Inconfidência Mineira, a Conjuração Baiana (1798)",["foi liderada apenas pela elite econômica.","defendia também o fim da escravidão e teve ampla participação popular.","queria manter o Brasil unido a Portugal.","ocorreu no século XVI.","foi apoiada pela Coroa portuguesa."],1,"A Conjuração Baiana reuniu alfaiates, soldados e escravizados e tinha propostas sociais mais radicais."],
["O Dia da Consciência Negra, 20 de novembro, homenageia",["a assinatura da Lei Áurea.","Zumbi dos Palmares, morto nessa data em 1695.","a chegada dos primeiros africanos ao Brasil.","a Revolta dos Malês.","a Independência do Brasil."],1,"A data lembra a morte de Zumbi, líder do Quilombo dos Palmares, símbolo da resistência negra."]
]},
{t:"Independência e Império", inc:"A", r:"De 1808 a 1889: família real, Independência, Regências, café e abolição.", v:"independência do brasil império segundo reinado enem aula",
c:[
"## A vinda da família real (1808)",
"Fugindo de Napoleão, a corte portuguesa veio para o Rio de Janeiro. D. João abriu os portos às nações amigas (fim do pacto colonial) e criou o Banco do Brasil, a Imprensa Régia e escolas superiores. Em 1815, o Brasil foi elevado a **Reino Unido** a Portugal.",
"## Independência (1822)",
"A Revolução do Porto (1820) exigiu a volta de D. João VI e tentou recolonizar o Brasil. D. Pedro ficou (Dia do Fico) e proclamou a independência em 7 de setembro de 1822. Foi uma independência **conservadora**: manteve a monarquia, a escravidão, o latifúndio e o poder das elites.",
"## Primeiro Reinado (1822–1831)",
"- **Constituição de 1824**, outorgada (imposta): criou o **Poder Moderador**, exclusivo do imperador, e o voto **censitário** (por renda).",
"- **Confederação do Equador (1824):** revolta republicana em Pernambuco, reprimida.",
"- D. Pedro I abdicou em 1831 em favor do filho de 5 anos.",
"## Período Regencial (1831–1840)",
"Fase de instabilidade e revoltas provinciais: **Cabanagem** (PA, popular), **Sabinada** (BA), **Balaiada** (MA), **Farroupilha** (RS, elite pecuarista, 1835–45) e **Revolta dos Malês** (BA, 1835, africanos muçulmanos escravizados). O Golpe da Maioridade (1840) antecipou a posse de D. Pedro II.",
"## Segundo Reinado (1840–1889)",
"- **Café:** principal produto de exportação, primeiro no Vale do Paraíba e depois no oeste paulista.",
"- **Lei de Terras (1850):** a terra só poderia ser obtida por compra, o que dificultou o acesso de pobres, libertos e imigrantes.",
"- **Guerra do Paraguai (1864–1870):** fortaleceu o Exército, que depois apoiaria a República.",
"- **Caminho da abolição:** Lei Eusébio de Queirós (1850, fim do tráfico), Lei do Ventre Livre (1871), Lei dos Sexagenários (1885) e **Lei Áurea** (13 de maio de 1888). O Brasil foi o último país das Américas a abolir a escravidão.",
"- **Imigração europeia:** italianos e outros substituíram a mão de obra escravizada nos cafezais.",
"> A abolição não veio com políticas de integração: não houve terra, educação ou trabalho para os libertos. Isso ajuda a explicar a desigualdade racial até hoje."
],
q:[
["A Independência do Brasil (1822) é considerada conservadora porque",["instalou uma república democrática.","manteve a monarquia, a escravidão e o poder das elites agrárias.","distribuiu terras aos escravizados.","foi feita por uma revolução popular.","rompeu todos os laços com a elite portuguesa."],1,"A independência mudou o poder político sem alterar a estrutura social e econômica."],
["A Constituição de 1824 criou o Poder Moderador, que",["era exercido pelo Parlamento.","dava ao imperador a última palavra sobre os demais poderes.","garantia o voto universal.","abolia a escravidão.","criava a República."],1,"O Poder Moderador, exclusivo do imperador, permitia a ele intervir nos outros três poderes."],
["A Lei de Terras de 1850 teve como consequência",["a reforma agrária.","dificultar o acesso à terra para pobres, libertos e imigrantes.","o fim do latifúndio.","a distribuição gratuita de terras no Sul.","o fim do tráfico de escravizados."],1,"Ao exigir compra, a lei concentrou a terra nas mãos de quem já tinha dinheiro."],
["A lei que proibiu o tráfico de africanos escravizados para o Brasil em 1850 foi a",["Lei Áurea","Lei do Ventre Livre","Lei Eusébio de Queirós","Lei dos Sexagenários","Lei de Terras"],2,"A Lei Eusébio de Queirós (1850) acabou com o tráfico negreiro, pressionada principalmente pela Inglaterra."]
]},
{t:"República Velha (1889–1930)", inc:"A", r:"República das oligarquias: café com leite, coronelismo e revoltas no campo e na cidade.", v:"república velha coronelismo café com leite enem aula",
c:[
"## A Proclamação e a Constituição de 1891",
"A República foi proclamada em 15 de novembro de 1889 por militares (Marechal Deodoro), com apoio dos cafeicultores, sem participação popular. A Constituição de 1891 criou o **presidencialismo**, o **federalismo**, a separação entre Igreja e Estado e o voto **aberto** para homens alfabetizados maiores de 21 anos. Mulheres e analfabetos, a maioria da população, ficaram de fora.",
"## A República Oligárquica",
"- **Política do café com leite:** revezamento na presidência entre São Paulo (café) e Minas Gerais (leite).",
"- **Política dos governadores:** o presidente apoiava as oligarquias estaduais e elas elegiam deputados aliados ao governo federal.",
"- **Coronelismo:** grandes fazendeiros (coronéis) controlavam os votos da região.",
"- **Voto de cabresto:** o eleitor votava em quem o coronel mandava. O voto aberto facilitava as fraudes e o controle.",
"## Revoltas no campo",
"- **Canudos (BA, 1896–97):** comunidade liderada por Antônio Conselheiro, destruída pelo Exército.",
"- **Contestado (SC/PR, 1912–16):** sertanejos expulsos de terras para a construção de ferrovia, com forte religiosidade.",
"- **Cangaço:** bandos armados no sertão nordestino, como o de Lampião.",
"## Revoltas urbanas",
"- **Revolta da Vacina (RJ, 1904):** reação à vacinação obrigatória contra a varíola, ligada às reformas urbanas que expulsaram pobres do centro e à falta de informação.",
"- **Revolta da Chibata (1910):** marinheiros, liderados por João Cândido, contra os castigos físicos.",
"- **Greve Geral de 1917:** operários, muitos imigrantes anarquistas, por melhores condições de trabalho.",
"- **Tenentismo (anos 1920):** jovens oficiais contra as oligarquias, com a Revolta dos 18 do Forte e a Coluna Prestes.",
"> A crise de 1929 derrubou o preço do café e, com a Revolução de 1930, encerrou a República Velha."
],
q:[
["O controle dos votos por grandes fazendeiros, com voto aberto e pressão sobre os eleitores, ficou conhecido como",["populismo","coronelismo e voto de cabresto","trabalhismo","tenentismo","parlamentarismo"],1,"Os coronéis controlavam o eleitorado local. O voto aberto facilitava a fiscalização e a fraude."],
["A Revolta da Vacina (1904) pode ser explicada, entre outros fatores,",["pela recusa dos médicos em vacinar.","pela vacinação obrigatória imposta de forma autoritária, somada à insatisfação com as reformas urbanas.","pela falta de vacinas no Brasil.","pelo apoio da população à campanha.","pela proibição do café."],1,"A obrigatoriedade sem diálogo, a desinformação e a remoção de moradias populares geraram revolta."],
["A política do café com leite consistia",["na alternância entre paulistas e mineiros na presidência.","na exportação conjunta de café e leite.","em uma aliança entre operários e camponeses.","no fim das oligarquias estaduais.","na união entre Brasil e Argentina."],0,"São Paulo e Minas Gerais se revezavam no poder federal durante boa parte da República Velha."],
["A Revolta da Chibata (1910) foi liderada por marinheiros que exigiam",["o fim dos castigos físicos na Marinha.","a volta da monarquia.","a independência do Rio Grande do Sul.","o fim da vacinação.","a reforma agrária."],0,"João Cândido, o “Almirante Negro”, liderou marinheiros contra as chibatadas usadas como punição."]
]},
{t:"Era Vargas (1930–1945)", inc:"A", r:"Centralização, industrialização, direitos trabalhistas e a ditadura do Estado Novo.", v:"era vargas estado novo enem aula",
c:[
"## A Revolução de 1930",
"Em 1929, o paulista Washington Luís rompeu o café com leite ao indicar outro paulista, Júlio Prestes. Minas, Rio Grande do Sul e Paraíba formaram a Aliança Liberal, com Getúlio Vargas. Derrotados nas eleições, e após o assassinato de João Pessoa, fizeram a Revolução de 1930, que levou Vargas ao poder.",
"## As fases",
"- **Governo Provisório (1930–34):** centralização do poder e interventores nos estados. **Revolução Constitucionalista (1932)**: São Paulo exigiu uma nova Constituição e foi derrotado.",
"- **Governo Constitucional (1934–37):** a Constituição de 1934 trouxe o voto secreto e o **voto feminino** (conquistado em 1932) e leis trabalhistas. Houve polarização entre a Ação Integralista (fascista) e a Aliança Nacional Libertadora (esquerda); a Intentona Comunista (1935) serviu de pretexto para a repressão.",
"- **Estado Novo (1937–45):** golpe baseado no falso Plano Cohen. Ditadura com Congresso fechado, censura, polícia política e o **DIP** (Departamento de Imprensa e Propaganda), que controlava a imprensa e promovia o culto a Vargas.",
"## Trabalho e economia",
"- **CLT (1943):** Consolidação das Leis do Trabalho, com carteira de trabalho, jornada de 8 horas, férias e salário mínimo (criado em 1940).",
"- **Sindicatos atrelados ao Estado:** controle sobre os trabalhadores.",
"- **Industrialização:** Companhia Siderúrgica Nacional (CSN, Volta Redonda) e Vale do Rio Doce.",
"- **Populismo e trabalhismo:** Vargas, o “pai dos pobres”, buscava apoio das massas urbanas com concessões e controle.",
"## Fim e retorno",
"A participação do Brasil na 2ª Guerra ao lado das democracias expôs a contradição da ditadura interna. Vargas foi deposto em 1945. Voltou eleito em 1951, criou a **Petrobras** (1953, campanha “O petróleo é nosso”) e se suicidou em agosto de 1954, em meio a uma crise política."
],
q:[
["A Consolidação das Leis do Trabalho (CLT) foi criada em",["1888, no Império","1943, durante o Estado Novo","1964, na Ditadura Militar","1988, com a nova Constituição","1917, após a greve geral"],1,"A CLT (1943) reuniu leis trabalhistas criadas durante a Era Vargas."],
["O DIP, durante o Estado Novo, tinha a função de",["garantir a liberdade de imprensa.","controlar a imprensa, censurar e fazer propaganda do governo.","organizar eleições livres.","administrar as ferrovias.","fiscalizar a Petrobras."],1,"O Departamento de Imprensa e Propaganda censurava e promovia a imagem de Vargas."],
["A relação de Vargas com os trabalhadores urbanos, que combinava concessão de direitos e controle dos sindicatos, é associada ao",["coronelismo","populismo trabalhista","liberalismo econômico","anarquismo","parlamentarismo"],1,"O populismo buscava apoio das massas com benefícios, mantendo os sindicatos sob controle do Estado."],
["O voto feminino no Brasil foi conquistado em",["1889","1932","1964","1988","1824"],1,"O Código Eleitoral de 1932 garantiu o voto feminino, confirmado pela Constituição de 1934."]
]},
{t:"Ditadura Militar (1964–1985)", inc:"A", r:"Golpe, Atos Institucionais, repressão, milagre econômico e redemocratização.", v:"ditadura militar brasil ai-5 enem aula",
c:[
"## O golpe de 1964",
"No período democrático (1946–64), João Goulart (Jango) propôs as **reformas de base** (agrária, urbana, educacional). Em plena Guerra Fria, setores militares, empresariais, parte da classe média e o governo dos EUA viram nisso uma ameaça comunista. Em 31 de março/1º de abril de 1964, um golpe civil-militar derrubou Jango.",
"## Como o regime funcionava",
"- **Atos Institucionais (AIs):** decretos acima da Constituição. O AI-2 (1965) criou o **bipartidarismo**: ARENA (governo) e MDB (oposição consentida).",
"- **Eleições indiretas** para presidente e governadores.",
"- **AI-5 (13/12/1968):** o mais duro. Fechou o Congresso, suspendeu o habeas corpus para crimes políticos, permitiu cassações e ampliou a censura. Começaram os “anos de chumbo” (governo Médici).",
"- **Repressão:** DOI-CODI, prisões, tortura, mortes e desaparecimentos. A Comissão Nacional da Verdade (2014) reconheceu 434 mortos e desaparecidos políticos.",
"## Economia",
"- **“Milagre econômico” (1968–73):** crescimento acima de 10% ao ano, grandes obras (Transamazônica, Ponte Rio–Niterói, Itaipu), endividamento externo e **concentração de renda** (“fazer o bolo crescer para depois dividir”).",
"- **Crise do petróleo (1973):** fim do milagre, inflação alta e dívida externa enorme.",
"## Resistência",
"Movimento estudantil (Passeata dos Cem Mil, 1968), guerrilhas urbana e rural (Araguaia), artistas e músicos (canções de protesto, Tropicália) e a imprensa alternativa.",
"## Abertura e redemocratização",
"- Geisel: abertura “lenta, gradual e segura”.",
"- **Lei da Anistia (1979):** perdão a presos e exilados políticos, mas também a agentes que torturaram.",
"- Fim do bipartidarismo (1979) e greves do ABC paulista (com Lula).",
"- **Diretas Já (1984):** campanha por eleições diretas; a emenda foi derrotada.",
"- Tancredo Neves, eleito indiretamente em 1985, morreu antes da posse. José Sarney assumiu."
],
q:[
["O AI-5, de dezembro de 1968, ficou marcado por",["convocar eleições diretas.","fechar o Congresso, ampliar a censura e suspender o habeas corpus para crimes políticos.","criar o pluripartidarismo.","conceder anistia aos presos políticos.","instituir a CLT."],1,"O AI-5 endureceu o regime e abriu a fase mais repressiva da ditadura."],
["O “milagre econômico” (1968–1973) caracterizou-se por",["crescimento econômico acelerado com concentração de renda.","distribuição igualitária da riqueza.","fim da dívida externa.","reforma agrária ampla.","redução das obras públicas."],0,"O PIB cresceu muito, mas a desigualdade aumentou e a dívida externa explodiu."],
["O movimento Diretas Já (1984) reivindicava",["a volta da monarquia.","eleições diretas para presidente.","o fechamento do Congresso.","o fim da Petrobras.","a criação do AI-6."],1,"Milhões foram às ruas pela emenda Dante de Oliveira, que previa eleições diretas. Ela foi derrotada no Congresso."],
["O bipartidarismo imposto pela ditadura dividia a política entre",["PT e PSDB","ARENA e MDB","UDN e PSD","Integralistas e comunistas","Liberais e conservadores"],1,"O AI-2 extinguiu os partidos e criou a ARENA (governo) e o MDB (oposição permitida)."]
]},
{t:"Nova República e Constituição de 1988", inc:"M", r:"A redemocratização, a Constituição Cidadã, o Plano Real e os direitos sociais.", v:"constituição de 1988 nova república enem aula",
c:[
"## A Constituição Cidadã (1988)",
"Elaborada por uma Assembleia Constituinte com ampla participação social, a Constituição de 1988 é a base da democracia atual. Pontos que caem muito:",
"- **Voto direto, secreto e universal**, facultativo para analfabetos, jovens de 16 e 17 anos e maiores de 70.",
"- **Direitos sociais (art. 6º):** educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência e assistência.",
"- **Saúde como direito de todos e dever do Estado (art. 196)**, base do SUS.",
"- **Racismo como crime inafiançável e imprescritível.**",
"- **Direitos dos povos indígenas** sobre as terras que tradicionalmente ocupam (art. 231) e reconhecimento de terras quilombolas.",
"- **Meio ambiente ecologicamente equilibrado (art. 225).**",
"## Governos e marcos",
"- **Collor (1990–92):** confisco da poupança, abertura econômica, privatizações; sofreu impeachment após denúncias de corrupção e protestos dos “caras-pintadas”.",
"- **Plano Real (1994):** controlou a hiperinflação.",
"- **Políticas sociais dos anos 2000:** programas de transferência de renda, ampliação do acesso à universidade (Prouni, Lei de Cotas de 2012, SISU).",
"- **Estatutos:** ECA (1990), Estatuto da Pessoa Idosa (2003), Lei Maria da Penha (2006), Estatuto da Igualdade Racial (2010), Lei Brasileira de Inclusão (2015).",
"> Esses documentos são ótimos repertórios para a redação!"
],
q:[
["A Constituição de 1988 ficou conhecida como “Constituição Cidadã” porque",["restringiu o voto aos alfabetizados.","ampliou direitos civis, políticos e sociais após a ditadura.","criou o Poder Moderador.","manteve os Atos Institucionais.","proibiu os partidos políticos."],1,"Ela ampliou direitos e garantias fundamentais e consolidou a redemocratização."],
["Segundo a Constituição de 1988, o voto para jovens de 16 e 17 anos é",["proibido","obrigatório","facultativo","permitido apenas em eleições municipais","indireto"],2,"O voto é facultativo para analfabetos, jovens de 16 e 17 anos e maiores de 70 anos."],
["O Plano Real, de 1994, teve como principal objetivo",["acabar com a hiperinflação.","criar a Petrobras.","promover a reforma agrária.","fechar a economia ao comércio exterior.","instituir o voto feminino."],0,"O Plano Real estabilizou a moeda e controlou a inflação altíssima dos anos anteriores."],
["O princípio que tornou a saúde “direito de todos e dever do Estado” fundamentou a criação do",["INSS","SUS","ECA","Prouni","FGTS"],1,"O artigo 196 da Constituição é a base do Sistema Único de Saúde, regulamentado em 1990."]
]}
]});

DATA.push({id:"hge", a:"hum", nome:"História Geral", lessons:[
{t:"Antiguidade clássica", inc:"M", r:"Grécia e Roma: as origens da política, da cidadania e da filosofia ocidental.", v:"grécia e roma antiga democracia ateniense enem aula",
c:[
"## Grécia",
"- **Pólis:** cidades-Estado independentes, como Atenas e Esparta.",
"- **Esparta:** sociedade militarizada e oligárquica.",
"- **Atenas:** berço da **democracia** (séc. V a.C., com Clístenes e Péricles). Era uma democracia **direta**: os cidadãos votavam na Ágora e na Eclésia. Mas era **excludente**: mulheres, estrangeiros (metecos) e escravizados não eram cidadãos, ou seja, cerca de 10% a 20% da população participava.",
"- Legado: filosofia, teatro (tragédia e comédia), Jogos Olímpicos, arquitetura.",
"## Roma",
"- **Monarquia → República → Império.**",
"- **República (509–27 a.C.):** Senado controlado pelos patrícios (aristocracia). Os plebeus lutaram por direitos e conquistaram o tribuno da plebe e a Lei das Doze Tábuas (leis escritas).",
"- **Império:** expansão territorial, escravismo e a política do **“pão e circo”** (distribuir alimentos e oferecer espetáculos para controlar a população).",
"- **Legado:** o **Direito Romano**, base de muitos sistemas jurídicos atuais, inclusive o brasileiro; o latim, origem do português.",
"- A crise do Império do Ocidente terminou em 476 d.C., com as invasões germânicas.",
"## Sociedades hidráulicas",
"Egito e Mesopotâmia desenvolveram-se às margens de grandes rios (Nilo, Tigre e Eufrates), com obras de irrigação controladas por um Estado forte e teocrático.",
"> O ENEM costuma comparar a democracia ateniense com a atual: a de Atenas era direta e restrita; a nossa é representativa e com sufrágio universal."
],
q:[
["A democracia ateniense era considerada restrita porque",["só os reis podiam votar.","mulheres, estrangeiros e escravizados não tinham cidadania.","os votos eram secretos e manipulados.","era representativa, com deputados eleitos.","todos os habitantes votavam."],1,"Apenas homens livres, adultos e filhos de atenienses eram cidadãos."],
["A política romana do “pão e circo” tinha como objetivo",["educar a população.","controlar as massas urbanas com alimentos e espetáculos.","estimular a agricultura.","acabar com a escravidão.","expandir a democracia."],1,"Distribuir comida e oferecer espetáculos reduzia a insatisfação popular e mantinha a ordem."],
["Um dos principais legados de Roma para o Brasil atual é",["o sistema de castas","o Direito Romano, base do sistema jurídico","a democracia direta","o feudalismo","a escrita cuneiforme"],1,"O direito brasileiro tem raízes no Direito Romano. O português também vem do latim."],
["Egito e Mesopotâmia são chamados de sociedades hidráulicas porque",["dependiam do controle das águas dos rios para a agricultura.","viviam da pesca em alto-mar.","inventaram a energia hidrelétrica.","não tinham rios em seus territórios.","eram ilhas cercadas pelo mar."],0,"O controle das cheias e a irrigação exigiam um Estado centralizado e organizavam toda a economia."]
]},
{t:"Idade Média", inc:"M", r:"Feudalismo, poder da Igreja, Cruzadas e o renascimento do comércio.", v:"idade média feudalismo enem aula",
c:[
"## Feudalismo",
"Com a queda de Roma e as invasões, a Europa ocidental se **ruralizou**. O poder ficou descentralizado nas mãos dos senhores feudais.",
"- **Sociedade estamental** (pouca mobilidade): clero (os que rezam), nobreza (os que guerreiam) e servos (os que trabalham).",
"- **Suserania e vassalagem:** um nobre (suserano) doava terra (feudo) a outro (vassalo) em troca de fidelidade e ajuda militar.",
"- **Servidão:** o servo ficava preso à terra e pagava obrigações ao senhor: **corveia** (trabalho gratuito nas terras do senhor), **talha** (parte da produção) e **banalidades** (uso do moinho e do forno).",
"- Economia agrária, autossuficiente, com pouca moeda e pouco comércio.",
"## A Igreja",
"Era a instituição mais poderosa: dona de terras, controlava a educação e a cultura (mosteiros) e definia a visão de mundo **teocêntrica** (Deus no centro de tudo).",
"## Cruzadas (1096–1270)",
"Expedições militares cristãs para retomar Jerusalém dos muçulmanos. Tiveram também motivos econômicos e reabriram o Mediterrâneo ao comércio europeu.",
"## Baixa Idade Média: transformações",
"- **Renascimento comercial e urbano:** feiras, rotas comerciais, crescimento dos **burgos** e surgimento da **burguesia**.",
"- **Crise do século XIV:** fome, **peste negra** (matou cerca de um terço da Europa) e revoltas camponesas.",
"- Fortalecimento dos reis, que prepara a formação dos Estados nacionais.",
"## Enquanto isso, no Oriente",
"O Império Bizantino (Constantinopla) durou até 1453. O Islã, fundado por Maomé no século VII, expandiu-se e preservou e desenvolveu a ciência grega (matemática, medicina, astronomia)."
],
q:[
["A relação em que um nobre recebia terras de outro em troca de fidelidade e serviço militar era chamada de",["servidão","suserania e vassalagem","escravidão","mercantilismo","absolutismo"],1,"O suserano cedia o feudo e o vassalo jurava fidelidade: base das relações entre nobres."],
["A corveia, no feudalismo, era",["um imposto em dinheiro pago ao rei.","o trabalho gratuito do servo nas terras do senhor alguns dias por semana.","uma guerra religiosa.","uma festa camponesa.","um tipo de moeda medieval."],1,"A corveia obrigava o servo a trabalhar de graça nas terras do senhor."],
["O renascimento comercial e urbano da Baixa Idade Média favoreceu",["o fortalecimento do feudalismo.","o surgimento da burguesia nos burgos.","o fim do comércio no Mediterrâneo.","a ruralização da Europa.","o desaparecimento das moedas."],1,"O comércio reativou as cidades (burgos), onde surgiu a burguesia, grupo que ganharia força na Idade Moderna."],
["A visão de mundo medieval, em que Deus é o centro de todas as explicações, é chamada de",["antropocentrismo","teocentrismo","racionalismo","iluminismo","positivismo"],1,"O teocentrismo marcou a cultura medieval. O Renascimento vai valorizar o ser humano (antropocentrismo)."]
]},
{t:"Idade Moderna", inc:"M", r:"Navegações, Renascimento, Reformas religiosas, absolutismo e Iluminismo.", v:"idade moderna renascimento reforma absolutismo iluminismo enem aula",
c:[
"## Grandes Navegações",
"Portugal (pioneiro, graças à centralização precoce e à posição geográfica) e Espanha buscaram novas rotas para as especiarias do Oriente. Resultados: chegada à América (1492), ao Brasil (1500), colonização, **mercantilismo** e um comércio global.",
"## Mercantilismo",
"Política econômica dos Estados absolutistas: **metalismo** (acumular ouro e prata), **balança comercial favorável** (exportar mais que importar), protecionismo e exploração colonial.",
"## Renascimento (séculos XIV–XVI)",
"Movimento cultural iniciado na Itália que valorizou a razão e o ser humano. **Humanismo, antropocentrismo, racionalismo**, retomada dos clássicos greco-romanos. Nomes: Leonardo da Vinci, Michelangelo, Galileu.",
"## Reformas religiosas",
"- **Reforma Protestante (1517):** Martinho Lutero criticou a venda de indulgências e defendeu a salvação pela fé e a leitura da Bíblia pelos fiéis. Surgiram também o calvinismo (predestinação, valorização do trabalho) e o anglicanismo.",
"- **Contrarreforma:** resposta católica com o Concílio de Trento, a Inquisição, o Index (livros proibidos) e a Companhia de Jesus (jesuítas).",
"## Absolutismo",
"Concentração de poder no rei. Justificativas: o direito divino dos reis (Bossuet) e a necessidade de um Estado forte (Hobbes). Luís XIV, na França: “O Estado sou eu”.",
"## Iluminismo (século XVIII)",
"O “Século das Luzes” usou a razão para criticar o absolutismo, a Igreja e os privilégios.",
"- **Locke:** direitos naturais (vida, liberdade, propriedade).",
"- **Montesquieu:** divisão em **três poderes** (Executivo, Legislativo, Judiciário).",
"- **Rousseau:** soberania popular e vontade geral.",
"- **Voltaire:** liberdade de expressão e tolerância religiosa.",
"- **Adam Smith:** liberalismo econômico (“mão invisível” do mercado).",
"> O Iluminismo inspirou a Revolução Francesa, a independência dos EUA e a Inconfidência Mineira."
],
q:[
["A divisão do poder do Estado em Executivo, Legislativo e Judiciário foi proposta por",["Voltaire","Montesquieu","Luís XIV","Lutero","Maquiavel"],1,"Em “O Espírito das Leis”, Montesquieu defendeu os três poderes para evitar o abuso de poder."],
["Uma característica do Renascimento cultural é",["o teocentrismo medieval.","o antropocentrismo e a valorização da razão humana.","a rejeição total da cultura greco-romana.","a proibição da ciência.","a valorização da servidão."],1,"O Renascimento colocou o ser humano no centro e retomou os clássicos antigos."],
["A Reforma Protestante, iniciada por Lutero em 1517, criticava principalmente",["a venda de indulgências pela Igreja Católica.","o fim do feudalismo.","as Grandes Navegações.","o Iluminismo.","a Revolução Industrial."],0,"Lutero condenou a venda do perdão dos pecados e defendeu a salvação pela fé."],
["No mercantilismo, a ideia de balança comercial favorável significava",["importar mais do que exportar.","exportar mais do que importar.","abolir impostos sobre importação.","proibir o comércio com colônias.","dividir igualmente a riqueza."],1,"Exportar mais do que importar trazia ouro e prata para o reino, fortalecendo o Estado."]
]},
{t:"Revoluções: Industrial, Francesa e Russa", inc:"A", r:"As revoluções que criaram o mundo contemporâneo: capitalismo industrial, direitos e socialismo.", v:"revolução industrial revolução francesa enem aula",
c:[
"## Revolução Industrial (Inglaterra, séc. XVIII)",
"- **Por que na Inglaterra:** capital acumulado, carvão e ferro, mão de obra disponível (cercamentos expulsaram camponeses), burguesia no poder após a Revolução Gloriosa (1688).",
"- **Mudanças:** da manufatura à **maquinofatura**, com a máquina a vapor, fábricas e trabalho assalariado.",
"- **Consequências sociais:** jornadas de até 16 horas, trabalho infantil, cidades insalubres e surgimento do **proletariado**.",
"- **Reações:** ludismo (quebra de máquinas), cartismo (direitos políticos), sindicatos, socialismo.",
"- **Segunda Revolução Industrial (séc. XIX):** eletricidade, petróleo, aço, química, linha de montagem.",
"## Independência dos EUA (1776)",
"As Treze Colônias reagiram aos impostos britânicos. A Declaração de Independência (Thomas Jefferson), inspirada no Iluminismo, defendia vida, liberdade e busca da felicidade. Primeira república moderna das Américas, mas manteve a escravidão.",
"## Revolução Francesa (1789)",
"- **Causas:** crise financeira, fome, privilégios do clero e da nobreza e ideias iluministas.",
"- **Queda da Bastilha (14 de julho de 1789)** e **Declaração dos Direitos do Homem e do Cidadão**.",
"- **Fases:** Monarquia Constitucional → Convenção (jacobinos, Robespierre, Terror) → Diretório → Era Napoleônica.",
"- **Lema:** Liberdade, Igualdade, Fraternidade.",
"- **Legado:** fim do Antigo Regime e dos privilégios, ascensão da burguesia, ideias de cidadania e direitos universais.",
"- **Napoleão:** Código Civil e Bloqueio Continental contra a Inglaterra, que provocou a vinda da família real ao Brasil em 1808.",
"## Revolução Russa (1917)",
"- Rússia czarista, pobre e agrária, em crise pela 1ª Guerra Mundial.",
"- **Fevereiro de 1917:** queda do czar. **Outubro de 1917:** os bolcheviques de Lênin tomam o poder (“Paz, terra e pão”).",
"- Formação da **URSS** (1922) e ditadura de Stálin (planos quinquenais, coletivização, gulags).",
"> O ENEM gosta de relacionar a Revolução Industrial ao mundo do trabalho atual, como automação e uberização."
],
q:[
["Uma das consequências sociais da Primeira Revolução Industrial foi",["a redução da jornada para 6 horas.","o surgimento do proletariado, com longas jornadas e trabalho infantil.","o fim das cidades.","a volta do feudalismo.","a eliminação da pobreza urbana."],1,"As fábricas criaram uma classe operária submetida a condições muito duras de trabalho."],
["O lema “Liberdade, Igualdade, Fraternidade” está associado à",["Revolução Russa","Revolução Francesa","Revolução Industrial","Guerra Fria","Reforma Protestante"],1,"É o lema da Revolução Francesa de 1789."],
["O movimento de trabalhadores ingleses que quebrava máquinas por considerá-las responsáveis pelo desemprego é o",["cartismo","ludismo","sindicalismo","bolchevismo","iluminismo"],1,"Os luditas destruíam máquinas em protesto contra a perda de empregos e as más condições de trabalho."],
["A Revolução Russa de outubro de 1917 levou ao poder",["o czar Nicolau II","os bolcheviques, liderados por Lênin","Napoleão Bonaparte","os jacobinos","a burguesia liberal inglesa"],1,"Os bolcheviques tomaram o poder e iniciaram a construção do Estado socialista soviético."]
]},
{t:"Século XX: guerras, totalitarismos e Guerra Fria", inc:"A", r:"Imperialismo, duas guerras mundiais, nazifascismo, Holocausto, Guerra Fria e descolonização.", v:"primeira e segunda guerra mundial guerra fria enem aula",
c:[
"## Imperialismo (séc. XIX–XX)",
"Potências industriais dominaram a África e a Ásia em busca de matérias-primas e mercados. A **Conferência de Berlim (1884–85)** dividiu a África sem respeitar povos e culturas, origem de muitos conflitos atuais. A justificativa era o darwinismo social e o “fardo do homem branco”, ideias racistas.",
"## 1ª Guerra Mundial (1914–1918)",
"- **Causas:** disputas imperialistas, nacionalismos, corrida armamentista, sistema de alianças (Tríplice Entente x Tríplice Aliança). Estopim: o assassinato do arquiduque Francisco Ferdinando.",
"- Guerra de trincheiras. O **Tratado de Versalhes** (1919) humilhou a Alemanha, o que ajudou a gerar a 2ª Guerra.",
"## Crise de 1929",
"Superprodução e especulação levaram à quebra da Bolsa de Nova York e a uma crise mundial. A resposta dos EUA foi o **New Deal** (intervenção do Estado na economia, com base nas ideias de Keynes).",
"## Totalitarismos",
"Nazismo (Hitler, Alemanha) e fascismo (Mussolini, Itália): partido único, culto ao líder, propaganda, censura, nacionalismo extremo, militarismo e perseguição a minorias. No nazismo, antissemitismo e racismo levaram ao **Holocausto** (cerca de 6 milhões de judeus assassinados, além de ciganos, pessoas com deficiência, homossexuais e opositores).",
"## 2ª Guerra Mundial (1939–1945)",
"Eixo (Alemanha, Itália, Japão) x Aliados (Reino Unido, URSS, EUA, França). Terminou com as **bombas atômicas** em Hiroshima e Nagasaki. Depois dela: criação da **ONU (1945)** e da **Declaração Universal dos Direitos Humanos (1948)**.",
"## Guerra Fria (1947–1991)",
"- Disputa **bipolar** entre EUA (capitalismo) e URSS (socialismo), sem confronto direto entre eles.",
"- Corrida armamentista e espacial, OTAN x Pacto de Varsóvia, **Muro de Berlim** (1961–1989).",
"- Conflitos indiretos: Coreia, Vietnã, Crise dos Mísseis em Cuba (1962).",
"- Na América Latina, os EUA apoiaram ditaduras militares, inclusive a brasileira.",
"- Fim: queda do Muro (1989) e fim da URSS (1991).",
"## Descolonização",
"Após 1945, países da Ásia e da África conquistaram a independência: Índia (1947, Gandhi e a resistência não violenta), Argélia, Angola e Moçambique (1975). Na África do Sul, o apartheid durou até 1994 (Nelson Mandela)."
],
q:[
["O Tratado de Versalhes (1919) é apontado como uma das causas da 2ª Guerra Mundial porque",["favoreceu a economia alemã.","impôs duras punições à Alemanha, alimentando revanchismo.","criou a ONU.","dividiu a África.","acabou com o nazismo."],1,"As perdas territoriais e as indenizações geraram crise e ressentimento, explorados pelo nazismo."],
["A Guerra Fria caracterizou-se por",["confrontos diretos entre EUA e URSS.","disputa ideológica, econômica e militar entre dois blocos, sem guerra direta entre as superpotências.","aliança entre EUA e URSS contra a Europa.","fim da corrida armamentista.","união da Alemanha em 1961."],1,"A rivalidade bipolar se expressou em corrida armamentista, espionagem e guerras indiretas."],
["Após a 2ª Guerra Mundial, foi criada em 1948 a",["Liga das Nações","Declaração Universal dos Direitos Humanos","Tríplice Entente","Conferência de Berlim","OTAN"],1,"A Declaração Universal dos Direitos Humanos foi adotada pela ONU em 1948, em resposta às atrocidades da guerra."],
["A Conferência de Berlim (1884–1885) está relacionada",["à partilha da África entre potências europeias.","ao fim da Guerra Fria.","à criação da ONU.","à Revolução Russa.","ao Plano Marshall."],0,"As potências dividiram o continente africano sem considerar os povos locais, o que gerou conflitos que duram até hoje."]
]}
]});

DATA.push({id:"geo", a:"hum", nome:"Geografia", lessons:[
{t:"Cartografia: escalas, fusos e projeções", inc:"A", r:"Ler mapas, calcular distâncias e horários e entender as distorções das projeções.", v:"cartografia escala fuso horário enem aula",
c:[
"## Escala",
"A escala mostra quantas vezes o real foi reduzido no mapa.",
"- **Numérica:** 1:100.000 significa que 1 cm no mapa corresponde a 100.000 cm (1 km) no real.",
"- **Gráfica:** uma barra dividida, útil porque continua certa ao ampliar o mapa.",
"- **Conta rápida:** distância real = distância no mapa × denominador. Converta: 100.000 cm = 1.000 m = 1 km.",
"- **Escala grande** (denominador pequeno, como 1:1.000) mostra muito detalhe e pouca área, como a planta de um bairro. **Escala pequena** (denominador grande, como 1:10.000.000) mostra pouco detalhe e muita área, como o mapa-múndi.",
"## Coordenadas geográficas",
"- **Latitude:** distância em graus ao Equador (0° a 90° N ou S).",
"- **Longitude:** distância em graus ao Meridiano de Greenwich (0° a 180° L ou O).",
"## Fusos horários",
"A Terra gira 360° em 24 h, então **15° de longitude = 1 hora**. Para **leste, o horário adianta**; para **oeste, atrasa**. Brasília usa GMT −3 (3 horas atrás de Greenwich).",
"> Exemplo: são 10h em Brasília (−3). Em Londres (0) são 13h. Em Tóquio (+9) são 22h.",
"## Projeções cartográficas",
"Toda projeção distorce algo, porque é impossível representar uma esfera num plano sem deformar.",
"- **Mercator (conforme):** preserva formas e ângulos, ótima para navegação, mas aumenta as áreas perto dos polos (a Groenlândia parece do tamanho da África). Tem visão eurocêntrica.",
"- **Peters (equivalente):** preserva as proporções de área, mas distorce as formas. Valoriza os países do Sul.",
"- **Azimutal:** projeção plana a partir de um ponto, usada em mapas polares e no símbolo da ONU.",
"## Outros conceitos",
"- **Curvas de nível:** ligam pontos de mesma altitude. Curvas próximas indicam relevo íngreme.",
"- **Sensoriamento remoto e GPS:** imagens de satélite e geolocalização, usadas no monitoramento do desmatamento."
],
q:[
["Em um mapa de escala 1:250.000, duas cidades estão a 8 cm uma da outra. A distância real é de",["2 km","20 km","200 km","25 km","2.000 km"],1,"1 cm = 250.000 cm = 2,5 km. Então 8 × 2,5 = 20 km."],
["São 14h em Brasília (GMT −3). Que horas são em uma cidade localizada no fuso GMT +2?",["11h","17h","19h","9h","21h"],2,"De −3 para +2 são 5 fusos para leste. Para leste, adianta: 14h + 5h = 19h."],
["A projeção de Mercator é criticada por",["preservar as áreas reais dos continentes.","ampliar as áreas próximas aos polos e reforçar uma visão eurocêntrica.","ser inútil para a navegação.","representar a Terra como um cilindro sem distorções.","ter sido criada no século XXI."],1,"Mercator preserva formas, mas aumenta muito as áreas de altas latitudes, como Europa e Groenlândia."],
["Um mapa com escala 1:2.000 comparado a outro com escala 1:2.000.000 apresenta",["menos detalhes e mais área.","mais detalhes e menor área representada.","a mesma quantidade de detalhes.","escala menor.","maior distorção de formas."],1,"Denominador menor significa escala maior: mais detalhes, porém uma área menor."]
]},
{t:"Clima, fenômenos atmosféricos e domínios naturais", inc:"A", r:"Fatores do clima, climas do Brasil, El Niño, ilha de calor e os domínios morfoclimáticos.", v:"climas do brasil domínios morfoclimáticos enem aula",
c:[
"## Tempo x clima",
"**Tempo** é o estado momentâneo da atmosfera (hoje está chovendo). **Clima** é o padrão observado ao longo de cerca de 30 anos.",
"## Fatores do clima",
"- **Latitude:** quanto mais perto do Equador, mais quente.",
"- **Altitude:** a cada 1.000 m de subida, a temperatura cai cerca de 6 °C.",
"- **Maritimidade x continentalidade:** perto do mar, a amplitude térmica é menor; no interior, é maior.",
"- **Massas de ar:** a Massa Equatorial Continental traz umidade para a Amazônia e parte do Brasil; a Massa Polar Atlântica traz frentes frias ao Sul e ao Sudeste.",
"- **Relevo e vegetação** também influenciam.",
"## Fenômenos que caem muito",
"- **Ilha de calor:** centros urbanos mais quentes que as áreas vizinhas, por causa do asfalto, do concreto, da falta de vegetação e da poluição.",
"- **Inversão térmica:** no inverno, uma camada de ar frio fica presa embaixo de uma camada quente, retendo poluentes perto do solo e piorando problemas respiratórios.",
"- **Chuva ácida:** gases como SO₂ e NOₓ reagem com a água da atmosfera.",
"- **El Niño:** aquecimento anormal das águas do Pacífico. No Brasil: seca no Norte e Nordeste e chuvas fortes no Sul. **La Niña** é o esfriamento, com efeitos geralmente inversos.",
"- **Efeito estufa:** fenômeno natural e essencial. O **aquecimento global** é sua intensificação pela emissão humana de gases, principalmente CO₂ e metano.",
"## Domínios morfoclimáticos (Aziz Ab’Saber)",
"- **Amazônico:** clima equatorial quente e úmido, floresta densa, grande biodiversidade, solos pobres (a fertilidade vem da própria floresta).",
"- **Cerrado:** clima tropical com estação seca, árvores tortuosas de casca grossa, raízes profundas; é a “caixa-d’água” do Brasil. Muito ameaçado pelo agronegócio.",
"- **Caatinga:** clima semiárido, vegetação xerófila adaptada à seca (cactos, plantas que perdem as folhas). Exclusivo do Brasil.",
"- **Mares de Morros:** Mata Atlântica, relevo de morros arredondados; é o bioma mais devastado (restam cerca de 12%).",

{t:"Urbanização", inc:"A", r:"Como as cidades brasileiras cresceram e os problemas urbanos que isso gerou.", v:"urbanização brasileira segregação socioespacial enem aula",
c:[
"## A urbanização brasileira",
"O Brasil se urbanizou de forma **rápida e desordenada**, principalmente entre 1950 e 1980, com a industrialização e o **êxodo rural** (causado pela mecanização do campo e pela concentração de terras). Hoje, mais de 85% da população vive em áreas urbanas.",
"## Conceitos-chave",
"- **Metrópole:** cidade grande que polariza uma região. **Região metropolitana:** a metrópole e as cidades ao redor integradas a ela.",
"- **Conurbação:** quando cidades vizinhas crescem e se unem fisicamente.",
"- **Megalópole:** junção de metrópoles, como o eixo Rio–São Paulo.",
"- **Macrocefalia urbana:** crescimento exagerado de poucas cidades, que concentram população e serviços.",
"- **Rede e hierarquia urbana:** cidades ligadas por fluxos de pessoas, mercadorias e informações.",
"## Problemas urbanos",
"- **Segregação socioespacial:** ricos e pobres ocupam espaços diferentes da cidade. Condomínios fechados de um lado, favelas e periferias do outro.",
"- **Favelização e periferização:** a população pobre ocupa áreas distantes ou de risco (encostas, margens de rios).",
"- **Gentrificação:** a revitalização de uma área valoriza os imóveis e expulsa os moradores de baixa renda.",
"- **Mobilidade urbana:** longos deslocamentos, trânsito, transporte público precário e de má qualidade.",
"- **Déficit habitacional**, enchentes (impermeabilização do solo), poluição e ilhas de calor.",
"## Direito à cidade",
"O **Estatuto da Cidade (2001)** regulamenta a função social da propriedade urbana. O conceito de **direito à cidade** defende que todos tenham acesso à moradia, ao transporte, ao lazer e aos serviços urbanos.",
"> Na redação, urbanização aparece ligada a temas como mobilidade, moradia e desigualdade."
],

c:[
"## A estrutura fundiária",
"O Brasil tem uma das maiores **concentrações de terra** do mundo, com origem nas sesmarias coloniais e na Lei de Terras (1850). Poucos grandes proprietários têm grande parte das terras agrícolas.",
"## Modernização conservadora",
"A partir dos anos 1960–70, o campo se modernizou com a **Revolução Verde**: máquinas, fertilizantes, agrotóxicos e sementes selecionadas. A produtividade aumentou, mas a concentração de terras se manteve e muitos trabalhadores foram expulsos para as cidades.",
"## Agronegócio x agricultura familiar",
"- **Agronegócio:** grandes propriedades, monocultura (soja, milho, cana, algodão), exportação, alta tecnologia e pouca mão de obra. O Brasil é um dos maiores exportadores de alimentos do mundo.",
"- **Agricultura familiar:** pequenas propriedades, policultura e mão de obra da família. É responsável por grande parte dos alimentos que chegam à mesa dos brasileiros, como mandioca, feijão e leite.",
"## Fronteira agrícola",
"A expansão da soja e do gado avançou sobre o Cerrado e a Amazônia (“arco do desmatamento”). A região do **MATOPIBA** (Maranhão, Tocantins, Piauí, Bahia) é a fronteira mais recente.",
"## Conflitos no campo",
"- **Movimentos sociais:** MST (Movimento dos Trabalhadores Rurais Sem Terra), que luta pela **reforma agrária**.",
"- Violência contra camponeses, indígenas e quilombolas; grilagem (falsificação de títulos de terra).",
"- Trabalho análogo à escravidão ainda é encontrado em fazendas.",
"## Impactos ambientais",
"Desmatamento, uso intensivo de agrotóxicos, perda de biodiversidade, erosão e contaminação da água.",
"> Termo útil: **commodities** são produtos primários com preço definido no mercado internacional, como soja, minério e petróleo."
],

{t:"Indústria, energia e globalização", inc:"A", r:"Modelos de produção, industrialização brasileira, matriz energética e o mundo globalizado.", v:"fordismo toyotismo globalização matriz energética enem aula",
c:[
"## Modelos de produção",
"- **Taylorismo:** divisão e cronometragem das tarefas, com controle rígido do trabalhador.",
"- **Fordismo:** linha de montagem, produção em massa, produtos padronizados e estoques grandes. O trabalhador faz uma tarefa repetitiva.",
"- **Toyotismo (produção flexível):** **just in time** (produzir sob demanda, estoque mínimo), trabalhador multifuncional, controle de qualidade e terceirização.",
"- **Uberização:** trabalho por aplicativo, sem vínculo empregatício, com renda instável e poucos direitos.",
"## Industrialização brasileira",
"Tardia e concentrada no Sudeste (principalmente São Paulo). Teve impulso com Vargas (indústria de base) e com JK (bens de consumo duráveis, como automóveis, e capital estrangeiro). A partir dos anos 1990 houve **desconcentração industrial**: fábricas migraram para o interior e outras regiões em busca de incentivos fiscais (guerra fiscal), mão de obra mais barata e menos sindicatos.",
"## Matriz energética",
"- O Brasil tem uma das matrizes mais **renováveis** do mundo: hidrelétricas, biomassa (cana), eólica (forte no Nordeste) e solar em expansão.",
"- **Hidrelétricas:** energia renovável, mas com alagamento de áreas, deslocamento de populações ribeirinhas e indígenas e impacto sobre peixes (Belo Monte).",
"- **Combustíveis fósseis** (petróleo, carvão, gás) emitem gases do efeito estufa. O pré-sal fez do Brasil um grande produtor de petróleo.",
"- **Transição energética:** substituir fontes fósseis por renováveis.",
"## Globalização",
"- Integração mundial de economias, culturas e informações, acelerada pela revolução técnico-científico-informacional.",
"- **Milton Santos:** o **meio técnico-científico-informacional** e a crítica à “globalização perversa”, que aumenta as desigualdades.",
"- **Empresas transnacionais**, fluxos financeiros instantâneos, divisão internacional do trabalho.",
"- **Blocos econômicos:** Mercosul, União Europeia, USMCA. **BRICS:** Brasil, Rússia, Índia, China, África do Sul e novos membros."
],

{t:"Questões ambientais", inc:"A", r:"Desmatamento, mudanças climáticas, acordos internacionais e desenvolvimento sustentável.", v:"questões ambientais aquecimento global acordo de paris enem aula",
c:[
"## Principais problemas",
"- **Desmatamento e queimadas:** na Amazônia e no Cerrado, ligados à pecuária, à soja, à mineração ilegal e à grilagem. Liberam CO₂ e reduzem a biodiversidade e as chuvas (os “rios voadores” da Amazônia levam umidade ao Centro-Sul).",
"- **Aquecimento global:** aumento da temperatura média do planeta por gases do efeito estufa (CO₂, CH₄). Consequências: derretimento de geleiras, aumento do nível do mar e eventos extremos.",
"- **Eventos extremos:** secas severas, ondas de calor, tempestades. Exemplo: as enchentes no Rio Grande do Sul em 2024.",
"- **Poluição da água e resíduos sólidos:** falta de saneamento, lixões, plásticos nos oceanos.",
"## Acordos internacionais",
"- **Eco-92 (Rio de Janeiro, 1992):** consolidou o conceito de desenvolvimento sustentável e a Agenda 21.",
"- **Protocolo de Kyoto (1997):** metas de redução de emissões para países desenvolvidos.",
"- **Acordo de Paris (2015):** limitar o aquecimento a bem menos de 2 °C, buscando 1,5 °C, com metas definidas por cada país.",
"- **COP30 (2025):** conferência do clima da ONU realizada em Belém (PA), na Amazônia.",
"## Conceitos importantes",
"- **Desenvolvimento sustentável:** atender às necessidades do presente sem comprometer as gerações futuras (Relatório Brundtland, 1987).",
"- **Economia circular:** reduzir, reutilizar, reciclar e manter materiais em uso.",
"- **Racismo ambiental:** populações negras, indígenas e pobres são as mais expostas a riscos ambientais, como enchentes, lixões e poluição.",
"- **Unidades de conservação:** de proteção integral (parques nacionais) ou de uso sustentável (reservas extrativistas).",
"- **Pegada ecológica:** quanto de recursos naturais uma pessoa ou país consome.",
"> Tema quente para a redação: crise climática, eventos extremos e justiça climática."
],

{t:"População, migrações e demografia", inc:"M", r:"Transição demográfica, envelhecimento, pirâmide etária, migrações e refugiados.", v:"transição demográfica pirâmide etária migrações enem aula",
c:[
"## Conceitos básicos",
"- **Natalidade:** nascimentos por mil habitantes. **Mortalidade:** óbitos por mil habitantes.",
"- **Crescimento vegetativo** = natalidade − mortalidade.",
"- **Taxa de fecundidade:** média de filhos por mulher. No Brasil caiu de cerca de 6 (1960) para menos de 2 hoje.",
"- **Expectativa de vida:** no Brasil, passa de 75 anos.",
"## Transição demográfica",
"1) Natalidade e mortalidade altas. 2) A mortalidade cai (vacinas, saneamento, medicina) e a população cresce rápido. 3) A natalidade também cai (urbanização, mulheres no mercado de trabalho, métodos contraceptivos, custo de criar filhos). 4) As duas ficam baixas e a população **envelhece**.",
"## Pirâmide etária",
"- **Base larga:** muitos jovens, típica de países em desenvolvimento com alta natalidade.",
"- **Base estreita e topo largo:** população envelhecida, como em países desenvolvidos e cada vez mais no Brasil.",
"- **Bônus demográfico:** período em que há muitas pessoas em idade de trabalhar em relação a crianças e idosos. O Brasil está saindo dessa fase.",
"- **Desafios do envelhecimento:** previdência, saúde, cuidado, etarismo (preconceito contra idosos). Foi o tema da redação do ENEM 2025!",
"## Migrações",
"- **Internas:** Nordeste → Sudeste (séc. XX), êxodo rural; hoje há migração de retorno e fluxos para o Centro-Oeste.",
"- **Internacionais:** refugiados de guerras e crises (venezuelanos, haitianos, sírios, afegãos, ucranianos).",
"- **Refugiado:** pessoa que deixa o país por perseguição, guerra ou violação de direitos humanos, protegida pelo direito internacional.",
"- **Xenofobia:** aversão ou preconceito contra estrangeiros.",
"## IDH",
"O Índice de Desenvolvimento Humano combina **renda, educação e longevidade** (expectativa de vida). Vai de 0 a 1."
],

{t:"Relevo, solos e hidrografia", inc:"M", r:"Agentes do relevo, formas do relevo brasileiro, problemas dos solos e uso da água.", v:"relevo brasileiro solos hidrografia enem aula",
c:[
"## Estrutura da Terra e agentes do relevo",
"- **Agentes internos (endógenos):** tectonismo (movimento das placas), vulcanismo, terremotos. Criam as grandes formas do relevo.",
"- **Agentes externos (exógenos):** intemperismo (desgaste das rochas), erosão (pela água, vento, gelo e ação humana). Modelam o relevo.",
"- O Brasil fica no centro da Placa Sul-Americana, por isso tem poucos terremotos fortes e nenhum vulcão ativo.",
"## Relevo brasileiro",
"Relevo antigo e desgastado, com altitudes modestas. Na classificação de Jurandyr Ross há três formas: **planaltos** (a erosão supera a sedimentação), **planícies** (a sedimentação predomina, como no Pantanal e na costa) e **depressões** (áreas mais baixas que o entorno).",
"## Problemas dos solos",
"- **Erosão e voçorocas:** grandes crateras, agravadas pelo desmatamento.",
"- **Lixiviação:** a água da chuva “lava” os nutrientes do solo.",
"- **Laterização:** formação de crostas duras e pobres em regiões tropicais.",
"- **Assoreamento:** acúmulo de sedimentos no leito dos rios, causado pela retirada da mata ciliar.",
"- **Desertificação:** degradação em áreas secas, como partes do semiárido nordestino.",
"- **Técnicas de conservação:** curvas de nível, terraceamento, plantio direto, rotação de culturas, adubação verde.",
"## Hidrografia",
"- Rios brasileiros são majoritariamente de **planalto**, com grande potencial hidrelétrico.",
"- **Bacias:** Amazônica (a maior do mundo), do Paraná (mais aproveitada para energia, com Itaipu), do São Francisco (o “rio da integração nacional”, alvo da **transposição** para levar água ao semiárido).",
"- **Aquífero Guarani:** um dos maiores reservatórios subterrâneos de água doce do mundo, compartilhado com Argentina, Paraguai e Uruguai.",
"- **Crise hídrica:** má gestão, desmatamento, poluição e mudanças climáticas. A água é um direito humano."
],

{t:"Filosofia antiga: dos pré-socráticos a Aristóteles", inc:"A", r:"O nascimento da filosofia, Sócrates, Platão, Aristóteles e as escolas helenísticas.", v:"filosofia antiga sócrates platão aristóteles enem aula",
c:[
"## Do mito ao logos",
"A filosofia nasceu na Grécia (séc. VI a.C.) quando pensadores passaram a explicar o mundo pela razão (**logos**), e não mais pelos mitos.",
"## Pré-socráticos: a busca da arché",
"Procuravam a **arché**, o princípio de todas as coisas.",
"- **Tales de Mileto:** a água. **Anaxímenes:** o ar.",
"- **Heráclito:** tudo flui, tudo muda (**devir**). “Ninguém se banha duas vezes no mesmo rio.” A realidade é luta de opostos.",
"- **Parmênides:** o ser é imutável; a mudança é ilusão dos sentidos.",
"- **Demócrito:** tudo é feito de átomos.",
"## Sofistas",
"Professores de retórica que cobravam pelas aulas. Defendiam o **relativismo**: “O homem é a medida de todas as coisas” (Protágoras).",
"## Sócrates (470–399 a.C.)",
"- Não deixou escritos; conhecemos seu pensamento por Platão.",
"- **“Só sei que nada sei”:** reconhecer a própria ignorância é o início do saber.",
"- **Método:** ironia (mostrar as contradições do interlocutor) e **maiêutica** (“parto das ideias”, ajudar o outro a chegar à verdade por perguntas).",
"- “Conhece-te a ti mesmo.” Foi condenado à morte, acusado de corromper a juventude.",
"## Platão (427–347 a.C.)",
"- **Teoria das Ideias:** há o **mundo sensível** (cópias imperfeitas e mutáveis, percebidas pelos sentidos) e o **mundo inteligível** (das Ideias perfeitas e eternas, alcançado pela razão).",
"- **Alegoria da Caverna:** prisioneiros veem só sombras e pensam que são a realidade. O filósofo é quem sai da caverna, vê a luz (a verdade) e volta para libertar os outros.",
"- **A República:** o governante ideal seria o filósofo.",
"## Aristóteles (384–322 a.C.)",
"- Valorizou a experiência e a observação. Criou a **lógica** (silogismo).",
"- **Ética:** o objetivo da vida é a felicidade (**eudaimonia**), alcançada pela virtude, que é o **justo meio** entre dois extremos (coragem entre covardia e temeridade).",
"- **Política:** “O homem é um **animal político**”, ou seja, realiza-se vivendo em sociedade (na pólis).",
"## Escolas helenísticas",
"- **Estoicismo:** aceitar o que não depende de nós e controlar as paixões.",
"- **Epicurismo:** buscar prazeres moderados e a ausência de dor e perturbação (ataraxia).",
"> Ligação com Psicologia: “Conhece-te a ti mesmo”, a teoria das emoções dos estoicos e a ideia de virtude como hábito são raízes antigas da psicologia."
],
q:[
["Na Alegoria da Caverna, Platão representa as sombras na parede como",["o mundo das Ideias.","as aparências do mundo sensível, confundidas com a realidade.","a verdade absoluta.","os deuses gregos.","a democracia ateniense."],1,"As sombras simbolizam a ilusão dos sentidos. Sair da caverna é alcançar o conhecimento verdadeiro pela razão."],
["O método socrático de ajudar o interlocutor a “dar à luz” ideias por meio de perguntas chama-se",["dialética hegeliana","maiêutica","empirismo","silogismo","relativismo"],1,"Maiêutica significa “arte de fazer o parto”: Sócrates ajudava o outro a descobrir a verdade."],
["Para Aristóteles, a virtude ética consiste",["no excesso de prazer.","no justo meio entre dois extremos.","na obediência cega às leis.","na negação da razão.","no isolamento social."],1,"A coragem, por exemplo, fica entre a covardia (falta) e a temeridade (excesso)."],
["A frase “Ninguém se banha duas vezes no mesmo rio” expressa a ideia de",["imobilidade do ser, de Parmênides.","devir, a mudança constante, de Heráclito.","átomo, de Demócrito.","relativismo, dos sofistas.","ataraxia, dos epicuristas."],1,"Heráclito afirmava que tudo está em permanente transformação."]
]},
{t:"Filosofia medieval: fé e razão", inc:"B", r:"Agostinho e Tomás de Aquino: como conciliar a fé cristã com a filosofia grega.", v:"filosofia medieval agostinho tomás de aquino enem aula",
c:[
"## O problema central",
"Na Idade Média, a filosofia girou em torno da relação entre **fé** (revelação cristã) e **razão** (filosofia grega).",
"## Patrística: Santo Agostinho (354–430)",
"- Influenciado por **Platão**.",
"- A fé vem antes e ilumina a razão: “Creio para compreender”.",
"- **Teoria da iluminação:** a verdade vem de Deus, que ilumina a mente humana.",
"- **O mal** não é uma criação de Deus, mas ausência do bem, resultado do mau uso do **livre-arbítrio** humano.",
"- Obras: “Confissões” (uma das primeiras autobiografias introspectivas) e “A Cidade de Deus”.",
"## Escolástica: São Tomás de Aquino (1225–1274)",
"- Influenciado por **Aristóteles**.",
"- Fé e razão não se contradizem: são dois caminhos para a mesma verdade. A razão pode demonstrar algumas verdades da fé.",
"- **Cinco vias:** argumentos racionais para provar a existência de Deus (primeiro motor, causa primeira, ser necessário etc.).",
"- Obra: “Suma Teológica”.",
"> Ligação com Psicologia: as “Confissões” de Agostinho são consideradas uma das primeiras reflexões sobre a interioridade, a memória e a vida psíquica."
],
q:[
["Santo Agostinho foi influenciado principalmente pela filosofia de",["Aristóteles","Platão","Descartes","Marx","Nietzsche"],1,"A Patrística agostiniana retomou o platonismo, com a ideia de um mundo superior de verdades eternas."],
["Para Tomás de Aquino, a relação entre fé e razão é de",["oposição total.","harmonia, pois ambas levam à mesma verdade.","subordinação completa da fé à ciência.","indiferença.","negação da fé."],1,"Tomás conciliou a fé cristã com a filosofia de Aristóteles, defendendo que razão e fé não se contradizem."],
["Para Agostinho, o mal no mundo resulta",["da vontade de Deus.","do mau uso do livre-arbítrio humano.","da matéria, que é essencialmente má.","dos astros.","da razão."],1,"Deus criou tudo bom; o mal é a ausência do bem, causada pelas escolhas humanas."],
["As “cinco vias” de Tomás de Aquino são",["regras de convivência monástica.","argumentos racionais para demonstrar a existência de Deus.","caminhos de peregrinação.","etapas do método científico.","leis da política medieval."],1,"São provas racionais, como a do primeiro motor imóvel, inspiradas em Aristóteles."]
]},
{t:"Filosofia moderna: razão, experiência e Kant", inc:"A", r:"Descartes, os empiristas, Kant e Maquiavel: como conhecemos e como devemos agir.", v:"filosofia moderna descartes kant empirismo enem aula",
c:[
"## O problema do conhecimento",
"Com a Revolução Científica, a grande pergunta passa a ser: **como conhecemos?** Pela razão ou pela experiência dos sentidos?",
"## Racionalismo: René Descartes (1596–1650)",
"- **Dúvida metódica:** duvidar de tudo o que pode ser duvidado (os sentidos enganam, podemos estar sonhando).",
"- A única certeza: se duvido, penso; se penso, existo. **“Penso, logo existo”** (cogito, ergo sum).",
"- **Ideias inatas:** algumas ideias já nascem com a razão.",
"- **Dualismo:** mente (res cogitans) e corpo (res extensa) são substâncias diferentes.",
"## Empirismo",
"- **John Locke:** a mente é uma **tábula rasa** (folha em branco) ao nascer; todo conhecimento vem da experiência.",
"- **David Hume:** a relação de causa e efeito não é percebida diretamente. Acreditamos nela por **hábito** (costume de ver um fato seguido de outro). Ceticismo.",
"- **Francis Bacon:** método indutivo e crítica aos “ídolos” (preconceitos que atrapalham o conhecimento).",
"## Immanuel Kant (1724–1804)",
"- **Criticismo:** uniu razão e experiência. O conhecimento começa com a experiência, mas a mente a organiza com estruturas próprias (espaço, tempo, categorias).",
"- **Ética do dever:** agir por dever, e não por interesse. **Imperativo categórico:** “Age apenas segundo uma máxima que possas querer que se torne lei universal” e trate a humanidade sempre como fim, nunca apenas como meio.",
"- **Autonomia:** agir segundo a lei que a própria razão impõe.",
"- **Esclarecimento:** “saída do homem de sua menoridade”. Lema: **Sapere aude!** (ousa saber, tenha coragem de usar o próprio entendimento).",
"## Maquiavel (1469–1527)",
"- “O Príncipe”: separou **ética e política**. O governante deve analisar a realidade como ela é.",
"- **Virtù** (capacidade de agir) e **fortuna** (acaso, circunstâncias).",
"- “É melhor ser temido do que amado”, se não for possível ser as duas coisas. A frase “os fins justificam os meios” é uma simplificação atribuída a ele.",
"> Ligação com Psicologia: o dualismo mente e corpo de Descartes e a “tábula rasa” de Locke são debates fundadores da psicologia."
],
q:[
["A frase “Penso, logo existo” é a primeira certeza alcançada por Descartes após",["a observação da natureza.","a dúvida metódica.","a leitura da Bíblia.","a experiência sensível.","o estudo da política."],1,"Ao duvidar de tudo, Descartes percebe que não pode duvidar de que está pensando."],
["Para John Locke, a mente humana ao nascer é",["cheia de ideias inatas.","uma tábula rasa, e o conhecimento vem da experiência.","igual à mente divina.","incapaz de conhecer.","formada por arquétipos."],1,"Locke é empirista: todo conhecimento deriva da experiência sensível."],
["O imperativo categórico de Kant orienta a agir",["conforme o próprio interesse.","segundo uma regra que possa valer como lei universal.","de acordo com as consequências mais lucrativas.","conforme a vontade do governante.","seguindo apenas as emoções."],1,"A ação moral é aquela cuja máxima pode ser universalizada, feita por dever."],
["Maquiavel é considerado o fundador da ciência política moderna por",["unir religião e política.","analisar a política como ela é, separando-a da moral religiosa.","defender a democracia direta.","criar a teoria dos três poderes.","propor o comunismo."],1,"Em “O Príncipe”, Maquiavel analisa realisticamente como o poder é conquistado e mantido."]
]},
{t:"Contratualistas: Hobbes, Locke e Rousseau", inc:"A", r:"Por que existe o Estado? Estado de natureza, contrato social e soberania.", v:"contratualistas hobbes locke rousseau enem aula",
c:[
"## A ideia de contrato social",
"Os contratualistas explicam a origem do Estado como um **acordo** entre as pessoas, que saem do **estado de natureza** (sem governo) para viver em sociedade organizada. Eles diferem sobre como seria esse estado de natureza e que tipo de governo o contrato deve criar.",
"## Thomas Hobbes (1588–1679), “Leviatã”",
"- O ser humano é egoísta e movido pelo medo: **“o homem é o lobo do homem”**.",
"- O estado de natureza é uma **guerra de todos contra todos**, e a vida é “solitária, pobre, sórdida, brutal e curta”.",
"- Para ter segurança, as pessoas cedem sua liberdade a um soberano com poder absoluto: o Leviatã.",
"- Justificou o **absolutismo**, mas de forma racional (não pelo direito divino).",
"## John Locke (1632–1704)",
"- No estado de natureza, os homens já têm **direitos naturais**: vida, liberdade e propriedade.",
"- O Estado existe para **proteger** esses direitos.",
"- Se o governo violar os direitos, o povo tem **direito de resistência** (rebelião).",
"- Pai do **liberalismo** político, inspirou a Revolução Gloriosa e a independência dos EUA.",
"## Jean-Jacques Rousseau (1712–1778)",
"- O ser humano nasce bom (**bom selvagem**); a sociedade o corrompe.",
"- A origem da desigualdade é a **propriedade privada**: “O primeiro que, tendo cercado um terreno, lembrou-se de dizer ‘isto é meu’... foi o verdadeiro fundador da sociedade civil”.",
"- O contrato legítimo cria a **vontade geral**: o povo é soberano e as leis devem expressar o bem comum. Base da **democracia** e da soberania popular.",
"> Macete: Hobbes = medo e segurança (absolutismo). Locke = direitos e propriedade (liberalismo). Rousseau = bondade natural e vontade geral (democracia)."
],
q:[
["Para Hobbes, o estado de natureza é marcado por",["paz e cooperação.","guerra de todos contra todos.","igualdade e bondade natural.","respeito à propriedade privada.","democracia direta."],1,"Sem um poder comum, o medo e o egoísmo levam ao conflito permanente."],
["O direito de o povo se rebelar contra um governo que viola a vida, a liberdade e a propriedade foi defendido por",["Hobbes","Locke","Maquiavel","Platão","Agostinho"],1,"Locke defendia o direito de resistência contra governos tirânicos."],
["Para Rousseau, a origem da desigualdade entre os homens está",["na natureza má do ser humano.","na propriedade privada.","na vontade de Deus.","na falta de um soberano absoluto.","na democracia."],1,"No “Discurso sobre a origem da desigualdade”, Rousseau aponta a propriedade privada como fonte das desigualdades."],
["A ideia de que o povo é soberano e de que as leis devem expressar a vontade geral está associada a",["Rousseau","Hobbes","Maquiavel","Tomás de Aquino","Hume"],0,"A vontade geral, em “O Contrato Social”, fundamenta a soberania popular."]
]},
{t:"Filosofia contemporânea", inc:"A", r:"Nietzsche, existencialismo, Frankfurt, Arendt, Foucault, Bauman e Byung-Chul Han.", v:"filosofia contemporânea nietzsche sartre foucault enem aula",
c:[
"## Friedrich Nietzsche (1844–1900)",
"- **“Deus está morto”:** os valores tradicionais perderam o fundamento.",
"- Crítica à **moral de rebanho** (moral dos fracos, que nega a vida) e defesa da **transvaloração dos valores**.",
"- **Vontade de potência** e o **além-do-homem** (super-homem), que cria os próprios valores.",
"## Existencialismo",
"- **Jean-Paul Sartre:** “a existência precede a essência”. Não nascemos com uma natureza pronta; nos fazemos pelas escolhas. Somos “condenados a ser livres” e responsáveis pelo que fazemos. **Má-fé:** fingir que não temos escolha.",
"- **Simone de Beauvoir:** “Não se nasce mulher, torna-se mulher” (“O Segundo Sexo”, 1949). O gênero é construção social, e não destino biológico. Base do feminismo contemporâneo.",
"## Escola de Frankfurt",
"- **Adorno e Horkheimer:** **indústria cultural**. A cultura vira mercadoria padronizada, produzida em série para o consumo, que aliena e conforma as massas.",
"- **Razão instrumental:** a razão usada só como meio técnico para dominar, sem reflexão sobre os fins.",
"- **Walter Benjamin:** a reprodutibilidade técnica e a perda da “aura” da obra de arte.",
"## Hannah Arendt (1906–1975)",
"- **Banalidade do mal:** ao acompanhar o julgamento do nazista Eichmann, percebeu que ele não era um monstro, mas um burocrata que “apenas cumpria ordens”, sem pensar criticamente. O mal pode vir da ausência de pensamento.",
"- Estudou o **totalitarismo**.",
"## Michel Foucault (1926–1984)",
"- O poder não está só no Estado: ele se espalha pelas instituições (**microfísica do poder**).",
"- **Sociedade disciplinar:** escolas, prisões, hospitais, fábricas e quartéis vigiam e “normalizam” os corpos.",
"- **Panóptico:** prisão em que o vigiado nunca sabe se está sendo observado, e por isso se autocontrola. Muito usado para falar de redes sociais e vigilância digital.",
"- “História da Loucura”: analisou como a sociedade passou a excluir e internar os “loucos”.",
"## Pensadores atuais",
"- **Zygmunt Bauman:** **modernidade líquida**. Relações, empregos e identidades frágeis e passageiros.",
"- **Byung-Chul Han:** **sociedade do cansaço**. A pressão por desempenho e produtividade leva ao esgotamento, à depressão e ao burnout.",
"> Ligação com Psicologia: Foucault (loucura, manicômios), Han (burnout) e Bauman (relações líquidas) são repertórios perfeitos para redações sobre saúde mental!"
],
q:[
["A frase “a existência precede a essência”, de Sartre, significa que",["o ser humano nasce com uma natureza definida por Deus.","o ser humano primeiro existe e depois se define pelas próprias escolhas.","a essência humana é biológica e imutável.","a liberdade é uma ilusão.","o destino é traçado pelos astros."],1,"Para o existencialismo, somos o que fazemos de nós mesmos, com total responsabilidade."],
["O conceito de “indústria cultural”, de Adorno e Horkheimer, critica",["a valorização da arte popular.","a transformação da cultura em mercadoria padronizada que aliena as massas.","o fim do cinema.","a educação pública.","a arte renascentista."],1,"A cultura produzida em série para o lucro tende a padronizar gostos e reduzir o pensamento crítico."],
["Para Byung-Chul Han, a sociedade atual é marcada",["pela obediência a proibições externas.","pelo excesso de desempenho e autoexploração, que gera esgotamento e burnout.","pelo fim do trabalho.","pela ausência de tecnologia.","pela vida contemplativa."],1,"Na “sociedade do cansaço”, o indivíduo se cobra produtividade sem limites e adoece."],
["O conceito de “banalidade do mal”, de Hannah Arendt, indica que",["o mal só é praticado por monstros.","atrocidades podem ser cometidas por pessoas comuns que deixam de pensar criticamente.","o mal é sempre punido.","não existe mal no mundo.","o mal é natural e inevitável."],1,"Eichmann cumpria ordens burocraticamente, sem refletir sobre o horror de seus atos."]
]},
{t:"Ética, política e ciência", inc:"M", r:"Ética x moral, utilitarismo, deontologia, bioética e filosofia da ciência.", v:"ética e moral utilitarismo bioética enem filosofia aula",
c:[
"## Ética x moral",
"- **Moral:** conjunto de normas e costumes de um grupo, numa época.",
"- **Ética:** reflexão filosófica sobre a moral. Pergunta por que agimos e o que é certo.",
"## Principais teorias éticas",
"- **Ética das virtudes (Aristóteles):** ser uma boa pessoa pelo hábito das virtudes.",
"- **Deontologia (Kant):** agir por dever, seguindo princípios universais, independentemente das consequências. Mentir é errado sempre.",
"- **Utilitarismo (Jeremy Bentham, John Stuart Mill):** a ação correta é a que produz a **maior felicidade para o maior número de pessoas**. Avalia as consequências.",
"## Bioética",
"Reflexão sobre questões de vida e saúde: pesquisas com seres humanos, clonagem, eutanásia, aborto, transgênicos, doação de órgãos. Princípios: **autonomia** (respeitar a decisão do paciente), **beneficência** (fazer o bem), **não maleficência** (não causar dano) e **justiça** (distribuição justa de recursos).",
"## Filosofia da ciência",
"- **Método científico:** observação, hipótese, experimentação e conclusão.",
"- **Karl Popper:** uma teoria científica deve ser **falseável**, ou seja, poder ser testada e eventualmente refutada.",
"- **Thomas Kuhn:** a ciência avança por **revoluções científicas** e mudanças de **paradigma** (como do geocentrismo ao heliocentrismo).",
"## Política",
"- Democracia representativa x direta; cidadania; direitos humanos.",
"- **Tolerância** e liberdade de expressão (Voltaire; John Stuart Mill).",
"> Ligação com Psicologia: o Código de Ética do psicólogo se baseia em princípios parecidos com os da bioética: sigilo, autonomia e não causar dano."
],
q:[
["Segundo o utilitarismo, uma ação é moralmente correta quando",["segue um dever universal, sem considerar as consequências.","produz a maior felicidade para o maior número de pessoas.","agrada ao governante.","é praticada por pessoas virtuosas.","segue a tradição religiosa."],1,"Bentham e Mill avaliam as ações pelas consequências: maximizar o bem-estar geral."],
["O princípio da bioética que exige respeitar a decisão livre e informada do paciente é o da",["beneficência","autonomia","justiça","não maleficência","utilidade"],1,"A autonomia garante que o paciente decida sobre o próprio tratamento, após ser informado."],
["Para Karl Popper, uma teoria é científica quando",["é aceita pela maioria das pessoas.","pode ser testada e potencialmente refutada (falseável).","é comprovada de forma definitiva e absoluta.","vem de uma autoridade religiosa.","não pode ser questionada."],1,"O critério de falseabilidade separa a ciência de afirmações que não podem ser testadas."],
["A diferença entre ética e moral é que",["são exatamente a mesma coisa.","a moral são normas de um grupo e a ética é a reflexão sobre essas normas.","a ética é imposta pela lei e a moral pela religião.","a moral é universal e a ética é individual.","a ética só existe na Grécia antiga."],1,"A moral são os costumes; a ética é o estudo filosófico que questiona e fundamenta esses costumes."]
]}
]});

DATA.push({id:"soc", a:"hum", nome:"Sociologia", lessons:[
{t:"Os clássicos: Durkheim, Weber e Marx", inc:"A", r:"Os três fundadores da Sociologia e seus conceitos mais cobrados.", v:"durkheim weber marx sociologia enem aula",
c:[
"## Émile Durkheim (1858–1917)",
"- **Fato social:** maneiras de agir, pensar e sentir que são **exteriores** (existem fora do indivíduo), **coercitivas** (se impõem a ele) e **gerais** (valem para o grupo). Exemplos: a língua, as leis, a moda.",
"- **Solidariedade mecânica:** em sociedades simples, as pessoas são unidas pelas semelhanças (mesmas crenças e tarefas).",
"- **Solidariedade orgânica:** em sociedades modernas, as pessoas são unidas pela **divisão do trabalho** e pela interdependência, como os órgãos de um corpo.",
"- **Anomia:** ausência ou enfraquecimento das normas sociais, o que gera desorientação.",
"- **“O Suicídio” (1897):** mostrou que até um ato que parece individual tem causas sociais. O suicídio varia conforme o grau de integração do indivíduo na sociedade.",
"## Max Weber (1864–1920)",
"- **Ação social:** ação com sentido, orientada pelo comportamento de outros. Tipos: racional com relação a **fins**, racional com relação a **valores**, **afetiva** (emoções) e **tradicional** (costumes).",
"- **Tipos de dominação (poder legítimo):** **legal-racional** (leis e burocracia), **tradicional** (costumes, como na monarquia) e **carismática** (qualidades extraordinárias do líder).",
"- **“A Ética Protestante e o Espírito do Capitalismo”:** a ética calvinista do trabalho e da poupança favoreceu o capitalismo.",
"- **Desencantamento do mundo:** a racionalização substitui as explicações mágicas e religiosas.",
"## Karl Marx (1818–1883)",
"- **Materialismo histórico:** a base econômica (forças produtivas e relações de produção) determina a organização da sociedade.",
"- **Luta de classes:** burguesia (dona dos meios de produção) x proletariado (vende a força de trabalho).",
"- **Mais-valia:** valor produzido pelo trabalhador e não pago a ele, apropriado pelo capitalista como lucro.",
"- **Alienação:** o trabalhador não se reconhece no produto do seu trabalho nem controla o processo.",

{t:"Cultura, identidade e diversidade", inc:"A", r:"Etnocentrismo, relativismo, racismo estrutural, democracia racial e indústria cultural.", v:"cultura etnocentrismo racismo estrutural sociologia enem aula",
c:[
"## Cultura",

"- **Etnocentrismo:** julgar outras culturas a partir dos valores da própria, considerada superior. Base de preconceitos e da justificativa do colonialismo.",
"- **Relativismo cultural:** compreender cada cultura em seu próprio contexto, sem hierarquizá-las.",
"- **Aculturação:** mudança cultural pelo contato entre povos, muitas vezes de forma imposta.",
"- **Identidade:** construída socialmente, múltipla e em transformação.",
"## Raça e racismo no Brasil",
"- **Raça** não é um conceito biológico válido para dividir humanos, mas é uma **construção social** que produz desigualdades reais.",
"- **Mito da democracia racial:** a ideia (associada a leituras de Gilberto Freyre, “Casa-Grande & Senzala”) de que no Brasil haveria convivência harmoniosa entre as raças. Foi criticada por Florestan Fernandes e outros, porque esconde o racismo.",
"- **Racismo estrutural (Silvio Almeida):** o racismo faz parte da estrutura da sociedade (economia, política, instituições) e não é só uma atitude individual.",
"- **Racismo institucional:** práticas de instituições que prejudicam grupos raciais.",
"- **Ações afirmativas:** políticas como as **cotas** (Lei 12.711/2012) para reduzir desigualdades históricas.",
"## Pensamento social brasileiro",
"- **Sérgio Buarque de Holanda**, “Raízes do Brasil”: o **homem cordial**, que age pela emoção e por relações pessoais, confundindo o público e o privado (patrimonialismo).",
"- **Darcy Ribeiro**, “O Povo Brasileiro”: formação a partir de matrizes indígena, africana e europeia.",
"- **Lélia Gonzalez:** feminismo negro e amefricanidade.",
"## Indústria cultural e consumo",
"Cultura de massa, padronização, publicidade e **consumismo**. A identidade passa a ser construída também pelo que se consome."
],
q:[
["Um viajante considera “atrasados” os costumes de um povo apenas porque são diferentes dos seus. Essa atitude é o",["relativismo cultural","etnocentrismo","multiculturalismo","sincretismo","cosmopolitismo"],1,"Julgar outra cultura pelos próprios padrões, considerando-os superiores, é etnocentrismo."],
["O conceito de racismo estrutural afirma que o racismo",["é apenas uma atitude individual isolada.","está presente na organização da sociedade e das instituições, produzindo desigualdades.","deixou de existir com a abolição.","é um fenômeno biológico.","atinge igualmente todos os grupos."],1,"O racismo estrutural está enraizado nas relações econômicas, políticas e institucionais."],
["A ideia de “democracia racial” no Brasil é criticada porque",["mostra a realidade com precisão.","esconde o racismo e as desigualdades raciais existentes.","foi criada pelo movimento negro.","defende as cotas raciais.","nega a mistura cultural."],1,"O mito da harmonia racial dificultava o reconhecimento e o combate ao racismo."],

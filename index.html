addLesson("geo", {o:4.5, t:"Transportes, redes e logística", inc:"M", r:"Por que o Brasil depende tanto de caminhões, e como as redes de transporte e comunicação organizam o espaço.", v:"transportes no brasil modal rodoviário ferrovias logística geografia enem aula",
c:[
"## A matriz de transportes brasileira",
"O Brasil transporta cerca de **60% das cargas por rodovias**, mesmo sendo um país enorme, onde ferrovias e hidrovias seriam mais baratas para longas distâncias.",
"- **Por quê?** Nos anos 1950, o governo JK apostou na indústria automobilística e na construção de estradas. As ferrovias antigas, feitas para levar café até os portos, foram abandonadas.",
"- **Consequências:** frete caro (o “custo Brasil”), mais acidentes, mais poluição e dependência do diesel. A **greve dos caminhoneiros de 2018** mostrou como o país fica vulnerável.",
"## Comparando os modais",
"- **Rodoviário:** flexível (porta a porta), bom para curtas distâncias; caro para longas.",
"- **Ferroviário:** grande capacidade e custo baixo em longas distâncias; ideal para minério e grãos.",
"- **Hidroviário:** o mais barato e menos poluente por tonelada; o Brasil tem muitos rios navegáveis pouco usados.",
"- **Aéreo:** rápido e caro; usado para pessoas e cargas de alto valor.",
"- **Dutoviário:** petróleo, gás e minério por tubulações.",
"## Corredores de exportação",
"A soja do Centro-Oeste está sendo cada vez mais escoada pelos portos do **Arco Norte** (como Itaqui, Santarém e Barcarena), usando rodovias como a **BR-163** e hidrovias da Amazônia, o que reduz custos, mas aumenta a pressão sobre a floresta.",
"## Redes e fluxos",
"- Rede urbana: hierarquia entre metrópoles e cidades menores, ligadas por fluxos de pessoas, mercadorias, capital e informação.",
"- A **internet** e as redes de fibra óptica aceleram os fluxos, mas o acesso é desigual (exclusão digital).",
"- **Logística:** organização do armazenamento e da circulação de mercadorias (centros de distribuição, entregas rápidas do comércio eletrônico).",
"> Milton Santos: o território brasileiro é marcado por **fixos** (portos, estradas, antenas) e **fluxos** (o que circula por eles)."
],
q:[
["O principal modal de transporte de cargas no Brasil é o",["ferroviário.","rodoviário.","hidroviário.","aéreo.","dutoviário."],1,"Cerca de 60% das cargas circulam por rodovias."],
["A escolha histórica pelo modal rodoviário no Brasil está ligada",["ao governo JK e à implantação da indústria automobilística.","à chegada da família real.","à Revolução Industrial inglesa.","ao período colonial.","à Constituição de 1988."],0,"O desenvolvimentismo dos anos 1950 priorizou carros, caminhões e estradas."],
["Para transportar grandes volumes de grãos por longas distâncias, o modal mais barato e menos poluente é o",["rodoviário.","aéreo.","hidroviário.","transporte por motocicletas.","transporte por helicópteros."],2,"Um comboio de barcaças leva a carga de centenas de caminhões."],
["A greve dos caminhoneiros de 2018 evidenciou",["a independência do Brasil em relação às rodovias.","a grande dependência do país do transporte rodoviário.","o excesso de ferrovias.","o baixo preço do diesel.","a eficiência das hidrovias."],1,"Faltou combustível, alimentos e remédios em várias cidades."],
["O “Arco Norte” refere-se",["aos portos do Norte e do Nordeste usados para escoar grãos do Centro-Oeste.","a uma montanha na Amazônia.","ao litoral gaúcho.","a um tratado internacional.","a uma rodovia no Sul."],0,"Esses portos encurtam o caminho da soja até a Europa e a Ásia."],
["Para Milton Santos, os “fixos” do território são",["as pessoas que migram.","as infraestruturas, como portos, estradas e antenas.","os fluxos de informação.","as nuvens e chuvas.","os impostos."],1,"Os fluxos (mercadorias, pessoas, dados) circulam pelos fixos."],
["A exclusão digital pode ser entendida como",["o acesso igual de todos à internet.","a desigualdade no acesso à internet e às tecnologias de informação.","a proibição da internet.","o excesso de computadores nas escolas.","uma doença causada por celulares."],1,"Renda, região e idade influenciam o acesso, o que ficou claro no ensino remoto da pandemia."],
["Uma desvantagem do modal rodoviário para longas distâncias é",["a baixa flexibilidade.","o alto custo do frete e a maior emissão de poluentes por tonelada.","a impossibilidade de entregas porta a porta.","a necessidade de rios.","a baixa velocidade em comparação às hidrovias."],1,"Por isso o frete no Brasil encarece os produtos (o “custo Brasil”)."]
]});
TIP("geo-10",
["Dependência do modal rodoviário.","Vantagens das ferrovias e hidrovias.","Escoamento da soja e impacto ambiental."],
["Compare custo, distância e tipo de carga.","Busque a explicação histórica (JK, indústria automobilística).","Relacione infraestrutura a impactos na Amazônia."],
["Hidrovia é a mais barata, mas não a mais rápida.","Rodovia é boa para curtas distâncias, não para longas."]);

addLesson("geo", {o:6.5, t:"Regionalização e desigualdades regionais", inc:"M", r:"As cinco regiões do IBGE, os três complexos regionais e por que o Brasil é tão desigual por dentro.", v:"regionalização do brasil regiões ibge complexos regionais geografia enem aula",
c:[
"## Por que regionalizar",
"Regionalizar é dividir o espaço em partes com características parecidas, para planejar e entender o território. Não existe uma divisão única: depende do critério.",
"## As cinco regiões do IBGE (1969/1988)",
"Norte, Nordeste, Centro-Oeste, Sudeste e Sul. Seguem os **limites dos estados**, o que facilita a coleta de dados e o planejamento. Em 1988, Tocantins passou a fazer parte do Norte.",
"## Os três complexos regionais (Pedro Geiger, 1967)",
"Baseados em critérios **econômicos e históricos**, e não nos limites dos estados:",
"- **Amazônia:** baixa densidade populacional, floresta, fronteira agrícola e mineral.",
"- **Nordeste:** herança colonial açucareira, concentração de terra, forte migração no passado. Tem sub-regiões: **Zona da Mata, Agreste, Sertão e Meio-Norte**.",
"- **Centro-Sul:** maior concentração de indústria, população e riqueza.",
"## As quatro regiões de Milton Santos",
"Divide o país conforme a presença do **meio técnico-científico-informacional**: Região Concentrada (Sudeste e Sul), Nordeste, Centro-Oeste e Amazônia.",
"## Desigualdades regionais",
"- Renda, escolaridade, saneamento e acesso à saúde variam muito entre as regiões.",
"- Causas históricas: concentração da industrialização no Sudeste, concentração de terras e investimentos públicos desiguais.",
"- Tentativas de reduzir: a **Sudene** (1959, idealizada por **Celso Furtado**), a **Zona Franca de Manaus** (1967) e a **Sudam**.",
"> Cuidado com o determinismo: a seca não explica sozinha a pobreza do Sertão. A **concentração de terra e de poder** (a chamada “indústria da seca”) pesa muito."
],
q:[
["A regionalização em cinco regiões do IBGE tem como característica",["respeitar os limites dos estados.","dividir estados ao meio.","basear-se apenas no relevo.","considerar só a vegetação.","ignorar as fronteiras políticas."],0,"Isso facilita a coleta de estatísticas e o planejamento."],
["A divisão do Brasil em três complexos regionais (Amazônia, Nordeste e Centro-Sul)",["segue rigorosamente os limites estaduais.","usa critérios econômicos e históricos, e alguns estados ficam divididos entre complexos.","foi criada pela ONU.","considera apenas o clima.","divide o país em cinco partes."],1,"O norte de Minas, por exemplo, fica no complexo do Nordeste."],
["As sub-regiões do Nordeste são",["Zona da Mata, Agreste, Sertão e Meio-Norte.","Pampa, Serra e Litoral.","Pantanal, Cerrado e Chaco.","Planalto, Planície e Depressão.","Amazônia, Cerrado e Pampa."],0,"Da Zona da Mata (úmida, litoral) ao Sertão (semiárido), com o Agreste como transição."],
["A “indústria da seca” é uma expressão que critica",["a produção industrial no Sertão.","o uso político da seca por elites locais para obter recursos públicos e manter seu poder.","as indústrias de irrigação.","o turismo no Nordeste.","as usinas eólicas."],1,"A seca vira justificativa para verbas que não resolvem o problema estrutural."],
["A Sudene, criada em 1959, tinha como objetivo",["promover o desenvolvimento do Nordeste e reduzir as desigualdades regionais.","industrializar apenas São Paulo.","explorar ouro na Amazônia.","construir Brasília.","privatizar empresas estatais."],0,"Foi idealizada pelo economista Celso Furtado."],
["A Zona Franca de Manaus foi criada para",["atrair indústrias à Amazônia com incentivos fiscais.","proteger a floresta proibindo qualquer atividade.","criar um porto no Sul.","exportar café.","transferir a capital."],0,"Isenções de impostos atraíram fábricas de eletrônicos e motocicletas."],
["A Região Concentrada, na regionalização de Milton Santos, corresponde",["ao Sudeste e ao Sul, com maior densidade de técnica, ciência e informação.","à Amazônia.","ao Sertão nordestino.","apenas ao Distrito Federal.","ao Pantanal."],0,"Lá se concentram indústrias, universidades, redes e serviços avançados."],
["Explicar a pobreza do Sertão apenas pela seca é um erro porque",["não existe seca no Sertão.","ignora fatores sociais como a concentração de terras e de poder.","a seca é igual em todo o mundo.","o Sertão é a região mais rica do Brasil.","a chuva no Sertão é abundante."],1,"O ENEM critica o determinismo geográfico: a natureza não explica tudo."]
]});
TIP("geo-11",
["Diferença entre as regionalizações (IBGE x complexos).","Sub-regiões do Nordeste.","Desigualdade regional e políticas públicas."],
["Veja o critério usado: limite de estado ou economia?","Desconfie de explicações só pela natureza (determinismo).","Associe Sudene ao Nordeste e Zona Franca à Amazônia."],
["Os complexos regionais cortam estados; as regiões do IBGE não.","Agreste é a transição entre a Zona da Mata e o Sertão."]);

addLesson("geo", {o:7.5, t:"Geologia, recursos minerais e riscos", inc:"M", r:"Placas tectônicas, tipos de rocha, mineração no Brasil e desastres como os de Mariana e Brumadinho.", v:"placas tectônicas tipos de rochas mineração brasil geografia enem aula",
c:[
"## A Terra por dentro",
"Crosta (fina), manto (rocha pastosa, o magma) e núcleo. A crosta é dividida em **placas tectônicas**, que se movem alguns centímetros por ano.",
"- **Limites convergentes:** placas se chocam, formando montanhas (Andes, Himalaia), vulcões e terremotos.",
"- **Limites divergentes:** placas se afastam (dorsal do Atlântico).",
"- **Limites transformantes:** placas deslizam lado a lado (falha de San Andreas).",
"> O Brasil fica no **meio da Placa Sul-Americana**, longe das bordas; por isso tem poucos terremotos fortes e nenhum vulcão ativo.",
"## Tipos de rocha",
"- **Magmáticas (ígneas):** do resfriamento do magma (granito, basalto). O basalto, ao se decompor, forma a **terra roxa**, muito fértil.",
"- **Sedimentares:** acúmulo de sedimentos em camadas (arenito, calcário). É onde se encontram **petróleo**, carvão e fósseis.",
"- **Metamórficas:** transformadas por calor e pressão (mármore, ardósia).",
"## Estrutura geológica do Brasil",
"- **Escudos cristalinos** (rochas antigas): ricos em **minerais metálicos** (ferro, manganês, ouro). Ex.: Quadrilátero Ferrífero (MG) e Serra dos Carajás (PA).",
"- **Bacias sedimentares:** petróleo e gás, como o **pré-sal** (camada no fundo do mar, abaixo de uma espessa camada de sal).",
"## Mineração e impactos",
"- O Brasil é um dos maiores exportadores de **minério de ferro** do mundo, principalmente para a China.",
"- **Desastres de Mariana (2015)** e **Brumadinho (2019)**: rompimento de barragens de rejeitos da mineração. Mariana contaminou o rio Doce até o mar; Brumadinho matou 272 pessoas.",
"- **Garimpo ilegal** na Amazônia: desmatamento e contaminação por **mercúrio**, afetando povos como os Yanomami e os Munduruku.",
"## Riscos",
"Deslizamentos em encostas ocupadas (como em Petrópolis, 2022) resultam da combinação de chuva forte, relevo íngreme, desmatamento e ocupação irregular por falta de moradia digna."
],
q:[
["O Brasil tem poucos terremotos fortes porque",["está no centro de uma placa tectônica, longe das bordas.","está sobre várias placas que se chocam.","não tem placas tectônicas.","está perto da Cordilheira dos Andes.","tem muitos vulcões ativos."],0,"Os abalos fortes ocorrem principalmente nos limites entre placas."],
["A Cordilheira dos Andes se formou pelo",["afastamento de placas.","choque (convergência) entre a Placa de Nazca e a Placa Sul-Americana.","acúmulo de sedimentos de rios.","impacto de meteoros.","derretimento de geleiras."],1,"Na convergência, uma placa mergulha sob a outra e o relevo se eleva."],
["O petróleo é encontrado principalmente em",["rochas magmáticas.","bacias sedimentares.","escudos cristalinos.","rochas metamórficas.","vulcões ativos."],1,"Ele se forma a partir de matéria orgânica acumulada em camadas de sedimentos."],
["A terra roxa, muito fértil, resulta da decomposição do",["basalto.","arenito.","mármore.","calcário.","granito rosa."],0,"É típica do Paraná e de São Paulo e favoreceu a expansão do café."],
["Os desastres de Mariana (2015) e Brumadinho (2019) foram causados",["por terremotos.","pelo rompimento de barragens de rejeitos da mineração.","por vulcões.","por tsunamis.","pela seca."],1,"Os rejeitos contaminaram rios e destruíram comunidades."],
["O garimpo ilegal na Amazônia é especialmente grave porque",["não causa desmatamento.","contamina rios e pessoas com mercúrio e invade terras indígenas.","gera empregos formais com carteira assinada.","é fiscalizado de perto pela ONU.","usa apenas energia solar."],1,"O mercúrio contamina os peixes e causa doenças graves nas populações ribeirinhas e indígenas."],
["O Quadrilátero Ferrífero (MG) e Carajás (PA) são ricos em minério de ferro porque estão em",["bacias sedimentares recentes.","escudos cristalinos, de rochas muito antigas.","planícies costeiras.","áreas vulcânicas ativas.","dunas."],1,"Os escudos cristalinos concentram minerais metálicos."],
["Os deslizamentos em encostas urbanas resultam da combinação de",["chuva forte, relevo íngreme, desmatamento e ocupação irregular.","clima seco e relevo plano.","terremotos frequentes.","excesso de vegetação.","ventos fortes do litoral."],0,"A falta de moradia digna empurra os mais pobres para áreas de risco."]
]});
TIP("geo-12",
["Placas tectônicas e por que o Brasil tem poucos terremotos.","Tipos de rocha e recursos (petróleo em sedimentares).","Impactos da mineração (Mariana, Brumadinho, garimpo)."],
["Associe cada recurso ao tipo de rocha ou estrutura geológica.","Veja se o desastre tem causa natural, humana ou as duas.","Relacione risco à desigualdade social (quem mora na área de risco)."],
["Brasil não tem vulcões ativos, mas tem tremores fracos.","Desastre “natural” quase sempre tem causa social também."]);

const VSUM = {"port-0": {"resumo": "O professor separa **compreensão** (encontrar a informação dentro do texto) de **interpretação** (tirar conclusões a partir do texto, indo além dele). Ele mostra que a gramática básica, como pontuação, termos da oração, conjunções e sentido das palavras, é a base para entender qualquer texto, e termina explicando **anáfora e catáfora**.", "pontos": [[0, "Começo da aula: compreensão x interpretação"], [125, "Compreender: a resposta está dentro do texto"], [283, "Interpretar: fazer deduções a partir do texto"], [438, "Por que a pontuação muda o sentido de uma frase"], [594, "Dica: letras de música ajudam a ampliar o vocabulário"], [907, "O ENEM cobra mais compreensão do que interpretação"], [1383, "Semântica: as relações de sentido"], [1694, "Anáfora e catáfora: palavras que retomam ou antecipam termos"]], "dica": "Na maioria das questões do ENEM, a resposta está no próprio texto. Volte a ele antes de marcar."}, "port-1": {"resumo": "Com duas questões reais do ENEM, o professor mostra que **gênero textual é o uso social do texto** (post, mensagem, propaganda, carta). Na primeira, uma campanha de trânsito apela para a culpa do motorista; na segunda, um post imita uma propaganda para dar transparência aos gastos públicos.", "pontos": [[0, "Apresentação da revisão"], [62, "O que é gênero textual: o texto no uso do dia a dia"], [124, "Questão 1: a campanha de trânsito do Detran"], [276, "Resolução: a peça fala com o condutor e apela para a culpa"], [370, "Questão 2: um post que usa a forma de uma propaganda"], [523, "Resolução: a função do post é a transparência"]], "dica": "Quando há texto e imagem juntos, use os dois. A imagem costuma confirmar a resposta."}, "port-2": {"resumo": "Aula completa sobre os **seis elementos da comunicação** e as **seis funções da linguagem**. Para cada função, o professor explica o foco (assunto, emissor, receptor, código, canal ou mensagem), as marcas no texto e onde ela aparece. Ele lembra que a primeira questão do ENEM 2018 cobrou metalinguagem.", "pontos": [[0, "Por que o ENEM cobra esse assunto há mais de dez anos"], [279, "Os seis elementos: emissor, receptor, mensagem, código, canal e contexto"], [559, "Função referencial: linguagem objetiva (notícias)"], [839, "Função emotiva: 1ª pessoa e subjetividade"], [1119, "Função conativa: convencer o receptor, com imperativo"], [1721, "Função metalinguística: o código explicando o código"], [2281, "Função fática: testar o canal (“alô”, “tá me ouvindo?”)"], [2563, "Função poética: foco na forma da mensagem"], [2844, "Exemplo real: a questão de metalinguagem do ENEM 2018"]], "dica": "Descubra em qual elemento está o foco do texto. É ele que define a função predominante."}, "port-3": {"resumo": "O professor explica que a **língua é um organismo vivo** e muda com o uso. Ele conta como o português nasceu do latim, mostra as diferenças entre o Brasil e Portugal e dentro do Brasil, e dá exemplos de variação histórica, regional e social. A ideia central é a **adequação** ao contexto.", "pontos": [[0, "A língua muda porque está viva"], [496, "Do latim ao português: como as línguas se formam"], [776, "O português chega ao Brasil e recebe novas palavras"], [1024, "Variação entre países e dentro do Brasil"], [1280, "Variação histórica: “vossa mercê” virou “você”"], [1561, "Variação regional: semáforo, sinaleiro, sinal, farol"], [1812, "Variação social e gírias de cada grupo"], [2605, "Adequação: a gíria que não serve para falar com o professor"]], "dica": "No ENEM, variação linguística é sempre questão de adequação, e não de certo ou errado."}, "port-4": {"resumo": "Em 9 minutos e com desenhos, a aula apresenta as **figuras de linguagem mais cobradas no ENEM**, divididas em quatro grupos: de pensamento (antítese, paradoxo, hipérbole, ironia, sinestesia), de palavra (comparação, metáfora, metonímia), de construção (elipse, polissíndeto, anáfora) e de som (onomatopeia).", "pontos": [[30, "Para que servem as figuras de linguagem"], [93, "Antítese e paradoxo"], [154, "Hipérbole e ironia"], [184, "Sinestesia: mistura de sentidos"], [246, "Comparação x metáfora"], [307, "Metonímia: “comi dois pratos”"], [337, "Elipse e polissíndeto"], [400, "Anáfora: repetição no início das frases"], [460, "Figuras de som: onomatopeia"]], "dica": "Metáfora é uma comparação sem o “como”. Se tiver o conectivo, é comparação."}, "port-5": {"resumo": "Aula rápida e direta: **coesão** é a estrutura do texto (conectivos, pronomes, preposições que ligam as partes) e **coerência** é a lógica das ideias. As duas caminham juntas e são essenciais tanto para interpretar quanto para escrever a redação.", "pontos": [[30, "Coesão e coerência sempre andam juntas"], [60, "Coesão: a parte gramatical e os conectivos"], [91, "Coerência: a sequência lógica das ideias"], [182, "Por que isso pesa na redação do ENEM"], [242, "Resumo: coesão é estrutura, coerência é ideia"]], "dica": "Coesão é a estrutura; coerência é a lógica. Um texto precisa das duas."}, "port-6": {"resumo": "O professor diferencia **intertextualidade** (um texto novo que faz referência, explícita ou implícita, a um texto que já existe, podendo concordar com ele ou contestá-lo) de **paráfrase** (recontar com as suas palavras mantendo a ideia do original, como num resumo). Ele usa a Canção do Exílio e releituras de quadros famosos como exemplos.", "pontos": [[43, "O que é intertextualidade"], [124, "Por que falta de leitura atrapalha a entender charges e tirinhas"], [205, "Dica: leia o mesmo assunto em fontes diferentes"], [245, "Intertextualidade pode reafirmar ou contestar o original"], [327, "O que é paráfrase: recontar mantendo a ideia"], [409, "Exemplo: a Canção do Exílio e um texto que conversa com ela"], [531, "Exemplo com pintura: o quadro original e a releitura"]], "dica": "Para perceber a intertextualidade, você precisa conhecer o texto original. Por isso vale ler e se informar."}, "port-7": {"resumo": "A aula explica o que é **divulgação científica**: textos que levam a ciência para o público leigo, diferentes do texto científico (feito para especialistas, cheio de termos técnicos). O professor mostra os recursos típicos, como **analogias**, comparações, linguagem acessível, 3ª pessoa e repetição didática.", "pontos": [[8, "A ciência está em toda parte no dia a dia"], [212, "Divulgação científica x texto científico"], [252, "O que é jargão (termo técnico de um grupo)"], [333, "Características: 3ª pessoa e ciência em primeiro plano"], [413, "Analogias: o átomo como uma maçã no centro de um estádio"], [454, "Por que a repetição ajuda a explicar"]], "dica": "Se o texto usa comparações do cotidiano para explicar algo científico, é divulgação científica."}, "lit-0": {"resumo": "Em 5 minutos, o vídeo resume o **Quinhentismo** (1500 a 1601): não era literatura artística, e sim textos de **informação** (cartas e crônicas de viajantes, com destaque para a Carta de Pero Vaz de Caminha) e de **catequese** (jesuítas como José de Anchieta). Barroco e Arcadismo estão nos tópicos desta lição.", "pontos": [[4, "O Quinhentismo não tinha intenção artística"], [44, "Literatura de informação: cartas sobre a terra e o povo"], [126, "A Carta de Caminha, “certidão de nascimento” do Brasil"], [170, "Os dois motores das navegações: riqueza e fé"], [210, "Literatura de catequese e os jesuítas"], [251, "José de Anchieta: autos, poemas e gramática tupi"]], "dica": "Carta de Caminha = informação. Anchieta = catequese."}, "lit-1": {"resumo": "A professora explica a **1ª geração do Romantismo**: indianista e nacionalista, com a natureza brasileira exaltada e um **ufanismo** exagerado, ligada à busca de identidade após a Independência. Gonçalves Dias é o destaque (Canção do Exílio), e o indígena aparece idealizado, como um herói quase medieval. As outras gerações estão nos tópicos.", "pontos": [[0, "Romantismo não é só sobre amor"], [41, "Gonçalves de Magalhães e Gonçalves Dias"], [82, "Canção do Exílio e o ufanismo"], [124, "A relação com a Independência de 1822"], [165, "O indígena idealizado como herói"], [211, "O amor exagerado e a natureza nos poemas"]], "dica": "No Romantismo, o indígena é idealizado, e não retratado como realmente era."}, "lit-2": {"resumo": "Resumo desenhado do **Realismo e do Naturalismo**: o contexto do fim do século XIX (industrialização, Lei Áurea, República), a busca por objetividade e a crítica à hipocrisia burguesa. O Naturalismo acrescenta o **determinismo** (o ser humano como fruto do meio) e a animalização. Machado de Assis e Aluísio Azevedo são os destaques. Parnasianismo e Simbolismo estão nos tópicos.", "pontos": [[49, "Contexto histórico do fim do século XIX"], [93, "Objetividade e verossimilhança no lugar do Romantismo"], [134, "Naturalismo: instintos, animalização e determinismo"], [177, "Autores: Machado de Assis e Aluísio Azevedo (O Cortiço)"], [219, "Por que essas obras ajudam a entender o Brasil"]], "dica": "Realismo critica a sociedade; Naturalismo explica as pessoas pelo meio e pela biologia."}, "lit-3": {"resumo": "O professor apresenta o **Pré-Modernismo** como uma transição entre o Simbolismo e a Semana de 22, marcada pela denúncia da realidade brasileira, linguagem mais simples e personagens marginalizados (sertanejo, caipira, suburbano). Autores: Euclides da Cunha (Os Sertões), Monteiro Lobato (Urupês e o Jeca Tatu), Lima Barreto (Policarpo Quaresma) e Augusto dos Anjos.", "pontos": [[40, "O que foi o Pré-Modernismo: uma transição"], [120, "Até a Semana de Arte Moderna de 1922"], [282, "Características: denúncia social e linguagem coloquial"], [365, "Euclides da Cunha e Os Sertões (Canudos)"], [447, "Monteiro Lobato e Urupês"], [527, "Lima Barreto e Triste Fim de Policarpo Quaresma"], [687, "Resumo final com todos os autores"]], "dica": "Pré-Modernismo = denúncia do Brasil real, antes da Semana de 22."}, "lit-4": {"resumo": "Aula desenhada sobre a **Semana de Arte Moderna (fevereiro de 1922)**: o contexto (centenário da Independência, vanguardas europeias), a ruptura com o Parnasianismo e a linguagem coloquial. Mostra as vaias do público, a leitura de “Os Sapos” e o **Grupo dos Cinco**: Anita Malfatti, Mário e Oswald de Andrade, Tarsila do Amaral e Menotti del Picchia.", "pontos": [[48, "Contexto: centenário da Independência e vanguardas"], [88, "Quando e onde: 11 a 18 de fevereiro de 1922, em São Paulo"], [129, "A ruptura com o Parnasianismo"], [169, "As vaias e o poema “Os Sapos”"], [211, "O Grupo dos Cinco e suas obras"]], "dica": "A Semana de 22 rompeu com o Parnasianismo e trouxe a linguagem do dia a dia para a arte."}, "lit-5": {"resumo": "O professor explica a **2ª geração modernista (Geração de 30) na prosa**: o contexto da crise de 1929 e da Era Vargas, a consolidação do Modernismo e o **romance regionalista** que denuncia a seca e a miséria. Destaques: Graciliano Ramos (Vidas Secas, São Bernardo), Rachel de Queiroz (O Quinze), Jorge Amado, José Lins do Rego e Erico Verissimo. A poesia e a Geração de 45 estão nos tópicos.", "pontos": [[41, "2ª geração: consolidação do Modernismo"], [124, "Obras que marcam a fase: A Bagaceira e Alguma Poesia"], [147, "Contexto: crise de 1929 e Revolução de 30"], [328, "Linguagem do povo, quebrando a gramática tradicional"], [410, "Os principais autores da prosa de 30"], [532, "Música para memorizar: Graciliano e Vidas Secas"], [619, "Rachel de Queiroz e Erico Verissimo"]], "dica": "Romance de 30 = regionalismo de denúncia: seca, fome e desigualdade."}, "lit-6": {"resumo": "A professora apresenta **Conceição Evaristo**: sua origem humilde em Belo Horizonte, a trajetória até a vida acadêmica e uma obra que valoriza a cultura negra e a autoria feminina, denunciando racismo e machismo. Ela explica o conceito de **escrevivência** (escrever a partir da vivência, ligando o individual ao coletivo) e cita as principais obras.", "pontos": [[8, "Quem é Conceição Evaristo"], [48, "Infância pobre e o esforço para estudar"], [131, "Valorização da cultura negra e da autoria feminina"], [211, "Denúncia do racismo e do machismo"], [377, "Personagens negras longe dos estereótipos"], [622, "O que é escrevivência"], [704, "Obras: Ponciá Vicêncio, Becos da Memória, Olhos d’Água"]], "dica": "Escrevivência: a experiência pessoal que representa uma experiência coletiva."}, "artes-0": {"resumo": "Aula longa sobre as **vanguardas europeias**, o estopim da arte moderna. O professor explica que elas deixaram de imitar o real para interpretá-lo, e passa por cada uma: **Futurismo** (velocidade e máquinas), **Expressionismo** (distorção e angústia, O Grito), **Cubismo** (fragmentação), **Dadaísmo** (deboche e ilógico) e **Surrealismo** (sonho e inconsciente).", "pontos": [[121, "Por que as vanguardas caem tanto no ENEM"], [285, "Vanguarda: interpretar a realidade em vez de imitá-la"], [449, "Por que foram tão polêmicas na época"], [611, "Futurismo: tecnologia e velocidade"], [904, "Expressionismo: distorção e angústia"], [1068, "Cubismo: a realidade fragmentada"], [1232, "Dadaísmo: arte ilógica e debochada"], [1395, "Surrealismo: sonho, inconsciente e o “onírico”"]], "dica": "Expressionismo distorce, Cubismo fragmenta, Surrealismo sonha e Dadaísmo debocha."}, "artes-1": {"resumo": "O vídeo conta a história da **arte moderna no Brasil**: o contexto de mudanças no mundo, os precursores Lasar Segall e Anita Malfatti, o escândalo da Semana de 22 e os grandes nomes, como **Tarsila do Amaral** (Abaporu e a Antropofagia), Victor Brecheret, Vicente do Rego Monteiro e **Candido Portinari** (Café, Os Retirantes).", "pontos": [[40, "O que é arte moderna"], [124, "Os precursores: Lasar Segall e Anita Malfatti"], [206, "A Semana de 22 no Theatro Municipal"], [248, "A reação do público: vaias e escândalo"], [332, "Anita Malfatti e a crítica de Monteiro Lobato"], [414, "Tarsila do Amaral e o Abaporu"], [538, "Portinari: Café e Os Retirantes"]], "dica": "Abaporu, de Tarsila, inspirou o Manifesto Antropófago de Oswald de Andrade."}, "edf-0": {"resumo": "A professora mostra que a Educação Física no ENEM é teórica: a base é a **cultura corporal de movimento** (o jeito de se mover muda de cultura para cultura). Ela passa pelos conteúdos: **jogos** (regras flexíveis e lúdicas) x **esportes** (regras oficiais), danças como expressão cultural, lutas e artes marciais, e as capacidades **aeróbia** (longa duração) e **anaeróbia** (curta e intensa).", "pontos": [[5, "Educação Física também é teoria"], [46, "O que é cultura corporal de movimento"], [129, "O ECA e o direito ao esporte"], [254, "Jogos x esportes: regras flexíveis e o lúdico"], [336, "Esportes olímpicos, paralímpicos e adaptados"], [457, "Dança como linguagem e expressão cultural (boi-bumbá)"], [539, "Lutas, artes marciais e modalidades de combate"], [580, "Capacidade aeróbia x anaeróbia"]], "dica": "Jogo tem regras combinadas entre os participantes; esporte tem regras oficiais."}, "lem-0": {"resumo": "O professor ensina três técnicas de leitura em inglês: **assumption** (supor o tema pela imagem, título e números), **skimming** (leitura rápida do “esqueleto” do texto, usando cognatos e palavras conhecidas) e **scanning** (buscar detalhes como autor, data e números). Depois aplica tudo numa questão sobre gravidez na adolescência.", "pontos": [[9, "As três técnicas de leitura"], [49, "Skimming: leitura rápida e palavras cognatas"], [132, "Scanning: autor, data, título e números"], [219, "Aplicando numa questão real (Unicamp 2017)"], [305, "A imagem e a palavra “high school” dão a pista"], [346, "Os números do texto e a eliminação das alternativas"]], "dica": "Antes de traduzir, olhe a imagem, o título e os números: eles já dizem muito sobre o texto."}, "lem-1": {"resumo": "Em 4 minutos, a professora apresenta **10 falsos amigos (heterossemânticos)** do espanhol que podem confundir no ENEM: embarazada (grávida), rato (momento), apellido (sobrenome), escoba (vassoura), borracho (bêbado), vaso (copo), exquisito (gostoso), oficina (escritório), acento (sotaque) e zurdo (canhoto).", "pontos": [[0, "O que são heterossemânticos"], [40, "Embarazada (grávida) e rato (momento)"], [83, "Apellido (sobrenome) e escoba (vassoura)"], [124, "Borracho (bêbado), vaso (copo) e exquisito (gostoso)"], [165, "Oficina (escritório) e acento (sotaque)"], [205, "Zurdo (canhoto)"]], "dica": "Parece português demais? Desconfie. É aí que o falso amigo engana."}, "lem-2": {"resumo": "A aula define as **Tecnologias da Informação e Comunicação (TICs)** como tudo o que foi criado para comunicar e informar, da escrita à internet, e discute o uso na educação, a inclusão e a **exclusão digital**. Depois resolve uma questão do ENEM 2023 sobre perfis falsos e robôs que espalham desinformação.", "pontos": [[3, "O que são as TICs"], [44, "Tecnologia não é só o que é moderno"], [126, "TICs na educação"], [166, "Inclusão x exclusão digital"], [248, "Impacto social: o exemplo da Primavera Árabe"], [288, "Questão do ENEM 2023: perfis falsos e robôs"], [613, "Resolução: identificar padrões de desinformação"]], "dica": "Leia o enunciado primeiro: ele diz exatamente qual relação o texto quer que você perceba."}, "hbr-0": {"resumo": "O professor explica o **Brasil pré-colonial** (extração do pau-brasil por escambo com os indígenas) e a **economia do açúcar**: produto tropical, monocultura de exportação, latifúndio, investimento holandês e mão de obra escravizada. Depois detalha as **capitanias hereditárias** (carta de doação e foral), as sesmarias e as câmaras municipais dos “homens bons”.", "pontos": [[0, "Período pré-colonial e o pau-brasil"], [41, "Escambo, feitorias e piratas franceses"], [122, "As características da economia açucareira"], [163, "Latifúndio e investimento holandês"], [244, "Capitanias hereditárias: carta de doação e foral"], [367, "Sesmarias e por que só duas capitanias prosperaram"], [488, "Câmaras municipais e os “homens bons”"]], "dica": "Açúcar colonial = latifúndio + monocultura + exportação + trabalho escravizado."}, "hbr-1": {"resumo": "Um passeio pelo **Brasil Império (1822–1889)** em três fases: o **Primeiro Reinado** (Constituição de 1824, abdicação de D. Pedro I), o **Período Regencial** (quatro regências, revoltas e o Golpe da Maioridade) e o **Segundo Reinado** (parlamentarismo às avessas, café, leis abolicionistas, Guerra do Paraguai e as questões que levaram à República).", "pontos": [[43, "As três fases do Império"], [43, "Primeiro Reinado e a Constituinte"], [136, "Abdicação de D. Pedro I"], [179, "Período Regencial e suas quatro fases"], [264, "Golpe da Maioridade (1840)"], [306, "Parlamentarismo às avessas e o café"], [390, "Leis abolicionistas e Guerra do Paraguai"], [430, "Questão militar, religiosa e latifundiária"]], "dica": "O fim do Império veio quando ele perdeu o apoio do Exército, da Igreja e dos fazendeiros."}, "hbr-2": {"resumo": "O vídeo explica a **República Velha (1889–1930)** em duas fases: a **República da Espada** (os militares Deodoro e Floriano, a Revolta da Armada) e a **República Oligárquica** (café com leite, política dos governadores, **coronelismo** e voto de cabresto). Mostra as revoltas (Canudos, Chibata, Contestado), o tenentismo e a Revolução de 1930.", "pontos": [[43, "República da Espada: os primeiros presidentes militares"], [125, "Floriano Peixoto, o Marechal de Ferro"], [169, "República Oligárquica: o governo dos fazendeiros"], [253, "Política dos governadores, coronelismo e voto de cabresto"], [337, "As revoltas do período"], [383, "Tenentismo e a crise do café com leite"], [468, "A Revolução de 1930"]], "dica": "Coronelismo + voto de cabresto = controle das eleições pelos fazendeiros."}, "hbr-3": {"resumo": "Aula desenhada sobre a **Era Vargas** em três fases: **Governo Provisório** (1930–34: centralização, Ministério do Trabalho, voto secreto e feminino, Revolução Constitucionalista de 1932), **Governo Constitucional** (1934–37: integralistas x ANL, Intentona Comunista) e **Estado Novo** (1937–45: golpe com o Plano Cohen, ditadura, CLT e o “pai dos pobres”).", "pontos": [[48, "As três fases da Era Vargas"], [90, "Governo Provisório: centralização e novos direitos"], [133, "Revolução Constitucionalista de 1932"], [215, "Integralistas x Aliança Nacional Libertadora"], [258, "O Plano Cohen e o golpe de 1937"], [298, "Estado Novo: ditadura personalista"], [381, "CLT e o “pai dos pobres”"], [421, "A 2ª Guerra e a queda de Vargas em 1945"]], "dica": "Vargas teve dois lados: direitos trabalhistas e ditadura com censura."}, "hbr-4": {"resumo": "Aula completa sobre a **ditadura civil-militar (1964–1985)**: o golpe contra João Goulart, o endurecimento pelos Atos Institucionais até o **AI-5**, a repressão (prisões, tortura, desaparecimentos), as guerrilhas, o “milagre econômico” pago com dívida externa, a oposição civil e a abertura até as **Diretas Já**.", "pontos": [[0, "Por que a ditadura ainda é tão discutida"], [248, "O golpe de 1964 contra João Goulart"], [530, "A escalada dos Atos Institucionais"], [774, "O AI-5 e os anos de chumbo"], [1057, "Repressão, tortura e guerrilhas"], [1301, "Milagre econômico e dívida externa"], [1585, "Oposição civil e direitos humanos"], [1826, "Abertura e Diretas Já"]], "dica": "AI-5 (1968) marca o endurecimento; a Lei da Anistia (1979) marca a abertura."}, "hbr-5": {"resumo": "Aula longa sobre a **Nova República**: o governo Sarney e a **hiperinflação** (planos Cruzado e a moratória), a Constituição de 1988, a eleição de Collor (confisco da poupança e impeachment), Itamar e o plebiscito de 1993, o **Plano Real** e o neoliberalismo de FHC (privatizações, reeleição e criação do ENEM), e as políticas de acesso à universidade.", "pontos": [[0, "Apresentação: o último tema de História do Brasil"], [369, "Governo Sarney e a hiperinflação"], [734, "A moratória da dívida externa"], [1138, "A eleição de 1989 e o neoliberalismo"], [1506, "Plano Collor e o confisco da poupança"], [1911, "Itamar Franco e o plebiscito de 1993"], [2278, "FHC, o Plano Real e as privatizações"], [2685, "A criação do ENEM"], [3056, "Acesso à universidade e ampliação de vagas"]], "dica": "Plano Real (1994) controlou a hiperinflação; a Constituição de 1988 ampliou os direitos."}, "hge-0": {"resumo": "O vídeo resume a **Grécia Antiga**, focando nos períodos arcaico e clássico (os mais cobrados): as **pólis** independentes (Atenas e Esparta), a **democracia ateniense** na Ágora e quem ficava de fora (mulheres, estrangeiros e escravizados), a economia, a religião politeísta, o teatro e os Jogos Olímpicos. Roma e as sociedades hidráulicas estão nos tópicos.", "pontos": [[0, "O legado grego para o Ocidente"], [40, "Onde ficava a Grécia: pólis independentes"], [82, "Os quatro períodos da história grega"], [125, "A democracia em Atenas"], [166, "Quem não era cidadão: mulheres, metecos e escravizados"], [206, "Economia: agricultura e comércio no Mediterrâneo"], [247, "Religião, oráculo de Delfos e teatro"], [370, "Os Jogos Olímpicos"]], "dica": "Democracia ateniense era direta, mas só para homens livres nascidos em Atenas."}, "hge-1": {"resumo": "Resumo completo da **Idade Média**: a queda de Roma (476) e a formação dos reinos bárbaros, o surgimento do **feudalismo** (castelos, vassalos, servos), a **sociedade estamental** sem mobilidade, o poder da **Igreja**, o renascimento do comércio e o surgimento da **burguesia**, e a crise do fim do período (Guerra dos Cem Anos, peste e revoltas camponesas).", "pontos": [[0, "Apresentação do resumo"], [201, "Queda do Império Romano do Ocidente (476)"], [402, "Invasões e a origem dos castelos e dos feudos"], [645, "Sociedade estamental: ninguém muda de classe"], [700, "A Igreja, a instituição mais poderosa"], [847, "Renascimento comercial e o surgimento da burguesia"], [1095, "Guerra dos Cem Anos e a crise do feudalismo"], [1299, "Revoltas camponesas e o fortalecimento dos reis"]], "dica": "Feudalismo = terra, suserania e vassalagem, servos presos à terra e Igreja no centro."}, "hge-2": {"resumo": "A professora explica o **Renascimento** em quatro partes: o que foi, os antecedentes (prensa de Gutenberg, burguesia enriquecida), as **características** (antropocentrismo, retomada da cultura greco-romana, racionalismo, humanismo, individualismo) e os grandes nomes, como Leonardo da Vinci, Michelangelo, Rafael e as descobertas de Copérnico.", "pontos": [[0, "O plano da aula"], [287, "A prensa e a leitura individual da Bíblia"], [572, "O dinheiro e a ascensão da burguesia"], [864, "A volta à cultura grega e romana"], [1196, "Humanismo e individualismo: as obras passam a ser assinadas"], [1483, "Copérnico e o heliocentrismo"], [1770, "Leonardo da Vinci e suas invenções"]], "dica": "Renascimento = o ser humano no centro (antropocentrismo) e a razão valorizada."}, "hge-3": {"resumo": "A **Revolução Francesa** em cinco minutos: a crise do Antigo Regime (rei absoluto, privilégios, fome), a Assembleia Constituinte, a **Queda da Bastilha** (14/7/1789), a **Declaração dos Direitos do Homem e do Cidadão**, a monarquia constitucional, a República e a execução do rei, girondinos x jacobinos, o **Terror** de Robespierre, o Diretório e o golpe de Napoleão (1799). A Revolução Industrial e a Russa estão nos tópicos.", "pontos": [[5, "O que a França vivia no Antigo Regime"], [51, "Crise, fome e os Estados Gerais"], [99, "Queda da Bastilha e a Declaração dos Direitos"], [141, "Constituição de 1791 e monarquia constitucional"], [187, "República e a execução do rei"], [230, "Jacobinos, voto universal e o Terror"], [274, "Diretório e a chegada de Napoleão"]], "dica": "Liberdade, Igualdade, Fraternidade: fim dos privilégios do clero e da nobreza."}, "hge-4": {"resumo": "Aula desenhada sobre a **Primeira Guerra Mundial**: as tensões (concorrência industrial, corrida armamentista, a Paz Armada, nacionalismos e imperialismo), as alianças (Tríplice Entente x Tríplice Aliança), o estopim em Sarajevo (1914), a guerra de trincheiras, a entrada dos EUA e o **Tratado de Versalhes**, que humilhou a Alemanha. Os temas da Segunda Guerra e da Guerra Fria estão nos tópicos.", "pontos": [[8, "As causas herdadas do século XIX"], [51, "Paz Armada e revanchismo francês"], [93, "Nacionalismo e as alianças militares"], [134, "O estopim: assassinato de Francisco Ferdinando"], [175, "Guerra de movimento e guerra de trincheiras"], [217, "Saída da Rússia e entrada dos EUA"], [240, "Tratado de Versalhes e a Liga das Nações"]], "dica": "O Tratado de Versalhes humilhou a Alemanha e ajudou a preparar a Segunda Guerra."}, "geo-0": {"resumo": "O professor ensina a calcular **fuso horário** passo a passo: a Terra gira 360° em 24 horas, então **15° = 1 hora** (e 1° = 4 minutos). A leste de Greenwich o horário adianta; a oeste, atrasa. Se a questão não der a posição do Brasil, use 45° oeste (horário de Brasília). Escalas e projeções estão nos tópicos.", "pontos": [[0, "A Terra como uma esfera de 360°"], [40, "Rotação: 360° em 24 h = 15° por hora"], [122, "Tabela: 1 fuso = 15° = 1 hora"], [203, "Horas fracionadas: 1° = 4 minutos"], [246, "Greenwich: 12 fusos a leste e 12 a oeste"], [415, "Por que o leste é adiantado"], [497, "Brasil a 45° oeste: o horário de Brasília"], [623, "Exemplo resolvido: somando horas para o leste"]], "dica": "Para leste, some horas; para oeste, subtraia. E cuidado com a alternativa que só trocou o sinal."}, "geo-1": {"resumo": "Conversa longa e descontraída sobre os **domínios morfoclimáticos**: o que o termo significa (clima + relevo + vegetação), e cada domínio com seu clima, solo e vegetação — Amazônico (equatorial), Cerrado e os climas tropicais (duas estações), **Caatinga** (semiárido, único bioma exclusivo do Brasil), Mata Atlântica (o mais destruído) e o solo de **terra roxa** do Sul.", "pontos": [[0, "O que é domínio morfoclimático"], [364, "Amazônia: clima equatorial e muita chuva"], [730, "Clima tropical: verão chuvoso e inverno seco"], [1098, "Caatinga: a vegetação que parece morta na seca"], [1465, "Solo de massapê e terra roxa"], [1828, "Mata Atlântica: o bioma mais destruído"], [2193, "Terra roxa: por que tem esse nome"]], "dica": "Caatinga é o único domínio exclusivamente brasileiro."}, "geo-2": {"resumo": "O vídeo explica como a **urbanização brasileira** foi tardia e desordenada: cidades no litoral, a mineração, a industrialização após 1930, o **êxodo rural** a partir de 1950, Brasília e a Zona Franca de Manaus. Mostra os problemas: **conurbação**, favelização (mais de 16 milhões de pessoas em favelas), falta de saneamento e ilhas de calor.", "pontos": [[0, "O que é urbanização"], [43, "Mineração e industrialização após 1930"], [85, "Êxodo rural e as políticas de Vargas e JK"], [125, "Conurbação e crescimento sem planejamento"], [168, "O que é favelização e sua origem histórica"], [213, "Dados do censo sobre as favelas"], [261, "Ilhas de calor e os desafios das cidades"]], "dica": "Urbanização rápida e sem planejamento gera segregação, favelas e enchentes."}, "geo-3": {"resumo": "O professor divide a **questão agrária e agrícola** em cinco pontos: a diferença entre agrícola (produção) e agrário (conflitos e divisão de terras), a importância do agro na economia (commodities), a **concentração de terras** desde as capitanias e a Lei de Terras, a **Revolução Verde** (tecnologia, monocultura e agrotóxicos) e o **êxodo rural**.", "pontos": [[0, "Os cinco pontos da aula"], [81, "Agrícola x agrário"], [162, "O Brasil como grande produtor: as commodities"], [242, "Concentração fundiária e a Lei de Terras"], [363, "Revolução Verde: prometeu acabar com a fome?"], [444, "Monocultura e agrotóxicos"], [610, "Êxodo rural: fatores de atração e repulsão"]], "dica": "A Revolução Verde aumentou a produção, mas não acabou com a fome nem com a concentração de terras."}, "geo-4": {"resumo": "Aula direta sobre os modelos de produção: **taylorismo** (tarefas divididas e repetitivas, trabalhador alienado, como em *Tempos Modernos*, de Chaplin), **fordismo** (linha de montagem, produção em massa e a crise de superprodução de 1929) e **toyotismo** (just in time, produção flexível, qualidade e terceirização). Energia e globalização estão nos tópicos.", "pontos": [[0, "Por que os modelos de produção caem tanto"], [40, "Taylorismo: tarefas repetitivas e alienação"], [121, "Tempos Modernos, de Chaplin"], [162, "Fordismo: a linha de montagem"], [242, "Superprodução e a crise de 1929"], [243, "Toyotismo: just in time"], [323, "Produção flexível e terceirização"]], "dica": "Estoque grande e produção em massa = fordismo. Produzir sob demanda = toyotismo."}, "geo-5": {"resumo": "O vídeo define **impactos ambientais** (alterações causadas pela ação humana, que podem ser locais, regionais ou globais) e dá exemplos urbanos: poluição do ar, **ilhas de calor**, **inversão térmica**, poluição da água e lixo. Depois fala dos órgãos de proteção (CONAMA, IBAMA), do **Acordo de Paris** (COP-21) e das expectativas para a **COP-30 em Belém**.", "pontos": [[0, "Por que impactos ambientais caem tanto"], [42, "Impactos podem ser positivos ou negativos"], [85, "Impactos urbanos: ilha de calor e inversão térmica"], [174, "Causas: combustíveis fósseis, agropecuária, desmatamento"], [215, "CONAMA, IBAMA e as medidas de proteção"], [261, "As COPs e o Acordo de Paris"], [347, "A COP-30 em Belém e o financiamento climático"], [429, "Petróleo na Foz do Amazonas: o debate"]], "dica": "Ilha de calor é mais comum no centro das cidades; inversão térmica, no inverno."}, "geo-6": {"resumo": "O professor explica a **transição demográfica** do Brasil em fases: no Brasil rural (até 1920), natalidade e mortalidade altas; com a industrialização e o **êxodo rural**, a mortalidade cai (antibióticos, hospitais) e a população explode; hoje, natalidade e mortalidade baixas, com crescimento pequeno. Mostra por que as famílias têm menos filhos nas cidades: custo de vida, mulher no mercado de trabalho e métodos contraceptivos.", "pontos": [[0, "O que é transição demográfica"], [80, "Fase 1: Brasil rural, natalidade e mortalidade altas"], [160, "Fase 2: Vargas, industrialização e êxodo rural"], [242, "A mortalidade cai e a população cresce muito"], [325, "Antibióticos e acesso à saúde"], [489, "Fase atual: natalidade e mortalidade baixas"], [570, "Por que as famílias urbanas têm menos filhos"], [652, "Métodos contraceptivos e queda do crescimento"]], "dica": "Menos nascimentos + vidas mais longas = população envelhecendo."}, "geo-7": {"resumo": "O vídeo apresenta o **relevo brasileiro**: baixas e médias altitudes, com **planaltos e depressões** em cerca de 95% do território. Explica a classificação de **Jurandyr Ross** (planaltos, planícies e depressões), os tipos de cada forma e os destaques: Pico da Neblina, Pantanal (maior planície inundável do mundo) e a Depressão Sertaneja. Solos e hidrografia estão nos tópicos.", "pontos": [[0, "Relevo brasileiro: baixas e médias altitudes"], [44, "O que forma o relevo: agentes internos e externos"], [84, "A classificação de Jurandyr Ross"], [84, "Planaltos: sedimentares, cristalinos e basálticos"], [124, "Planícies: costeira, fluvial e lacustre"], [166, "Depressões absolutas e relativas"], [256, "Pico da Neblina e Pico da Bandeira"], [302, "Pantanal, a maior planície inundável do mundo"], [383, "Depressão Sertaneja e Caatinga"]], "dica": "Planalto: a erosão predomina. Planície: a sedimentação predomina."}, "geo-8": {"resumo": "O vídeo explica o que é **geopolítica** e as ordens mundiais: a **bipolar** da Guerra Fria (EUA x URSS) e a atual, chamada de **unimultipolar** (uma superpotência militar e vários polos econômicos). Detalha a **ONU**, o Conselho de Segurança com os 5 membros permanentes e o poder de veto, e o G4 (Brasil, Alemanha, Índia e Japão), que quer vagas permanentes.", "pontos": [[49, "O que é geopolítica"], [134, "Ordem mundial e as grandes potências"], [217, "A velha ordem bipolar da Guerra Fria"], [338, "A nova ordem: unimultipolar"], [422, "A ONU e seus órgãos"], [504, "Conselho de Segurança e o poder de veto"], [625, "O G4 e a disputa por vagas permanentes"]], "dica": "Hoje o mundo é multipolar na economia e unipolar no poder militar (EUA)."}, "filo-0": {"resumo": "Resumo dos três grandes gregos: **Sócrates** (o ser humano é alma/razão, a virtude vem do conhecimento e o vício da ignorância, e a **maiêutica** faz “parir” as ideias), **Platão** (mundo sensível x inteligível, a razão como caminho da verdade e o governo do filósofo) e **Aristóteles** (conhecimento começa pelos sentidos, lógica, ser humano como **animal político** e a virtude como **justo meio**).", "pontos": [[0, "Apresentação: Sócrates, Platão e Aristóteles"], [40, "Sócrates: o ser humano é alma e razão"], [80, "Virtude como conhecimento, vício como ignorância"], [120, "A maiêutica: o parto das ideias"], [160, "Platão: os dois mundos"], [243, "Platão e as almas de bronze, prata e ouro"], [284, "Aristóteles: o conhecimento começa pelos sentidos"], [366, "Animal político e governo constitucional"], [406, "Ética do justo meio"]], "dica": "Sócrates pergunta; Platão separa os dois mundos; Aristóteles observa o mundo real."}, "filo-1": {"resumo": "A aula mostra que a Idade Média não foi só “trevas” e divide a filosofia medieval em dois períodos: a **Patrística** (Santo Agostinho, influenciado por Platão, com a **teoria da iluminação** e a Cidade de Deus x Cidade dos Homens) e a **Escolástica** (São Tomás de Aquino, influenciado por Aristóteles, época em que surgem as universidades).", "pontos": [[0, "Patrística e Escolástica"], [82, "Como o cristianismo se aproximou da filosofia grega"], [245, "Os “padres da Igreja” e a Patrística"], [327, "Santo Agostinho e o platonismo"], [449, "Escolástica, Aristóteles e as primeiras universidades"], [529, "Agostinho: a teoria da iluminação"], [694, "Cidade de Deus x Cidade dos Homens"]], "dica": "Agostinho → Platão (Patrística). Tomás de Aquino → Aristóteles (Escolástica)."}, "filo-2": {"resumo": "Em 4 minutos: o **racionalismo** diz que o conhecimento vem da razão (ideias inatas, matemática; Descartes, Espinosa, Leibniz) e o **empirismo** diz que ele vem da experiência dos sentidos (a mente como **tábula rasa** de Locke; Bacon, Hume). **Kant** concilia os dois: o conhecimento começa nos sentidos, mas termina na razão.", "pontos": [[0, "Duas formas de explicar o conhecimento"], [42, "Racionalismo e as ideias inatas"], [80, "Empirismo: tudo vem dos sentidos"], [82, "Locke e a tábula rasa"], [124, "Ideias de sensação e de reflexão"], [165, "A árvore que cai na floresta: um exemplo"], [207, "Kant concilia razão e experiência"]], "dica": "Razão = racionalismo. Experiência = empirismo. As duas juntas = Kant."}, "filo-3": {"resumo": "O professor compara os três **contratualistas**: para **Hobbes**, o estado de natureza é guerra, e o ser humano troca liberdade por segurança (governo absolutista); para **Locke**, já existem direitos naturais (vida, liberdade, propriedade) e o Estado serve para protegê-los; para **Rousseau**, o ser humano nasce bom, a propriedade privada cria a desigualdade e o Estado deve seguir a **vontade geral**.", "pontos": [[0, "Filosofia política: o assunto mais cobrado"], [42, "O que é estado de natureza"], [83, "Hobbes: o ser humano é egoísta"], [125, "Hobbes: liberdade em troca de segurança"], [165, "Locke: direitos naturais"], [245, "Rousseau: o bom selvagem"], [285, "Rousseau: propriedade privada e vontade geral"], [325, "Resumo comparando os três"]], "dica": "Hobbes = segurança. Locke = direitos. Rousseau = vontade geral."}, "filo-4": {"resumo": "A aula apresenta **Michel Foucault** e a obra *Vigiar e Punir*: a disciplina que produz **corpos dóceis** (soldados, alunos, pacientes), a organização dos espaços (escola, hospital, quartel) e do tempo, e o **panóptico**, a prisão em que o preso nunca sabe se está sendo vigiado e por isso se controla sozinho, como as câmeras de hoje.", "pontos": [[0, "Quem foi Michel Foucault"], [41, "Vigiar e Punir e os corpos dóceis"], [81, "Escola e hospital como espaços disciplinares"], [122, "O controle do tempo e da postura"], [203, "O panóptico de Bentham"], [284, "Câmeras e bonecos de policial: a vigilância de hoje"], [324, "O poder de definir o que é “patológico”"]], "dica": "Panóptico: quem acha que está sendo vigiado controla o próprio comportamento."}, "filo-5": {"resumo": "O professor explica o **utilitarismo** de Bentham e Stuart Mill: a ação certa é a que gera **a maior felicidade para o maior número**, feita como um “cálculo moral” das consequências. Ele usa o dilema do bonde e mostra que, para Mill, os prazeres intelectuais valem mais que os sensoriais.", "pontos": [[0, "Ética x moral"], [40, "O dilema do bonde (série The Good Place)"], [81, "O cálculo moral utilitarista"], [121, "A maior felicidade do grupo, e não só a minha"], [162, "Bentham, Stuart Mill e o panóptico"], [245, "Prazeres intelectuais x prazeres sensoriais"]], "dica": "Utilitarismo julga pelas consequências; Kant julga pelo dever."}, "filo-6": {"resumo": "O professor explica o que é uma **falácia** (um argumento que parece válido, mas engana) e por que ela tira pontos na redação. Passa por vários tipos com exemplos: apelo à novidade, falsa dicotomia (o discurso de George W. Bush), intimidação, apelo ao povo, falsa autoridade, apelo à piedade, bola de neve (generalização) e ataque à pessoa (*ad hominem*).", "pontos": [[8, "O que é uma falácia argumentativa"], [134, "Apelo à novidade"], [254, "Falsa dicotomia: “quem não está conosco...”"], [414, "Apelo ao povo"], [697, "Falsa autoridade"], [819, "Apelo à piedade"], [983, "Bola de neve e generalização"], [1107, "Ataque à pessoa (ad hominem)"]], "dica": "Na redação, evite o “todo mundo sabe” e as autoridades que ninguém conhece."}, "soc-0": {"resumo": "Em 5 minutos, as diferenças entre os três clássicos: **Durkheim** (fatos sociais estudados “como coisas”, com imparcialidade, e o estudo do suicídio: anômico, egoísta, altruísta), **Weber** (não há imparcialidade total, as quatro **ações sociais** e a ética protestante no capitalismo) e **Marx** (materialismo histórico, luta de classes e a transformação da sociedade).", "pontos": [[0, "Os três clássicos da Sociologia"], [41, "Durkheim: fatos sociais como coisas"], [84, "Durkheim e os tipos de suicídio"], [125, "Weber: não existe neutralidade total"], [166, "Weber: as quatro ações sociais"], [206, "Ética protestante e capitalismo"], [206, "Marx: materialismo histórico e dialético"], [286, "“O que importa é transformar o mundo”"]], "dica": "Durkheim = sociedade acima do indivíduo. Weber = ação do indivíduo. Marx = luta de classes."}, "soc-1": {"resumo": "A aula define **etnocentrismo**: julgar a cultura do outro a partir da própria, considerada superior. Mostra suas características (hierarquizar culturas, negar a diversidade, justificar a dominação), exemplos históricos (colonização, nazismo, escravidão) e a antropologia **evolucionista** (barbárie → selvageria → civilização), que serviu para justificar o domínio europeu.", "pontos": [[0, "O que é etnocentrismo"], [41, "Julgar o outro pela própria cultura"], [82, "A definição de Anthony Giddens"], [123, "Características: hierarquizar e negar a diversidade"], [164, "Exemplo: portugueses e indígenas"], [204, "Nazismo e escravidão"], [246, "Os antropólogos evolucionistas"], [329, "Como isso justificou a dominação"]], "dica": "O contrário do etnocentrismo é o relativismo cultural."}, "soc-2": {"resumo": "O professor define **movimento social** (grupo organizado que luta por uma causa, com pauta clara) e o diferencia de manifestação espontânea (como uma torcida). Mostra as classificações: **conjuntural** (demanda imediata, como o preço da passagem) x **estrutural** (mudança de longo prazo, como o combate ao racismo), contra ou a favor do governo, e de **transformação** x de **conservação**.", "pontos": [[0, "Movimentos sociais no dia a dia"], [40, "O que é um movimento social"], [82, "Movimento social x manifestação espontânea"], [123, "Conjuntural x estrutural"], [163, "Áreas: trabalhista, ambiental, racial, feminista"], [205, "De transformação x de conservação"], [245, "Um mesmo movimento em várias classificações"]], "dica": "Sem pauta ou objetivo, não é movimento social."}, "soc-3": {"resumo": "Aula longa sobre **Pierre Bourdieu**: a pergunta “o indivíduo faz a sociedade ou a sociedade faz o indivíduo?”, e os conceitos de **habitus** (disposições que aprendemos pela origem social e que parecem “naturais”), **campo** (o “tabuleiro” onde disputamos posições), **estratégias** e os tipos de **capital** (econômico, cultural, social e simbólico). Termina mostrando como até o gosto é construído socialmente.", "pontos": [[1, "As perguntas da Sociologia"], [284, "A experiência de Bourdieu na Argélia"], [609, "A teoria da prática"], [894, "O que é habitus"], [1220, "Habitus depende da origem social"], [1506, "Campo e estratégias: o tabuleiro social"], [2120, "Capital econômico e capital cultural"], [2729, "O gosto também é construído socialmente"]], "dica": "Capital cultural herdado da família dá vantagem na escola: é assim que a desigualdade se reproduz."}, "bio-0": {"resumo": "O professor mostra que **Ecologia é quase metade das questões de Biologia do ENEM** e passa pelos temas que mais caem: o **ciclo do nitrogênio** (fixação, nitrificação e nitrato para as plantas), o ciclo do carbono, a poluição do ar e da água, a **eutrofização**, a **biorremediação** (organismos que limpam poluentes), os corredores ecológicos e o **controle biológico** de pragas.", "pontos": [[0, "Ecologia: metade das questões de Biologia"], [171, "Ciclo do nitrogênio a partir de uma questão do ENEM"], [335, "Bactérias fixadoras e a amônia"], [503, "Nitrificação: o nitrato que a planta absorve"], [830, "Ciclo do carbono: fotossíntese e respiração"], [1035, "Poluição e o exemplo dos botos-cinza"], [1361, "Eutrofização passo a passo"], [1525, "Biorremediação"], [1686, "Corredores ecológicos e controle biológico"]], "dica": "Na eutrofização, os peixes morrem por falta de oxigênio consumido na decomposição."}, "bio-1": {"resumo": "Um professor com mestrado em parasitologia apresenta a **introdução à parasitologia**: por que ela importa (a ascaridíase, por exemplo, atinge cerca de 1 bilhão de pessoas), os grupos estudados (protozoários, platelmintos e nematelmintos) e conceitos que caem na prova: ecto e endoparasita, hospedeiro, **portador** assintomático e **vetor** (quem transmite). As doenças e as vacinas estão nos tópicos.", "pontos": [[0, "Apresentação"], [165, "Por que estudar parasitologia"], [371, "Protozoários, platelmintos e nematelmintos"], [576, "Ectoparasitas x endoparasitas"], [785, "Portador: tem o parasita, mas não tem sintomas"], [991, "O que é um vetor"], [1196, "Parasitoide x parasita"]], "dica": "Vetor é quem transmite (geralmente um inseto); o agente é quem causa a doença."}, "bio-2": {"resumo": "O professor compara as **leis de Mendel**. Na **1ª lei** (uma característica), mostra o cruzamento das ervilhas amarelas e verdes, os heterozigotos e a proporção **3:1**. Na **2ª lei** (duas características em cromossomos diferentes), monta o quadro de 16 casas e chega à proporção **9:3:3:1**.", "pontos": [[0, "1ª x 2ª lei de Mendel"], [203, "As ervilhas amarelas e verdes (geração parental)"], [406, "Heterozigoto: alelos diferentes"], [649, "Proporção 3:1 e a chance de 1/4"], [851, "2ª lei: segregação independente"], [1096, "Duplo heterozigoto e o quadro de 16 casas"], [1545, "A proporção 9:3:3:1 e suas variações"]], "dica": "Em Aa × Aa, a chance do recessivo aa é 1/4."}, "bio-3": {"resumo": "A aula compara **Lamarck** (uso e desuso, herança de características adquiridas: a girafa que estica o pescoço) e **Darwin** (seleção natural: o ambiente seleciona variações que já existem). Explica o **neodarwinismo** (inclui mutação e genética) e dá exemplos: resistência a antibióticos, a perda do siso e o urso-polar.", "pontos": [[0, "Por que a evolução dá sentido à Biologia"], [245, "Lamarck (1809) e Darwin (A Origem das Espécies, 1859)"], [492, "As girafas: Lamarck x Darwin"], [736, "Exemplo prático: bactérias e antibióticos"], [978, "Neodarwinismo: seleção natural + mutação"], [1462, "O siso não some porque não usamos"], [1708, "O urso-polar e a seleção natural"]], "dica": "Palavras-chave: “uso e desuso” = Lamarck; “seleção natural” = Darwin."}, "bio-4": {"resumo": "Aula desenhada sobre **citologia**: células procariontes (simples, sem núcleo, como as bactérias) e eucariontes; as diferenças entre célula animal e vegetal (cloroplasto, parede de celulose, vacúolo); a **membrana plasmática** (mosaico fluido) e a função de cada organela: ribossomos, retículos, complexo golgiense, lisossomos, mitocôndria, centríolos e peroxissomos.", "pontos": [[50, "O que é citologia: procariontes x eucariontes"], [133, "O que as eucariontes têm"], [174, "Célula animal x vegetal"], [257, "Membrana plasmática e mosaico fluido"], [301, "Ribossomos: fábrica de proteínas"], [383, "Retículos e complexo golgiense"], [425, "Lisossomos e mitocôndria"], [510, "Centríolos e peroxissomos"]], "dica": "Mitocôndria = respiração celular (ATP). Cloroplasto = fotossíntese. Ribossomo = proteínas."}, "bio-5": {"resumo": "Aula sobre o **sistema nervoso central**, muito útil para quem quer Psicologia: a organização (encéfalo e medula; periférico somático e autônomo), a proteção pelas meninges (e a meningite), como a **memória** se forma (repetição e integração de áreas), a memória motora, o cerebelo e o tônus muscular, o **tálamo** e as emoções, e o **ciclo circadiano**.", "pontos": [[0, "Memória, inteligência e sonhos: o que o cérebro faz"], [243, "Encéfalo, medula e sistema nervoso periférico"], [530, "Meninges e meningite"], [817, "Como a memória se forma"], [1100, "Conexões entre regiões do cérebro"], [1342, "Memória motora: aprender a dirigir"], [1627, "Cerebelo e tônus muscular"], [1911, "Tálamo e as emoções"], [2195, "Ciclo circadiano: horário regular importa"]], "dica": "Rotina de sono regular ajuda o cérebro a controlar emoções e memória, inclusive para estudar."}, "bio-6": {"resumo": "O professor explica as **células-tronco**: células pouco diferenciadas, capazes de originar outros tipos. Quanto mais especializada a célula, menos ela se multiplica (por isso neurônios quase não se regeneram). Mostra os tipos (**totipotentes, pluripotentes, multipotentes**, oligo e unipotentes), as **pluripotentes induzidas** e o debate ético sobre o uso de embriões.", "pontos": [[0, "O potencial terapêutico das células-tronco"], [40, "O que são células-tronco"], [123, "Diferenciação e especialização"], [207, "Por que o neurônio quase não se regenera"], [287, "Os tipos de células-tronco"], [371, "Totipotentes e pluripotentes"], [413, "Multipotentes e a medula óssea"], [578, "Células pluripotentes induzidas"], [662, "A discussão ética sobre embriões"]], "dica": "Quanto menos especializada, maior o potencial de virar outras células."}, "bio-7": {"resumo": "Introdução à **botânica**: as características comuns a todas as plantas (multicelulares, embrião protegido e dependente da planta-mãe, fecundação interna, cutícula contra a perda de água), a **alternância de gerações** (fase n e fase 2n) e a evolução dos grupos: briófitas (dependem da água), pteridófitas (vasos condutores e órgãos verdadeiros), gimnospermas (sementes) e angiospermas (flores e frutos).", "pontos": [[0, "Introdução à botânica"], [122, "Características comuns a todas as plantas"], [287, "Fecundação interna"], [453, "Cutícula: menos perda de água"], [616, "Alternância de gerações: fases n e 2n"], [778, "Esporos, gametófito e esporófito"], [942, "Pteridófitas: vasos condutores e órgãos verdadeiros"], [1106, "Plantas vasculares e o surgimento da semente"]], "dica": "Semente surge nas gimnospermas; flor e fruto, só nas angiospermas."}, "qui-0": {"resumo": "Aula desenhada sobre **química ambiental**: o **efeito estufa** é natural, o problema é o agravamento pelos gases CO₂ (queima de combustíveis fósseis) e CH₄ (digestão dos ruminantes); os **biocombustíveis** (etanol, biodiesel, biogás) são renováveis porque as plantas absorvem CO₂ ao crescer; a **chuva ácida** vem dos óxidos de enxofre e nitrogênio; os **CFCs** destroem a camada de ozônio; e os 3 Rs do lixo.", "pontos": [[49, "O que é química ambiental"], [90, "Efeito estufa: natural x agravado"], [132, "CO₂ da gasolina e CH₄ dos ruminantes"], [173, "Revolução Industrial e combustíveis fósseis"], [213, "Biocombustíveis: etanol, biodiesel e biogás"], [296, "Chuva ácida: óxidos de enxofre e nitrogênio"], [336, "Calagem para corrigir o solo ácido"], [343, "Camada de ozônio e os CFCs"], [377, "Os 3 Rs: reduzir, reutilizar e reciclar"]], "dica": "Chuva ácida vem de SO₂ e NOₓ; efeito estufa, de CO₂ e CH₄; buraco no ozônio, dos CFCs."}, "qui-1": {"resumo": "Um professor animado ensina **estequiometria** sem medo: “mol” pode significar quantidade de partículas (6,02 × 10²³), massa molar ou volume (22,4 L nas CNTP). A técnica das **três linhas**: na 1ª, os mols da equação; na 3ª, os dados; na 2ª, a conversão para a mesma unidade. Depois é só a regra de três. Resolve um exemplo com hidrogênio e água (resultado: 36 g).", "pontos": [[0, "Apresentação: perder o medo de estequiometria"], [85, "O mais difícil é chegar à regra de três"], [109, "Os três significados de 1 mol"], [169, "A técnica das três linhas"], [291, "A 2ª linha: converter mol para massa ou volume"], [495, "Exemplo: massa de água a partir de 44,8 L de H₂"], [702, "Montando as linhas e resolvendo"], [784, "Resultado: 36 g de água"]], "dica": "Coloque sempre unidade embaixo de unidade antes de fazer a regra de três."}, "qui-2": {"resumo": "A professora explica **concentração das soluções**: solução = soluto (menor quantidade) + solvente. Com um exemplo de 20 g de soda cáustica em 500 mL, calcula a **concentração comum** (C = m/V = 40 g/L) e a **molaridade** (mols/V = 1 mol/L), usando a massa molar do NaOH (40 g/mol). Alerta para não confundir concentração com densidade.", "pontos": [[0, "Onde a concentração aparece: exames e rótulos"], [41, "Soluto e solvente"], [83, "Concentração comum e concentração molar"], [123, "Exemplo: 20 g de NaOH em 500 mL"], [163, "Resultado: 40 g/L"], [204, "Calculando a massa molar e os mols"], [288, "Resultado: 1 mol/L"], [328, "Concentração não é densidade"]], "dica": "Converta mL para L (divida por 1.000) antes de calcular g/L ou mol/L."}, "qui-3": {"resumo": "O professor ensina a **identificar funções orgânicas rápido**: álcool (OH em carbono saturado, e se é primário, secundário ou terciário), fenol (OH no anel, mais ácido), aldeído (na ponta da cadeia), cetona, éter (oxigênio entre carbonos), ácido carboxílico, éster (aromas artificiais) e as nitrogenadas: **amina** (bases orgânicas) e **amida** (C=O ligado direto ao N).", "pontos": [[82, "Álcool: OH em carbono saturado"], [205, "Álcool primário, secundário e terciário"], [287, "Fenol: OH ligado ao benzeno"], [370, "Aldeído e cetona"], [410, "Éter e ácido carboxílico"], [530, "Éster e os sabores artificiais"], [572, "Aminas primárias, secundárias e terciárias"], [733, "Amida: C=O ligado diretamente ao nitrogênio"]], "dica": "Amida só existe se o C=O estiver ligado DIRETAMENTE ao nitrogênio."}, "qui-4": {"resumo": "A professora mostra por que a **termoquímica** cai quase todo ano (energia, combustíveis, emissão de CO₂). Explica reações **endotérmicas** (ΔH > 0, absorvem calor) e **exotérmicas** (ΔH < 0, liberam calor) e três formas de calcular o ΔH: pela **entalpia de formação** (substância simples = zero), pela **energia de ligação** (quebrar é +, formar é −) e pela **Lei de Hess**.", "pontos": [[81, "Por que termoquímica cai quase todo ano"], [202, "Endotérmica x exotérmica e o sinal do ΔH"], [405, "Entalpia de formação"], [528, "Substâncias simples têm entalpia zero"], [649, "Energia de ligação: quebrar é +, formar é −"], [732, "Lei de Hess: só importam o início e o fim"]], "dica": "ΔH negativo = libera calor (exotérmica). ΔH positivo = absorve calor (endotérmica)."}, "qui-5": {"resumo": "Aula curta sobre **pilhas e baterias**: a pilha é uma reação espontânea que gera eletricidade (a eletrólise é o contrário, como o celular carregando). **Oxidação** é perder elétrons; **redução** é ganhar. Na pilha de Daniell, o zinco se oxida e perde massa (**ânodo**, polo negativo) e o cobre se reduz e ganha massa (**cátodo**, polo positivo), com a ponte salina equilibrando as cargas.", "pontos": [[0, "Pilha x eletrólise: o exemplo do celular"], [41, "Oxidação: perder elétrons"], [81, "Redução: ganhar elétrons"], [81, "A pilha de Daniell: zinco e cobre"], [121, "O fluxo de elétrons que acende a lâmpada"], [162, "O zinco corrói e o cobre se deposita"], [242, "Ânodo e cátodo: o macete"]], "dica": "Ânodo = Oxidação (vogal com vogal). Cátodo = Redução (consoante com consoante)."}, "qui-6": {"resumo": "Em 4 minutos, o vídeo explica a **teoria ácido-base**: para **Arrhenius**, ácido libera H⁺ e base libera OH⁻ em água; para **Brønsted-Lowry**, ácido doa próton e base recebe. Mostra o que é ácido forte e as regras de nome: hidrácidos (-ídrico), oxiácidos (-ico) e bases (hidróxido de...). Equilíbrio e pH estão nos tópicos.", "pontos": [[0, "Ácidos e bases"], [40, "Arrhenius: H⁺ e OH⁻"], [86, "Brønsted-Lowry: doar e receber prótons"], [87, "Ácido forte"], [112, "Nomes dos hidrácidos (-ídrico)"], [132, "Nomes dos oxiácidos (-ico)"], [178, "Nomes das bases"]], "dica": "Ácido libera H⁺; base libera OH⁻. Juntos, neutralizam (formam sal e água)."}, "qui-7": {"resumo": "Aula sobre **polaridade**: numa ligação entre átomos diferentes, o mais eletronegativo “puxa” os elétrons, como num cabo de guerra (ligação polar); entre átomos iguais, fica equilibrado (apolar). Para saber se a **molécula** é polar, some os vetores: formas angulares ou piramidais (com par de elétrons sobrando) são polares; nas demais, ligantes iguais dão molécula apolar.", "pontos": [[0, "Por que a polaridade importa"], [41, "Ligação polar: o cabo de guerra do HCl"], [123, "Ligação apolar: átomos iguais"], [123, "Molécula polar: a soma dos vetores (NH₃)"], [205, "Molécula apolar mesmo com ligações polares (CH₄)"], [245, "Macete pela geometria da molécula"]], "dica": "Semelhante dissolve semelhante: polar dissolve polar; apolar dissolve apolar."}, "qui-8": {"resumo": "Resumo desenhado da **radioatividade**: núcleos instáveis emitem radiação para se estabilizar. **Alfa** (2 prótons + 2 nêutrons: o número atômico cai 2 e a massa cai 4), **beta** (o número atômico sobe 1 e a massa não muda) e **gama** (onda eletromagnética muito penetrante, perigosa aos tecidos). Termina com a **meia-vida**.", "pontos": [[8, "O que é radioatividade"], [49, "Decaimento: a busca pela estabilidade"], [90, "Emissão alfa: a 1ª lei"], [131, "Emissão beta: a 2ª lei"], [131, "Emissão gama: a mais penetrante"], [172, "Meia-vida: metade a cada período"]], "dica": "Depois de 2 meias-vidas sobra 1/4; depois de 3, 1/8."}, "fis-0": {"resumo": "O professor explica a **tensão elétrica** (ddp, popularmente “voltagem”, medida em volts: 12 V, 127 V, 220 V) e a fórmula mais importante da eletrodinâmica: **P = U × i** (potência = tensão × corrente). Ele demonstra a fórmula e resolve um exemplo: um chuveiro de 8,8 kW em 220 V tem corrente de 40 A.", "pontos": [[0, "Potência: energia por tempo"], [41, "Por que essa fórmula cai tanto"], [81, "O que é ddp (tensão ou “voltagem”)"], [122, "Exemplos: 12 V, 127 V e 220 V"], [245, "Unidades: volt, ampère, watt"], [325, "A fórmula P = U × i"], [405, "Demonstração da fórmula"], [527, "Exemplo: chuveiro de 8,8 kW em 220 V"]], "dica": "Converta kW para W (× 1.000) antes de usar P = U × i."}, "fis-1": {"resumo": "Aula sobre a **conservação da energia mecânica**: sem atrito, a energia não se cria nem se perde, só se transforma, e a energia mecânica (cinética + potencial) fica constante. Exemplos: a bolinha que cai do prédio, o skatista na pista e o pêndulo. Com atrito, parte vira calor. No fim, calcula a velocidade de uma bola que desce uma rampa de 45 m.", "pontos": [[0, "O princípio da conservação da energia"], [41, "Energia mecânica = cinética + potencial"], [81, "A bolinha que cai: potencial vira cinética"], [162, "O skatista na pista"], [203, "O pêndulo"], [244, "Com atrito: parte vira energia térmica"], [285, "Exemplo: velocidade no fim de uma rampa"]], "dica": "Sem atrito: m·g·h = m·v²/2. A massa até se cancela!"}, "fis-2": {"resumo": "Resumo de **ondulatória**: ondas **mecânicas** precisam de meio (som, corda, mar) e **eletromagnéticas** se propagam no vácuo (luz, rádio, micro-ondas). Ondas longitudinais x transversais; crista, vale, **comprimento de onda (λ)** e amplitude. A equação que mais cai: **v = λ · f**. Depois percorre o **espectro eletromagnético** em ordem de frequência (rádio → micro-ondas → infravermelho → luz visível → ultravioleta → raio X → gama): quanto maior a frequência, maior a energia (E = h · f).", "pontos": [[0, "Natureza: ondas mecânicas x eletromagnéticas"], [40, "Longitudinais x transversais"], [81, "Crista, vale e comprimento de onda"], [162, "Amplitude"], [172, "A equação fundamental: v = λ · f"], [203, "O espectro eletromagnético"], [286, "Micro-ondas, wi-fi e infravermelho"], [326, "As cores da luz visível"], [368, "Ultravioleta: bronzeado e esterilização"], [410, "Raio X e raio gama"], [453, "Maior frequência = maior energia"]], "dica": "Som é onda mecânica: NÃO se propaga no vácuo. Luz se propaga."}, "fis-3": {"resumo": "Em 5 minutos, as **três leis de Newton** com exemplos do dia a dia: **1ª (inércia)**: o corpo tende a continuar parado ou em movimento retilíneo uniforme (por isso o cinto de segurança). **2ª (princípio fundamental)**: F resultante = m · a (força em newtons, massa em kg, aceleração em m/s²). **3ª (ação e reação)**: forças de mesma intensidade e direção, sentidos opostos, aplicadas em **corpos diferentes**, por isso não se anulam.", "pontos": [[0, "O carro que freia e o cinto de segurança"], [41, "Newton e os Princípios (1687)"], [85, "1ª lei: inércia"], [130, "2ª lei: F = m · a"], [173, "Unidades do Sistema Internacional"], [214, "3ª lei: ação e reação"], [259, "Resumo das três leis"]], "dica": "Ação e reação nunca se anulam: agem em corpos diferentes."}, "fis-4": {"resumo": "A professora explica **calorimetria**: calor é energia térmica **em trânsito** do corpo mais quente para o mais frio (não confunda com temperatura). **Calor sensível** muda a temperatura: **Q = m · c · Δθ** (o famoso “que macete”), em que c é o calor específico (característica da substância). **Capacidade térmica** C = m · c depende da massa. **Calor latente** muda o estado físico sem mudar a temperatura: **Q = m · L**.", "pontos": [[0, "Calorimetria: um dos temas mais cobrados"], [80, "Calor x temperatura"], [162, "Calor sensível: muda a temperatura"], [286, "Q = m · c · Δθ"], [368, "Calor específico: característica da substância"], [453, "Unidades: caloria, grama e °C"], [576, "Capacidade térmica: C = m · c"], [738, "Calor latente: muda o estado físico"], [862, "Q = m · L"]], "dica": "Durante a mudança de estado a temperatura fica constante: use Q = m · L, não Q = m · c · Δθ."}, "fis-5": {"resumo": "Aula curta sobre os **defeitos da visão** sem decoreba: o cristalino é uma lente **convergente** que forma a imagem na retina. Na **miopia** (olho alongado), a imagem se forma **antes** da retina e se corrige com lente **divergente** (bordas grossas). Na **hipermetropia**, a imagem se forma **depois** e se corrige com lente **convergente**. Termina com a lupa: imagem virtual, direita e maior.", "pontos": [[0, "Entender em vez de decorar"], [40, "Olho saudável: imagem na retina"], [81, "Miopia: imagem antes da retina"], [100, "Correção: lente divergente"], [122, "Hipermetropia: imagem depois da retina"], [162, "Exercício da Olimpíada de Física"], [203, "A lupa: imagem virtual, direita e maior"]], "dica": "Miopia = não enxerga longe = lente divergente. Hipermetropia = não enxerga perto = lente convergente."}, "fis-6": {"resumo": "O professor explica a **hidrostática** (fluidos em equilíbrio) com duas grandezas: **densidade** (d = m/V: a pedra afunda, o balão sobe; água = 1 g/cm³ = 1.000 kg/m³, ou seja, 1 L de água ≈ 1 kg) e **pressão** (p = F/A: quanto menor a área, maior a pressão). Exemplos: o lápis nos dedos, a agulha da vacina, a cama de pregos e a faca amolada.", "pontos": [[0, "O que é hidrostática"], [41, "Fluido: líquidos e gases"], [82, "Densidade: massa por volume"], [124, "A pedra afunda, o balão sobe"], [245, "Unidades: g/cm³ × 1.000 = kg/m³"], [368, "1 litro de água = 1 kg"], [400, "Pressão: força dividida pela área"], [450, "O lápis e a agulha da vacina"], [530, "A cama de pregos"], [612, "Por que amolar a faca"]], "dica": "Menor área = maior pressão. Por isso a faca amolada corta melhor."}, "fis-7": {"resumo": "Aula da série “física do zero” sobre **velocidade média**: Vm = Δs / Δt, em que Δ (delta) é sempre **final − inicial**. Mostra que Δs pode ser negativo (movimento contra a orientação da trajetória) e ensina a conversão mais importante: **km/h ÷ 3,6 = m/s** e **m/s × 3,6 = km/h** (36 km/h = 10 m/s; 72 km/h = 20 m/s; 108 km/h = 30 m/s). No fim, calcula a velocidade de um carro real na estrada.", "pontos": [[0, "Velocidade média: aula 1 da física do zero"], [46, "Trajetória e orientação"], [129, "O que significa Δ: final − inicial"], [251, "Exemplo com a bicicleta"], [336, "Conversão: o número 3,6"], [376, "36, 72 e 108 km/h"], [457, "Exemplo real: o carro entre os km 91 e 90"], [498, "Δs negativo: tudo bem!"]], "dica": "De km/h para m/s, divida por 3,6. De m/s para km/h, multiplique."}, "arit-0": {"resumo": "A professora mostra que fazemos **comparações de quantidades** o tempo todo, e isso é **razão** (a/b, lida “a para b”): a ordem importa! Com bolinhas coloridas, suco concentrado e uma sala com 15 meninas e 25 meninos (razão 3/5), explica a **proporção** (razões equivalentes). Termina com razões do cotidiano: acertos numa prova, **velocidade média** (km/h) e **escala** de maquete.", "pontos": [[0, "Comparamos quantidades o tempo todo"], [86, "Razão: o quociente de a para b"], [210, "As três formas de escrever uma razão"], [293, "Proporç

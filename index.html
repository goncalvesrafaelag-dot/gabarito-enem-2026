ão: dobrou aqui, dobra ali"], [413, "O suco concentrado"], [495, "Exemplo: meninas e meninos (3 para 5)"], [697, "Acertos numa prova: 2 para 5"], [900, "Velocidade média é uma razão"], [1021, "Escala da maquete"]], "dica": "Na razão, a ordem importa: “de A para B” é A em cima, B embaixo."}, "arit-1": {"resumo": "O professor ensina **aumento e desconto** de duas formas. Aumento de 20% num salário de R$ 3.200: 20/100 × 3.200 = 640, novo salário R$ 3.840. Desconto de 40% num celular de R$ 2.500 por **regra de três** (R$ 1.000 de desconto) ou direto: pagar 60% de 2.500 = **R$ 1.500**. O atalho: “de” vira “vezes”.", "pontos": [[0, "Aumento: salário de R$ 3.200 com 20%"], [40, "O macete: porcentagem vira fração e “de” vira “vezes”"], [80, "Simplificando: aumento de R$ 640"], [123, "Desconto de 40% no celular"], [163, "Atalho: pagar 60% do valor"], [205, "Calculando por regra de três"], [329, "Conferindo: 60% de 2.500 = 1.500"]], "dica": "Desconto de 40% = pagar 60%. Aumento de 20% = multiplicar por 1,2."}, "arit-2": {"resumo": "Em 8 minutos, **juros compostos**: os juros incidem sempre sobre o **último valor** (R$ 100 a 10% → 110 → 121), e não sobre o inicial como nos juros simples. Fórmula **M = C · (1 + i)ᵗ**, com a taxa em decimal (2% = 0,02) e tempo na mesma unidade da taxa. Exemplos: empréstimo de R$ 500 mil a 10% ao ano por 3 anos = R$ 665.500; e a **desvalorização** de um carro, em que a fórmula vira **(1 − i)ᵗ**.", "pontos": [[0, "A ideia: juros sobre juros"], [41, "R$ 100 → 110 → 121"], [102, "A fórmula M = C · (1 + i)ᵗ"], [123, "Taxa em decimal e tempo na mesma unidade"], [166, "Exemplo: empréstimo de R$ 500 mil"], [248, "Montando a conta: 1,1³ = 1,331"], [376, "Resultado: R$ 665.500"], [400, "Desvalorização: (1 − i)ᵗ"]], "dica": "Se a questão não diz “juros simples”, é juros compostos."}, "arit-3": {"resumo": "Em 12 minutos, **escala** sempre com regra de três: escala = **desenho / real**. 1:8.000 quer dizer que 1 cm no mapa vale 8.000 cm na realidade. Exemplos com mapa e maquete. O pulo do gato: para **área**, eleve a escala **ao quadrado**; para **volume**, eleve **ao cubo** (1:100 vira 1:1.000.000 no volume). E as conversões de unidade (m² anda de 100 em 100; m³, de 1.000 em 1.000).", "pontos": [[0, "Escala é desenho sobre real"], [41, "Exemplo: mapa na escala 1:8.000"], [126, "Convertendo centímetros em metros"], [168, "Exemplo: a árvore da maquete"], [296, "Escala com área: eleve ao quadrado"], [463, "Convertendo cm² para m²"], [506, "Escala com volume: eleve ao cubo"], [629, "A piscina da maquete"], [711, "cm³ para litros"]], "dica": "Linear: escala. Área: escala². Volume: escala³."}, "arit-4": {"resumo": "A professora mostra a diferença entre **PA** (soma sempre o mesmo número, a razão r) e **PG** (multiplica sempre pelo mesmo número, a razão q, achada dividindo um termo pelo anterior). Ensina os termos gerais **aₙ = a₁ + (n − 1) · r** e **aₙ = a₁ · qⁿ⁻¹** e calcula o 5º termo de cada: 16 na PA (4, 7, 10, 13...) e 324 na PG (4, 12, 36, 108...).", "pontos": [[0, "PA e PG não são a mesma coisa"], [41, "PA: somando de 3 em 3 (razão r)"], [81, "PG: multiplicando por 3"], [126, "Por que a razão da PG é q (quociente)"], [167, "Termo geral da PA"], [253, "Termo geral da PG"], [296, "Calculando o 5º termo da PA"], [381, "Calculando o 5º termo da PG"]], "dica": "Na PG, resolva a potência ANTES de multiplicar: 4 · 3⁴ = 4 · 81."}, "arit-6": {"resumo": "O professor começa do zero com **frações**: numerador (quantas partes foram tomadas) e denominador (em quantas partes o todo foi dividido); frações próprias e impróprias; **frações equivalentes** (multiplique em cima e embaixo pelo mesmo número); como **reduzir ao mesmo denominador** usando o **MMC**; e como **comparar frações** (com denominadores iguais, basta olhar o numerador: 6/7 > 4/5).", "pontos": [[0, "Frações em duas aulas"], [41, "Numerador e denominador"], [121, "Representando 2/5 no círculo"], [202, "Frações impróprias"], [285, "Frações equivalentes: a mesma parte do todo"], [369, "Multiplicar em cima e embaixo pelo mesmo número"], [456, "Reduzindo ao mesmo denominador"], [581, "Usando o MMC"], [744, "Comparando frações"]], "dica": "Para comparar ou somar frações, primeiro deixe os denominadores iguais."}, "est-0": {"resumo": "O professor ensina **média, mediana e moda** com desafios e uma questão do ENEM. **Média**: soma ÷ quantidade. **Mediana**: o termo central **depois de colocar em ordem** (com quantidade par, média dos dois centrais). **Moda**: o que mais aparece (pode não existir). Na questão dos gols de um time, usa a **média ponderada** pela tabela de frequências (média 2,25; mediana 2; moda 0).", "pontos": [[0, "Estatística em uma questão"], [43, "Média: soma dividida pela quantidade"], [84, "Mediana: primeiro coloque em ordem!"], [169, "Moda (e sequência sem moda)"], [210, "Quantidade par: média dos dois centrais"], [292, "Questão do ENEM: gols por partida"], [372, "Média ponderada pela tabela"], [498, "Mediana entre o 10º e o 11º termos"], [620, "A moda foi zero gol"]], "dica": "Mediana sem ordenar os dados é o erro número 1."}, "est-1": {"resumo": "Em 13 minutos, **probabilidade** = casos favoráveis ÷ casos possíveis (pode virar porcentagem). Numa urna com 2 bolas azuis em 5, a chance é 2/5 = 40%. Na moeda lançada 3 vezes: o **“e” vira multiplicação** (½ · ½ · ½ = 1/8), mas é preciso contar as **ordens diferentes** (3 ordens para exatamente duas caras = 3/8). O **“ou” vira soma**, sem contar duas vezes o mesmo elemento (par ou primo de 1 a 20 = 17/20).", "pontos": [[0, "Probabilidade: favoráveis sobre possíveis"], [41, "A urna: 2 azuis em 5 = 40%"], [122, "Moeda lançada 3 vezes"], [247, "“E” vira vezes"], [370, "Não esqueça as outras ordens!"], [450, "“Ou” vira soma"], [575, "Não conte o 2 duas vezes"], [698, "Quadrados perfeitos: 4 em 20"]], "dica": "“E” multiplica, “ou” soma. E confira se a ordem importa."}, "est-2": {"resumo": "Aula completa de **análise combinatória**. **Princípio multiplicativo**: 5 camisas × 3 calças × 2 sapatos = 30 roupas (e caminhos diferentes se **somam**). Números com algarismos: cuidado com o zero na centena e com as restrições (ímpares). **Permutação**: nº de elementos = nº de posições (n!); com letras repetidas, divide pelos fatoriais (ARARA). **Arranjo**: a ordem importa (pódio). **Combinação**: a ordem não importa (duplas, salada de frutas). O teste da “foto”: trocou a ordem e mudou? É arranjo; não mudou? Combinação.", "pontos": [[0, "Princípio multiplicativo: camisas, calças e sapatos"], [122, "Caminhos entre cidades: multiplica e soma"], [251, "Números de 3 algarismos"], [415, "Números ímpares: comece pela restrição"], [538, "Permutação: o sofá de 5 lugares"], [826, "O pódio"], [949, "Permutação com repetição: ARARA"], [1245, "Arranjo: 5 pessoas em 3 lugares"], [1409, "Combinação: duplas e a salada de frutas"]], "dica": "Teste da foto: se trocar a ordem gera algo novo, é arranjo; se não, combinação."}, "func-0": {"resumo": "Aula sem cortes sobre **função do 2º grau**: y = ax² + bx + c com a ≠ 0. A parábola “sorri” se a > 0 e fica “triste” se a < 0. As **raízes** (Bhaskara) são onde ela corta o eixo x; o **Δ** diz quantas são (Δ > 0: duas; Δ = 0: uma; Δ < 0: nenhuma real). **Vértice**: xᵥ = −b/2a e yᵥ = −Δ/4a. O **valor máximo ou mínimo** da função é o yᵥ; o **instante/valor que torna máximo** é o xᵥ. Termina com o projétil do canhão (altura máxima de 16 m).", "pontos": [[0, "Estrutura: a ≠ 0"], [124, "A concavidade: sorrindo ou triste"], [206, "Raízes por Bhaskara"], [329, "As raízes cortam o eixo x"], [453, "Vértice: −b/2a e −Δ/4a"], [659, "Os três casos do Δ"], [906, "Valor máximo x ponto de máximo"], [1032, "Questão do projétil"], [1157, "Altura máxima: 16 m"]], "dica": "“Valor máximo” = yᵥ. “Em que instante é máximo” = xᵥ."}, "func-1": {"resumo": "Em 15 minutos, **função exponencial** f(x) = aˣ (base positiva e diferente de 1): a incógnita fica no expoente. Constrói os gráficos de 3ˣ (**base > 1: crescente**) e (½)ˣ (**base entre 0 e 1: decrescente**) e lembra que expoente negativo inverte a base. Depois resolve três questões: quando uma substância **quadruplica** (iguala as bases e os expoentes), a **meia-vida** da água e como achar as constantes a e b pelos pontos do gráfico.", "pontos": [[0, "O que é função exponencial"], [84, "Montando a tabela de 3ˣ"], [167, "Expoente negativo: inverte a base"], [249, "Base > 1: crescente"], [337, "Base entre 0 e 1: decrescente"], [506, "Questão 1: quando a substância quadruplica"], [589, "Iguale as bases e os expoentes"], [632, "Questão 2: reduzir à metade"], [752, "Questão 3: achar a e b pelo gráfico"]], "dica": "Mesma base dos dois lados → iguale os expoentes."}, "func-2": {"resumo": "Em 13 minutos, **trigonometria no triângulo retângulo** com o macete **SOH-CAH-TOA** (“socatoa”): seno = oposto/hipotenusa; cosseno = adjacente/hipotenusa; tangente = oposto/adjacente. A hipotenusa fica sempre **oposta ao ângulo de 90°**, não necessariamente “embaixo”. Resolve exemplos com 30° e 60° e a questão clássica do prédio visto de dois pontos (triângulo isósceles de 50 m).", "pontos": [[0, "Catetos e hipotenusa"], [41, "O macete SOH-CAH-TOA"], [123, "Exemplo com 30°: usando o seno"], [248, "Usando o cosseno"], [288, "Exemplo com 60°: cuidado com a hipotenusa"], [368, "Usando a tangente"], [490, "Questão clássica: a altura do prédio"], [531, "O triângulo obtuso e o isósceles"], [653, "Resolvendo com seno e cosseno de 60°"]], "dica": "Decore a tabela de 30°, 45° e 60°: sen 30° = ½, cos 60° = ½, tg 45° = 1."}, "geom-0": {"resumo": "Revisão de **geometria plana**: **quadrado** (área L², perímetro 4L, diagonal L√2 e apótema L/2), **triângulo equilátero** (área L²√3/4, altura L√3/2; o centro divide a altura em 2/3 e 1/3), **hexágono regular** (= 6 triângulos equiláteros), **losango** (área D·d/2) e **circunferência** (comprimento 2πr × área πr²), terminando com o **setor circular** por regra de três.", "pontos": [[2, "Quadrado: área e perímetro"], [83, "Diagonal do quadrado"], [165, "Apótema do quadrado"], [288, "Triângulo equilátero: área"], [371, "Altura e os 2/3 e 1/3"], [452, "Hexágono regular"], [575, "Hexágono = 6 triângulos equiláteros"], [743, "Losango"], [865, "Circunferência: comprimento x área"], [950, "Setor circular: a fatia de pizza"]], "dica": "Comprimento da circunferência = 2πr (o barbante). Área do círculo = πr² (a pizza inteira)."}, "geom-1": {"resumo": "Revisão completa de **geometria espacial**. **Prisma**: teto igual e paralelo à base e faces planas (o cilindro não é prisma, porque tem face curva); área total = lateral + 2 × base; **volume = área da base × altura**. **Cubo**: área 6a², volume a³, diagonal a√3. **Paralelepípedo**: 2(ab + bc + ac) e diagonal √(a² + b² + c²). **Cilindro** (equilátero: altura = diâmetro), **pirâmide** (apótema e Pitágoras) e **cone** (g² = h² + r²). “Tudo que tem ponta” tem volume dividido por 3.", "pontos": [[9, "O que é um prisma"], [132, "Arestas da base e laterais"], [255, "Área total do prisma"], [378, "Volume: área da base × altura"], [505, "Cubo: área, volume e diagonal"], [629, "Paralelepípedo"], [753, "Cilindro e secção meridiana"], [1040, "Cilindro equilátero"], [1168, "Pirâmide: nomes e apótema"], [1535, "Cone e o volume das figuras com ponta"]], "dica": "Figura com ponta (pirâmide, cone): volume = área da base × altura ÷ 3."}, "curso-0": {"resumo": "O professor explica como a **redação do ENEM** é avaliada: vale **1.000 pontos** sozinha, é um texto **dissertativo-argumentativo** e tem **5 competências** (até 200 pontos cada), que nunca mudam, enquanto os temas mudam todo ano. Detalha a **Competência 1** (norma-padrão): os níveis de 0 a 200, a importância da **estrutura sintática** e os desvios (acentuação, ortografia, hífen, maiúsculas, concordância, regência, crase). Para 200, é preciso sintaxe excelente e no máximo 2 desvios.", "pontos": [[0, "Por que entender as competências"], [80, "A redação vale 1.000 pontos"], [162, "Ler bem a proposta e os textos motivadores"], [245, "Competência 1: a norma-padrão"], [325, "Os temas mudam; as competências, não"], [406, "Nível 1 e 2: sintaxe deficitária"], [488, "120 pontos: sintaxe regular"], [570, "200 pontos: excelente, no máximo 2 desvios"], [653, "O que conta como desvio"]], "dica": "Releia a redação procurando só acento, crase e concordância: é onde mais se perde ponto na C1."}, "curso-1": {"resumo": "O professor ensina a **não fugir do tema**: **tema ≠ contexto**. O contexto é o assunto geral (ex.: infância, internet); o tema é o **recorte** dado pela frase temática (ex.: trabalho infantil, publicidade infantil). Analisa o tema de 2018 (“manipulação do comportamento do usuário pelo controle de dados na internet”): quem fala só de “internet” tangencia. Você precisa relacionar os **tópicos (palavras-chave)** do tema, e o texto motivador serve para situar, não para copiar.", "pontos": [[0, "Como ler bem o tema"], [42, "Tema é diferente de contexto"], [90, "A frase temática"], [132, "Contexto: o assunto geral"], [213, "Exemplo: infância, trabalho e publicidade infantil"], [253, "O tema do ENEM 2018"], [338, "Falar só do contexto = tangenciar"], [420, "A relação entre as palavras-chave"], [502, "Texto motivador situa, não é para copiar"]], "dica": "Sublinhe as palavras-chave do tema e confira se CADA parágrafo fala delas."}, "curso-2": {"resumo": "Os professores montam uma **introdução modelo** com 4 partes: **repertório** (o filme *Divertida Mente 2*, explicado como se o corretor não o conhecesse), **apresentação do tema** (desafios para combater a ansiedade), **tese** (ampliar o acesso a tratamento psicológico e conscientizar a sociedade) e **antecipação dos argumentos**, que mostra planejamento (projeto de texto). Siglas: escreva por extenso na primeira vez.", "pontos": [[0, "Por que a introdução importa"], [82, "Começar a conversa com o leitor"], [122, "O repertório: tudo o que você já viveu e leu"], [202, "Antecipar os argumentos = projeto de texto"], [283, "Exemplo: o filme Divertida Mente"], [330, "Explique o repertório como se o corretor não o conhecesse"], [365, "Siglas por extenso na primeira vez"], [446, "Repertório + tema + tese + argumentos"]], "dica": "Introdução = repertório + tema + tese + os dois argumentos que você vai desenvolver."}, "curso-3": {"resumo": "Continuação: o **parágrafo de desenvolvimento** ideal. Comece com um **conectivo** (use pelo menos um em cada parágrafo). O repertório precisa ser **legitimado** (tem fonte: quem disse, onde), **pertinente** (combina com o tema) e **produtivo** (você explica como ele sustenta o argumento). A frase-chave da aula: “**o óbvio precisa ser dito**”, porque o corretor não vai adivinhar sua relação. Termine o parágrafo com uma reflexão que já puxe para a proposta de intervenção.", "pontos": [[0, "O desenvolvimento da redação"], [123, "Conectivos entre parágrafos"], [204, "Repertório legitimado: com fonte"], [288, "Pertinente e produtivo"], [300, "“O óbvio precisa ser dito”"], [370, "O modelo de parágrafo"], [453, "Explique siglas e nomes locais"], [475, "Fechamento que puxa a proposta"]], "dica": "Todo repertório precisa de fonte e de uma frase explicando a relação com o seu argumento."}, "curso-4": {"resumo": "A professora explica a **proposta de intervenção completa**, com **5 elementos**: **ação** (o que fazer, com verbo claro: “deve criar”), **agente** (quem faz: um órgão, a escola, a mídia; nunca uma lei ou o ECA, que não agem), **modo/meio** (como, de forma possível), **finalidade** (para quê: o efeito sobre o problema) e **detalhamento** (explicar ou exemplificar um dos elementos; na dúvida, detalhe dois). A proposta precisa ter relação com o que você discutiu no texto.", "pontos": [[0, "O que diferencia a redação do ENEM"], [20, "Os 5 elementos"], [82, "Ação: deixe claro que é a SUA proposta"], [100, "Agente: quem vai fazer"], [123, "Leis e estatutos não são agentes!"], [165, "Modo: uma ação possível"], [190, "Finalidade: para que serve"], [207, "Tem que se ligar ao texto"], [250, "Detalhamento: na dúvida, detalhe dois"], [315, "Exemplo completo (surdos, ENEM 2017)"], [457, "Uma ou duas propostas?"]], "dica": "Checklist: QUEM + FAZ O QUÊ + COMO + PARA QUÊ + um detalhe."}, "curso-5": {"resumo": "A professora mostra como tirar nota máxima na **Competência 4 (coesão)**, que vale 200 pontos: use **conectivos** (operadores argumentativos) no início de cada parágrafo, exceto o primeiro, e **dentro** dos parágrafos. O conectivo precisa ter o **sentido certo** (somar, opor, concluir, concordar): “em paralelo” soma, “portanto” conclui, “entretanto” opõe. Duas regras: **não repita** o mesmo conectivo e **não erre o sentido**. Deixe seus conectivos preferidos treinados para o dia da prova.", "pontos": [[0, "Coesão vale 200 pontos"], [40, "Coesão = ideias costuradas com conectivos"], [82, "Conectando os parágrafos"], [123, "“Em primeiro plano” pode, sim"], [206, "O sentido do conectivo importa"], [287, "Conectivos dentro do parágrafo: oposição"], [369, "Concordância e elementos coesivos"], [450, "Concluir cada parágrafo"], [531, "Regra 1: não repetir. Regra 2: sentido certo"], [611, "Treine sempre os mesmos conectivos"]], "dica": "Tenha na manga 2 conectivos de cada tipo: somar, opor, explicar e concluir."}, "curso-6": {"resumo": "A partir de mais de 50 mil redações corrigidas, a professora lista os **erros de norma que mais se repetem**: maiúsculas (governo federal com minúscula; Estado = governo com maiúscula), **hífen na translineação**, **crase** (na dúvida, NÃO coloque; teste trocando por palavra masculina: se virar “ao”, tem crase), **vírgula** (nunca entre sujeito e predicado, mesmo que o sujeito seja longo; obrigatória depois de adjunto adverbial longo deslocado), ortografia (conscientização) e palavras que você não domina (“positivismo” não é otimismo). E: “acarretar problemas”, sem “em”.", "pontos": [[0, "Os erros que mais se repetem"], [20, "Letras maiúsculas e minúsculas"], [125, "Hífen ao quebrar a palavra"], [207, "Crase: na dúvida, não coloque"], [250, "O teste da palavra masculina"], [290, "Vírgula não é respiração"], [330, "Nunca entre sujeito e predicado"], [380, "Adjunto adverbial longo: vírgula obrigatória"], [411, "Ortografia: conscientização"], [495, "Não use palavra que você não domina"], [575, "Regência: “acarretar problemas”"]], "dica": "Na dúvida entre usar ou não crase e vírgula: não use."}, "curso-7": {"resumo": "A estratégia é ter **repertório por eixo temático**, e não um “coringão”. Exemplos que ela ensina a encaixar: **meio ambiente**: a ecologia profunda de Arne Naess (todo ser vivo tem valor, contra o antropocentrismo); **saúde**: *Ensaio sobre a cegueira*, de José Saramago (o colapso das instituições numa epidemia); **educação**: o **capital cultural** de Pierre Bourdieu (a escola pode perpetuar desigualdades); **gênero**: o filme *Estrelas além do tempo*. Lembre: repertório é só uma parte da nota.", "pontos": [[0, "Repertório por eixo, não coringa"], [43, "Meio ambiente: a ecologia profunda"], [85, "Exemplo de uso na introdução"], [166, "Saúde: Ensaio sobre a cegueira"], [208, "Educação: o capital cultural de Bourdieu"], [289, "Gênero: Estrelas além do tempo"], [369, "Repertório não é tudo"]], "dica": "Monte 1 repertório para cada eixo: educação, saúde, meio ambiente, tecnologia, cidadania, cultura e gênero."}, "psi-0": {"resumo": "Explica as **notas de corte do SISU**: é a nota do **último aprovado** (com 10 vagas, a do 10º colocado), e cada **modalidade de cota** tem a sua (normalmente mais baixa que a da ampla concorrência). Cada curso pode dar **pesos** diferentes às provas (média ponderada), exigir **notas mínimas** e algumas universidades dão **bônus regional**. A nota de corte parcial muda todo dia durante as inscrições: serve para planejar, não é garantia.", "pontos": [[0, "Nota de corte = nota do último aprovado"], [41, "Ampla concorrência x cotas"], [81, "Exemplo: Direito na UFRJ"], [122, "Por que a sua nota muda de curso para curso"], [161, "Pesos: a média ponderada"], [202, "Notas e médias mínimas"], [243, "Nota de 950? É o bônus regional"], [326, "A nota parcial muda todo dia"]], "dica": "Para Psicologia, a redação e as Humanas costumam ter peso maior: vale investir nelas."}, "psi-1": {"resumo": "Um psicólogo apresenta as **principais escolas da Psicologia**: **estruturalismo** (Wundt, introspecção) e funcionalismo; **Gestalt** (“o todo é maior que a soma das partes”); **behaviorismo** (comportamentos reforçados se repetem: o cão de Pavlov e o rato de Skinner); **psicanálise** (Freud: inconsciente, id/ego/superego); **humanismo** (Maslow e Rogers: liberdade de escolha, base da psicologia positiva); **cognitivismo** (pensamento e linguagem, base da TCC de Aaron Beck); e a **neurociência**.", "pontos": [[0, "A Psicologia como ciência"], [81, "Estruturalismo: a primeira escola"], [130, "Funcionalismo"], [163, "Gestalt: o todo é maior que as partes"], [285, "Behaviorismo: Pavlov e Skinner"], [366, "Psicanálise: Freud e o inconsciente"], [530, "Humanismo: Maslow e Rogers"], [612, "Cognitivismo e a TCC"], [738, "Neurociência"]], "dica": "Reforço = aumenta o comportamento; punição = diminui. Isso é behaviorismo."}, "psi-2": {"resumo": "Aula sobre a **Reforma Psiquiátrica** e a **RAPS** (Rede de Atenção Psicossocial). Nos anos 1970, profissionais denunciaram a violência dos manicômios (no Hospital Colônia de Barbacena, mais de 60 mil mortes). A **Lei 10.216/2001 (Lei Paulo Delgado)** prioriza o cuidado em liberdade, na comunidade. A rede inclui **CAPS** (que substituem os manicômios), UBS (porta de entrada), leitos em hospitais gerais, residências terapêuticas, geração de renda e o consultório na rua.", "pontos": [[0, "O que é a RAPS"], [41, "Do manicômio ao cuidado em liberdade"], [83, "A luta dos anos 1970 e Barbacena"], [123, "Lei 10.216/2001: Lei Paulo Delgado"], [248, "CAPS: o centro da rede"], [290, "UBS: a porta de entrada"], [412, "Internação só quando necessário"], [453, "Residências terapêuticas"], [536, "Trabalho, renda e consultório na rua"]], "dica": "Ótimo repertório para redações sobre saúde mental: cite a Lei 10.216/2001."}, "psi-3": {"resumo": "Animação sobre o **experimento de conformidade de Solomon Asch** (1950): estudantes precisavam dizer qual linha tinha o mesmo tamanho de outra, mas os colegas (atores) davam a resposta errada de propósito. Resultado: **75% se conformaram ao menos uma vez**, só 25% resistiram sempre. **Três pessoas** já bastam para pressionar, e **um único aliado** que discorde reduz muito o efeito. Mostra a força da pressão do grupo, inclusive nas redes sociais.", "pontos": [[0, "Qual linha é igual?"], [20, "A história do menino e o copo de vinho"], [81, "O experimento de Asch"], [122, "Os atores respondem primeiro"], [165, "Os julgamentos críticos"], [180, "Os resultados"], [206, "Três pessoas bastam; um aliado quebra a pressão"], [246, "O que isso diz sobre a nossa educação"]], "dica": "Conformidade = mudar de opinião para se encaixar no grupo. Clássico da psicologia social."}, "metodo-0": {"resumo": "Um casal conta como fez uma dissertação de mestrado com **TDAH**. Dicas práticas: **quebre o trabalho em pedaços minúsculos**, com uma **meta diária absurdamente simples** (ex.: 5 linhas); use uma recompensa (só joga depois de cumprir); **não pule nenhum dia**, nem abrindo exceções (“faço tudo no sábado” não funciona); use o **Pomodoro** (25 min de foco, 5 de pausa, com o cronômetro visível); e **não tente fazer perfeito na primeira vez**: faça e revise depois.", "pontos": [[0, "A pergunta: como focar com TDAH?"], [40, "Quebre em pedaços muito pequenos"], [121, "Meta diária absurdamente simples"], [160, "Recompensa depois da meta"], [205, "Não abra exceções: nenhum dia sem fazer"], [287, "O método Pomodoro: 25 + 5"], [327, "Primeiro faça, depois revise"], [489, "Cronômetro visível na frente"]], "dica": "Meta ridícula de pequena, todo dia, sem exceção. Por isso as missões do app são curtas."}, "metodo-1": {"resumo": "O professor simula o **2º dia do ENEM** com você: preencha o cartão, frase e cor da prova **logo no início**; controle o tempo por **intervalos** (meta de ~12 questões no primeiro, depois 10 em cada); comece pelas **fáceis** (biologia teórica, gráficos, contas curtas); **pule rápido** a questão que travou e volte no fim; marque primeiro com um “x” leve. Explica a **TRI** (acertar as fáceis vale mais que chutar as difíceis), que só se **aproxima** um valor quando a questão pede, e que chutar no final tudo bem, mas só depois de tentar.", "pontos": [[0, "Cartão-resposta e cor da prova primeiro"], [40, "Controle do tempo por intervalos"], [163, "Confie na sua resposta"], [370, "Meta: 12 questões no primeiro intervalo"], [530, "Travou? Pule!"], [734, "TRI: por que os extremos enganam"], [937, "Volte nas puladas no fim"], [1098, "Quais questões fazer primeiro"], [1300, "Só aproxime quando a questão pedir"]], "dica": "Só tem tempo para voltar no fim quem pula rápido quando precisa pular."}, "hbr-7": {"resumo": "Animação que explica por que o Brasil foi o **maior mercado de escravizados das Américas**: Portugal tinha pouca gente para mandar à colônia, e o tráfico era lucrativo. Entre 1531 e 1855 desembarcaram mais de **4 milhões de africanos**. Mostra a pressão inglesa contra o tráfico (a Inglaterra queria consumidores assalariados), que o Brasil foi o **último país das Américas a abolir** a escravidão (1888, depois de 353 anos) e que os libertos ficaram sem amparo, enquanto o governo incentivou a imigração.", "pontos": [[0, "O Brasil como maior mercado escravista"], [42, "Por que usar mão de obra escravizada"], [127, "Mais de 4 milhões de africanos"], [170, "A resistência e o abolicionismo"], [211, "Iluminismo e liberalismo contra a escravidão"], [311, "A Inglaterra contra o tráfico"], [352, "O último país das Américas a abolir"], [434, "Exclusão depois da abolição"], [482, "Uma herança que continua hoje"]], "dica": "Liberdade sem terra, escola e trabalho: é assim que o ENEM explica a desigualdade racial."}, "hbr-8": {"resumo": "O professor percorre o caminho até a **abolição (1888)**: os tratados com a Inglaterra (1810), a **Lei Feijó (1831), a “lei para inglês ver”**, a Bill Aberdeen (1845) e a **Lei Eusébio de Queirós (1850)**, que de fato acabou com o tráfico. Critica a pouca efetividade das leis do Ventre Livre e dos Sexagenários, mostra o papel da **Guerra do Paraguai** (escravizados enviados como Voluntários da Pátria) e termina com a discussão que já caiu no ENEM: a Lei Áurea foi mais uma lei de “soltura” do que de libertação.", "pontos": [[0, "Uma abolição tardia"], [42, "Os abolicionistas: Gama, Nabuco, Patrocínio, Rebouças"], [84, "A pressão inglesa desde 1810"], [166, "Lei Feijó: “para inglês ver”"], [207, "O interesse econômico inglês"], [248, "Bill Aberdeen e Lei Eusébio de Queirós"], [290, "Ventre Livre e Sexagenários: pouco efeito"], [330, "A Guerra do Paraguai e os Voluntários da Pátria"], [450, "A Lei Áurea, com só dois artigos"], [532, "Lei de libertação ou de soltura?"]], "dica": "“Lei para inglês ver” = lei feita só para aparentar, sem ser cumprida."}, "hbr-9": {"resumo": "O professor resolve **questões reais do ENEM** sobre as revoltas da Primeira República: a **Revolta da Chibata** (marinheiros negros e pobres contra os castigos, herança escravocrata na Marinha), **Canudos** (como os autores descreveram os sertanejos: obstinação e resistência), a **Revolta da Vacina** (a reforma urbana que destruiu cortiços e empurrou os pobres para morros e periferias) e o **Contestado** (a ferrovia e as serrarias que desorganizaram a vida dos camponeses).", "pontos": [[0, "Questões do ENEM sobre as revoltas"], [43, "ENEM 2018: Revolta da Chibata"], [125, "Por que os marinheiros se revoltaram"], [166, "ENEM 2015: Canudos"], [290, "Como a questão caracteriza os sertanejos"], [290, "ENEM 2013: a reforma urbana do Rio"], [373, "Destruição dos cortiços e Revolta da Vacina"], [415, "ENEM 2010: Guerra do Contestado"], [495, "Ferrovia, serrarias e expulsão dos camponeses"]], "dica": "Nas revoltas, procure sempre a causa social por trás do motivo imediato."}, "hbr-10": {"resumo": "Aula longa e completa sobre a **República Populista (1946–1964)**, presidente por presidente: **Dutra** (alinhado aos EUA e plano SALTE), **Vargas** eleito (nacionalismo, Petrobras, o atentado da Rua Tonelero contra Carlos Lacerda e o suicídio em 1954), **JK** (nacional-desenvolvimentismo, capital estrangeiro, dívida e Brasília), **Jânio** (renúncia) e **Jango** (Reformas de Base, Marcha da Família e o golpe de 1964, apoiado por setores conservadores e pelos EUA).", "pontos": [[0, "O que é populismo"], [245, "Dutra: primeiro presidente do período"], [491, "Plano SALTE"], [736, "Vargas eleito: nacionalismo"], [981, "Carlos Lacerda e a crise de 1954"], [1225, "O suicídio de Vargas"], [1475, "JK: capital estrangeiro e dívida"], [1723, "Por que construir Brasília"], [2217, "Jânio Quadros e a renúncia"], [2709, "Jango e as Reformas de Base"], [2957, "Marcha da Família e o golpe de 1964"]], "dica": "Associe: Vargas = Petrobras; JK = Brasília; Jânio = renúncia; Jango = Reformas de Base."}, "hbr-11": {"resumo": "O professor explica o que o ENEM cobra de **patrimônio histórico**: o patrimônio pode ter importância para um país, uma cidade ou até uma família; no Brasil, o órgão responsável é o **Iphan**. Diferencia **patrimônio material** (cidades como Ouro Preto e Paraty, a Serra da Capivara) e **imaterial** (capoeira, samba de roda, o **modo artesanal de fazer o queijo de Minas**, o ofício das paneleiras de Goiabeiras) e resolve questões.", "pontos": [[0, "Patrimônio histórico no ENEM"], [241, "O que pode ser patrimônio"], [323, "O Iphan"], [406, "Os livros do tombo"], [490, "Patrimônio material: Ouro Preto e Paraty"], [571, "Serra da Capivara"], [654, "Patrimônio imaterial: capoeira e samba de roda"], [738, "O queijo da Serra da Canastra"], [986, "Questão resolvida"]], "dica": "Se é um saber, uma festa ou um ofício, é patrimônio imaterial."}, "hge-5": {"resumo": "Resumo animado do **Egito antigo**: o **rio Nilo** e suas cheias fertilizavam o solo; os nomos se uniram em dois reinos, unificados pelo rei Menés (primeiro faraó). A sociedade era uma **monarquia teocrática** (o faraó era considerado um deus), com sacerdotes, nobres, **escribas** (que sabiam ler e escrever), camponeses e escravizados. Religião politeísta, crença na vida após a morte, avanços na medicina e as **pirâmides** como tumbas.", "pontos": [[0, "Por que estudar o Egito"], [41, "O Nilo e as cheias"], [83, "Nomos e a unificação por Menés"], [105, "Monarquia teocrática"], [128, "A sociedade e os escribas"], [171, "Economia: agricultura e o rio"], [214, "Religião: politeísmo e vida após a morte"], [255, "Medicina, arquitetura e pirâmides"], [300, "O fim do Egito antigo"]], "dica": "Teocracia = o governante é visto como um deus. É o caso do faraó."}, "hge-9": {"resumo": "Um professor explica o **Iluminismo** “sem dar sono”: a herança grega e romana, a **Revolução Científica** (Copérnico, Kepler, Galileu, telescópio e microscópio) e o método de **Descartes** preparam a “guerra” entre a razão e o **Antigo Regime** (absolutismo e clero). Apresenta **Voltaire** (crítica ao clero e à nobreza), **Locke** (direitos naturais, pai do liberalismo), **Montesquieu** (três poderes), Adam Smith e **Rousseau**, e aponta a contradição: falavam de liberdade no auge da **escravidão**.", "pontos": [[0, "Iluminismo sem dormir"], [43, "A herança grega e romana"], [86, "Fé x razão"], [126, "Revolução Científica: Copérnico e Galileu"], [168, "Descartes e o Antigo Regime"], [252, "Voltaire"], [295, "Locke, o pai do liberalismo"], [338, "Montesquieu e os três poderes"], [378, "Adam Smith e Rousseau"], [464, "A contradição: liberdade e escravidão"], [507, "Influência na Revolução Francesa e na Inconfidência"]], "dica": "Antigo Regime = absolutismo + privilégios do clero e da nobreza."}, "hge-6": {"resumo": "Aula curta sobre a **colonização da América espanhola**: com muito ouro e prata, a Espanha criou um **pacto colonial muito rígido**, com a **Casa de Contratação** e o sistema de **porto único** para evitar contrabando. A administração se dividia em **vice-reinos e capitanias gerais**, com os **cabildos** (câmaras) controlados pelos criollos. A principal mão de obra foi **indígena**, na **mita** (trabalho temporário nas minas, onde muitos morriam) e na **encomienda**.", "pontos": [[0, "A colonização espanhola"], [42, "Metais preciosos e um pacto colonial rígido"], [82, "Casa de Contratação e porto único"], [123, "Vice-reinos, capitanias e cabildos"], [123, "Quem eram os criollos"], [163, "Mineração como atividade principal"], [204, "Mão de obra indígena: a mita"], [245, "A encomienda"], [285, "Como isso cai na prova"]], "dica": "América espanhola = mão de obra indígena (mita). Brasil = predomínio africano."}, "hge-7": {"resumo": "O professor explica o **imperialismo europeu do século XIX (neocolonialismo)**: com a **Segunda Revolução Industrial**, vários países (França, EUA, Japão, Alemanha, Itália) passaram a disputar **matéria-prima** (petróleo, aço) e **mercados consumidores**, como novos supermercados disputando clientes. Na **Conferência de Berlim**, convocada por Bismarck, a África foi dividida sem respeitar as etnias, o que alimenta conflitos até hoje. A justificativa era o **darwinismo social** e o “fardo do homem branco”.", "pontos": [[0, "Neocolonialismo x colonialismo"], [41, "Matéria-prima e mercado consumidor"], [82, "A Segunda Revolução Industrial"], [123, "A comparação com os supermercados"], [206, "Petróleo, aço e novos mercados"], [287, "A Conferência de Berlim e Bismarck"], [329, "Inglaterra e França com os maiores territórios"], [369, "A justificativa: darwinismo social"], [450, "O “fardo do homem branco”"], [511, "Fronteiras que ignoraram as etnias"]], "dica": "Motivo real: matéria-prima e mercados. Justificativa: “missão civilizatória”."}, "hge-8": {"resumo": "Aula ilustrada sobre **ordem mundial**: a **velha ordem** foi a bipolaridade da **Guerra Fria** (EUA x URSS, corrida espacial e armamentista), encerrada com a **queda do Muro de Berlim (1989)**. A **nova ordem** é **unimultipolar**: multipolar na economia (EUA, União Europeia, Japão, China) e unipolar no poderio militar (EUA). Destaca a **globalização**, a internacionalização das empresas, os blocos econômicos, os **BRICS** e a regionalização Norte x Sul.", "pontos": [[0, "O que é ordem mundial"], [80, "A velha ordem: depois da 2ª Guerra"], [121, "EUA x URSS: a Guerra Fria"], [161, "Corrida espacial e armamentista"], [203, "Queda do Muro de Berlim"], [283, "A nova ordem: multipolar na economia"], [324, "Unimultipolar"], [345, "Globalização"], [364, "Empresas transnacionais"], [405, "Blocos econômicos e BRICS"], [446, "Leste-Oeste x Norte-Sul"]], "dica": "Unimultipolar: “uni” no poder militar, “multi” na economia."}, "geo-9": {"resumo": "Vídeo que passa pelos **seis biomas continentais** do Brasil. **Amazônia**: quase metade do território, clima equatorial, maior biodiversidade do mundo, regula as chuvas do país e já perdeu mais de 20% da área. **Cerrado**: clima tropical com estação seca, árvores de troncos retorcidos. **Caatinga**: semiárido, plantas espinhosas e cactos (mandacaru, xique-xique). **Mata Atlântica**: floresta densa onde vive cerca de 70% da população. **Pantanal**: o menor bioma, com cheias e secas. Termina com o **Pampa**.", "pontos": [[0, "O que é bioma"], [41, "Amazônia: clima e vegetação"], [122, "Importância e desmatamento da Amazônia"], [162, "Cerrado"], [202, "Espécies ameaçadas do Cerrado"], [242, "Caatinga e as plantas da seca"], [325, "Mata Atlântica"], [448, "70% da população vive na Mata Atlântica"], [475, "Pantanal: cheias e secas"]], "dica": "A Amazônia regula as chuvas de quase todo o Brasil (rios voadores)."}, "geo-10": {"resumo": "O professor compara os **modais de transporte**. **Aeroviário**: rápido, para pessoas e cargas de alto valor, mas caro e poluente. **Hidroviário**: grande capacidade, frete barato e pouco poluente, mas depende de rios navegáveis e do relevo (eclusas). **Ferroviário**: grande volume e frete baixo, mas malha limitada e sem flexibilidade. **Rodoviário**: ágil, entrega de porta em porta, mas caro de manter e muito poluente. Explica por que o Brasil apostou nas rodovias: incentivo às montadoras e integração nacional.", "pontos": [[0, "Os modais de transporte"], [40, "O que são modais"], [81, "Aeroviário"], [122, "Desvantagens do avião"], [163, "Hidroviário: barato e pouco poluente"], [204, "Limitações: rios e eclusas"], [245, "Ferroviário"], [285, "Limitações dos trens"], [365, "Rodoviário: de porta em porta"], [406, "Custos e poluição das rodovias"], [448, "Por que o Brasil escolheu as rodovias"]], "dica": "Hidrovia e ferrovia: longas distâncias e cargas pesadas. Rodovia: curtas distâncias."}, "geo-11": {"resumo": "Aula sobre **região e regionalização**: regionalizar é dividir o espaço a partir de características comuns, o que ajuda nas políticas públicas. Mostra as propostas do **IBGE** (1941, por regiões naturais; 1969, a base das cinco regiões atuais, com semelhanças históricas, sociais e econômicas), os **complexos regionais** de Pedro Geiger (Amazônia, Nordeste e Centro-Sul, que **não respeitam os limites dos estados**) e as **quatro regiões de Milton Santos**, baseadas no meio técnico-científico-informacional (incluindo a Região Concentrada).", "pontos": [[0, "Região e regionalização"], [41, "O conceito de região"], [123, "Regionalizar por características comuns"], [164, "Por que regionalizar"], [204, "IBGE 1941: regiões naturais"], [244, "IBGE 1969: a base das regiões atuais"], [284, "Pedro Geiger: complexos regionais"], [325, "Não respeita os limites dos estados"], [345, "Milton Santos: as quatro regiões"]], "dica": "Pergunta sobre divisão que corta estados? É a de Pedro Geiger."}, "geo-12": {"resumo": "Aula descontraída sobre os **três tipos de rocha**. **Magmáticas (ígneas)**: vêm do resfriamento do magma; podem ser **intrusivas** (esfriam dentro da crosta, como o granito) ou **extrusivas** (esfriam na superfície, como o basalto). **Sedimentares**: formadas por sedimentos que se desgastam, se acumulam em camadas e se compactam. **Metamórficas**: rochas já existentes transformadas por **temperatura e pressão**, como o **mármore** e o **gnaisse**.", "pontos": [[0, "Como se classificam as rochas"], [40, "Magma x lava"], [80, "Rochas magmáticas intrusivas e extrusivas"], [121, "Rochas sedimentares: desgaste e acúmulo"], [163, "A compactação dos sedimentos"], [204, "Rochas metamórficas: calor e pressão"], [204, "Exemplos: mármore e gnaisse"]], "dica": "Petróleo e fósseis estão nas rochas sedimentares."}};

function numVal(t){

function lessonQueues(){
  const q = {};
  for (const a of ENEM_AREAS) {
    const subs = DATA.filter(s => s.a === a), out = [];
    for (const lvl of ["A","M","B"]) {
      const lists = subs.map(s => LESSONS.filter(L => L.s === s && L.inc === lvl));
      for (let k = 0, more = true; more; k++) { more = false; for (const Ls of lists) if (Ls[k]) { out.push(Ls[k]); more = true; } }
    }
    q[a] = out.filter(L => !isDone(L.id)).concat(out.filter(L => isDone(L.id)));
  }
  const psi = LESSONS.filter(L => L.a === "psi" && !isDone(L.id));
  const metodo = psi.filter(L => L.s.id === "metodo"), trilha = psi.filter(L => L.s.id !== "metodo");
  q.hum = metodo.concat(S.curso === "psicologia" ? trilha : []).concat(q.hum);
  q.red = LESSONS.filter(L => L.a === "red" && !isDone(L.id));
  return q;
}
function generatePlan(){
  const st = S.settings, start = today0(), d1 = parseYMD(st.d1), d2 = parseYMD(st.d2);
  const nBlocks = Math.max(1, Math.round(st.hours * 60 / 50));
  const order = [1,2,3,4,5,6,0].filter(d => st.days[d]);
  const simDay = order[order.length-1], redDay = order[Math.floor((order.length-1)/2)];
  const Qs = lessonQueues(), ptr = {lin:0,hum:0,nat:0,mat:0,red:0}, credit = {lin:0,hum:0,nat:0,mat:0,red:0};
  let redT = 0, temaPtr = 0, simPtr = 0;
  const days = [], same = (a,b) => a.getTime() === b.getTime();
  for (let d = new Date(start); d <= d2; d = addDays(d,1)) {
    const key = ymd(d), wd = d.getDay();
    if (same(d,d1) || same(d,d2)) { days.push({date:key, type:"prova", blocks:[{a:"geral", k:"prova", t: same(d,d1) ? "1º dia: Linguagens, Humanas e Redação" : "2º dia: Natureza e Matemática"}]}); continue; }
    if (same(addDays(d,1),d1) || same(addDays(d,1),d2)) { days.push({date:key, type:"vespera", blocks:[{a:"geral",k:"leve",t:"Revisar só os erros anotados (no máximo 1 hora)"},{a:"geral",k:"leve",t:"Separar documento com foto e caneta preta transparente"},{a:"geral",k:"leve",t:"Descansar e dormir cedo"}]}); continue; }
    if (!st.days[wd]) continue;
    const afterD1 = d > d1, left = diffDays(d, afterD1 ? d2 : d1);
    const areas = afterD1 ? ["nat","mat"] : ["lin","hum","nat","mat","red"].filter(a => st.w[a] > 0);
    if (!areas.length) areas.push("mat");
    const blocks = [];
    if (st.simulado && wd === simDay && order.length > 1) {
      const sa = afterD1 ? ["nat","mat"] : ENEM_AREAS;
      const n = Math.max(1, nBlocks - 1);
      for (let i = 0; i < n; i++) { const a = sa[simPtr++ % sa.length]; blocks.push({a, k:"sim", t:`Simulado de ${AREAS[a].nome}`}); }
      if (nBlocks > 1) blocks.push({a:"geral", k:"erros", t:"Refazer as questões que você errou"});
      days.push({date:key, type:"sim", blocks}); continue;
    }
    let i0 = 0;
    if (!afterD1 && wd === redDay && st.w.red > 0) { blocks.push({a:"red", k:"redacao", t:TEMAS_TREINO[temaPtr++ % TEMAS_TREINO.length]}); i0 = 1; }
    const w = a => afterD1 ? 1 : st.w[a], sumW = areas.reduce((s,a) => s + w(a), 0);
    for (let i = i0; i < nBlocks; i++) {
      areas.forEach(a => credit[a] += w(a));
      let pick = areas[0]; for (const a of areas) if (credit[a] > credit[pick]) pick = a;
      credit[pick] -= sumW;
      if (pick === "red") { const L = Qs.red[ptr.red++]; blocks.push(L ? {a:"red", k:"licao", lid:L.id, s:L.s.nome, t:L.t} : {a:"red", k:"redt", t:RED_TREINO[redT++ % RED_TREINO.length]}); continue; }
      const q = Qs[pick], n = ptr[pick]++, L = q[n % q.length];
      blocks.push({a:L.a, k:(n >= q.length || (!afterD1 && left <= 7)) ? "rev" : "licao", lid:L.id, s:L.s.nome, t:L.t});
    }
    days.push({date:key, type:"estudo", blocks});
  }
  S.plan = {created: ymd(start), days}; S.done = {}; planWeek = null; save();
}
const KIND = {licao:"Videoaula, tópicos e questões", rev:"Revisar e refazer as questões", sim:"Simulado cronometrado", erros:"Caderno de erros", redacao:"Redação completa · 1h", redt:"Treino de redação", leve:"Atividade leve", prova:"Dia de prova"};
const blockKey = (date,i) => `${date}#${i}`;
const blockDone = (date,i,b) => !!S.done[blockKey(date,i)] || (b.k === "licao" && isDone(b.lid));
function todayPlan(){ const t = ymd(today0()); return S.plan && S.plan.days.find(d => d.date === t); }
function recommended(){
  const pd = todayPlan();
  if (pd) { const b = pd.blocks.find(b => b.k === "licao" && !isDone(b.lid)); if (b) return LBYID[b.lid]; }
  const q = lessonQueues(), order = ["red","hum","lin","nat","mat"].sort((a,b) => (S.settings.w[b] || 0) - (S.settings.w[a] || 0));
  for (const a of order) { const L = (q[a] || []).find(L => !isDone(L.id)); if (L) return L; }
  return LESSONS.find(L => !isDone(L.id));
}

/* =========================================================
   LIÇÃO EM 3 PASSOS

function sections(L){
  const out = []; let cur = null;
  L.c.forEach(line => { if (line.startsWith("## ")) { cur = {h:line.slice(3), lines:[]}; out.push(cur); } else { if (!cur) { cur = {h:L.t, lines:[]}; out.push(cur); } cur.lines.push(line); } });
  return out;
}
function renderLines(arr){
  let html = "", list = null, ol = null;
  const flush = () => { if (list) { html += `<ul>${list.join("")}</ul>`; list = null; } if (ol) { html += `<ol>${ol.join("")}</ol>`; ol = null; } };
  arr.forEach(line => {
    if (line.startsWith("- ")) { if (ol) flush(); (list = list || []).push(`<li>${md(line.slice(2))}</li>`); return; }
    if (/^\d+\. /.test(line)) { if (list) flush(); (ol = ol || []).push(`<li>${md(line.replace(/^\d+\.\s/, ""))}</li>`); return; }
    flush();
    if (line.startsWith("> ")) html += `<div class="callout">${icon("bulb")}<p>${md(line.slice(2))}</p></div>`;
    else html += `<p>${md(line)}</p>`;
  });
  flush(); return html;
}
function vLicao(){
  const L = LBYID[R.lid]; if (!L) return vEstudar();
  const st = S.lessons[L.id] || {}, step = R.step || (VIDEOS[L.id] ? 1 : 2);
  const secs = sections(L), hasTips = !!TIPS[L.id], totalCards = secs.length + (hasTips ? 1 : 0), card = Math.min(R.card || 0, totalCards - 1);
  const steps = [["Videoaula","video"],["Tópicos","list"],["Questões","target"]];
  let body = "";
  if (step === 1) body = videoStep(L);
  if (step === 2) {
    const isTips = hasTips && card === secs.length;
    body = `<div class="cards-nav"><div class="dots">${Array.from({length:totalCards}, (_,i) => `<i class="${i < card ? "seen" : i === card ? "on" : ""}"></i>`).join("")}</div><span class="xs muted mono">${card+1}/${totalCards}</span></div>
      <article class="topic-card ${isTips ? "tips" : ""}">${isTips ? tipsHTML(L) : `<h2>${md(secs[card].h)}</h2><div class="content">${renderLines(secs[card].lines)}</div>`}</article>
      <div class="step-nav">${card > 0 ? `<button class="btn" data-card="${card-1}">${icon("left")} Anterior</button>` : `<button class="btn" data-lstep="1">${icon("video")} Videoaula</button>`}
        ${card < totalCards - 1 ? `<button class="btn primary" data-card="${card+1}">Próximo tópico ${icon("right")}</button>` : `<button class="btn primary" data-act="start-lesson" data-lid="${L.id}">Ir para as questões ${icon("right")}</button>`}</div>`;
  }
  if (step === 3) body = `<section class="card stack center">
      <span class="big-ico" style="${cs(L.a)}">${icon("target", 2)}</span>
      <h2>Hora de praticar</h2><p class="muted">${L.q.length} questões sobre “${esc(L.t)}”. Cada uma tem a resolução explicada.</p>
      ${st.done ? `<p class="small">Seu melhor resultado: ${st.best}/${st.total} ${stars(st.stars || 0, 14)}</p>` : ""}
      <button class="btn primary block big" data-act="start-lesson" data-lid="${L.id}">${icon("play")} ${st.done ? "Refazer as questões" : "Começar as questões"}</button>
      <button class="btn ghost" data-lstep="2">Rever os tópicos</button></section>`;
  return `<div class="lesson" style="${cs(L.a)}">
    ${topbar(esc(L.t), "materia:" + L.s.id)}
    <div class="stepper">${steps.map(([t,ic],i) => `<button class="st ${step === i+1 ? "on" : step > i+1 ? "past" : ""}" data-lstep="${i+1}"><span>${step > i+1 ? icon("check", 3) : i+1}</span>${t}</button>`).join("")}</div>
    <div class="stack-lg">${body}</div>
  </div>`;
}
function videoStep(L){
  const v = VIDEOS[L.id], s = (typeof VSUM !== "undefined" && VSUM[L.id]) || null;
  if (!v) return `<div class="note">${icon("video")} Esta lição não tem videoaula. Vá direto para os tópicos.</div><button class="btn primary block big" data-lstep="2">Estudar os tópicos ${icon("right")}</button>`;

      ${s.dica ? `<div class="callout">${icon("bulb")}<p><b>Dica do professor:</b> ${md(s.dica)}</p></div>` : ""}
    </section>` : ""}

function playVideo(id, start){

function tipsHTML(L){

/* =========================================================
   QUESTÕES (lição, erros, simulados)
   ========================================================= */
let Q = null, LAST = null, simTick = null;
function startQuiz(src, qids, extra){
  if (!qids.length) return toast("Não há questões para mostrar aqui.");
  Q = Object.assign({src, qids, idx:0, ans:[], xp:0, t0:Date.now()}, extra || {});
  if (src === "sim" && Q.minutes) { Q.deadline = Date.now() + Q.minutes * 60000; stopSimTimer(); simTick = setInterval(paintSimTimer, 1000); }
  go("quiz", {src});
}
function stopSimTimer(){ clearInterval(simTick); simTick = null; }
function paintSimTimer(){
  if (!Q || !Q.deadline) return;
  const left = Math.max(0, Math.round((Q.deadline - Date.now()) / 1000));
  const el = $("#qtimer"); if (el) el.textContent = left >= 3600 ? `${Math.floor(left/3600)}:${pad(Math.floor(left%3600/60))}:${pad(left%60)}` : mmss(left);
  if (left <= 0) { stopSimTimer(); toast("O tempo acabou!"); finishQuiz(); }
}
function vQuiz(){
  if (!Q) return vProvas();
  const q = QBYID[Q.qids[Q.idx]], a = Q.ans[Q.idx], sim = Q.src === "sim";
  const color = sim ? "var(--brand)" : AREAS[q.a].cor;
  const title = Q.src === "licao" ? esc(LBYID[Q.lid].t) : Q.src === "erros" ? "Caderno de erros" : esc(Q.title || "Simulado");
  const many = Q.qids.length > 20;
  const prog = many ? `<div class="bar thin"><span style="width:${(Q.idx)/Q.qids.length*100}%"></span></div>` : `<div class="qbar">${Q.qids.map((_,i) => { const x = Q.ans[i]; return `<i class="${x ? (sim ? "cur" : x.ok ? "ok" : "bad") : i === Q.idx ? "cur" : ""}"></i>`; }).join("")}</div>`;
  let feedback = "";
  if (a && !sim) {
    const tip = !a.ok && TIPS[q.lid] ? TIPS[q.lid].armadilhas[0] : "";
    feedback = `<div class="feedback ${a.ok ? "ok" : "bad"}"><h3>${icon(a.ok ? "check" : "x", 3)} ${a.ok ? ["Mandou bem!","Isso aí!","Acertou!","Perfeito!"][Q.idx % 4] : `Quase! A resposta é ${"ABCDE"[q.c]}.`}</h3><p>${esc(q.e)}</p>${tip ? `<p class="small"><b>Cuidado no ENEM:</b> ${md(tip)}</p>` : ""}
      <button class="btn ${a.ok ? "primary" : "danger-fill"} block big" data-act="q-next">${Q.idx >= Q.qids.length-1 ? "Ver resultado" : "Continuar"}</button></div>`;
  }
  return `<div class="stack-lg" style="--c:${color}">
    <div class="topbar"><button class="icon-btn" data-act="q-quit" aria-label="Sair">${icon("x", 2.2)}</button><div class="grow stack-xs"><span class="xs muted" style="font-weight:700">${title} · ${Q.idx+1} de ${Q.qids.length}</span>${prog}</div>${sim && Q.deadline ? `<span class="mono timer-chip" id="qtimer">--:--</span>` : ""}</div>
    <section class="stack ${a ? "" : "stagger"}">
      <span class="area-lbl" style="${cs(q.a)}">${AREAS[q.a].nome} · ${esc(LBYID[q.lid].s.nome)}</span>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${q.o.map((o,j) => {
        let cls = "";
        if (a && !sim) { if (j === q.c) cls = "ok pop"; else if (j === a.j) cls = "bad shake"; else cls = "dim"; }
        if (a && sim && j === a.j) cls = "sel";
        return `<button class="opt ${cls}" data-ans="${j}" ${a && !sim ? "disabled" : ""}><span class="letter">${"ABCDE"[j]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${feedback}
      ${sim ? `<div class="step-nav"><button class="btn" data-act="q-prev" ${Q.idx === 0 ? "disabled" : ""}>${icon("left")} Anterior</button>${Q.idx >= Q.qids.length-1 ? `<button class="btn primary" data-act="q-finish">Entregar</button>` : `<button class="btn primary" data-act="q-next">${a ? "Próxima" : "Pular"} ${icon("right")}</button>`}</div>` : ""}
    </section>
  </div>`;
}
function answer(j){
  const q = QBYID[Q.qids[Q.idx]];
  if (Q.src !== "sim" && Q.ans[Q.idx]) return;
  const ok = j === q.c; Q.ans[Q.idx] = {j, ok};
  if (Q.src === "sim") { render(); return; }
  S.answered[q.id] = {ok, t:Date.now()};
  if (ok) delete S.wrong[q.id]; else S.wrong[q.id] = 1;
  const g = ok ? 10 : 2; Q.xp += g; vibrate(ok ? 25 : [60,40,60]);
  render(); addXP(g, !ok);
  const fb = $(".feedback"); if (fb) setTimeout(() => fb.scrollIntoView({block:"nearest", behavior: reduced() ? "auto" : "smooth"}), 60);
}
function finishQuiz(){
  stopSimTimer();
  const total = Q.qids.length, ok = Q.ans.filter(x => x && x.ok).length, pct = ok / total;
  const res = {src:Q.src, ok, total, xp:Q.xp, bonus:0, lid:Q.lid, qids:Q.qids, ans:Q.ans, jkey:Q.jkey, full:Q.full};
  if (Q.src === "licao") {
    const prev = S.lessons[Q.lid] || {}, st = pct === 1 ? 3 : pct >= .75 ? 2 : pct >= .5 ? 1 : 0, first = !prev.done;
    S.lessons[Q.lid] = Object.assign({}, prev, {read:true, done:true, best:Math.max(prev.best || 0, ok), total, stars:Math.max(prev.stars || 0, st)});
    res.stars = st; res.first = first; if (first) res.bonus = 30 + (st === 3 ? 20 : 0);
  }
  if (Q.src === "sim") {
    Q.qids.forEach((id,i) => { const x = Q.ans[i]; if (!x) return; S.answered[id] = {ok:x.ok, t:Date.now()}; if (x.ok) delete S.wrong[id]; else S.wrong[id] = 1; });
    const by = {}; Q.qids.forEach((id,i) => { const a = QBYID[id].a; by[a] = by[a] || {ok:0,n:0}; by[a].n++; if (Q.ans[i] && Q.ans[i].ok) by[a].ok++; });
    res.by = by; res.bonus = ok * 5 + 30;
    Object.entries(by).forEach(([a,v]) => { if (v.n >= 20 && TRI[a]) setNota(a, triEstimate(a, v.ok, v.n), Q.full ? "Prova completa" : "Simulado"); });
    S.sims.push({d:ymd(today0()), ok, total, t:Q.title || "Simulado"});
    if (Q.jkey) S.jornada[Q.jkey] = {ok, total, d:ymd(today0()), tri: Object.fromEntries(Object.entries(by).filter(([a]) => TRI[a]).map(([a,v]) => [a, triEstimate(a, v.ok, v.n)]))};
  }
  if (Q.src === "erros") res.bonus = ok * 3;
  LAST = res; Q = null; save();
  go("resultado", {}, "replace");
  if (res.bonus) addXP(res.bonus); else setTimeout(nextModal, 300);
  if (pct >= .75) setTimeout(confetti, 250);
}
function vResultado(){

    ${r.src === "sim" && wrongList.length ? `<details class="panel"><summary>Ver a correção das ${wrongList.length} questões erradas</summary><div class="panel-body">${wrongList.map(x => `<div class="stack-xs sep-top"><span class="area-lbl" style="${cs(x.q.a)}">${AREAS[x.q.a].nome}</span><p><b>${esc(x.q.q)}</b></p><p class="small">Resposta: <b>${"ABCDE"[x.q.c]}) ${esc(x.q.o[x.q.c])}</b>${x.a ? ` · você marcou ${"ABCDE"[x.a.j]}` : " · em branco"}</p><p class="small muted">${esc(x.q.e)}</p></div>`).join("")}</div></details>` : ""}
    <div class="stack">
      ${next ? `<button class="btn area block big" style="--c:${color}" data-lesson="${next.id}">Próxima lição ${icon("right")}</button>` : ""}

      ${r.src === "sim" ? `<button class="btn primary block big" data-tab="provas">Voltar para a preparação</button>` : ""}
      <button class="btn ghost block" data-tab="hoje">Voltar para Hoje</button>
    </div>
  </div>`;

const TRI = {
  lin:[[0,300],[10,380],[15,430],[20,480],[25,530],[30,580],[35,635],[40,700],[45,820]],
  hum:[[0,310],[10,400],[15,455],[20,510],[25,560],[30,615],[35,675],[40,745],[45,845]],
  nat:[[0,320],[10,440],[15,500],[20,555],[25,605],[30,660],[35,720],[40,790],[45,870]],
  mat:[[0,330],[5,390],[10,470],[15,555],[20,625],[25,690],[30,750],[35,810],[40,880],[45,960]]
};
function triEstimate(a, ok, total){
  const x = total ? ok / total * 45 : 0, A = TRI[a];
  for (let i = 1; i < A.length; i++) if (x <= A[i][0]) { const [x0,y0] = A[i-1], [x1,y1] = A[i]; return Math.round(y0 + (y1 - y0) * (x - x0) / (x1 - x0)); }
  return A[A.length-1][1];
}

const STEPS = [
  ["Introdução","Repertório + problema + tese + anúncio dos 2 argumentos. De 3 a 5 linhas."],
  ["Desenvolvimento 1","Tópico frasal com o 1º argumento, repertório, explicação ligando ao tema e fechamento. De 7 a 9 linhas."],
  ["Desenvolvimento 2","Comece com um conectivo de adição (Além disso...). 2º argumento, repertório, explicação e fechamento. De 7 a 9 linhas."],
  ["Conclusão","Retome a tese e faça a proposta: agente + ação + meio + finalidade + detalhamento. De 5 a 7 linhas."]
];
const essayText = () => S.draft.mode === "guiado" ? S.draft.parts.filter(p => p.trim()).join("\n") : S.draft.text;
const essayScore = () => COMPETENCIAS.reduce((s,c) => s + c.checks.filter((_,i) => S.evalc[`${c.n}-${i}`]).length * 40, 0);
const lineCount = txt => txt.split("\n").reduce((s,l) => s + (l.trim() ? Math.max(1, Math.ceil(l.length / 68)) : 0), 0);
const STOP = new Set("a o e é de da do das dos em no na nos nas um uma uns umas para por com sem que se ao aos à às como mais mas ou sua seu suas seus isso esse essa este esta ser são foi pelo pela pelos pelas entre sobre também quando muito já não nem há ter tem desse dessa nesse nessa deve devem forma modo assim brasil brasileira brasileiro sociedade".split(" "));
function analyze(){
  const txt = essayText(), low = txt.toLowerCase(), items = [];
  const lines = lineCount(txt), paras = txt.split("\n").filter(p => p.trim()).length, words = (low.match(/[a-záàâãéêíóôõúç]+/g) || []);
  if (!txt.trim()) return {items:[{st:"warn", t:"Comece a escrever para ver a análise automática."}], lines, paras, words:0};
  items.push(lines <= 7 ? {st:"bad", t:`Cerca de ${lines} linhas. Com 7 ou menos, a redação vale zero.`} : lines > 30 ? {st:"bad", t:`Cerca de ${lines} linhas. O máximo é 30.`} : lines < 20 ? {st:"warn", t:`Cerca de ${lines} linhas. O ideal é de 25 a 30.`} : {st:"ok", t:`Cerca de ${lines} linhas: bom tamanho.`});
  items.push(paras === 4 ? {st:"ok", t:"4 parágrafos: estrutura ideal."} : {st:"warn", t:`${paras} parágrafo(s). O modelo mais seguro tem 4.`});
  const temaW = (S.draft.tema.toLowerCase().match(/[a-záàâãéêíóôõúç]+/g) || []).filter(w => w.length > 4 && !STOP.has(w));
  const found = temaW.filter(w => low.includes(w.slice(0, Math.max(5, w.length - 2))));
  items.push(found.length >= Math.ceil(temaW.length * .6) ? {st:"ok", t:"Você retoma as palavras-chave do tema."} : {st:"warn", t:`Retome mais as palavras-chave do tema: ${temaW.filter(w => !found.includes(w)).slice(0,4).join(", ")}.`});
  const allCon = CONECTIVOS.flatMap(c => c[1].split(",").map(x => x.trim().toLowerCase())).filter(x => x.length > 2);
  const usedCon = [...new Set(allCon.filter(c => new RegExp("(^|[^a-záàâãéêíóôõúç])" + c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "([^a-záàâãéêíóôõúç]|$)").test(low)))];
  items.push(usedCon.length >= 8 ? {st:"ok", t:`${usedCon.length} conectivos diferentes: ótima coesão.`} : usedCon.length >= 4 ? {st:"warn", t:`${usedCon.length} conectivos diferentes. Tente chegar a 8 ou mais.`} : {st:"bad", t:"Poucos conectivos. Use um no início de cada parágrafo e outros dentro deles."});
  const rep = /(segundo|de acordo com|conforme|constituição|lei |estatuto|filósof|sociólog|pensador|autor|obra|livro|filme|série|ibge|oms|onu|“)/i.test(txt);
  items.push(rep ? {st:"ok", t:"Há sinais de repertório. Lembre de explicar a ligação com o tema."} : {st:"warn", t:"Não encontrei repertório. Cite um autor, lei, obra ou fato e explique a relação com o tema."});
  const last = txt.split("\n").filter(p => p.trim()).slice(-1)[0] || "", ll = last.toLowerCase();
  const pe = [["agente",/(minist[ée]rio|governo|estado|poder p[úu]blico|escola|m[íi]dia|ongs?\b|fam[íi]lia|congresso|secretaria|prefeitura|empresas|universidades|sociedade civil|instituiç)/],["ação",/(deve|devem|cabe a|cabe ao|é necessário que|é preciso que|precisa|precisam)/],["meio",/(por meio d|mediante|através d|por intermédio d|com o auxílio d|a partir d)/],["finalidade",/(a fim de|para que|com o objetivo de|com o intuito de|com a finalidade de|visando)/],["detalhamento",/(,\s*(que|a qual|o qual|como|isto é|ou seja)\b|por exemplo)/]].map(([n,re]) => [n, re.test(ll)]);
  const got = pe.filter(x => x[1]).length;
  items.push(got === 5 ? {st:"ok", t:"Proposta com os 5 elementos."} : {st: got >= 3 ? "warn" : "bad", t:`A conclusão parece ter ${got} de 5 elementos. Falta: ${pe.filter(x => !x[1]).map(x => x[0]).join(", ")}.`});
  const oral = low.match(/(^|[^a-z])(a gente|tipo assim|né|tá|pra|vc|pq|eu acho|eu penso|na minha opinião)(?=[^a-z]|$)/g);
  items.push(oral ? {st:"bad", t:`Evite oralidade ou 1ª pessoa: ${[...new Set(oral.map(x => x.trim()))].slice(0,4).join(", ")}.`} : {st:"ok", t:"Sem marcas de oralidade nem 1ª pessoa do singular."});
  const freq = {}; words.filter(w => w.length > 4 && !STOP.has(w)).forEach(w => freq[w] = (freq[w] || 0) + 1);
  const rep2 = Object.entries(freq).filter(([w,n]) => n >= 4 && !temaW.includes(w)).sort((a,b) => b[1] - a[1]).slice(0,3);
  items.push(rep2.length ? {st:"warn", t:`Palavras repetidas: ${rep2.map(([w,n]) => `${w} (${n}x)`).join(", ")}.`} : {st:"ok", t:"Sem repetições excessivas."});
  return {items, lines, paras, words:words.length};
}

let planWeek = null, planConfirm = false;
function planWeeks(){ const weeks = []; if (!S.plan) return weeks; let cur = null; S.plan.days.forEach(d => { const dt = parseYMD(d.date), mon = addDays(dt, -((dt.getDay()+6)%7)), k = ymd(mon); if (!cur || cur.key !== k) { cur = {key:k, mon, days:[]}; weeks.push(cur); } cur.days.push(d); }); return weeks; }
function vPlano(){
  const st = S.settings, wd = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], tKey = ymd(today0()), weeks = planWeeks();
  if (planWeek === null) { const i = weeks.findIndex(w => w.days.some(d => d.date >= tKey)); planWeek = Math.max(0, i); }
  planWeek = Math.min(planWeek, Math.max(0, weeks.length - 1));
  const w = weeks[planWeek];
  const seg = a => `<div class="seg">${[0,1,2,3].map(v => `<button data-w="${a}:${v}" aria-pressed="${st.w[a] === v}">${["Pular","Pouco","Normal","Muito"][v]}</button>`).join("")}</div>`;
  return `<div class="stack-lg">
    ${header("Plano da semana", `Ajustado para ${esc(curso().nome)} · ${st.hours}h por dia`, "hoje")}
    ${w ? `<div class="weeknav"><button class="icon-btn" data-act="wk-prev" ${planWeek === 0 ? "disabled" : ""} aria-label="Semana anterior">${icon("left", 2.2)}</button><div class="grow center"><b>Semana ${planWeek+1} de ${weeks.length}</b><div class="xs muted">${fmtShort(w.mon)} a ${fmtShort(addDays(w.mon,6))}</div></div><button class="icon-btn" data-act="wk-next" ${planWeek >= weeks.length-1 ? "disabled" : ""} aria-label="Próxima semana">${icon("right", 2.2)}</button></div>
    <div class="stack">${w.days.map(d => d.type === "prova" ? `<div class="note prova"><b>${esc(fmtDay(parseYMD(d.date)))}</b><br>${esc(d.blocks[0].t)}</div>` : `<details class="panel" ${d.date === tKey ? "open" : ""}><summary><span class="stack-xs"><span style="text-transform:capitalize">${d.date === tKey ? "Hoje · " : ""}${esc(fmtDay(parseYMD(d.date)))}</span><span class="xs muted" style="font-family:var(--f-body);font-weight:600">${d.blocks.filter((b,i) => blockDone(d.date,i,b)).length}/${d.blocks.length} feitas${d.type === "sim" ? " · simulado" : ""}</span></span></summary><div class="panel-body tasks">${d.blocks.map((b,i) => taskHTML({b, i, date:d.date, done:blockDone(d.date,i,b)}, i+1)).join("")}</div></details>`).join("")}</div>` : `<div class="note">A data da prova já passou. Ajuste as datas abaixo.</div>`}
    <details class="panel" ${planConfirm ? "open" : ""}><summary>Ajustar o plano</summary><div class="panel-body">
      <div class="grid2"><label class="field"><span>1º dia de prova</span><input type="date" id="d1" value="${st.d1}"></label><label class="field"><span>2º dia de prova</span><input type="date" id="d2" value="${st.d2}"></label></div>
      <div class="field"><span>Horas por dia</span><div class="seg">${[1,2,3,4,5].map(h => `<button data-hours="${h}" aria-pressed="${st.hours === h}">${h}h</button>`).join("")}</div></div>
      <div class="field"><span>Dias de estudo</span><div class="scroller">${[1,2,3,4,5,6,0].map(d => `<button class="chip" data-day="${d}" aria-pressed="${st.days[d]}">${wd[d]}</button>`).join("")}</div></div>

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { setTimeout(checkCall, 800); if (T.running) { paintTimer(); lockScreen(true); } } });

/* ---------- instalar como app ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (R.v === "hoje") render(); });
function installHTML(){
  if (!HOSTED || S.hideInstall) return "";
  try { if (matchMedia("(display-mode: standalone)").matches) return ""; } catch(e) {}
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="banner"><span class="brand-mark sm">Ψ</span><span class="grow"><b>Instale o app no celular</b><span>${installEvt ? "Ícone na tela inicial e abre direto." : ios ? "No Safari: Compartilhar → “Adicionar à Tela de Início”." : "No Chrome: menu ⋮ → “Instalar app”."}</span></span>${installEvt ? `<button class="btn primary sm" data-act="install">Instalar</button>` : `<button class="icon-btn" data-act="hide-install" aria-label="Fechar">${icon("x")}</button>`}</div>`;
}
if (HOSTED && "serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* =========================================================
   EVENTOS
   ========================================================= */
function toggleBlock(btn){
  const key = btn.dataset.block, L = btn.dataset.lid;
  if (btn.dataset.bk === "licao" && L && isDone(L)) return toast("Essa tarefa foi concluída pela lição.");
  S.done[key] = !S.done[key]; if (!S.done[key]) delete S.done[key];
  if (S.done[key]) { vibrate(20); if (!S.doneXP[key]) { S.doneXP[key] = 1; addXP(10); } }
  save(); render();
}
function openLesson(lid, step){ if (!LBYID[lid]) return; if (!isRead(lid)) { S.lessons[lid] = Object.assign({}, S.lessons[lid], {read:true}); save(); } go("licao", {lid, step: step || (VIDEOS[lid] ? 1 : 2), card:0}); }
function applyCurso(id){ const c = CURSOS.find(x => x.id === id); if (!c) return; S.curso = id; S.cursoSet = true; S.settings.meta = c.meta; S.settings.w = Object.assign({}, c.w); S.calc.pesos = {lin:c.w.lin > 2 ? 2 : 1, hum:c.w.hum > 2 ? 2 : 1, nat:c.w.nat > 2 ? 2 : 1, mat:c.w.mat > 2 ? 2 : 1, red:c.w.red > 2 ? 2 : 1}; save(); }
function updateMedia(){
  const ks = ["lin","hum","nat","mat","red"], c = S.calc, sp = ks.reduce((s,a) => s + (+c.pesos[a] || 0), 0) || 1, m = ks.reduce((s,a) => s + (+c.notas[a] || 0) * (+c.pesos[a] || 0), 0) / sp;
  const diff = Math.round(m - (+S.settings.meta || 750)), o = $("#mediaOut"); if (!o) return;
  o.textContent = m.toFixed(1); o.style.color = diff >= 0 ? "var(--good)" : "var(--warn)";
  $("#metaMsg").textContent = diff >= 0 ? `${diff} pontos acima da meta.` : `Faltam ${-diff} pontos para a meta.`;
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-act]"); if (!t) return;
  const d = t.dataset;
  if (d.act === "modal-close") { if (e.target === t || t.tagName === "BUTTON") closeModal(); return; }
  if (d.tab) return go(d.tab, {}, "replace");
  if (d.back) { const [v, a] = d.back.split(":"); return depth > 0 ? history.back() : go(v, a ? (v === "materia" ? {sid:a} : {a}) : {}, "replace"); }
  if (d.block) return toggleBlock(t);
  if (d.lesson) return openLesson(d.lesson);
  if (d.lstep) { R.step = +d.lstep; R.card = R.card || 0; try { history.replaceState(R, ""); } catch(er) {} render(); return window.scrollTo(0,0); }
  if (d.card !== undefined) { R.card = +d.card; try { history.replaceState(R, ""); } catch(er) {} render(); return window.scrollTo(0,0); }
  if (d.play) return playVideo(d.play);
  if (d.seek) { const [id, sec] = d.seek.split(":"); return playVideo(id, +sec); }
  if (d.area) return go("area", {a:d.area});
  if (d.sid && !d.act) return go("materia", {sid:d.sid});
  if (d.go) return go(d.go, d.sa ? {sa:d.sa} : {});
  if (d.jornada) return startJornada(d.jornada);
  if (d.redTab) return go("redacao", {tab:d.redTab}, R.v === "redacao" && !R.sub ? "replace" : "push");
  if (d.redSub) return go("redacao", {tab:"aprender", sub:d.redSub});
  if (d.write) { S.draft.tema = d.write; save(); return go("redacao", {tab:"escrever"}); }
  if (d.curso) { applyCurso(d.curso); if (!S.setup) { render(); return; } render(); return toast(`Meta ajustada para ${curso().nome}. Crie um novo plano para aplicar as prioridades.`); }
  if (d.day) { const k = +d.day; S.settings.days[k] = !S.settings.days[k]; if (!S.settings.days.some(Boolean)) S.settings.days[k] = true; save(); t.setAttribute("aria-pressed", S.settings.days[k]); return; }
  if (d.hours) { S.settings.hours = +d.hours; save(); $$("[data-hours]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (d.w) { const [a,v] = d.w.split(":"); S.settings.w[a] = +v; save(); $$(`[data-w^="${a}:"]`).forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (d.themeSet) { S.theme = d.themeSet; save(); applyTheme(); return render(); }
  if (d.fs) { S.fs = +d.fs; save(); applyTheme(); return render(); }
  if (d.ans !== undefined && Q) return answer(+d.ans);
  if (d.simn) { SIMCFG.n = +d.simn; return render(); }
  if (d.sima) { SIMCFG.area = d.sima; return render(); }
  if (d.ff) { F = {filter:d.ff, idx:0, back:false, deck:null}; return render(); }
  if (d.mode) { if (T.running) return toast("Pause o cronômetro antes de trocar."); T.mode = d.mode; T.phase = "foco"; T.left = MODES[T.mode][0]*60; S.settings.focusMin = +d.mode; save(); return render(); }
  if (d.emode) { S.draft.mode = d.emode; if (d.emode === "livre" && !S.draft.text.trim()) S.draft.text = S.draft.parts.filter(p => p.trim()).join("\n"); save(); return render(); }
  if (d.openEssay) { const es = S.essays.find(x => String(x.id) === d.openEssay); if (es) { S.draft = {mode:"livre", tema:es.tema, parts:["","","",""], text:es.text}; S.evalc = Object.assign({}, es.evalc); save(); go("redacao", {tab:"escrever"}, "replace"); toast("Redação aberta no editor."); } return; }
  if (d.bub) { const [n, L] = d.bub.split(":"), st = ofState(R.y, R.d); if (st.ans[n] === L) delete st.ans[n]; else st.ans[n] = L; save(); $$(`[data-bub^="${n}:"]`).forEach(b => b.setAttribute("aria-pressed", st.ans[n] === b.dataset.bub.split(":")[1])); const c = $("#cmarked"); if (c) c.textContent = Object.keys(st.ans).length; return; }
  if (d.lang) { ofState(R.y, R.d).lang = d.lang; save(); return render(); }
  if (d.book) return go("leitor", {book:d.book});
  if (d.cap !== undefined) { if (d.read !== undefined) markRead(+d.read); R.cap = +d.cap; try { history.replaceState(R, ""); } catch(er) {} loadChapter(); return window.scrollTo(0,0); }
  if (d.act) return act(d.act, t);
});
function act(a, t){
  switch (a) {
    case "ob-next": { const nm = $("#nm"); if (nm) S.name = nm.value.trim().slice(0,30); OB++; save(); return render(); }
    case "ob-prev": OB = Math.max(0, OB - 1); return render();
    case "setup": { if (!S.cursoSet) applyCurso(S.curso || "psicologia"); S.setup = true; generatePlan(); R = {v:"hoje"}; render(); window.scrollTo(0,0); confetti(); addXP(10); return toast("Plano criado! Vamos começar."); }
    case "theme": S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); return render();
    case "start-lesson": { const L = LBYID[t.dataset.lid]; if (!S.lessons[L.id] || !S.lessons[L.id].readXP) { S.lessons[L.id] = Object.assign({}, S.lessons[L.id], {read:true, readXP:true}); addXP(10); } return startQuiz("licao", L.q.map((_,j) => `${L.id}#${j}`), {lid:L.id}); }
    case "subj-quiz": { const pool = QUESTIONS.filter(q => LBYID[q.lid].s.id === t.dataset.sid); return startQuiz("sim", shuffle(pool).slice(0, 10).map(q => q.id), {title:"Treino: " + subjName(LBYID[pool[0].lid].s)}); }
    case "erros": { const ids = shuffle(Object.keys(S.wrong).filter(id => QBYID[id])).slice(0, 20); if (!ids.length) return toast("Nenhum erro para refazer. Muito bem!"); return startQuiz("erros", ids); }
    case "sim-start": { const pool = QUESTIONS.filter(q => ENEM_AREAS.includes(q.a) && (SIMCFG.area === "todas" || q.a === SIMCFG.area)); const ids = shuffle(pool).slice(0, SIMCFG.n).map(q => q.id); return startQuiz("sim", ids, {minutes: SIMCFG.timer ? ids.length * 3 : 0, title:"Simulado rápido"}); }
    case "q-next": if (!Q) return; if (Q.idx >= Q.qids.length - 1) return Q.src === "sim" ? null : finishQuiz(); Q.idx++; render(); window.scrollTo(0,0); return;
    case "q-prev": if (Q && Q.idx > 0) { Q.idx--; render(); } return;
    case "q-finish": return finishQuiz();
    case "q-quit": if (Q && Q.src === "sim" && Q.ans.some(Boolean)) return finishQuiz(); stopSimTimer(); Q = null; return depth > 0 ? history.back() : go("provas", {}, "replace");
    case "f-flip": F.back = !F.back; return render();
    case "f-yes": case "f-no": { const c = F.deck[F.idx]; S.cards[c.i] = a === "f-yes" ? Math.min(3, (S.cards[c.i] || 0) + 1) : 1; save(); if (a === "f-yes") addXP(2, true); F.back = false; F.idx++; if (F.idx >= F.deck.length) { F.deck = null; F.idx = 0; toast("Rodada completa!"); } return render(); }
    case "wk-prev": planWeek--; return render();
    case "wk-next": planWeek++; return render();
    case "plan-gen": if (S.plan && Object.keys(S.done).length) { planConfirm = true; return render(); } generatePlan(); render(); return toast("Plano criado.");
    case "plan-yes": planConfirm = false; generatePlan(); render(); return toast("Novo plano criado.");
    case "plan-no": planConfirm = false; return render();
    case "t-toggle": { tMode(); if (T.running) { T.left = Math.max(0, Math.round((T.end - Date.now())/1000)); T.running = false; clearInterval(tick); lockScreen(false); } else { T.end = Date.now() + T.left*1000; T.running = true; clearInterval(tick); tick = setInterval(paintTimer, 500); lockScreen(true); } const b = $("#tBtn"); if (b) b.textContent = T.running ? "Pausar" : "Começar"; return paintTimer(); }
    case "t-reset": clearInterval(tick); T.running = false; lockScreen(false); T.phase = "foco"; T.left = MODES[tMode()][0]*60; return render();
    case "marks": R.marks = R.marks === false; try { history.replaceState(R, ""); } catch(e) {} return render();
    case "tema-rand": { const all = TEMAS_TREINO.filter(x => x !== S.draft.tema); S.draft.tema = all[Math.floor(Math.random()*all.length)]; save(); render(); return toast("Novo tema sorteado."); }
    case "essay-save": { const text = essayText(); if (lineCount(text) < 8) return toast("Escreva pelo menos 8 linhas antes de salvar."); const score = essayScore(); S.essays.push({id:Date.now(), date:new Date().toLocaleDateString("pt-BR"), tema:S.draft.tema, text, score, evalc:Object.assign({}, S.evalc)}); setNota("red", score, "Autoavaliação"); save(); addXP(50); return toast(`Redação salva! Nota estimada: ${score}.`); }
    case "essay-new": S.draft = {mode:S.draft.mode, tema:TEMAS_TREINO[Math.floor(Math.random()*TEMAS_TREINO.length)], parts:["","","",""], text:""}; S.evalc = {}; save(); render(); window.scrollTo(0,0); return toast("Novo tema sorteado. Boa escrita!");
    case "of-corrigir": { const st = ofState(R.y, R.d); if (Object.keys(st.ans).length < 90) { R.ofConfirm = true; render(); const c = $(".confirm"); if (c) c.scrollIntoView({block:"center"}); return; } return ofCorrigir(); }
    case "of-corrigir-sim": return ofCorrigir();
    case "of-voltar": R.ofConfirm = false; return render();
    case "of-refazer": { const st = ofState(R.y, R.d); st.ans = {}; st.res = null; save(); render(); return window.scrollTo(0,0); }
    case "notas-calc": Object.entries(S.notas || {}).forEach(([a, n]) => S.calc.notas[a] = n.v); save(); render(); return toast("Notas levadas para o simulador.");
    case "pesos-iguais": ["lin","hum","nat","mat","red"].forEach(x => S.calc.pesos[x] = 1); save(); return render();
    case "pesos-curso": { const w = curso().w; S.calc.pesos = {lin:w.lin > 2 ? 2 : 1, hum:w.hum > 2 ? 2 : 1, nat:w.nat > 2 ? 2 : 1, mat:w.mat > 2 ? 2 : 1, red:w.red > 2 ? 2 : 1}; save(); return render(); }
    case "ics": return downloadICS();
    case "notif": return askNotif();
    case "call-test": return showCall();
    case "call-yes": return answerCall();
    case "call-no": return endCall(15);
    case "call-later": return endCall(10);
    case "call-go": { endCall(); const rec = recommended(); return rec ? openLesson(rec.id) : go("hoje"); }
    case "install": if (installEvt) { installEvt.prompt(); installEvt = null; } return;
    case "hide-install": S.hideInstall = true; save(); return render();
    case "fs-up": S.fs = Math.min(1.35, (S.fs || 1) + .08); save(); return applyTheme();
    case "fs-down": S.fs = Math.max(.85, (S.fs || 1) - .08); save(); return applyTheme();
    case "book-end": { markRead(+t.dataset.read); toast("Leitura concluída! +5 XP"); return go("biblioteca", {}, "replace"); }
    case "reset": R.reset = true; return render();
    case "reset-no": R.reset = false; return render();
    case "reset-yes": { S = clone(DEFAULT); save(); Q = null; LAST = null; OB = 0; applyTheme(); go("hoje", {}, "replace"); return toast("Progresso apagado."); }
  }
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "d1" && t.value) { const o1 = parseYMD(S.settings.d1), o2 = parseYMD(S.settings.d2); S.settings.d1 = t.value; if (diffDays(o1,o2) === 7 || parseYMD(S.settings.d2) <= parseYMD(t.value)) S.settings.d2 = ymd(addDays(parseYMD(t.value), 7)); const d2 = $("#d2"); if (d2) d2.value = S.settings.d2; save(); if (S.setup) toast("Data salva. Crie o plano de novo para aplicar."); }
  if (t.id === "d2" && t.value) { S.settings.d2 = t.value; save(); toast("Data salva. Crie o plano de novo para aplicar."); }
  if (t.id === "studyTime" && t.value) { S.settings.studyTime = t.value; S.called = {}; save(); if (S.setup) toast(`Horário de estudo: ${t.value}.`); }
  if (t.id === "tdah") { S.settings.focusMin = t.checked ? 15 : 25; T.mode = null; save(); }
  if (t.id === "remindOn") { S.settings.remind = t.checked; save(); }
  if (t.id === "simulado") { S.settings.simulado = t.checked; save(); }
  if (t.id === "simtimer") { SIMCFG.timer = t.checked; render(); }
  if (t.id === "temaSel") { S.draft.tema = t.value; save(); refreshAnalysis(); }
  if (t.id === "tArea") T.area = t.value;
  if (t.id === "nm") { S.name = t.value.trim().slice(0,30); save(); }
  if (t.id === "meta") { S.settings.meta = Math.max(0, Math.min(1000, +t.value || 0)); save(); }
  if (t.id === "capSel") { R.cap = +t.value; loadChapter(); }
  if (t.dataset.ev) { S.evalc[t.dataset.ev] = t.checked; save(); const el = $("#estScore"); if (el) el.textContent = essayScore(); }
  if (t.dataset.vesp) { S.vespera[t.dataset.vesp] = t.checked; save(); }
  if (t.dataset.perigo !== undefined) { S.perigos[t.dataset.perigo] = t.checked; save(); if (t.checked) addXP(3, true); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.part !== undefined) { S.draft.parts[+t.dataset.part] = t.value; save(); refreshAnalysis(); }
  if (t.id === "freeText") { S.draft.text = t.value; save(); refreshAnalysis(); }
  if (t.dataset.nota) { S.calc.notas[t.dataset.nota] = Math.max(0, Math.min(1000, +t.value || 0)); save(); updateMedia(); }
  if (t.dataset.peso) { S.calc.pesos[t.dataset.peso] = Math.max(0, Math.min(5, +t.value || 0)); save(); updateMedia(); }
  if (t.id === "meta") { S.settings.meta = Math.max(0, Math.min(1000, +t.value || 0)); save(); }
});

/* =========================================================
   INÍCIO DO APP
   ========================================================= */
if (!S.plan) generatePlan();
checkBadges(); modalQueue.length = 0;
const h0 = location.hash.slice(1);
R = {v: ["estudar","provas","redacao","mais","plano","biblioteca","boletim","pesquisa"].includes(h0) ? h0 : "hoje"};
try { history.replaceState(R, "", "#" + R.v); } catch(e) {}
render();
setTimeout(checkCall, 1500);


</script>

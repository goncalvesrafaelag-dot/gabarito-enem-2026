"1. **Grife as palavras-chave** do tema. No exemplo: *estigma*, *doenças mentais*, *sociedade brasileira*.",
"2. **Identifique o problema.** Qual é a situação negativa? O preconceito que afasta as pessoas do tratamento.",
"3. **Veja o recorte.** O tema fala de “desafios”, “caminhos”, “persistência”, “impactos”? Isso orienta o texto.",

"## Fuga x tangenciamento",

"- **Tangenciamento:** escrever sobre o assunto geral sem abordar o recorte → nota baixa (C2 limitada a 40 pontos).",

{t:"A introdução nota 1000", inc:"A", r:"Contextualização com repertório, tese clara e anúncio dos argumentos.", v:"como fazer introdução redação enem nota 1000",

c:[
"## Dois parágrafos, dois argumentos",

"## A estrutura de cada parágrafo (7 a 9 linhas)",
"1. **Tópico frasal:** a primeira frase já apresenta a ideia do parágrafo. “Em primeiro lugar, a desinformação alimenta preconceitos sobre quem sofre de transtornos mentais.”",

"## Os 5 elementos da proposta",
"1. **Agente:** quem vai executar a ação. Seja específico: “o Ministério da Educação” é melhor que “o governo”.",
"2. **Ação:** o que será feito.",
"3. **Meio/modo:** como será feito, por meio de quê.",
"4. **Finalidade/efeito:** para quê, qual resultado se espera.",
"5. **Detalhamento:** uma informação a mais sobre qualquer um dos elementos (quem é o agente, como é o meio, exemplo da ação...).",
"> Cada elemento vale 40 pontos na C5. Com os 5 elementos válidos, você garante 200.",

c:[
"## O que a C4 avalia",
"O uso de **conectivos** (entre parágrafos e dentro deles) e de **retomadas** (pronomes, sinônimos, expressões) para que o texto flua. Para 200 pontos: repertório diversificado de recursos coesivos e **poucas inadequações**.",
"## Conectivos entre parágrafos (o “esqueleto”)",
"- Início do D1: “Em primeiro lugar”, “Primordialmente”, “Em primeira análise”.",
"- Início do D2: “Além disso”, “Ademais”, “Outrossim”, “Somado a isso”.",
"- Início da conclusão: “Portanto”, “Dessa forma”, “Logo”, “Em suma”.",
"## Conectivos dentro dos parágrafos",
"- **Causa:** porque, visto que, uma vez que, haja vista.",
"- **Consequência:** consequentemente, de modo que, por conseguinte.",
"- **Oposição:** entretanto, contudo, no entanto, todavia.",
"- **Exemplificação e explicação:** por exemplo, isto é, ou seja, nesse sentido.",
"- **Conclusão parcial:** assim, dessa maneira, desse modo.",
"## Retomadas (evite repetições)",
"- **Pronomes:** isso, esse, tal, o qual, cujo.",
"- **Sinônimos:** estudantes → alunos → jovens.",
"- **Expressões resumitivas:** “esse cenário”, “tal conjuntura”, “essa problemática”, “o quadro supracitado”.",
"## Erros comuns que tiram pontos",
"- Repetir o mesmo conectivo (“além disso” três vezes).",
"- Usar conectivo com o sentido errado (“portanto” onde deveria haver oposição).",
"- Frases sem nenhum conectivo, todas soltas.",
"- Excesso de conectivos rebuscados sem necessidade, o que deixa o texto artificial.",
"> Meta: pelo menos um conectivo no início de cada parágrafo e dois ou três dentro de cada um."

"## Crase",
"Ocorre na junção da preposição **a** com o artigo **a**. Dica: troque por uma palavra masculina. Se virar “ao”, use crase.",
"- “Vou **à** escola” → “vou **ao** colégio” ✓. “Refiro-me **à** lei” ✓.",
"- **Não use** antes de palavra masculina, de verbo, de pronomes como “esta” e “ela”, nem em “a partir de”.",
"## Vírgula",
"- **Nunca** separe o sujeito do verbo: “Os jovens brasileiros, enfrentam...” ✗.",
"- Use vírgula depois de conectivos no início da frase: “Além disso, ...”.",
"- Use vírgula para isolar apostos e expressões explicativas: “Paulo Freire, educador brasileiro, defendia...”.",
"- Use vírgula antes de “mas”, “porém”, “pois” (explicativo).",
"## Concordância",
"- **Verbal:** o verbo concorda com o sujeito. “**Existem** muitos problemas” ✓; “**Há** muitos problemas” ✓ (haver no sentido de existir não vai para o plural). “Faz dez anos” ✓.",
"- **Nominal:** “É **necessária** a criação” / “É **necessário** criar”.",
"## Grafias que confundem",
"- **Mal** (oposto de bem) x **mau** (oposto de bom).",
"- **Há** (tempo passado, existir) x **a** (tempo futuro, distância): “há dois anos”, “daqui a dois anos”.",
"- **Por que** (pergunta) · **porque** (explicação) · **por quê** (fim de frase) · **o porquê** (substantivo).",
"- **Onde** (lugar físico) x **em que** / **no qual** (situações): “a sociedade **em que** vivemos”.",
"- **A fim de** (finalidade) x **afim** (semelhante).",
"## Registro formal",
"- **Evite:** “a gente” (use “nós” ou “a sociedade”), “tipo”, “né”, “tá”, “pra”, gírias, abreviações e **primeira pessoa do singular** (“eu acho”).",
"- Prefira períodos curtos e completos. Frases longas demais geram erros de estrutura.",
"> A C1 tolera no máximo 1 falha de estrutura sintática e 2 desvios para a nota 200. Revise sempre ao passar a limpo!"
],

c:[
"## A Psicologia como ciência",
"A Psicologia científica nasce em **1879**, quando **Wilhelm Wundt** cria o primeiro laboratório de psicologia experimental em Leipzig, na Alemanha. Antes disso, as questões da mente eram estudadas pela Filosofia (Platão, Descartes, Locke).",
"## As grandes escolas",
"- **Behaviorismo (comportamentalismo):** estuda o **comportamento observável**. **Watson** e **Skinner**: condicionamento operante, reforço e punição. **Pavlov**: condicionamento clássico (o cão que saliva ao ouvir a campainha).",
"- **Psicanálise:** **Sigmund Freud**. O **inconsciente** influencia nosso comportamento. Id, ego e superego; mecanismos de defesa; interpretação dos sonhos. Influenciou o Surrealismo.",
"- **Gestalt:** “o todo é diferente da soma das partes”. Estuda a percepção (ilusões de óptica).",
"- **Humanismo:** **Carl Rogers** e **Abraham Maslow** (pirâmide das necessidades). Foco no potencial humano e na autorrealização.",
"- **Cognitivismo:** estuda pensamento, memória, atenção e linguagem. Base da Terapia Cognitivo-Comportamental (TCC).",
"## Desenvolvimento humano",
"- **Jean Piaget:** estágios do desenvolvimento cognitivo (sensório-motor, pré-operatório, operatório concreto, operatório formal). A criança constrói o conhecimento ativamente.",
"- **Lev Vygotsky:** o desenvolvimento é **social e cultural**. **Zona de desenvolvimento proximal**: o que a criança consegue fazer com ajuda.",
"## Bases biológicas",
"Emoções, memória e comportamento dependem do **sistema nervoso**: neurônios, sinapses e neurotransmissores (dopamina, serotonina). O **sistema límbico** (amígdala, hipocampo) participa das emoções e da memória. O estresse crônico eleva o **cortisol**.",
"> No ENEM, esses nomes aparecem em textos de Linguagens, Humanas e Biologia. Reconhecê-los ajuda a interpretar."
],

"## Estereótipo, preconceito e discriminação",
"- **Estereótipo:** crença generalizada sobre um grupo (“todo X é assim”).",
"- **Preconceito:** atitude ou julgamento negativo prévio, sem conhecer a pessoa.",
"- **Discriminação:** ação que trata alguém de forma desigual por pertencer a um grupo.",
"## Experimentos clássicos",
"- **Conformidade (Solomon Asch, anos 1950):** muitas pessoas deram respostas claramente erradas sobre o tamanho de linhas só para concordar com o grupo. Mostra a força da pressão social.",
"- **Obediência à autoridade (Stanley Milgram, 1961):** muitos participantes aplicaram o que acreditavam ser choques elétricos fortes em outra pessoa porque um pesquisador mandou. Dialoga com a “banalidade do mal” de Hannah Arendt.",
"- **Efeito espectador:** quanto mais pessoas presenciam uma emergência, menor a chance de alguém ajudar, porque a responsabilidade se dilui.",
"## Identidade e grupos",
"- Tendemos a favorecer o nosso grupo (endogrupo) e a desconfiar dos outros (exogrupo). Isso ajuda a explicar a polarização política e as bolhas nas redes sociais.",
"- **Viés de confirmação:** buscamos e acreditamos mais em informações que confirmam o que já pensamos. É o combustível das fake news.",
"## Ética na pesquisa",
"Experimentos como o de Milgram hoje seriam considerados antiéticos. Atualmente, as pesquisas com seres humanos exigem **consentimento informado** e aprovação de comitês de ética.",

   TIP(id, o que mais cai, passo a passo, pegadinhas e perigos) */
const TIPS = {};

/* ---------- Português ---------- */
TIP("port-0",
["Qual é a ideia principal ou a tese do texto.","A intenção do autor: criticar, informar, convencer ou emocionar.","Charges e tirinhas: qual é a crítica por trás do humor."],
["Leia a pergunta (o comando) antes de ler o texto.","Leia o texto inteiro uma vez, sem pressa, e pense: “sobre o que ele fala?”.","Volte ao comando e sublinhe a palavra-chave dele (finalidade, tese, crítica, efeito).","Para cada alternativa, pergunte: “consigo provar isso com uma frase do texto?”. Se não conseguir, risque.","Entre as que sobraram, fique com a mais completa, que responde exatamente ao que foi pedido."],
["Alternativa com “sempre”, “nunca”, “todos” ou “somente” quase sempre está errada, porque exagera o texto.","Alternativa verdadeira, mas sobre um detalhe: está certa sobre o texto e errada para a pergunta.","Não use a sua opinião. Vale só o que o texto diz.","Não gaste mais de 3 minutos numa questão de texto longo: marque e volte depois."]);
TIP("port-1",
["Identificar o gênero de um texto (crônica, notícia, charge, propaganda).","Perguntar a finalidade do gênero: para que aquele texto existe.","Gêneros digitais: post, meme, comentário, tuíte."],
["Olhe onde o texto foi publicado (fonte embaixo do texto): jornal, rede social, livro?","Veja a forma: tem título e lide? Tem balões? Tem imperativo e marca?","Pergunte: esse texto quer informar, convencer, divertir, ensinar ou emocionar?","Escolha o gênero que combina com essa função."],
["Não confunda tipo (narrar, argumentar) com gênero (crônica, artigo).","Crônica e conto parecem iguais: a crônica fala do cotidiano e sai em jornal.","Editorial não tem autor assinado; artigo de opinião tem."]);
TIP("port-2",
["Descobrir a função predominante num anúncio, poema, verbete ou conversa.","Propagandas (conativa) e textos que falam da própria linguagem (metalinguística) são os favoritos."],
["Pergunte: qual é o foco do texto? O assunto, quem fala, quem lê, o canal, a língua ou a forma?","Procure pistas: imperativo e “você” = conativa; “eu” e emoção = emotiva; “alô, né?” = fática.","Se o texto explica uma palavra ou fala sobre escrever, é metalinguística.","Se a forma (rima, som, jogo de palavras) chama mais atenção, é poética."],
["Quase todo texto tem várias funções. A pergunta é sobre a que predomina.","Poema nem sempre é função poética: um poema sobre escrever poemas é metalinguístico.","Propaganda pode usar rima, mas o foco continua sendo convencer (conativa)."]);
TIP("port-3",
["Textos com falas regionais, gírias ou fala de antigamente.","Perguntas sobre preconceito linguístico.","Adequação: o jeito de falar combina com a situação?"],
["Identifique quem fala, onde e em que situação.","Veja o que muda: região (diatópica), grupo social (diastrática), situação (diafásica) ou época (histórica).","Procure a alternativa que respeita a variedade e fala em adequação."],
["Alternativas que dizem “o falante erra” ou “a forma correta é” quase sempre estão erradas.","O ENEM não defende que “tudo vale” em qualquer situação: na redação, use a norma-padrão.","Não confunda gíria de grupo (diastrática) com mudança pela situação (diafásica)."]);
TIP("port-4",
["O efeito de sentido de uma figura: ironia, metáfora, hipérbole.","Ironia em charges e textos de humor.","Metonímia e personificação em propagandas."],
["Encontre a palavra ou frase que não está no sentido literal.","Pergunte: o que ela quer dizer de verdade?","Pense no efeito: exagerar, criticar, suavizar, comparar ou emocionar.","Escolha a alternativa que explica o efeito, e não só o nome da figura."],
["Metáfora x comparação: se tiver “como” ou “feito”, é comparação.","Antítese (ideias opostas) x paradoxo (ideias opostas que parecem impossíveis juntas).","Ironia só se percebe pelo contexto. Leia a situação inteira."]);
TIP("port-5",
["O sentido de um conectivo (mas, embora, portanto, porque).","A que palavra um pronome se refere.","Se trocar um conectivo mantém o sentido."],
["Leia a frase antes e a frase depois do conectivo.","Pergunte: a segunda ideia soma, contraria, explica, conclui ou mostra consequência?","Teste a troca: coloque o novo conectivo na frase e leia em voz baixa. Faz o mesmo sentido?","Para pronomes, volte no texto até achar o termo que ele substitui."],
["“Embora” e “mas” têm sentidos parecidos, mas a frase precisa mudar de estrutura.","“Pois” pode ser explicação (antes do verbo) ou conclusão (depois do verbo).","Não escolha pelo som: escolha pela relação lógica entre as ideias."]);
TIP("port-6",
["Paródias de poemas famosos (Canção do Exílio, No meio do caminho).","Memes e propagandas que retomam obras de arte.","Diferença entre paródia e paráfrase."],
["Descubra qual texto ou obra famosa está sendo retomado.","Compare: o sentido original foi mantido ou mudou?","Se mudou para humor ou crítica, é paródia. Se manteve, é paráfrase."],
["Nem toda semelhança é plágio: no ENEM, a intertextualidade é um recurso criativo.","Citação exige a indicação do autor; alusão é só uma referência indireta."]);

TIP("lit-0",

["Procure sentimentalismo, idealização e exagero emocional.","Indígena herói e natureza exaltada: 1ª geração.","Morte, tédio e melancolia: 2ª geração.","Denúncia da escravidão com tom grandioso: 3ª geração (Castro Alves)."],

TIP("lit-3",

["Pergunte: o texto denuncia algum problema do Brasil real (sertão, subúrbio, racismo)?","Se sim e for do começo do século XX, é Pré-Modernismo.","Associe: Canudos = Euclides; subúrbio e racismo = Lima Barreto; Jeca Tatu = Monteiro Lobato."],

TIP("lit-4",

["Tem verso livre, fala coloquial, humor ou poema-piada? 1ª fase modernista.","Tem crítica à cópia da cultura europeia ou “devorar” a cultura de fora? Antropofagia.","Associe os nomes: Oswald (humor, manifestos), Mário (Macunaíma), Bandeira."],
["Modernismo não é “não ter regras”: é romper com as regras antigas de propósito.","Antropofagia não é rejeitar a cultura estrangeira, e sim absorver e transformar."]);
TIP("lit-5",
["Vidas Secas e o romance da seca.","Poemas de Drummond.","Clarice Lispector e os momentos de revelação (epifania)."],
["Seca, miséria, retirantes e linguagem seca e curta? Graciliano Ramos.","Reflexão sobre o mundo e a vida com ironia? Drummond.","Personagem comum que tem uma revelação interior? Clarice.","Linguagem inventada, cheia de palavras novas do sertão? Guimarães Rosa."],
["Não confunda o regionalismo de 30 (denúncia) com o de Guimarães Rosa (universal e inventivo).","Clarice olha para dentro da personagem, e não para a paisagem."]);
TIP("lit-6",

["Pergunte: quem fala no texto? Qual grupo ganha voz?","Procure temas de identidade, memória, racismo e desigualdade.","A resposta costuma valorizar a voz de quem viveu a experiência."],
["Alternativas que chamam esses textos de “menos literários” estão erradas.","Não reduza a obra a “desabafo pessoal”: ela fala de uma experiência coletiva."]);

["Descreva mentalmente a imagem: formas, cores, tema.","Formas geométricas e vários ângulos? Cubismo. Cores fortes e angústia? Expressionismo. Sonho e absurdo? Surrealismo. Luz e pinceladas soltas? Impressionismo.","Leia o texto que acompanha a imagem: ele costuma dar a pista."],

addLesson("arit", {t:"Matemática básica: frações, decimais e potências", inc:"A", r:"A base de quase todas as questões de Matemática e de Natureza. Sem isso, a conta trava.", v:"matemática básica frações potências enem aula",
c:[
"## Por que começar por aqui",
"Nos levantamentos das provas de 2009 a 2024, **matemática básica e proporcionalidade** são os assuntos que mais aparecem. Mesmo quando a questão é de Física ou Química, você precisa de frações, porcentagem e potências para chegar ao resultado. Como a prova **não permite calculadora**, a conta tem que sair na mão.",
"## Frações",
"- **Somar e subtrair:** deixe os denominadores iguais (MMC). 1/2 + 1/3 = 3/6 + 2/6 = 5/6.",
"- **Multiplicar:** em cima com em cima, embaixo com embaixo. 2/3 × 3/4 = 6/12 = 1/2.",
"- **Dividir:** repita a primeira e multiplique pelo inverso da segunda. (1/2) ÷ (1/4) = 1/2 × 4 = 2.",
"- **Simplificar sempre** antes de multiplicar números grandes: isso evita contas enormes.",
"## Decimais e porcentagem de cabeça",
"- 50% = metade; 25% = um quarto; 10% = dividir por 10; 1% = dividir por 100.",
"- 15% de 80: 10% é 8 e 5% é 4, então 15% = 12.",
"- 0,5 = 1/2; 0,25 = 1/4; 0,2 = 1/5; 0,75 = 3/4.",
"## Potências e notação científica",
"- a² × a³ = a⁵ (na multiplicação, soma os expoentes); a⁵ ÷ a² = a³ (na divisão, subtrai).",
"- (a²)³ = a⁶; a⁰ = 1; a⁻¹ = 1/a.",
"- **Notação científica:** 45.000 = 4,5 × 10⁴ e 0,003 = 3 × 10⁻³. Muito usada em Química e Física.",
"## Ordem das operações",
"Primeiro parênteses, depois potências e raízes, depois multiplicação e divisão, e por último soma e subtração. Errar a ordem é uma das pegadinhas mais comuns.",
"> Treine 10 minutos de conta por dia sem calculadora. Isso acelera a prova inteira de Matemática e de Natureza."
],
q:[
["Uma receita pede 3/4 de xícara de açúcar. Para fazer metade da receita, a quantidade de açúcar é",["1/4 de xícara","3/8 de xícara","1/2 xícara","3/2 de xícara","2/3 de xícara"],1,"Metade de 3/4 é 3/4 × 1/2 = 3/8."],
["Um produto de R$ 80,00 tem 15% de desconto. O valor do desconto é",["R$ 8,00","R$ 10,00","R$ 12,00","R$ 15,00","R$ 68,00"],2,"10% de 80 = 8; 5% de 80 = 4. Então 15% = 12."],
["O valor de 2³ × 2² é",["2⁵ = 32","2⁶ = 64","4⁵","2¹ = 2","6"],0,"Na multiplicação de potências de mesma base, somam-se os expoentes: 2³⁺² = 2⁵ = 32."],
["A distância da Terra ao Sol é de aproximadamente 150.000.000 km. Em notação científica, isso é",["15 × 10⁶ km","1,5 × 10⁸ km","1,5 × 10⁷ km","150 × 10⁶ km","1,5 × 10⁹ km"],1,"150.000.000 = 1,5 × 100.000.000 = 1,5 × 10⁸."],
["O resultado de 2 + 3 × 4 é",["20","14","24","9","10"],1,"A multiplicação vem antes da soma: 3 × 4 = 12; 2 + 12 = 14."]
]});

addLesson("port", {t:"Publicidade e divulgação científica", inc:"A", r:"Anúncios, campanhas e textos que explicam ciência para o público: estratégias de persuasão e de explicação.", v:"texto publicitário divulgação científica enem aula",
c:[
"## Por que esse assunto importa",
"Depois de interpretação e variação linguística, os textos de **publicidade** e de **divulgação científica** estão entre os mais cobrados em Português. A pergunta quase sempre é: **qual estratégia o texto usa para atingir o objetivo dele?**",
"## Publicidade e propaganda",
"- **Objetivo:** convencer o leitor a comprar, aderir a uma ideia ou mudar um comportamento (campanhas de saúde, trânsito, vacinação).",
"- **Recursos comuns:** verbos no imperativo (“Beba”, “Vacine-se”), o pronome “você”, trocadilhos e duplo sentido, rima, humor, imagens de impacto, dados assustadores e a autoridade de especialistas ou famosos.",
"- **Linguagem verbal + não verbal:** a imagem e o texto se completam. O sentido costuma nascer da relação entre os dois.",
"## Divulgação científica",
"- **Objetivo:** explicar um conhecimento científico para quem não é especialista.",
"- **Recursos comuns:** comparações com o cotidiano (“o vírus funciona como uma chave”), exemplos, definições simples, perguntas ao leitor, citação de pesquisadores e instituições, dados e gráficos.",
"- **Como reconhecer:** tom explicativo, linguagem acessível, vocabulário técnico explicado ao leitor.",
"## Enunciação: quem fala e para quem",
"Observe as marcas do enunciador (quem produz o texto) e do enunciatário (a quem se dirige): pronomes, vocativos, o registro formal ou informal. Isso revela a intenção e o público.",
"> Pergunta-chave para toda questão desse tipo: qual recurso o autor usou e para quê?"
],
q:[
["Uma campanha de trânsito traz a imagem de um celular rachado e a frase: “Essa mensagem pode esperar. Você não volta.” A estratégia principal da campanha é",["apresentar dados estatísticos sobre acidentes.","usar o apelo emocional e o imperativo implícito para mudar um comportamento.","explicar o funcionamento dos celulares.","vender um modelo de celular mais resistente.","narrar a história de um motorista famoso."],1,"A imagem de impacto e a frase dirigida ao leitor (“você”) buscam comovê-lo e fazê-lo deixar o celular de lado ao dirigir."],
["Um texto de revista explica: “O sistema imunológico funciona como um exército: cada célula tem uma função na defesa do corpo.” Esse recurso, típico da divulgação científica, é",["uma comparação que aproxima o conceito científico do cotidiano.","uma ironia que critica a ciência.","um erro científico grave.","uma linguagem técnica sem explicação.","um slogan publicitário."],0,"Comparar o sistema imune a um exército torna o conceito compreensível para o leigo."],
["Em uma propaganda, o uso do pronome “você” e de verbos no imperativo tem o objetivo de",["tornar o texto impessoal.","aproximar-se do leitor e convencê-lo a agir.","mostrar a opinião de um cientista.","informar dados de forma neutra.","dificultar a leitura."],1,"São marcas da função conativa: o texto se dirige diretamente ao leitor para persuadi-lo."],
["Uma característica que diferencia o texto de divulgação científica do artigo científico é",["o uso de linguagem acessível e de exemplos do cotidiano.","a ausência de qualquer informação científica.","o uso obrigatório de humor.","a presença de rimas.","a falta de fontes."],0,"A divulgação científica traduz o conhecimento especializado para o público geral, com linguagem simples e exemplos."]
]});

addLesson("filo", {t:"Lógica, argumentação e falácias", inc:"M", r:"Como reconhecer um bom argumento e os truques que parecem lógicos, mas não são.", v:"lógica argumentação falácias filosofia enem aula",
c:[
"## O que é um argumento",
"Um argumento tem **premissas** (as razões) e uma **conclusão** (o que se quer provar). Ele é bom quando as premissas são verdadeiras e sustentam a conclusão.",
"## Dedução e indução",
"- **Dedução:** parte do geral para o particular. Se as premissas forem verdadeiras, a conclusão é necessariamente verdadeira. É o **silogismo** de Aristóteles: “Todo ser humano é mortal. Sócrates é humano. Logo, Sócrates é mortal.”",
"- **Indução:** parte de casos particulares para uma conclusão geral. A conclusão é provável, e não garantida. “Todos os cisnes que vi são brancos, logo todos os cisnes são brancos” (existem cisnes negros!).",
"## Falácias: argumentos que enganam",
"- **Ataque à pessoa (ad hominem):** critica quem fala em vez do argumento. “Não ouça o que ele diz sobre economia, ele é feio.”",
"- **Apelo à autoridade:** “É verdade porque um famoso disse.”",
"- **Apelo à maioria (ad populum):** “Todo mundo acredita, então é verdade.”",
"- **Espantalho:** distorce o argumento do outro para atacar uma versão mais fraca.",
"- **Falsa dicotomia:** apresenta só duas opções quando existem outras. “Ou você está comigo ou contra mim.”",
"- **Generalização apressada:** conclui algo geral a partir de poucos casos.",
"- **Causa falsa:** “Choveu depois que comprei o guarda-chuva, então o guarda-chuva trouxe a chuva.”",
"## Onde isso aparece no ENEM",
"Em Filosofia, em textos de opinião e em questões sobre fake news. E, principalmente, na sua **redação**: argumentar bem é a Competência 3!",
"> Ao ler uma notícia ou um post, pergunte: quais são as razões? Elas sustentam mesmo a conclusão?"
],
q:[
["“Todos os mamíferos respiram por pulmões. A baleia é um mamífero. Logo, a baleia respira por pulmões.” Esse raciocínio é um exemplo de",["indução","dedução (silogismo)","falácia do espantalho","apelo à autoridade","analogia"],1,"Parte de uma regra geral para um caso particular, com conclusão necessária: é um silogismo dedutivo."],
["Num debate, um candidato responde a uma proposta dizendo: “Não dá para confiar nessa ideia, porque quem a propôs já perdeu uma eleição.” Ele cometeu a falácia",["ad hominem (ataque à pessoa)","de generalização apressada","de causa falsa","ad populum","de falsa dicotomia"],0,"Ele ataca a pessoa, e não o conteúdo da proposta."],
["“Milhões de pessoas compartilharam essa notícia, então ela deve ser verdadeira.” O erro desse argumento é",["apelo à maioria (ad populum)","silogismo válido","dedução correta","ataque à pessoa","espantalho"],0,"A quantidade de pessoas que acredita em algo não prova que seja verdade."],
["Um estudante conheceu três pessoas de uma cidade que eram antipáticas e concluiu que “todos daquela cidade são antipáticos”. Trata-se de",["dedução válida","generalização apressada","argumento de autoridade","falsa dicotomia","raciocínio científico"],1,"Poucos casos não autorizam uma conclusão sobre um grupo inteiro."]
]});

q:[

["Qual atividade é a mais indicada durante a pausa de 5 minutos?",["Abrir as redes sociais.","Levantar, beber água e se alongar.","Começar outra matéria.","Assistir a um episódio de série.","Responder todas as mensagens."],1,"Movimento e água descansam o cérebro sem o risco de a pausa virar uma hora."],

addLesson("hbr", {o:-1, t:"Povos indígenas e a conquista", inc:"A", r:"Quem vivia aqui antes de 1500, o que mudou com a chegada dos portugueses e a luta indígena até hoje.", v:"povos indígenas brasil colonização história enem aula",
c:[
"## Antes de 1500",
"O território que hoje é o Brasil era habitado por milhões de pessoas (as estimativas variam de 2 a 5 milhões), de centenas de povos diferentes. Os **tupis-guaranis** ocupavam boa parte do litoral; os **macro-jês** (chamados de “tapuias” pelos portugueses) ficavam mais no interior.",
"- Não eram “um povo só”: cada grupo tinha língua, crenças e organização próprias.",
"- Viviam da caça, pesca, coleta e agricultura (mandioca, milho). A terra era de uso coletivo.",
"## O encontro e o choque",
"A chegada dos europeus trouxe **epidemias** (varíola, gripe, sarampo), guerras e escravização. Doenças para as quais os indígenas não tinham imunidade mataram muito mais que as armas.",
"- **Escambo:** troca de trabalho (corte do pau-brasil) por objetos como facas e espelhos.",
"- **Escravidão indígena:** existiu durante toda a colônia, apesar de leis que a limitavam. Os **bandeirantes** capturavam indígenas no interior.",
"- **Catequese:** os jesuítas reuniam indígenas em aldeamentos, impondo a fé cristã e mudando seus costumes. Também os protegiam de parte da escravização.",
"## Resistência",
"Os povos indígenas não foram passivos: houve guerras (como a **Confederação dos Tamoios**, 1554–1567), fugas para o interior, alianças estratégicas e a preservação de línguas e rituais.",
"> O ENEM costuma criticar a visão do indígena como “selvagem” ou “preguiçoso”. Essa visão é **eurocêntrica** e **etnocêntrica**.",
"## Os indígenas hoje",
"- A **Constituição de 1988** (art. 231) reconhece os direitos originários dos indígenas sobre as terras que tradicionalmente ocupam e garante sua organização social, costumes e línguas.",
"- O Censo de 2022 contou cerca de **1,7 milhão** de indígenas, de mais de 300 povos, falando mais de 270 línguas.",
"- Debates atuais: **demarcação de terras**, a tese do **marco temporal**, garimpo ilegal (como a crise humanitária Yanomami) e o papel das terras indígenas na preservação da floresta.",
"- A **Lei 11.645/2008** tornou obrigatório o ensino de história e cultura afro-brasileira e indígena nas escolas."
],
q:[
["A principal causa da queda demográfica indígena após 1500 foi",["a migração voluntária para a Europa.","as epidemias trazidas pelos europeus, somadas à guerra e à escravização.","a falta de alimentos causada pela seca.","a proibição da agricultura pelos jesuítas.","o baixo número de nascimentos antes da chegada dos portugueses."],1,"Varíola, sarampo e gripe mataram em massa, porque os indígenas não tinham imunidade."],
["Chamar os povos indígenas genericamente de “índios preguiçosos” é uma visão",["científica e neutra.","etnocêntrica, que julga outras culturas pelos valores europeus.","defendida pela Constituição de 1988.","baseada nos dados do IBGE.","própria dos povos tupis."],1,"Julgar outra cultura a partir da própria é etnocentrismo, visão criticada no ENEM."],
["O escambo praticado no início da colonização consistia em",["troca de trabalho indígena por objetos europeus.","pagamento de salários em ouro.","venda de terras indígenas à Coroa.","comércio de açúcar com a Holanda.","cobrança de impostos dos indígenas."],0,"Os indígenas cortavam e carregavam o pau-brasil em troca de ferramentas e adornos."],
["A Constituição de 1988 reconhece aos povos indígenas",["a obrigação de se integrarem à sociedade nacional.","direitos originários sobre as terras que tradicionalmente ocupam.","a proibição de falar suas línguas nas escolas.","a perda das terras não registradas em cartório.","a tutela permanente do Estado sobre suas decisões."],1,"O artigo 231 reconhece os direitos originários: eles existiam antes do próprio Estado brasileiro."],
["Os aldeamentos jesuíticos tinham como característica",["preservar integralmente os costumes indígenas.","reunir indígenas para catequizá-los, transformando seus modos de vida.","treinar indígenas para lutar contra Portugal.","vender indígenas aos engenhos.","ensinar o tupi apenas aos europeus."],1,"A catequese impunha o cristianismo e novos hábitos, ainda que protegesse de parte da escravização."],
["A tese do “marco temporal”, muito debatida no Brasil recente, trata",["da data de fundação das capitais.","da ideia de que só seriam indígenas as terras ocupadas em 5 de outubro de 1988.","do calendário escolar indígena.","do fim do horário de verão.","da data da primeira missa no Brasil."],1,"Os povos indígenas contestam a tese porque muitos foram expulsos de suas terras antes de 1988."],
["Os bandeirantes, no período colonial, são associados",["à defesa dos direitos indígenas.","à captura de indígenas e à busca de metais no interior.","à abolição da escravidão.","à fundação dos quilombos.","ao comércio de pau-brasil no litoral."],1,"As bandeiras paulistas escravizavam indígenas e depois encontraram ouro em Minas Gerais."],
["A Lei 11.645/2008 tem como objetivo",["proibir o ensino de línguas indígenas.","tornar obrigatório o ensino de história e cultura afro-brasileira e indígena.","criar reservas de mineração em terras indígenas.","acabar com a Funai.","transformar os indígenas em funcionários públicos."],1,"A lei combate o apagamento dessas histórias no currículo escolar."]
]});

addLesson("hbr", {o:0.5, t:"África, escravidão e resistência negra", inc:"A", r:"O tráfico atlântico, a vida sob a escravidão e as muitas formas de luta dos africanos e seus descendentes.", v:"escravidão no brasil resistência quilombos história enem aula",
c:[
"## A África antes do tráfico",
"A África tinha reinos e impérios complexos, como **Mali**, **Songai**, **Congo** e **Daomé**, com comércio, cidades e produção de conhecimento (Tombuctu era um centro de estudos). A escravidão existia no continente, mas o **tráfico atlântico** a transformou em um negócio gigantesco e racializado.",
"## O tráfico atlântico",
"- Entre os séculos XVI e XIX, cerca de **12 milhões** de africanos foram embarcados para as Américas; o Brasil recebeu aproximadamente **4,8 milhões**, o maior número.",
"- O tráfico era um negócio muito lucrativo para comerciantes portugueses e brasileiros.",
"- Nos **navios negreiros** (tumbeiros), as condições eram desumanas e muitos morriam na travessia.",
"## A vida sob a escravidão",
"Escravizados trabalhavam nos engenhos, nas minas, nas cidades (como **escravos de ganho**, que vendiam produtos e serviços e entregavam parte do dinheiro ao senhor) e nas casas. Eram submetidos a castigos físicos e à separação das famílias.",
"## Formas de resistência",
"- **Quilombos:** comunidades de fugitivos. Palmares (século XVII) chegou a ter milhares de habitantes.",
"- **Revoltas:** a **Revolta dos Malês** (Salvador, 1835), de africanos muçulmanos, foi a maior revolta urbana de escravizados do Brasil.",
"- **Resistência cotidiana:** fugas, sabotagem do trabalho, compra da alforria, irmandades religiosas.",
"- **Cultura:** manutenção de religiões (candomblé), línguas, música, capoeira e culinária.",
"> A resistência cultural também é resistência. O ENEM valoriza o protagonismo negro, não só o sofrimento.",
"## Herança e racismo estrutural",
"O fim da escravidão sem integração deixou uma herança de desigualdade. O **racismo estrutural** é o racismo presente nas instituições e na organização da sociedade, e não só em atitudes individuais. Hoje existem as **comunidades remanescentes de quilombos**, com direito à terra garantido pela Constituição de 1988."
],
q:[
["A Revolta dos Malês (1835), em Salvador, foi organizada por",["fazendeiros contra o Império.","africanos escravizados e libertos, em grande parte muçulmanos.","indígenas contra os jesuítas.","imigrantes italianos.","militares republicanos."],1,"“Malê” vem de imalê, muçulmano em iorubá; foi a maior revolta urbana de escravizados do país."],
["O Brasil, em relação ao tráfico atlântico de africanos,",["recebeu poucos africanos em comparação a outros países.","foi o país que mais recebeu africanos escravizados nas Américas.","proibiu o tráfico logo após a Independência, sem exceções.","não teve escravidão africana, só indígena.","recebia africanos apenas como trabalhadores assalariados."],1,"Foram cerca de 4,8 milhões de pessoas, o maior contingente das Américas."],
["Os chamados “escravos de ganho” eram",["escravizados que trabalhavam nas ruas vendendo produtos ou serviços e repassavam parte do ganho ao senhor.","trabalhadores livres europeus.","escravizados que viviam em quilombos.","indígenas catequizados.","capatazes dos engenhos."],0,"Eram comuns nas cidades e às vezes conseguiam juntar dinheiro para comprar a alforria."],
["Manter o candomblé, a capoeira e a culinária de origem africana pode ser entendido como",["aceitação total da escravidão.","forma de resistência cultural dos africanos e seus descendentes.","imposição dos senhores de engenho.","costume trazido pelos portugueses.","prática proibida pela Constituição de 1988."],1,"Preservar a própria cultura sob opressão é uma forma de resistência."],
["O racismo estrutural é aquele que",["aparece apenas em ofensas individuais.","está presente nas instituições e na organização social, produzindo desigualdades mesmo sem intenção explícita.","deixou de existir com a Lei Áurea.","atinge igualmente todos os grupos.","só existe em outros países."],1,"É o racismo “normalizado” na sociedade, visível em indicadores de renda, violência e acesso à educação."],
["As comunidades remanescentes de quilombos têm, pela Constituição de 1988,",["direito à propriedade das terras que ocupam.","obrigação de deixar suas terras.","proibição de manter suas tradições.","dever de pagar impostos especiais.","nenhum direito específico."],0,"O Ato das Disposições Transitórias (art. 68) garante o título das terras aos quilombolas."],
["Tombuctu, no Império do Mali, é lembrada por ter sido",["um porto de navios negreiros portugueses.","um importante centro de comércio e de estudos na África.","a capital do Império Romano.","um quilombo brasileiro.","uma colônia inglesa."],1,"A cidade tinha bibliotecas e escolas, o que desmonta a ideia de uma África “sem história”."],
["A alforria era",["a carta que dava liberdade a um escravizado.","um imposto sobre o ouro.","um tipo de castigo físico.","o nome do navio negreiro.","a proibição do tráfico."],0,"Podia ser comprada, concedida ou condicionada; muitos escravizados juntavam dinheiro por anos para obtê-la."]
]});

addLesson("hbr", {o:1.5, t:"Abolição e pós-abolição", inc:"A", r:"Como a escravidão acabou, quem lutou por isso e por que a liberdade veio sem igualdade.", v:"abolição da escravatura lei áurea pós-abolição enem aula",
c:[
"## Um fim lento e gradual",
"A abolição foi feita em etapas, para proteger os interesses dos fazendeiros:",
"1. **Lei Eusébio de Queirós (1850):** proibiu o tráfico de africanos (pressão da Inglaterra, que queria mercados consumidores e combatia o tráfico).",
"2. **Lei do Ventre Livre (1871):** filhos de escravizadas nascidos a partir dessa data seriam livres, mas podiam ficar sob a guarda do senhor até os 21 anos.",
"3. **Lei dos Sexagenários (1885):** libertava escravizados com mais de 60 anos (poucos chegavam a essa idade).",
"4. **Lei Áurea (13 de maio de 1888):** aboliu a escravidão, sem indenização aos senhores e sem nenhum apoio aos libertos.",
"## Quem lutou pela abolição",
"- **Abolicionistas:** Joaquim Nabuco, **André Rebouças**, **Luiz Gama** (ex-escravizado que libertou centenas de pessoas nos tribunais), José do Patrocínio.",
"- **Os próprios escravizados:** fugas em massa das fazendas paulistas nos anos 1880, quilombos abolicionistas (como o do Jabaquara), ações na Justiça.",
"- **Jangadeiros do Ceará**, liderados por Francisco José do Nascimento (o **Dragão do Mar**), que se recusaram a transportar escravizados. O Ceará aboliu a escravidão em 1884.",
"> A abolição não foi um presente da princesa Isabel: foi resultado de muita luta, principalmente dos próprios negros.",
"## Liberdade sem igualdade",
"- Os libertos não receberam terra, indenização, educação ou emprego.",
"- A **Lei de Terras (1850)** já tinha dificultado o acesso à terra: ela só podia ser obtida por compra.",
"- O Estado incentivou a **imigração europeia**, ligada à ideia racista de **branqueamento** da população.",
"- Surgiram formas de controle, como a criminalização da **vadiagem** e da capoeira no Código Penal de 1890.",
"## Consequências até hoje",
"A falta de integração ajuda a explicar a concentração de pessoas negras nas periferias e favelas, as desigualdades de renda e de escolaridade e a violência maior contra a população negra."
],
q:[
["A Lei do Ventre Livre (1871) determinava que",["todos os escravizados estavam livres.","os filhos de escravizadas nascidos a partir daquela data seriam considerados livres.","os escravizados com mais de 60 anos seriam libertos.","o tráfico de africanos estava proibido.","os senhores receberiam indenização pela abolição."],1,"Na prática, as crianças podiam continuar trabalhando para o senhor até os 21 anos."],
["A Lei Eusébio de Queirós (1850) foi aprovada, em grande parte, por causa",["da pressão da Inglaterra contra o tráfico negreiro.","de uma revolta dos cafeicultores.","da Proclamação da República.","da Guerra do Paraguai.","do pedido dos jesuítas."],0,"A Inglaterra, industrializada, combatia o tráfico e apreendia navios negreiros."],
["Luiz Gama é lembrado na história do Brasil por",["ser o primeiro presidente negro.","ter sido escravizado e depois atuado como advogado, libertando centenas de pessoas na Justiça.","ter assinado a Lei Áurea.","ter liderado a Revolta da Chibata.","ter fundado o Quilombo dos Palmares."],1,"Autodidata, Gama usou as leis contra a escravidão ilegal e é símbolo do abolicionismo negro."],
["Um problema central do pós-abolição no Brasil foi que",["os libertos receberam terras e indenizações.","a liberdade veio sem políticas de integração, como acesso à terra, à educação e ao trabalho.","todos os ex-escravizados migraram para a Europa.","o racismo acabou imediatamente.","os fazendeiros foram presos."],1,"Sem apoio do Estado, os libertos ficaram à margem, o que está na raiz de desigualdades atuais."],
["A política de incentivo à imigração europeia no fim do século XIX estava associada",["ao desejo de industrializar o Nordeste.","à ideologia racista do branqueamento da população.","à falta total de trabalhadores no país.","à proibição do trabalho assalariado.","à reforma agrária."],1,"Havia mão de obra livre (os libertos), mas as elites preferiam imigrantes brancos."],
["O Ceará aboliu a escravidão em 1884, antes da Lei Áurea, com destaque para",["os jangadeiros que se recusaram a transportar escravizados.","a ação dos bandeirantes.","a chegada da família real.","os tenentes do Exército.","a Revolta dos Malês."],0,"Liderados pelo Dragão do Mar, os jangadeiros pararam o embarque de escravizados no porto de Fortaleza."],
["A Lei dos Sexagenários (1885) foi criticada porque",["libertou todos os escravizados de uma vez.","beneficiava poucos, já que raramente os escravizados chegavam aos 60 anos.","deu terras aos libertos.","proibiu a imigração.","acabou com o tráfico."],1,"A expectativa de vida sob a escravidão era baixa; a lei tinha pouco efeito prático."],
["A criminalização da “vadiagem” e da capoeira no Código Penal de 1890 pode ser interpretada como",["forma de controle social da população negra recém-liberta.","incentivo à cultura afro-brasileira.","política de geração de empregos.","medida para integrar os libertos.","exigência dos abolicionistas."],0,"Sem trabalho formal, muitos libertos passaram a ser perseguidos pela polícia."]
]});
TIP("hbr-8",
["Leis abolicionistas em ordem.","Protagonismo negro na abolição.","Pós-abolição e desigualdade racial atual."],
["Memorize a ordem: 1850 (tráfico), 1871 (ventre livre), 1885 (sexagenários), 1888 (Áurea).","Pergunte: a lei mudou a vida dos negros de verdade?","Ligue a falta de integração às desigualdades de hoje."],
["A abolição não foi “concedida” pela princesa: foi conquistada.","A Lei Áurea não deu terra nem indenização aos libertos."]);

addLesson("hbr", {o:2.5, t:"Messianismo, cangaço e revoltas da Primeira República", inc:"M", r:"Canudos, Contestado, cangaço e as revoltas urbanas: o povo contra a República das oligarquias.", v:"canudos contestado revolta da vacina primeira república enem aula",
c:[
"## Por que tanta revolta?",
"A Primeira República (1889–1930) era controlada pelas oligarquias. O povo pobre, no campo e na cidade, não tinha voz: o voto era aberto, controlado pelos **coronéis** (voto de cabresto), e analfabetos não votavam.",
"## Messianismo no campo",
"- **Canudos (1896–1897, Bahia):** milhares de sertanejos seguiram **Antônio Conselheiro** e formaram uma comunidade que dividia o que produzia. Foram acusados de monarquistas e massacrados pelo Exército após quatro expedições. Euclides da Cunha narrou a guerra em **Os Sertões** (1902).",
"- **Contestado (1912–1916, Paraná e Santa Catarina):** camponeses expulsos de suas terras pela construção de uma ferrovia e por uma madeireira estrangeira seguiram líderes religiosos (os “monges”) e foram derrotados pelo Exército.",
"> Messianismo: movimento que espera um líder salvador. No ENEM, ele aparece ligado à miséria e à falta de terra, e não à “ignorância”.",
"## Cangaço",
"Grupos armados que percorriam o sertão nordestino, como o bando de **Lampião** e Maria Bonita. Para uns, eram bandidos; para outros, uma reação à violência dos coronéis e à miséria. É um exemplo de **banditismo social**.",
"## Revoltas urbanas",
"- **Revolta da Vacina (1904, Rio de Janeiro):** contra a vacinação obrigatória, mas também contra a reforma urbana que derrubou cortiços e expulsou os pobres do centro (o “bota-abaixo” de Pereira Passos).",
"- **Revolta da Chibata (1910):** marinheiros, em sua maioria negros, liderados por **João Cândido**, contra os castigos físicos na Marinha.",
"- **Greve geral de 1917:** operários, muitos imigrantes anarquistas, por salários e jornada de trabalho.",
"## O que elas têm em comum",
"Em todas, grupos excluídos reagiram à desigualdade e ao autoritarismo, e o Estado respondeu com repressão."
],
q:[
["A Guerra de Canudos terminou com",["a vitória dos sertanejos e a criação de um novo estado.","a destruição do arraial pelo Exército e a morte de milhares de pessoas.","um acordo de reforma agrária.","a volta da monarquia.","a prisão de Lampião."],1,"Foram necessárias quatro expedições; o arraial foi arrasado em 1897."],
["A Guerra do Contestado está ligada",["à construção de uma ferrovia e à expulsão de camponeses de suas terras.","à vacinação obrigatória.","à luta contra os castigos na Marinha.","à Revolução de 1930.","à Independência do Brasil."],0,"A concessão de terras a uma empresa estrangeira desalojou os posseiros da região."],
["O livro “Os Sertões”, de Euclides da Cunha, retrata",["a Revolta da Chibata.","a Guerra de Canudos.","a Semana de 22.","a Era Vargas.","a Inconfidência Mineira."],1,"Euclides acompanhou a guerra como jornalista e escreveu uma das obras mais importantes do país."],
["Além do medo da vacina, a Revolta da Vacina (1904) foi motivada",["pela reforma urbana que derrubou cortiços e expulsou os pobres do centro do Rio.","pela abolição da escravidão.","pela crise de 1929.","pela chegada da família real.","pelo fim do voto de cabresto."],0,"O “bota-abaixo” e o modo autoritário da vacinação geraram grande revolta popular."],
["João Cândido, o “Almirante Negro”, liderou",["a Revolta da Chibata contra os castigos físicos na Marinha.","a Guerra de Canudos.","o cangaço no sertão.","a greve geral de 1917.","a Coluna Prestes."],0,"Os marinheiros tomaram navios e ameaçaram bombardear o Rio até o fim das chibatadas."],
["O cangaço pode ser interpretado, por alguns historiadores, como",["um movimento operário urbano.","banditismo social ligado à miséria e à violência dos coronéis no sertão.","uma revolta de militares.","um movimento de imigrantes.","uma política do governo federal."],1,"Os cangaceiros eram temidos, mas também expressavam a desigualdade do sertão."],
["Os movimentos messiânicos da Primeira República são explicados, no ENEM, principalmente por",["fanatismo e ignorância dos sertanejos.","condições de miséria, concentração de terras e abandono do Estado.","influência de ideias comunistas.","apoio da elite cafeeira.","incentivo da Igreja Católica oficial."],1,"A religiosidade se unia à busca por terra e por uma vida mais digna."],
["O voto de cabresto, típico da Primeira República, significava",["voto secreto e livre.","o controle dos votos pelos coronéis, com voto aberto e sob pressão.","direito de voto às mulheres.","voto obrigatório para analfabetos.","eleição indireta pelo Congresso."],1,"O voto era aberto, então o coronel sabia em quem cada um votava."]
]});
TIP("hbr-9",
["Canudos e Contestado (terra e religião).","Revolta da Vacina e da Chibata.","Coronelismo e voto de cabresto."],
["Identifique se é revolta rural (messiânica) ou urbana.","Procure a causa social por trás da revolta.","Veja como o Estado respondeu (quase sempre com repressão)."],
["Não chame Canudos de “fanatismo”: o ENEM valoriza a explicação social.","A Revolta da Vacina não foi só contra a vacina."]);

addLesson("hbr", {o:3.5, t:"República Populista (1945–1964)", inc:"A", r:"Dutra, Vargas, JK, Jânio e Jango: desenvolvimento, populismo e o caminho até o golpe de 1964.", v:"república populista jk jango brasil 1945 1964 enem aula",
c:[
"## O que foi o período",
"Entre o fim do Estado Novo (1945) e o golpe militar (1964), o Brasil viveu uma experiência democrática com eleições diretas, partidos e forte participação popular. A marca da época é o **populismo**: líderes carismáticos que buscavam apoio direto das massas urbanas.",
"## Os governos",
"- **Dutra (1946–1951):** nova Constituição (1946), alinhamento aos EUA na Guerra Fria e proibição do Partido Comunista.",
"- **Vargas (1951–1954):** volta pelo voto. Campanha **“O petróleo é nosso”** e criação da **Petrobras** (1953). Sob forte pressão, suicidou-se em 1954 (“Saio da vida para entrar na história”).",
"- **Juscelino Kubitschek (1956–1961):** **Plano de Metas** (“50 anos em 5”), indústria automobilística, estradas e a construção de **Brasília** (1960). Custos: inflação e dívida externa.",
"- **Jânio Quadros (1961):** eleito com a vassoura (“varrer a corrupção”), renunciou após 7 meses.",
"- **João Goulart, o Jango (1961–1964):** assumiu sob um parlamentarismo improvisado; depois defendeu as **Reformas de Base** (agrária, urbana, educacional, eleitoral).",
"## O caminho até o golpe",
"As Reformas de Base assustaram a elite, parte da classe média, a Igreja conservadora e os militares, num contexto de Guerra Fria e medo do comunismo. Houve a **Marcha da Família com Deus pela Liberdade** e, em 31 de março/1º de abril de 1964, o golpe civil-militar, com apoio dos EUA.",
"> Populismo não é só “enganar o povo”: foi também um período de conquistas trabalhistas e de grande mobilização social (sindicatos, Ligas Camponesas, estudantes)."
],
q:[
["O Plano de Metas de Juscelino Kubitschek tinha como lema",["“O petróleo é nosso”.","“50 anos em 5”.","“Brasil, ame-o ou deixe-o”.","“Diretas Já”.","“Ordem e Progresso”."],1,"JK prometia acelerar o desenvolvimento com indústria, energia, transportes e Brasília."],
["A criação da Petrobras (1953) está associada",["ao governo Dutra e ao liberalismo econômico.","à campanha “O petróleo é nosso” e ao nacionalismo do segundo governo Vargas.","à ditadura militar.","ao Plano Real.","ao governo de Jânio Quadros."],1,"A estatal garantiu o monopólio da exploração do petróleo pelo Estado brasileiro."],
["As Reformas de Base defendidas por João Goulart incluíam",["privatização das estatais.","reforma agrária, urbana, educacional e eleitoral.","o fim dos direitos trabalhistas.","a volta da monarquia.","o fechamento do Congresso."],1,"As propostas assustaram os setores conservadores e foram usadas para justificar o golpe."],
["Um custo do desenvolvimento acelerado no governo JK foi",["a queda da produção industrial.","o aumento da inflação e da dívida externa.","o fim da indústria automobilística.","a mudança da capital para Salvador.","a proibição do investimento estrangeiro."],1,"O crescimento foi financiado com emissão de moeda e empréstimos."],
["O populismo, no Brasil de 1945 a 1964, caracterizou-se por",["líderes carismáticos que buscavam apoio direto das massas urbanas.","governos militares sem eleições.","monarquia parlamentar.","total ausência de participação popular.","voto censitário."],0,"Getúlio, JK e Jango se apresentavam como defensores do povo e dos trabalhadores."],
["A Marcha da Família com Deus pela Liberdade (1964) expressava",["apoio de setores conservadores à derrubada de Jango.","a luta pela reforma agrária.","o apoio das Ligas Camponesas ao governo.","o movimento pelas Diretas Já.","a campanha “O petróleo é nosso”."],0,"Setores da classe média e da Igreja conservadora protestaram contra o “perigo comunista”."],
["A construção de Brasília teve como um de seus objetivos",["levar o desenvolvimento e a ocupação para o interior do país.","concentrar ainda mais a economia no litoral.","acabar com a indústria.","criar um quilombo.","abrigar a família real."],0,"A interiorização da capital estava prevista desde a Constituição de 1891."],
["O golpe de 1964 ocorreu no contexto internacional",["da Guerra Fria, com o medo do comunismo e o apoio dos EUA.","da Primeira Guerra Mundial.","da Revolução Industrial.","do fim da União Soviética.","da crise de 2008."],0,"Após a Revolução Cubana (1959), os EUA apoiaram golpes contra governos reformistas na América Latina."]
]});
TIP("hbr-10",
["JK e o nacional-desenvolvimentismo.","Vargas, Petrobras e nacionalismo.","Reformas de Base e o golpe de 1964."],
["Associe cada presidente à sua marca (Petrobras, Brasília, renúncia, Reformas de Base).","Pense no contexto da Guerra Fria.","Veja quem apoiou e quem se opôs ao governo."],
["O golpe de 1964 teve apoio civil, não foi só militar.","Não confunda o Estado Novo (ditadura) com o segundo governo Vargas (eleito)."]);

addLesson("hbr", {o:5.5, t:"Memória, patrimônio e cidadania", inc:"M", r:"Patrimônio histórico, cultura afro-brasileira e indígena, e a luta por direitos na história recente.", v:"patrimônio cultural material imaterial iphan enem aula",
c:[
"## Patrimônio cultural",
"Patrimônio é tudo o que uma sociedade considera importante preservar da sua história. O órgão federal responsável é o **Iphan** (Instituto do Patrimônio Histórico e Artístico Nacional).",
"- **Material:** bens físicos, como igrejas barrocas de Ouro Preto, o Pelourinho (Salvador), sítios arqueológicos.",
"- **Imaterial:** saberes, celebrações, formas de expressão e lugares, como o **samba de roda do Recôncavo**, o **frevo**, a **capoeira**, o **ofício das baianas de acarajé**, o **jongo** e a **arte Kusiwa** dos Wajãpi.",
"- **Tombamento:** o ato que protege um bem material; bens imateriais são **registrados**.",
"> O ENEM gosta de mostrar que patrimônio não é só “prédio velho de gente rica”: a cultura popular, negra e indígena também é patrimônio.",
"## Memória e disputa",
"Memória é uma construção: a sociedade escolhe o que lembrar e o que esquecer. Por isso há debates sobre **estátuas de bandeirantes e escravocratas**, nomes de ruas de ditadores e a criação de **lugares de memória** (como o Cais do Valongo, no Rio, principal porto de chegada de africanos escravizados, reconhecido como Patrimônio Mundial pela Unesco em 2017).",
"## Cidadania no Brasil",
"O historiador **José Murilo de Carvalho** mostrou que, no Brasil, os direitos vieram em ordem diferente da Inglaterra:",
"1. Primeiro os **sociais** (leis trabalhistas na Era Vargas, em plena ditadura).",
"2. Depois os **políticos** (voto), com muitas interrupções.",
"3. Por último e ainda incompletos, os **civis** (liberdade, igualdade perante a lei, segurança).",
"## Movimentos e conquistas recentes",
"- Movimento negro: Dia da Consciência Negra, cotas, **Lei 10.639/2003** (ensino de história afro-brasileira), criminalização do racismo (inafiançável e imprescritível pela Constituição).",
"- Movimento feminista: **Lei Maria da Penha (2006)** e a Lei do Feminicídio (2015).",
"- Direitos das pessoas com deficiência, da população LGBTQIA+ e dos idosos (Estatuto do Idoso, 2003)."
],
q:[
["O samba de roda do Recôncavo Baiano e o ofício das baianas de acarajé são exemplos de",["patrimônio material tombado.","patrimônio imaterial registrado pelo Iphan.","bens privados sem valor histórico.","monumentos da época imperial.","patrimônio natural."],1,"Saberes e celebrações são patrimônio imaterial e são registrados, não tombados."],
["O Cais do Valongo, no Rio de Janeiro, é um importante lugar de memória porque",["foi o local da proclamação da República.","foi o principal porto de desembarque de africanos escravizados nas Américas.","abrigou a primeira fábrica do Brasil.","foi a primeira capital do país.","recebeu a família real em 1808."],1,"Reconhecido pela Unesco em 2017, lembra a dimensão do tráfico e a presença africana."],
["Segundo José Murilo de Carvalho, no Brasil os direitos sociais",["vieram por último.","vieram antes dos direitos políticos e civis, em grande parte durante a Era Vargas.","nunca existiram.","foram conquistados junto com a Independência.","dependem apenas do voto."],1,"Os direitos trabalhistas vieram “de cima”, num governo autoritário."],
["A Lei 10.639/2003 tornou obrigatório",["o ensino de história e cultura afro-brasileira nas escolas.","o voto aos 16 anos.","o serviço militar feminino.","o tombamento de todas as igrejas.","o ensino religioso católico."],0,"Depois, a Lei 11.645/2008 incluiu também a história e cultura indígena."],
["O tombamento é um instrumento que",["destrói prédios antigos.","protege bens materiais de valor histórico, artístico ou cultural.","registra festas populares.","vende patrimônio público.","cria feriados nacionais."],1,"Um bem tombado não pode ser demolido ou descaracterizado."],
["O debate sobre retirar ou ressignificar estátuas de escravocratas mostra que a memória",["é neutra e não muda.","é uma construção social, marcada por disputas.","só interessa aos historiadores.","é definida apenas pelo governo.","não tem relação com o presente."],1,"O que se homenageia no espaço público revela valores, e esses valores mudam com o tempo."],
["A Constituição de 1988 define o racismo como crime",["com fiança baixa.","inafiançável e imprescritível.","que só pode ser julgado em outro país.","sem pena de prisão.","que prescreve em um ano."],1,"Isso mostra a gravidade que a sociedade passou a dar ao racismo."],

addLesson("hge", {o:-1, t:"Pré-história e primeiras civilizações", inc:"B", r:"Da origem da humanidade às primeiras cidades: Mesopotâmia, Egito e as civilizações da Ásia e da América.", v:"pré-história mesopotâmia egito antigo história enem aula",
c:[
"## Pré-história",
"É o período antes da escrita (que surgiu por volta de 4000 a.C.). O nome é criticado, porque povos sem escrita também têm história.",
"- **Paleolítico:** pedra lascada, caça e coleta, **nomadismo**, domínio do fogo, pinturas rupestres.",
"- **Neolítico:** pedra polida e a **Revolução Agrícola**: agricultura, domesticação de animais, **sedentarização** e primeiras aldeias.",
"- **Idade dos Metais:** cobre, bronze e ferro; aldeias viram cidades.",
"> O Brasil tem um dos sítios mais importantes das Américas: a **Serra da Capivara** (Piauí), com pinturas rupestres milenares.",
"## Mesopotâmia (entre os rios Tigre e Eufrates)",
"- Sumérios, babilônios, assírios. Escrita **cuneiforme** (em placas de argila).",
"- **Código de Hamurábi:** um dos primeiros conjuntos de leis escritas, com a lógica do “olho por olho, dente por dente” (Lei de Talião).",
"## Egito (às margens do Nilo)",
"- O Nilo tornava o solo fértil com suas cheias. Governo de um **faraó**, visto como um deus (teocracia).",
"- Escrita **hieroglífica**, pirâmides, mumificação, avanços na matemática e na medicina.",
"## Outras civilizações",
"- **China:** papel, pólvora, bússola e a Grande Muralha.",
"- **Índia:** sistema de numeração decimal e o zero (que chegou à Europa via árabes).",
"- **América:** maias (calendário e matemática avançados), astecas (Tenochtitlán, uma das maiores cidades do mundo em 1500) e incas (estradas nos Andes e o quipo para registrar informações).",
"## Sociedades hidráulicas",
"Mesopotâmia, Egito, Índia e China nasceram perto de grandes rios. O controle da água (canais, diques) exigia organização e ajudou a criar Estados centralizados."
],
q:[
["A Revolução Agrícola, no Neolítico, provocou",["o nomadismo.","a sedentarização e o surgimento das primeiras aldeias.","o fim da produção de alimentos.","a invenção da escrita cuneiforme no Paleolítico.","a Revolução Industrial."],1,"Plantar e criar animais permitiu que os grupos se fixassem num lugar."],
["O Código de Hamurábi, da Mesopotâmia, é conhecido por",["ser a primeira Constituição democrática.","ser um dos primeiros conjuntos de leis escritas, baseado na Lei de Talião.","proibir a escravidão.","ter sido escrito em hieróglifos.","ter criado o direito romano."],1,"“Olho por olho, dente por dente”: a punição correspondia ao dano causado."],
["A importância do rio Nilo para o Egito antigo estava",["nas cheias que fertilizavam o solo para a agricultura.","no comércio com a América.","na geração de energia elétrica.","na navegação até a China.","na proteção contra os romanos apenas."],0,"Heródoto disse que o Egito era “uma dádiva do Nilo”."],
["O termo “Pré-história” é criticado porque",["os povos sem escrita também têm história.","a escrita surgiu no Paleolítico.","não existiram seres humanos antes da escrita.","foi inventado pelos egípcios.","se refere apenas à América."],0,"A divisão valoriza a escrita como marco e desvaloriza culturas ágrafas."],
["O sítio da Serra da Capivara, no Piauí, é importante porque",["guarda pinturas rupestres e vestígios muito antigos da presença humana nas Américas.","foi a capital do Império Inca.","abriga pirâmides egípcias.","foi o primeiro quilombo.","é a nascente do rio Amazonas."],0,"É Patrimônio Mundial da Unesco e desafia teorias sobre a chegada humana ao continente."],
["São invenções da China antiga:",["o zero e a democracia.","o papel, a pólvora e a bússola.","a escrita cuneiforme e o Código de Hamurábi.","as pirâmides e os hieróglifos.","a imprensa de Gutenberg e o telescópio."],1,"Essas invenções chegaram à Europa séculos depois e mudaram a navegação e a guerra."],
["Os incas registravam informações usando",["hieróglifos.","o quipo, um sistema de cordas com nós.","placas de argila.","papiro.","a imprensa."],1,"O quipo guardava dados como censos e tributos."],
["As chamadas sociedades hidráulicas tinham em comum",["a localização perto de grandes rios e a necessidade de obras coletivas de irrigação.","o clima polar.","a ausência de governo.","a economia industrial.","a religião monoteísta."],0,"Controlar a água exigia organização, o que favoreceu Estados centralizados."]
]});

["Revolução Agrícola e sedentarização.","Rios e o surgimento das civilizações.","Valorização de culturas não europeias (China, Índia, América)."],
["Associe cada civilização ao seu rio e à sua escrita.","Veja se a questão critica uma visão eurocêntrica.","Pense em causa e consequência: agricultura → cidades → Estado."],

addLesson("hge", {o:3.2, t:"Colonização da América e independências", inc:"A", r:"Conquista espanhola, colonização inglesa e as independências das Américas, incluindo o Haiti.", v:"colonização da américa espanhola independências américa latina haiti enem aula",
c:[
"## A conquista espanhola",
"Os espanhóis conquistaram os **astecas** (Hernán Cortés, 1521) e os **incas** (Francisco Pizarro, 1532), aproveitando rivalidades internas, armas de metal, cavalos e, principalmente, epidemias.",
"- **Encomienda:** indígenas eram “confiados” a um colono, que devia catequizá-los em troca de trabalho.",
"- **Mita:** trabalho obrigatório e rotativo nas minas, como a de **Potosí** (prata), que matou milhares.",
"- Sociedade hierarquizada: **chapetones** (espanhóis, no topo), **criollos** (brancos nascidos na América), mestiços, indígenas e africanos escravizados.",
"## Colonização inglesa",
"- **Colônias do norte:** pequenas propriedades, trabalho livre, mercado interno (colônias de povoamento).",
"- **Colônias do sul:** latifúndios, algodão e tabaco, trabalho escravizado.",
"## Independências",
"- **EUA (1776):** primeira independência das Américas, inspirada no Iluminismo, mas manteve a escravidão.",
"- **Haiti (1804):** a única revolução de escravizados que criou um país. Liderada por **Toussaint Louverture** e Dessalines, aboliu a escravidão e assustou as elites de todo o continente (o “haitianismo”).",
"- **América espanhola (1810–1826):** liderada pelos **criollos**, como **Simón Bolívar** e **San Martín**. Bolívar sonhava com uma América unida, mas a região se fragmentou em vários países.",
"> As independências foram, em geral, feitas pelas elites locais e mantiveram a desigualdade, como no Brasil.",
"## Depois da independência",
"- **Caudilhismo:** líderes militares locais disputando o poder.",
"- **Doutrina Monroe (1823):** “A América para os americanos”, base da influência dos EUA na região.",
"- Dependência econômica: exportação de produtos primários e importação de industrializados."
],
q:[
["A mita, na América espanhola, era",["um imposto sobre o ouro brasileiro.","o trabalho obrigatório e rotativo de indígenas, principalmente nas minas.","uma festa religiosa asteca.","o nome da elite criolla.","um tratado de paz com os incas."],1,"Os espanhóis adaptaram uma instituição inca para explorar as minas como Potosí."],
["A independência do Haiti (1804) foi singular porque",["foi feita pela elite branca.","foi a única revolução de escravizados que resultou em um país independente.","manteve a escravidão.","foi apoiada pela França.","foi a última da América."],1,"Liderada por ex-escravizados, aboliu a escravidão e assustou as elites escravistas das Américas."],
["As independências da América espanhola foram lideradas principalmente pelos",["chapetones.","criollos, brancos nascidos na América.","indígenas.","africanos escravizados.","reis espanhóis."],1,"Os criollos tinham riqueza, mas eram excluídos dos altos cargos, reservados aos chapetones."],
["O projeto de Simón Bolívar era",["manter a América submetida à Espanha.","unir as ex-colônias espanholas em uma grande federação.","anexar o Brasil aos EUA.","restaurar o Império Inca.","criar uma monarquia europeia na América."],1,"O sonho da unidade fracassou e a região se dividiu em vários países."],
["A Doutrina Monroe (1823), resumida em “A América para os americanos”, serviu para",["impedir a influência europeia e ampliar a influência dos EUA no continente.","unir o Brasil a Portugal.","acabar com a escravidão nos EUA.","criar o Mercosul.","dividir a África."],0,"Na prática, justificou intervenções dos EUA na América Latina."],
["As colônias inglesas do norte da América caracterizavam-se por",["latifúndio e escravidão.","pequenas propriedades, trabalho livre e mercado interno.","mineração de prata.","monocultura de cana.","ausência de população europeia."],1,"Eram colônias de povoamento, diferentes das do sul, voltadas à exportação."],
["Um fator decisivo para a conquista dos astecas e incas foi",["a superioridade numérica dos espanhóis.","as epidemias trazidas pelos europeus e as rivalidades entre os povos locais.","a ajuda dos portugueses.","a falta de cidades na América.","o uso de aviões."],1,"A varíola devastou as populações; os espanhóis também se aliaram a povos inimigos dos astecas."],
["O caudilhismo, comum na América Latina após as independências, refere-se",["ao governo de líderes militares locais com poder pessoal.","ao parlamentarismo inglês.","à democracia direta.","ao socialismo.","ao governo dos jesuítas."],0,"Os caudilhos disputavam o poder com exércitos próprios, gerando instabilidade."]
]});
TIP("hge-6",
["Revolução Haitiana.","Exploração do trabalho indígena (mita, encomienda).","Independências feitas pelas elites."],
["Identifique quem liderou cada independência e quem ficou de fora.","Compare com a independência do Brasil.","Relacione Doutrina Monroe à influência dos EUA."],

addLesson("hge", {o:3.5, t:"Imperialismo, neocolonialismo e descolonização", inc:"A", r:"A partilha da África e da Ásia no século XIX e as lutas pela independência no século XX.", v:"imperialismo neocolonialismo partilha da áfrica descolonização enem aula",
c:[
"## O que foi",
"No século XIX, com a **Segunda Revolução Industrial**, as potências europeias (e depois EUA e Japão) disputaram África e Ásia em busca de **matérias-primas**, **mercados consumidores** e lugares para **investir capitais**.",
"## As justificativas",
"- **Darwinismo social:** aplicava de forma distorcida a ideia de seleção natural às sociedades, dizendo que os europeus eram “superiores”.",
"- **“Fardo do homem branco”:** a ideia de que os europeus tinham a “missão” de civilizar os outros povos.",
"> Hoje essas ideias são vistas como racistas e eurocêntricas.",
"## A partilha da África",
"Na **Conferência de Berlim (1884–1885)**, os europeus dividiram a África entre si, **sem nenhum africano presente**. As fronteiras foram traçadas com régua, separando povos aliados e juntando povos rivais, o que está na origem de muitos conflitos atuais.",
"- Exemplo de violência: o **Congo Belga**, propriedade pessoal do rei Leopoldo II, onde milhões morreram na exploração da borracha.",
"## Ásia",
"- **Índia:** colônia britânica, a “joia da coroa”.",
"- **China:** as **Guerras do Ópio** forçaram a China a abrir portos e ceder Hong Kong aos britânicos.",
"## Descolonização (depois de 1945)",
"Com a Europa enfraquecida pela 2ª Guerra e o apoio da ONU à autodeterminação dos povos, as colônias se tornaram independentes.",
"- **Índia (1947):** liderada por **Gandhi**, com a **resistência pacífica** (desobediência civil).",
"- **Argélia (1962):** guerra violenta contra a França.",
"- **Angola e Moçambique (1975):** guerras contra Portugal; a Revolução dos Cravos (1974) apressou as independências.",
"- **Apartheid** na África do Sul (1948–1994): segregação racial oficial; **Nelson Mandela** ficou 27 anos preso e foi eleito presidente em 1994.",
"## Consequências",
"Fronteiras artificiais, guerras civis, dependência econômica e o **neocolonialismo** econômico: países independentes politicamente, mas ainda dependentes de exportar produtos primários."
],
q:[
["A Conferência de Berlim (1884–1885) teve como resultado",["a independência dos países africanos.","a partilha da África entre potências europeias, sem participação africana.","o fim da escravidão no Brasil.","a criação da ONU.","a unificação da Alemanha."],1,"As fronteiras foram definidas pelos interesses europeus, ignorando os povos locais."],
["O darwinismo social foi usado no século XIX para",["defender a igualdade entre os povos.","justificar a dominação imperialista com base na suposta superioridade europeia.","combater o racismo.","explicar a evolução das plantas.","promover a descolonização."],1,"Era uma distorção da teoria de Darwin aplicada às sociedades humanas."],
["A independência da Índia (1947) é associada",["à resistência pacífica e à desobediência civil lideradas por Gandhi.","a uma guerra contra os Estados Unidos.","à Revolução Russa.","à Conferência de Berlim.","ao apartheid."],0,"A Marcha do Sal (1930) é um símbolo da resistência não violenta."],
["Muitos conflitos atuais na África têm relação com",["fronteiras traçadas pelos europeus que ignoraram as divisões étnicas e culturais.","a falta de recursos naturais em todo o continente.","a ausência de povos antes da colonização.","a influência da Guerra do Paraguai.","o feudalismo europeu."],0,"Povos rivais foram unidos e povos aliados separados por fronteiras artificiais."],
["O apartheid na África do Sul foi",["um regime oficial de segregação racial.","um movimento de independência pacífico.","uma política de igualdade entre brancos e negros.","uma guerra contra Portugal.","uma organização da ONU."],0,"Durou de 1948 a 1994; Nelson Mandela se tornou o primeiro presidente negro do país."],
["As Guerras do Ópio, no século XIX, envolveram",["a Grã-Bretanha e a China, que foi obrigada a abrir seus portos.","a França e a Argélia.","Portugal e Angola.","os EUA e o Japão.","a Rússia e a Índia."],0,"A China perdeu e teve de ceder Hong Kong e aceitar o comércio britânico."],
["Uma das motivações econômicas do imperialismo foi",["a busca por matérias-primas e mercados para a produção industrial.","o desejo de acabar com a indústria.","a proteção dos povos africanos.","o fim do capitalismo.","a volta do feudalismo."],0,"A Segunda Revolução Industrial precisava de borracha, petróleo, minérios e consumidores."],
["O termo neocolonialismo, usado depois das independências, indica",["a volta do domínio político direto das metrópoles.","a dependência econômica que continua mesmo com a independência política.","a colonização da América no século XVI.","um tipo de agricultura sustentável.","a união dos países africanos."],1,"Países independentes seguem exportando produtos primários e dependendo de capital externo."]
]});

addLesson("hge", {o:4.5, t:"Mundo contemporâneo: globalização e novos conflitos", inc:"A", r:"Do fim da URSS aos dias de hoje: globalização, terrorismo, Oriente Médio, crises e a ordem multipolar.", v:"nova ordem mundial pós guerra fria resumo enem",
c:[
"## O fim da Guerra Fria",
"- **Perestroika** (reforma econômica) e **Glasnost** (abertura política) de Gorbachev tentaram salvar a URSS.",

],

addLesson("hge", {o:2.5, t:"Renascimento científico e Iluminismo", inc:"M", r:"Galileu, Newton, Descartes, Locke, Montesquieu e Rousseau: as ideias que mudaram o mundo moderno.", v:"iluminismo revolução científica montesquieu rousseau história enem aula",
c:[
"## A Revolução Científica (séculos XVI e XVII)",
"- **Copérnico:** **heliocentrismo** (o Sol no centro), contra o geocentrismo defendido pela Igreja.",
"- **Galileu Galilei:** observou o céu com a luneta e defendeu o heliocentrismo; foi julgado pela Inquisição e obrigado a se retratar.",
"- **Isaac Newton:** lei da gravitação universal. O universo passou a ser visto como uma “máquina” regida por leis matemáticas.",
"- **Método científico:** observação, experimentação e razão (Bacon e Descartes).",
"## O Iluminismo (século XVIII)",
"O “Século das Luzes” defendia a **razão** contra a tradição, a superstição e o poder absoluto dos reis.",
"- **John Locke:** direitos naturais (vida, liberdade e propriedade); o povo pode derrubar um governo que os viola.",
"- **Montesquieu:** **divisão dos três poderes** (Executivo, Legislativo e Judiciário) para evitar o abuso de poder.",
"- **Voltaire:** tolerância religiosa e liberdade de expressão; crítico da Igreja.",
"- **Rousseau:** soberania popular e **vontade geral**; a desigualdade nasce da propriedade privada.",
"- **Diderot e D’Alembert:** a **Enciclopédia**, que reuniu o saber da época.",
"- **Adam Smith:** liberalismo econômico, “mão invisível” do mercado, contra o mercantilismo.",
"## Despotismo esclarecido",
"Reis absolutistas que aplicaram algumas ideias iluministas sem abrir mão do poder. Exemplo: o **Marquês de Pombal**, em Portugal, que expulsou os jesuítas (1759).",
"## Por que isso importa",
"As ideias iluministas inspiraram a Independência dos EUA, a Revolução Francesa, a Inconfidência Mineira e a Conjuração Baiana, e estão na base das constituições democráticas atuais, incluindo a do Brasil.",
"> Crítica atual: o Iluminismo falava em direitos universais, mas muitos iluministas conviveram com a escravidão e a exclusão das mulheres."
],
q:[
["A divisão do poder em Executivo, Legislativo e Judiciário foi proposta por",["Rousseau.","Montesquieu.","Adam Smith.","Galileu.","Luís XIV."],1,"Em “O Espírito das Leis”, Montesquieu defende que o poder freie o próprio poder."],
["Galileu Galilei foi julgado pela Inquisição por defender",["o geocentrismo.","o heliocentrismo.","o absolutismo.","a Reforma Protestante.","o mercantilismo."],1,"A ideia de que a Terra gira em torno do Sol contrariava a interpretação da Igreja."],
["A “mão invisível” do mercado é uma ideia de",["Adam Smith, base do liberalismo econômico.","Karl Marx.","Montesquieu.","Voltaire.","Copérnico."],0,"Smith defendia que a livre concorrência regularia a economia, sem intervenção do Estado."],
["Para John Locke, o governo que não respeita os direitos naturais",["deve ser obedecido sempre.","pode ser derrubado pelo povo.","representa a vontade de Deus.","deve se tornar absolutista.","deve entregar o poder à Igreja."],1,"Esse direito de resistência inspirou a Independência dos EUA."],
["O despotismo esclarecido foi",["a aplicação de algumas ideias iluministas por reis absolutistas, sem abrir mão do poder.","uma revolução popular.","a democracia direta na Grécia.","um tipo de feudalismo.","a separação entre Igreja e ciência."],0,"O Marquês de Pombal, em Portugal, é o exemplo mais cobrado."],
["O Iluminismo valorizava principalmente",["a tradição e a fé acima de tudo.","a razão como caminho para o conhecimento e para a liberdade.","o poder absoluto dos reis.","o fim da ciência.","a servidão."],1,"Por isso se chamou “Século das Luzes”: a luz da razão contra as “trevas” da ignorância."],
["Uma crítica feita hoje ao Iluminismo é que",["ele não defendia a razão.","falava em direitos universais, mas muitos de seus pensadores aceitaram a escravidão e a exclusão das mulheres.","ele foi contra a ciência.","ele defendia o feudalismo.","ele não teve influência política."],1,"O universalismo iluminista, na prática, excluiu muita gente."],
["As ideias iluministas influenciaram no Brasil colonial",["a Inconfidência Mineira e a Conjuração Baiana.","a chegada de Cabral.","a fundação das capitanias.","a criação do Poder Moderador.","a Guerra de Canudos."],0,"Os inconfidentes liam autores franceses e se inspiravam na independência dos EUA."]
]});

addLesson("geo", {o:1.5, t:"Biomas brasileiros e conservação", inc:"A", r:"Amazônia, Cerrado, Caatinga, Mata Atlântica, Pantanal e Pampa: características, ameaças e proteção.", v:"biomas brasileiros amazônia cerrado caatinga enem geografia aula",
c:[
"## Os seis biomas",
"- **Amazônia:** maior floresta tropical do mundo; clima quente e úmido; enorme biodiversidade; solos pobres (a floresta se sustenta da própria matéria orgânica). Ameaças: desmatamento, garimpo, queimadas.",
"- **Cerrado:** savana com árvores de troncos tortos e casca grossa, raízes profundas; “berço das águas”. Ameaça: expansão da soja e do gado (MATOPIBA).",
"- **Caatinga:** único bioma exclusivamente brasileiro; clima semiárido; plantas **xerófilas** (adaptadas à seca), que perdem as folhas na estiagem. Ameaça: desertificação.",
"- **Mata Atlântica:** a mais devastada (resta cerca de 12% da cobertura original); abriga a maior parte da população do país.",
"- **Pantanal:** maior planície alagável do mundo; ciclo de cheias e secas. Ameaças: incêndios (como os de 2020 e 2024) e assoreamento dos rios.",
"- **Pampa:** campos no Rio Grande do Sul; ameaças: pecuária intensiva, monoculturas e arenização.",
"## Conservação",
"- **Unidades de conservação** (SNUC, 2000): de **proteção integral** (parques nacionais, só visitação e pesquisa) e de **uso sustentável** (reservas extrativistas, onde populações tradicionais usam os recursos).",
"- **Código Florestal (2012):** exige **Áreas de Preservação Permanente** (margens de rios, topos de morro) e **Reserva Legal** (percentual da propriedade que deve manter vegetação nativa: 80% na Amazônia).",
"- Terras indígenas e comunidades tradicionais estão entre as áreas mais preservadas.",
"## Queimadas e “ponto de não retorno”",
"Cientistas alertam que, se o desmatamento da Amazônia passar de certo limite, parte da floresta pode virar uma vegetação mais seca, como uma savana. Isso afetaria as chuvas de todo o país, porque a floresta forma os **rios voadores**.",
"> O Cerrado costuma ser esquecido, mas perde vegetação muito rápido e é fundamental para a água do Brasil."
],
q:[
["O único bioma exclusivamente brasileiro é",["a Amazônia.","a Caatinga.","o Pampa.","o Pantanal.","a Mata Atlântica."],1,"A Caatinga só existe no Brasil, principalmente no semiárido nordestino."],
["Plantas xerófilas, típicas da Caatinga, são",["adaptadas a ambientes secos, como cactos que armazenam água.","plantas aquáticas.","árvores de clima frio.","espécies de mangue.","plantas que precisam de chuva o ano inteiro."],0,"Espinhos, folhas pequenas e armazenamento de água reduzem a perda hídrica."],
["O Cerrado é chamado de “berço das águas” porque",["tem muito gelo.","abriga nascentes de importantes bacias hidrográficas brasileiras.","fica no litoral.","é coberto por lagoas salgadas.","recebe chuva o ano todo."],1,"Nascentes do São Francisco, Tocantins-Araguaia e Paraná estão no Cerrado."],
["A Reserva Legal, prevista no Código Florestal, é",["uma área da propriedade rural que deve manter vegetação nativa.","uma prisão ambiental.","uma área para construir casas.","uma reserva de petróleo.","uma terra indígena."],0,"Na Amazônia, 80% da propriedade deve ser mantida com vegetação nativa."],
["Os solos da Amazônia são, em geral,",["muito férteis, por isso a agricultura é fácil.","pobres, e a floresta se mantém pela reciclagem da própria matéria orgânica.","cobertos de gelo.","arenosos e sem vegetação.","iguais aos do Pampa."],1,"Ao desmatar, a fertilidade some rapidamente, e o solo se degrada."],

["A ideia de “ponto de não retorno” da Amazônia significa que",["a floresta sempre se recupera, qualquer que seja o desmatamento.","acima de certo nível de desmatamento, parte da floresta pode se transformar em vegetação mais seca.","a Amazônia vai virar mar.","o desmatamento acabou.","a floresta vai se expandir para o Sul."],1,"Isso reduziria as chuvas no próprio bioma e em outras regiões do país."]

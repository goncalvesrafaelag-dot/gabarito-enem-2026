<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="App de estudos para o ENEM 2026: videoaulas, lições, questões, redação, simulados, provas oficiais e plano de estudos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabarito">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Gabarito ENEM 2026</title>
<meta name="theme-color" content="#F2F5F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EEF1F4; --surface-3:#E2E7EC;
  --ink:#121826; --ink-2:#4A5568; --ink-3:#8590A2; --line:#E2E6EC;
  --brand:#0E7C6B; --brand-2:#12A58C; --brand-soft:#DDF3EE; --brand-ink:#FFFFFF;
  --gold:#E8A300; --fire:#F2622E;
  --lin:#D43D72; --hum:#D9771A; --nat:#15935A; --mat:#2D66DB; --red:#7E47E0; --psi:#0E9484; --geral:#5A6577;
  --good:#16A34A; --good-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2; --warn:#B45309; --warn-soft:#FEF3C7;
  --paper:#FFFFFF; --paper-ink:#1B1B1B;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --shadow-lg:0 20px 50px rgba(16,24,40,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --r:18px; --nav-h:66px; --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D; --surface-3:#253039;
    --ink:#E8EDF3; --ink-2:#A6B1BF; --ink-3:#6E7B8B; --line:#24303A;
    --brand:#2EC4A9; --brand-2:#52D7BE; --brand-soft:#11352F; --brand-ink:#04211C;
    --gold:#F5B82E; --fire:#FF7A45;
    --lin:#F06C98; --hum:#F59E3F; --nat:#35C47C; --mat:#6A98F5; --red:#A882F5; --psi:#2EC4A9; --geral:#8995A6;
    --good:#34D399; --good-soft:#0F2E22; --bad:#F87171; --bad-soft:#3A1717; --warn:#FBBF24; --warn-soft:#3A2A0C;
    --paper:#161C22; --paper-ink:#E6E2D9;
    --shadow:none; --shadow-lg:0 20px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D; --surface-3:#253039;
  --ink:#E8EDF3; --ink-2:#A6B1BF; --ink-3:#6E7B8B; --line:#24303A;
  --brand:#2EC4A9; --brand-2:#52D7BE; --brand-soft:#11352F; --brand-ink:#04211C;
  --gold:#F5B82E; --fire:#FF7A45;
  --lin:#F06C98; --hum:#F59E3F; --nat:#35C47C; --mat:#6A98F5; --red:#A882F5; --psi:#2EC4A9; --geral:#8995A6;
  --good:#34D399; --good-soft:#0F2E22; --bad:#F87171; --bad-soft:#3A1717; --warn:#FBBF24; --warn-soft:#3A2A0C;
  --paper:#161C22; --paper-ink:#E6E2D9;
  --shadow:none; --shadow-lg:0 20px 50px rgba(0,0,0,.5);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
svg:not([width]){width:1.3em;height:1.3em;flex:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(16px * var(--fs));line-height:1.55;margin:0;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,5.4vw,2.05rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.04rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
a{color:var(--brand);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.9rem} .xs{font-size:.78rem}
.center{text-align:center;align-items:center}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-xs{display:flex;flex-direction:column;gap:3px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nowrap{flex-wrap:nowrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.pad-lg{padding:22px}
.sep-top{border-top:1px solid var(--line);padding-top:12px}
ul.clean{display:flex;flex-direction:column;gap:6px}

/* ---------- estrutura ---------- */
.app{min-height:100%}
.side{display:none}
main{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
body.focus main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body.focus .bottom{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--nav-h);font-size:.72rem;font-weight:700;color:var(--ink-3)}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-current="page"]{color:var(--brand)}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .bottom,body.focus .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .nav{display:flex;flex-direction:column;gap:4px}
  .side .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-size:1rem;color:var(--ink-2)}
  .side .nav-btn::before{display:none}
  .side .nav-btn:hover{background:var(--surface-2)}
  .side .nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  main{padding:40px 44px 72px}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;color:var(--ink-3);letter-spacing:.04em}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#12A58C,#0A3F38);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem;font-weight:800;flex:none}
.brand-mark.sm{width:40px;height:40px}
.side-card{margin-top:auto;border-radius:16px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.chip-fire{display:inline-flex;align-items:center;gap:3px;color:var(--fire);font-weight:800;font-size:.85rem}
.chip-fire svg{width:16px;height:16px}

/* ---------- animações ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--brand)) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.1) rotate(3deg)}}
.stagger > *{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
#main > *{animation:rise .3s ease both}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.shake{animation:shake .4s ease both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);transition:transform .12s,background .2s,border-color .2s;text-align:center}
.btn:hover{border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.area{background:var(--c);border-color:var(--c);color:#fff}
.btn.white{background:#fff;border-color:#fff;color:#0A3F38}
.btn.block{width:100%} .btn.big{min-height:56px;font-size:1.05rem;border-radius:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--brand);padding:0 8px;min-height:40px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;border-radius:11px;font-size:.9rem}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);font-weight:800;font-size:.85rem}
.icon-btn:disabled{opacity:.35}
.icon-btn svg{width:21px;height:21px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;font-weight:700;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;min-height:42px;border-radius:11px;font-weight:700;font-size:.9rem;color:var(--ink-2);padding:0 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
input[type=date],input[type=time],input[type=text],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-weight:700}
.checkline{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.checkline input{width:21px;height:21px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--bad-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.A{background:#FFF1C2;color:#7A5200}
.tag.B{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.tag.gold{background:#FFF1C2;color:#7A5200;font-size:.85rem;padding:6px 12px}
:root[data-theme="dark"] .tag.A,:root[data-theme="dark"] .tag.gold{background:#3A2E08;color:#F7CD55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.A,:root:not([data-theme="light"]) .tag.gold{background:#3A2E08;color:#F7CD55}}
.area-lbl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:var(--c)}
.area-lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.note{padding:14px 16px;border-radius:14px;background:var(--surface-2);display:flex;gap:10px;align-items:flex-start;line-height:1.5;flex-wrap:wrap}
.note.ok{background:var(--good-soft);color:var(--ink)}
.note.prova{background:linear-gradient(145deg,#12A58C,#0A3F38);color:#fff;display:block}

/* ---------- progresso ---------- */
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar.thin{height:6px}
.bar > span{display:block;height:100%;width:0;background:var(--c,var(--brand));border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ring{display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)}
.ring .fg{stroke:var(--c,var(--brand));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-weight:700}

/* ---------- cabeçalhos ---------- */
.page-head,.home-head{display:flex;align-items:flex-start;gap:12px}
.page-head p{margin-top:4px}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:10px 0 12px;background:var(--bg)}
.tb-title{font-family:var(--f-display);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Hoje ---------- */
.mission{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:4px}
.tick{flex:none;position:relative;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-3)}
.tick::before{content:"";position:absolute;inset:-8px}
.tick[aria-pressed="true"]{background:var(--c,var(--brand));border-color:var(--c,var(--brand));color:#fff}
.tick svg{width:17px;height:17px}
.task-open{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.task-title{font-weight:700;line-height:1.3}
.task-kind{font-size:.8rem;color:var(--ink-3)}
.task.done .task-title{text-decoration:line-through;color:var(--ink-3)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.stat b{font-family:var(--f-mono);font-size:1.35rem;line-height:1.2}
.stat b small{font-size:.8rem;color:var(--ink-3)}
.stat > span:last-child{font-size:.75rem;color:var(--ink-2);font-weight:600}
.stat .flame{color:var(--fire);animation:flicker 1.6s ease-in-out infinite;display:inline-flex}
.banner{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;border:1px dashed var(--ink-3);background:var(--surface);width:100%}
.banner b{display:block}
.banner span span,.banner .grow > span{font-size:.85rem;color:var(--ink-2)}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.list > * + *{border-top:1px solid var(--line)}
.list-group{display:flex;flex-direction:column;gap:8px}
.row-item,.area-row,.lesson-row,.book,.perigo{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;background:none;border:0;width:100%;min-height:64px;transition:background .15s}
.row-item:hover,.area-row:hover,.lesson-row:hover,.book:hover{background:var(--surface-2)}
.row-item:disabled{cursor:default;background:none}
.ri-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--brand)) 13%,transparent);color:var(--c,var(--brand))}
.ri-ico svg{width:21px;height:21px}
.ri-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ri-txt span{font-size:.85rem;color:var(--ink-2)}
.ri-go{color:var(--ink-3);display:flex}
.subj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.subj-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.subj{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-height:132px;transition:transform .15s,border-color .15s}
.subj:hover{border-color:var(--c)}.subj:active{transform:scale(.97)}
.subj b{font-size:1rem;line-height:1.2}.subj .bar{width:100%;margin-top:auto}
.sj-tag{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:.95rem}
.area-h{display:flex;align-items:center;gap:8px;font-size:1.05rem}.area-h .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ar-letter{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.lr-dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;border:2.5px solid var(--surface-3);font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-3)}
.lesson-row.done .lr-dot{background:var(--c);border-color:var(--c);color:#fff}
.lesson-row.next .lr-dot{border-color:var(--c);color:var(--c);animation:pulse 1.8s infinite}
.lesson-row.next{background:color-mix(in srgb,var(--c) 6%,transparent)}
.lesson-row b{line-height:1.3}
.stars{display:inline-flex;gap:1px} .stars svg{width:15px;height:15px}
.list-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
.list-item.col{flex-direction:column;align-items:flex-start;gap:3px}
.continue{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:20px;border:0;color:#fff;background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 62%,#000))}
.continue .eyebrow,.continue .muted{color:rgba(255,255,255,.8)}
.continue b{font-family:var(--f-display);font-size:1.15rem;line-height:1.2}
.play-dot{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;flex:none}
.play-dot svg{width:22px;height:22px}
.profile{display:flex;gap:14px;align-items:center}

"## Os elementos da comunicação",
"O linguista Roman Jakobson descreveu seis elementos em toda comunicação: **emissor** (quem fala), **receptor** (quem recebe), **mensagem** (o texto em si), **código** (a língua usada), **canal** (o meio físico) e **referente** ou contexto (o assunto). Cada função da linguagem coloca um desses elementos em destaque.",
"## As seis funções",
"- **Referencial ou denotativa (referente):** informa de forma objetiva, em 3ª pessoa. Notícias, textos didáticos e científicos.",
"- **Emotiva ou expressiva (emissor):** mostra sentimentos e opiniões de quem fala, em 1ª pessoa, com interjeições e exclamações. Diários, cartas pessoais, desabafos.",
"- **Conativa ou apelativa (receptor):** quer convencer ou influenciar o leitor. Usa imperativo, vocativo e a 2ª pessoa (você). Propagandas e campanhas.",
"- **Fática (canal):** testa, abre, mantém ou encerra o contato. “Alô?”, “Tá me ouvindo?”, “né?”, “Oi, tudo bem?”.",
"- **Metalinguística (código):** a linguagem fala de si mesma. Dicionários, gramáticas, um poema sobre fazer poesia, um filme sobre cinema.",
"- **Poética (mensagem):** chama atenção para a forma: rima, ritmo, sonoridade, jogos de palavras. Poemas, slogans criativos, letras de música.",
"> Um texto pode ter várias funções, mas o ENEM pede a predominante. Pergunte: qual é o foco principal?",
"## Macete de memorização",
"Referencial → assunto. Emotiva → eu. Conativa → você. Fática → canal. Metalinguística → código. Poética → forma da mensagem."
],
q:[
["No verbete “Saudade: sentimento de falta de algo ou alguém distante”, predomina a função",["emotiva","poética","metalinguística","fática","conativa"],2,"O verbete usa a língua para explicar uma palavra da própria língua: o código explicando o código."],
["“Não perca! Só hoje, todos os tênis com 50% de desconto. Corra!” A função predominante é a",["referencial","conativa","emotiva","fática","metalinguística"],1,"O foco é convencer o leitor a agir. Os imperativos “não perca” e “corra” são marcas da função conativa."],
["Em uma ligação, alguém repete: “Alô? Alô? Está me ouvindo? A ligação caiu?”. Predomina a função",["fática","poética","referencial","emotiva","conativa"],0,"As falas servem para testar o canal de comunicação, sem transmitir conteúdo novo."],
["Em uma página de diário: “Hoje me senti tão sozinho... queria que alguém me entendesse.” A função predominante é a",["referencial","metalinguística","emotiva","fática","conativa"],2,"Primeira pessoa e expressão de sentimentos de quem escreve caracterizam a função emotiva."]
]},
{t:"Variação linguística", inc:"A", r:"A língua muda conforme a região, o grupo social, a situação e a época. O ENEM combate o preconceito linguístico.", v:"variação linguística enem aula",
c:[
"## A ideia central",
"Não existe um único português. A língua varia, e todas as variedades têm lógica e regras próprias. O ENEM cobra a ideia de **adequação**: cada situação pede um registro. O conceito de “certo e errado” absoluto dá lugar a “adequado ou inadequado ao contexto”.",
"## Os tipos de variação",
"- **Diatópica ou regional:** muda de lugar para lugar. Mandioca, aipim ou macaxeira; sotaques; “tu” e “você”.",
"- **Diastrática ou social:** muda conforme o grupo: idade, profissão, classe social, comunidade. Gírias de jovens e jargões médicos ou jurídicos.",
"- **Diafásica ou situacional:** muda conforme a situação. Falamos diferente numa entrevista de emprego e numa conversa com amigos.",
"- **Histórica ou diacrônica:** muda com o tempo. “Vossa mercê” virou “vosmecê”, “você” e “cê”. Palavras como “farmácia” já foram escritas “pharmacia”.",
"## Norma-padrão e preconceito linguístico",
"A norma-padrão é a referência usada em textos formais, documentos, na escola e na redação do ENEM. Ela é importante, mas não é a única forma válida de falar. **Preconceito linguístico** é discriminar alguém pelo modo como fala, geralmente associado a região ou classe social. O linguista Marcos Bagno é referência nesse debate.",
"> Na prova, desconfie de alternativas que chamem uma variedade de “errada”, “inferior” ou “pobre”. O ENEM valoriza a diversidade linguística.",
"## Oralidade x escrita",
"A fala tem repetições, marcadores (né, tipo, então) e frases incompletas. É uma característica da modalidade, não um defeito. A escrita formal tende a ser mais planejada."
],
q:[
["Um poema reproduz a fala de um vaqueiro nordestino, com palavras como “oxente” e “mode” (por causa de). O uso dessa linguagem no poema tem a função de",["mostrar que o falante não domina a língua portuguesa.","valorizar a identidade cultural e regional do personagem.","ensinar a norma-padrão ao leitor.","criticar o modo de falar do Nordeste.","dificultar a leitura do texto."],1,"A variedade regional dá autenticidade e valoriza a cultura do personagem. Chamá-la de erro seria preconceito linguístico."],
["Um jovem diz ao amigo “Mano, a festa foi top!” e, na entrevista de emprego, “A experiência foi muito positiva”. Essa mudança de registro é um exemplo de variação",["diatópica","histórica","diafásica","diacrônica","fonológica"],2,"A mudança acontece por causa da situação de comunicação (informal x formal): variação diafásica."],
["Um médico escreve no prontuário “paciente apresenta cefaleia e dispneia”. Esse vocabulário técnico de um grupo profissional é um exemplo de variação",["diastrática","diatópica","histórica","diafásica","regional"],0,"Jargões de grupos profissionais ou sociais são variação diastrática."],
["Sobre o preconceito linguístico, é correto afirmar que ele",["é necessário para preservar a língua.","atinge apenas estrangeiros.","discrimina pessoas pelo modo de falar, muitas vezes ligado à origem e à classe social.","só acontece na escrita.","deixou de existir com a internet."],2,"O preconceito linguístico é uma forma de discriminação social que desvaloriza variedades populares e regionais."]
]},
{t:"Figuras de linguagem", inc:"M", r:"Recursos expressivos que criam efeitos de sentido: metáfora, metonímia, ironia, antítese e outras.", v:"figuras de linguagem enem aula",
c:[
"## Sentido denotativo e conotativo",
"**Denotação** é o sentido literal, de dicionário. **Conotação** é o sentido figurado, que depende do contexto. As figuras de linguagem usam a conotação para criar efeitos de sentido: emoção, humor, crítica, ênfase.",
"## Figuras de palavra",
"- **Metáfora:** comparação sem conectivo. “Aquele menino é uma fera no xadrez.”",
"- **Comparação:** usa conectivo (como, feito, tal qual). “Corria como um raio.”",
"- **Metonímia:** troca de um termo por outro próximo: autor pela obra (“li Machado”), marca pelo produto (“comprei um Bombril”), parte pelo todo (“sem teto”).",
"- **Catacrese:** metáfora já incorporada ao uso por falta de palavra própria: pé da mesa, braço da cadeira.",
"## Figuras de pensamento",
"- **Ironia:** dizer o contrário do que se pensa, com intenção crítica ou humorística. “Que belo trabalho, está tudo errado!”",
"- **Hipérbole:** exagero intencional. “Já te falei um milhão de vezes.”",
"- **Eufemismo:** suaviza algo desagradável. “Ele partiu desta para melhor.”",
"- **Antítese:** ideias opostas lado a lado. “Riso e choro na mesma festa.”",
"- **Paradoxo:** ideias opostas que parecem absurdas juntas. “Amor é fogo que arde sem se ver.” (Camões)",
"- **Prosopopeia ou personificação:** dá ações humanas a seres inanimados. “O vento sussurrava segredos.”",
"- **Gradação:** ideias em sequência crescente ou decrescente.",
"## Figuras de som e de construção",
"- **Aliteração:** repetição de consoantes. **Assonância:** repetição de vogais.",
"- **Onomatopeia:** imita sons (tic-tac, bum).",
"- **Anáfora:** repetição da mesma palavra no início de versos ou frases.",
"- **Sinestesia:** mistura de sentidos. “Um cheiro doce e quente.”",
"> O ENEM raramente pede só o nome da figura. Ele pergunta o efeito que ela produz no texto."
],
q:[
["Na frase “Esse bairro não dorme nunca”, a figura de linguagem predominante é a",["metonímia","prosopopeia","antítese","onomatopeia","catacrese"],1,"O bairro recebe uma ação humana (dormir): personificação ou prosopopeia. Há também um tom hiperbólico."],
["Em “Ela bebeu dois copos de água”, a expressão “copos” no lugar do líquido é exemplo de",["metáfora","metonímia","eufemismo","hipérbole","ironia"],1,"Troca-se o conteúdo (água) pelo continente (copo): metonímia."],
["Um aluno chega atrasado pela terceira vez e o professor diz: “Que pontualidade admirável!”. O efeito de sentido é produzido pela",["hipérbole","antítese","ironia","gradação","sinestesia"],2,"O professor diz o contrário do que pensa para criticar: ironia."],
["O verso “Estou cego e vejo” apresenta",["paradoxo","comparação","onomatopeia","eufemismo","catacrese"],0,"Afirmações contraditórias unidas numa mesma ideia formam um paradoxo."]
]},
{t:"Coesão, coerência e conectivos", inc:"M", r:"Como as partes do texto se ligam: conectivos, retomadas e lógica entre as ideias.", v:"coesão e coerência conectivos enem aula",
c:[
"## Coesão e coerência",
"**Coesão** são as ligações visíveis entre palavras, frases e parágrafos: conectivos, pronomes, sinônimos. **Coerência** é a lógica do texto: as ideias não se contradizem e fazem sentido para o leitor. Um texto pode ter conectivos e mesmo assim ser incoerente.",
"## Coesão referencial: retomar sem repetir",
"- **Pronomes:** “Maria chegou. Ela estava cansada.”",
"- **Sinônimos e hiperônimos:** “O cachorro latiu. O animal estava assustado.”",
"- **Expressões resumitivas:** “Esse cenário”, “tal situação”, “essa conjuntura”.",
"- **Elipse:** omissão de um termo fácil de recuperar. “Cheguei cedo; (eu) saí tarde.”",
"- **Anáfora** retoma algo já dito; **catáfora** antecipa algo que ainda vai ser dito.",
"## Coesão sequencial: os conectivos e seus sentidos",
"- **Adição:** e, além disso, ademais, também, não só... mas também.",
"- **Oposição (adversativa):** mas, porém, contudo, todavia, entretanto, no entanto.",
"- **Concessão:** embora, ainda que, mesmo que, apesar de. Admite uma ideia contrária sem anular a principal.",
"- **Causa:** porque, pois, visto que, já que, uma vez que.",
"- **Consequência:** tão... que, de modo que, por isso, consequentemente.",
"- **Conclusão:** portanto, logo, assim, dessa forma.",
"- **Condição:** se, caso, desde que.",
"- **Finalidade:** para que, a fim de que.",
"- **Tempo:** quando, enquanto, assim que, logo que.",
"> Pegadinha comum: a questão troca um conectivo por outro e pergunta se o sentido se mantém. Troque “mas” por “embora” e veja: a estrutura da frase muda!",
"## Pontuação com sentido",
"Aspas indicam citação ou ironia. Reticências indicam hesitação ou suspense. Os dois-pontos anunciam uma explicação ou enumeração. A vírgula pode mudar o sentido: “Não, espere” e “Não espere” dizem coisas diferentes."
],
q:[
["Em “Embora estivesse cansado, terminou o trabalho”, a palavra “embora” expressa",["causa","concessão","conclusão","finalidade","tempo"],1,"“Embora” admite um fato contrário (o cansaço) que não impede o fato principal: concessão."],
["“Choveu muito durante a semana; ______, o jogo foi adiado.” O conectivo que completa a frase com sentido de conclusão ou consequência é",["porém","embora","portanto","contudo","mesmo que"],2,"O adiamento é consequência da chuva: “portanto” estabelece essa relação."],
["Em “O Brasil tem grande biodiversidade. Essa riqueza, porém, está ameaçada”, a expressão “Essa riqueza” é um recurso de",["coesão referencial, retomando “grande biodiversidade”.","coesão sequencial de adição.","incoerência, pois muda de assunto.","catáfora, pois antecipa uma ideia.","ironia, pois diz o contrário."],0,"“Essa riqueza” retoma o termo anterior sem repeti-lo: coesão referencial por expressão resumitiva."],
["Assinale a frase em que o conectivo indica finalidade.",["Saiu cedo porque tinha prova.","Estudou tanto que passou.","Estudou para que pudesse passar.","Se estudar, vai passar.","Estudou, mas não passou."],2,"“Para que” indica o objetivo da ação. As outras indicam causa, consequência, condição e oposição."]
]},
{t:"Intertextualidade", inc:"M", r:"Quando um texto conversa com outro: paródia, paráfrase, citação, alusão.", v:"intertextualidade paródia paráfrase enem aula",
c:[
"## O que é",
"Intertextualidade é o diálogo entre textos. Um texto retoma outro já conhecido para concordar, homenagear, criticar ou fazer humor. Para perceber, o leitor precisa reconhecer o texto de origem, por isso o ENEM usa obras muito famosas.",
"## Tipos principais",
"- **Paródia:** retoma um texto mudando o sentido, com humor, ironia ou crítica. É muito usada em memes e propagandas.",
"- **Paráfrase:** reescreve um texto com outras palavras, mantendo a ideia original.",
"- **Citação:** reproduz trechos de outro texto, entre aspas e com indicação do autor.",
"- **Alusão:** referência indireta a uma obra, personagem ou fato conhecido.",
"- **Epígrafe:** trecho de outra obra colocado no início de um livro ou capítulo.",
"- **Pastiche:** imitação do estilo de um autor ou época.",
"## O texto mais parodiado do Brasil",
"A “Canção do Exílio”, de Gonçalves Dias (1843), com os versos sobre palmeiras e o sabiá, foi retomada por Oswald de Andrade, Murilo Mendes, Drummond e inúmeros memes. Também aparecem com frequência “No meio do caminho” (Drummond), o Hino Nacional e pinturas como a Mona Lisa e o Abaporu.",
"> Para identificar paródia ou paráfrase, compare o sentido: se ele se inverte ou ganha crítica e humor, é paródia. Se continua igual, é paráfrase."
],
q:[
["Uma propaganda de academia mostra a Mona Lisa com braços musculosos e a frase “Até a arte precisa de um upgrade”. A relação com a obra original é de",["paráfrase","paródia","citação literal","epígrafe","plágio"],1,"A obra é retomada com humor e mudança de sentido para vender um serviço: paródia."],
["Um aluno reescreve um poema com suas próprias palavras, preservando fielmente o sentido original. Ele produziu uma",["paródia","alusão","paráfrase","sátira","epígrafe"],2,"Manter o sentido com outras palavras caracteriza a paráfrase."],
["Na frase “Aquela prova foi meu Waterloo”, há uma referência indireta à derrota de Napoleão. O recurso é a",["epígrafe","citação","alusão","paráfrase","onomatopeia"],2,"A alusão faz referência indireta a um fato conhecido (a derrota decisiva de Napoleão em Waterloo) para sugerir um fracasso."],
["O poema “Canção do Exílio”, de Gonçalves Dias, é frequentemente retomado em outros textos porque",["foi escrito em língua estrangeira.","é pouco conhecido e precisa ser divulgado.","é um texto canônico, facilmente reconhecido pelos leitores brasileiros.","não possui rimas.","foi proibido durante o Império."],2,"A intertextualidade depende do reconhecimento. Textos muito conhecidos, como a Canção do Exílio, funcionam bem como base de paródias."]
]}
]});

{t:"Quinhentismo, Barroco e Arcadismo", inc:"B", r:"A literatura do Brasil colonial: da carta de Caminha à Inconfidência Mineira.", v:"quinhentismo barroco arcadismo enem aula",
c:[
"## Quinhentismo (século XVI)",
"São textos sobre o Brasil escritos por europeus, e não propriamente literatura brasileira. Há dois grupos:",
"- **Literatura de informação:** a Carta de Pero Vaz de Caminha (1500) descreve a terra e os indígenas com visão exótica e interesse econômico (“em se plantando, tudo dá”).",
"- **Literatura de catequese:** textos dos jesuítas, como o Padre José de Anchieta, para converter os indígenas ao cristianismo.",
"## Barroco (século XVII)",
"Reflete a tensão entre a fé religiosa e os prazeres do mundo, influência da Contrarreforma. Usa antíteses, paradoxos e linguagem rebuscada.",
"- **Cultismo:** jogo de palavras e imagens rebuscadas.",
"- **Conceptismo:** jogo de ideias e raciocínios complexos.",
"- **Gregório de Matos**, o “Boca do Inferno”: poesia satírica que critica a sociedade baiana, além de poesia lírica e religiosa.",
"- **Padre Antônio Vieira:** sermões com argumentação brilhante, como o Sermão da Sexagésima.",
"## Arcadismo (século XVIII)",
"Reação ao exagero barroco, inspirada no Iluminismo e nos clássicos. Busca simplicidade e natureza idealizada.",
"- **Temas:** bucolismo (vida no campo), fugere urbem (fugir da cidade), carpe diem (aproveitar o dia), locus amoenus (lugar ameno).",
"- Poetas usam pseudônimos de pastores. Tomás Antônio Gonzaga escreveu “Marília de Dirceu”; Cláudio Manuel da Costa e Basílio da Gama (“O Uraguai”) também se destacam.",
"- Vários árcades participaram da **Inconfidência Mineira** (1789).",
"> Macete: Barroco = conflito e exagero. Arcadismo = simplicidade e campo."
],
q:[
["Um poema cheio de antíteses como “luz e sombra”, “pecado e perdão”, marcado pelo conflito entre fé e prazer, pertence ao",["Arcadismo","Barroco","Quinhentismo","Romantismo","Parnasianismo"],1,"O dualismo entre o espiritual e o material, expresso por antíteses e paradoxos, é a marca do Barroco."],
["A valorização da vida simples no campo, a fuga da cidade e pastores idealizados são características do",["Barroco","Modernismo","Arcadismo","Simbolismo","Realismo"],2,"Bucolismo e fugere urbem são temas centrais do Arcadismo."],
["A Carta de Pero Vaz de Caminha pertence à literatura",["de catequese","de informação","barroca","romântica","árcade"],1,"A carta informa ao rei de Portugal sobre a terra encontrada: é literatura de informação do Quinhentismo."],
["Gregório de Matos ficou conhecido como “Boca do Inferno” por causa de",["seus sermões religiosos.","sua poesia satírica, que criticava a sociedade da Bahia.","sua participação na Inconfidência Mineira.","seus romances indianistas.","sua defesa do Parnasianismo."],1,"Sua poesia satírica atacava com ironia autoridades, clero e costumes da Bahia colonial."]
]},
{t:"Romantismo", inc:"M", r:"Sentimentalismo, nacionalismo e as três gerações da poesia romântica, além da prosa de José de Alencar.", v:"romantismo brasileiro gerações enem aula",
c:[
"## Contexto",
"O Romantismo brasileiro começa em 1836, com “Suspiros Poéticos e Saudades”, de Gonçalves de Magalhães. Após a Independência (1822), havia desejo de construir uma **identidade nacional**. As marcas gerais são a subjetividade, o sentimentalismo, a idealização (da mulher, do amor, da pátria, do indígena) e a liberdade formal.",
"## As três gerações da poesia",
"- **1ª geração, nacionalista e indianista:** exalta a natureza e o indígena como herói nacional. **Gonçalves Dias**: “Canção do Exílio” e “I-Juca-Pirama”.",
"- **2ª geração, ultrarromântica ou “mal do século”:** pessimismo, tédio, obsessão pela morte, amor impossível. **Álvares de Azevedo** (“Lira dos Vinte Anos”), Casimiro de Abreu, Junqueira Freire.",
"- **3ª geração, condoreira ou social:** poesia engajada, de tom grandioso, contra a escravidão. **Castro Alves**, o “poeta dos escravos”: “O Navio Negreiro” e “Vozes d’África”.",
"## A prosa romântica",
"- **José de Alencar** quis retratar todo o Brasil. Romances indianistas (“O Guarani”, “Iracema”, “Ubirajara”), urbanos (“Senhora”, “Lucíola”), regionalistas (“O Sertanejo”) e históricos.",
"- **Joaquim Manuel de Macedo:** “A Moreninha” (1844), romance urbano de costumes.",
"- **Manuel Antônio de Almeida:** “Memórias de um Sargento de Milícias”, que retrata as camadas populares com humor e antecipa traços realistas.",
"> No ENEM, é comum comparar o indígena idealizado do Romantismo com a visão crítica do Modernismo ou com a literatura indígena contemporânea."
],
q:[
["Poemas marcados pelo pessimismo, pelo tédio e pela atração pela morte caracterizam a",["primeira geração romântica","segunda geração romântica (ultrarromantismo)","terceira geração romântica","poesia árcade","poesia parnasiana"],1,"O “mal do século” é típico da segunda geração, representada por Álvares de Azevedo."],
["Castro Alves é o principal nome da poesia romântica",["indianista","ultrarromântica","condoreira, de caráter social e abolicionista","parnasiana","simbolista"],2,"Castro Alves denunciou a escravidão em poemas como “O Navio Negreiro”, na geração condoreira."],
["Em “Iracema”, José de Alencar representa a indígena como heroína bela e pura, símbolo da formação do Brasil. Essa representação revela",["o realismo crítico do autor.","a idealização romântica do indígena como símbolo nacional.","a denúncia do extermínio indígena.","a influência do Modernismo.","o determinismo naturalista."],1,"O indianismo romântico idealiza o indígena como herói e símbolo da nação, sem mostrar a violência da colonização."],
["O marco inicial do Romantismo no Brasil é a publicação, em 1836, de",["“Memórias Póstumas de Brás Cubas”","“Suspiros Poéticos e Saudades”","“Os Sertões”","“Marília de Dirceu”","“Macunaíma”"],1,"Gonçalves de Magalhães publicou “Suspiros Poéticos e Saudades” em 1836, marco inicial do movimento."]
]},
{t:"Realismo, Naturalismo, Parnasianismo e Simbolismo", inc:"M", r:"A literatura do fim do século XIX: Machado de Assis, o determinismo naturalista, a arte pela arte e a musicalidade simbolista.", v:"realismo naturalismo machado de assis enem aula",
c:[
"## Realismo (a partir de 1881)",
"Reage à idealização romântica e retrata a sociedade de forma crítica e objetiva. O marco é “Memórias Póstumas de Brás Cubas” (1881), de **Machado de Assis**.",
"- **Machado de Assis:** ironia fina, pessimismo, análise psicológica, crítica à elite do Rio de Janeiro e diálogo direto com o leitor. Obras: “Memórias Póstumas de Brás Cubas” (narrador defunto), “Dom Casmurro” (a dúvida sobre a traição de Capitu), “Quincas Borba” (“ao vencedor, as batatas”) e contos como “O Alienista”.",
"## Naturalismo",
"É um Realismo mais radical, influenciado pela ciência do século XIX (Darwin, positivismo).",
"- **Determinismo:** o comportamento é determinado pelo meio, pela raça e pelo momento histórico (teorias hoje consideradas racistas e superadas).",
"- **Zoomorfização:** personagens descritos como animais. Instintos, sexualidade e patologias ganham destaque.",
"- **Aluísio Azevedo**, “O Cortiço” (1890): o próprio cortiço funciona como personagem que molda as pessoas.",
"## Parnasianismo (poesia)",
"“Arte pela arte”: perfeição formal, vocabulário culto, rimas ricas, preferência pelo soneto e pela objetividade. **Olavo Bilac** (“Profissão de fé”), Raimundo Correia e Alberto de Oliveira.",
"## Simbolismo (poesia)",
"Reação ao materialismo: espiritualidade, mistério, subjetividade, musicalidade (aliterações, assonâncias) e sinestesias. **Cruz e Sousa** (“Broquéis”, 1893), o “Cisne Negro”, e **Alphonsus de Guimaraens**.",
"> Resumindo: Realismo critica a sociedade; Naturalismo explica o ser humano pelo meio e pela biologia; Parnasianismo busca a forma perfeita; Simbolismo busca o espiritual e o musical."
],
q:[
["Um romance em que o narrador, já morto, conta sua vida com ironia e conversa com o leitor é",["“O Cortiço”","“Memórias Póstumas de Brás Cubas”","“Iracema”","“Vidas Secas”","“O Guarani”"],1,"Brás Cubas é o “defunto autor” de Machado de Assis, obra que inaugura o Realismo no Brasil."],
["Em “O Cortiço”, as personagens agem movidas pelo meio em que vivem e são comparadas a animais. Essas características são do",["Romantismo","Simbolismo","Naturalismo","Arcadismo","Modernismo"],2,"Determinismo e zoomorfização são as marcas do Naturalismo de Aluísio Azevedo."],
["Um soneto com rimas ricas, vocabulário raro e preocupação com a forma perfeita, sem expressar emoções intensas, é típico do",["Parnasianismo","Simbolismo","Ultrarromantismo","Barroco","Modernismo"],0,"O culto à forma e o lema “arte pela arte” definem o Parnasianismo."],
["Versos musicais, com aliterações, sinestesias e temas espirituais e misteriosos, caracterizam o",["Realismo","Simbolismo","Naturalismo","Arcadismo","Quinhentismo"],1,"Musicalidade, sinestesia e espiritualidade são marcas do Simbolismo, de Cruz e Sousa."]
]},
{t:"Pré-Modernismo", inc:"M", r:"1902 a 1922: a literatura que denunciou o Brasil real, antes da Semana de Arte Moderna.", v:"pré-modernismo euclides da cunha lima barreto enem aula",
c:[
"## O que foi",
"Não é uma escola literária, mas um período de transição (1902–1922). Os autores mantêm parte da linguagem tradicional, mas trazem temas novos: a **denúncia social** e o retrato de um Brasil pobre, sertanejo, suburbano e esquecido pelas elites.",
"## Autores e obras",
"- **Euclides da Cunha**, “Os Sertões” (1902): relato da Guerra de Canudos (1896–97), dividido em A Terra, O Homem e A Luta. Denuncia o massacre do povo de Antônio Conselheiro pelo Exército. Frase famosa: “O sertanejo é, antes de tudo, um forte”.",
"- **Lima Barreto**, “Triste Fim de Policarpo Quaresma” (1915): critica o nacionalismo exagerado e ingênuo, a burocracia e o autoritarismo do governo Floriano Peixoto. Denuncia o racismo e retrata o subúrbio carioca com linguagem simples.",
"- **Monteiro Lobato**, “Urupês”: cria o Jeca Tatu, caipira retratado como preguiçoso. Mais tarde, Lobato atribui a situação do Jeca à falta de saúde e saneamento.",
"- **Augusto dos Anjos**, “Eu” (1912): poesia com vocabulário científico, pessimismo e temas mórbidos (morte, decomposição).",
"- **Graça Aranha**, “Canaã”: aborda a imigração alemã no Espírito Santo.",
"> Ideia-chave: o Pré-Modernismo mostra o Brasil que a República oficial escondia: sertão, subúrbio, pobreza e racismo."
],
q:[
["“Os Sertões”, de Euclides da Cunha, tem como tema central",["a vida da elite cafeeira paulista.","a Guerra de Canudos e o massacre dos sertanejos.","a Semana de Arte Moderna.","a chegada da família real ao Brasil.","a imigração italiana."],1,"A obra narra e analisa o conflito de Canudos, denunciando a violência do Exército contra o arraial."],
["Em “Triste Fim de Policarpo Quaresma”, Lima Barreto critica",["o nacionalismo ufanista e ingênuo e o autoritarismo do governo.","a idealização do indígena.","o movimento modernista.","a vida no campo idealizada.","a perfeição formal da poesia."],0,"Policarpo é um patriota ingênuo esmagado pela realidade política. O romance critica o ufanismo e o autoritarismo do governo Floriano Peixoto."],
["Uma característica comum aos autores pré-modernistas é",["a arte pela arte.","o indianismo idealizado.","a denúncia da realidade social brasileira.","o bucolismo pastoril.","a escrita automática surrealista."],2,"O ponto em comum é a denúncia social e o retrato do Brasil marginalizado."],
["A poesia de Augusto dos Anjos se destaca pelo uso de",["vocabulário científico e temas mórbidos.","linguagem coloquial e humor.","rimas pobres e versos livres.","temas bucólicos e pastoris.","exaltação da pátria."],0,"Augusto dos Anjos usava termos da biologia e da química para tratar de morte e decomposição."]
]},
{t:"Modernismo: 1ª fase (1922–1930)", inc:"A", r:"A Semana de Arte Moderna e a revolução da linguagem: verso livre, humor e nacionalismo crítico.", v:"semana de arte moderna 1922 primeira fase modernismo enem aula",
c:[
"## A Semana de Arte Moderna",
"Em fevereiro de 1922, no Theatro Municipal de São Paulo, artistas apresentaram obras que rompiam com a arte acadêmica. Foi o marco do Modernismo brasileiro, no centenário da Independência. Participaram Mário de Andrade, Oswald de Andrade, Anita Malfatti, Di Cavalcanti, Heitor Villa-Lobos e outros.",
"## Características",
"- **Ruptura com o passado:** crítica ao Parnasianismo (“poesia de dicionário”).",
"- **Verso livre** (sem métrica fixa) e sem rima obrigatória.",
"- **Linguagem coloquial**, com a fala brasileira incorporada à escrita.",
"- **Humor, ironia e poema-piada.**",
"- **Nacionalismo crítico:** valoriza a cultura brasileira sem idealizá-la.",
"## Os manifestos de Oswald de Andrade",
"- **Manifesto da Poesia Pau-Brasil (1924):** poesia de exportação, primitiva e brasileira.",
"- **Manifesto Antropófago (1928):** o Brasil deve “devorar” a cultura estrangeira e transformá-la em algo próprio. “Tupi, or not tupi, that is the question.” A pintura “Abaporu”, de Tarsila do Amaral, inspirou o movimento.",
"## Obras essenciais",
"- **Mário de Andrade:** “Pauliceia Desvairada” (1922) e “Macunaíma” (1928), o “herói sem nenhum caráter”, que mistura lendas, línguas e culturas do Brasil.",
"- **Oswald de Andrade:** “Memórias Sentimentais de João Miramar” e poemas curtos como “Erro de português”.",
"- **Manuel Bandeira:** “Os Sapos” (crítica ao Parnasianismo), “Vou-me embora pra Pasárgada”, “Poética”.",
"> Se aparecer um poema curto, com humor, linguagem do dia a dia e crítica à história oficial do Brasil, pense na 1ª fase modernista."
],
q:[
["A Semana de Arte Moderna aconteceu em",["1822, no Rio de Janeiro","1922, em São Paulo","1930, em Recife","1945, em Belo Horizonte","1888, em Salvador"],1,"Ela ocorreu em fevereiro de 1922, no Theatro Municipal de São Paulo, no centenário da Independência."],
["O Manifesto Antropófago propunha que a cultura brasileira deveria",["copiar fielmente os modelos europeus.","rejeitar toda influência estrangeira.","devorar a cultura estrangeira e transformá-la em algo original.","voltar aos padrões do Parnasianismo.","valorizar apenas a cultura portuguesa."],2,"A antropofagia cultural propõe absorver criticamente o que vem de fora e recriá-lo de forma brasileira."],
["Macunaíma, personagem de Mário de Andrade, é chamado de",["o “último romântico”","o “herói sem nenhum caráter”","o “poeta dos escravos”","o “Boca do Inferno”","o “bruxo do Cosme Velho”"],1,"O subtítulo do livro é “o herói sem nenhum caráter”, sugerindo um Brasil ainda sem identidade definida."],
["São características da primeira fase modernista:",["soneto, rimas ricas e vocabulário raro.","verso livre, linguagem coloquial e humor.","pessimismo e obsessão pela morte.","bucolismo e pseudônimos pastoris.","determinismo e zoomorfização."],1,"A 1ª fase rompeu com a forma tradicional: verso livre, coloquialismo e poema-piada."]
]},
{t:"Modernismo: 2ª fase e Geração de 45", inc:"A", r:"O romance de 30, a poesia de Drummond e Cecília, e a renovação de Clarice, Guimarães Rosa e João Cabral.", v:"segunda fase modernista romance de 30 geração de 45 enem aula",
c:[
"## 2ª fase: a Geração de 30 (1930–1945)",
"Com a linguagem já renovada, os autores aprofundam temas sociais e existenciais. O contexto é a crise de 1929, a Era Vargas e a ascensão do nazifascismo.",
"## O romance regionalista de 30",
"Denuncia a seca, a miséria, o coronelismo e a exploração no Nordeste.",
"- **Graciliano Ramos:** “Vidas Secas” (1938), a família de retirantes Fabiano, Sinhá Vitória, os meninos e a cachorra Baleia; linguagem seca e enxuta; animalização das pessoas pela miséria. Também “São Bernardo” e “Memórias do Cárcere”.",
"- **Rachel de Queiroz:** “O Quinze” (1930), a seca de 1915 no Ceará.",
"- **José Lins do Rego:** “Menino de Engenho”, a decadência dos engenhos de açúcar.",
"- **Jorge Amado:** “Capitães da Areia”, meninos de rua em Salvador.",
"## A poesia de 30",
"- **Carlos Drummond de Andrade:** reflexão existencial, social e irônica. “No meio do caminho tinha uma pedra”, “José” (“E agora, José?”), “A Rosa do Povo”.",
"- **Cecília Meireles:** poesia intimista e musical, sobre o tempo e a efemeridade. “Romanceiro da Inconfidência”.",
"- **Vinicius de Moraes** (sonetos de amor) e **Murilo Mendes**.",
"## 3ª fase: Geração de 45",
"- **Clarice Lispector:** romance introspectivo, fluxo de consciência e **epifania** (um momento de revelação a partir de algo banal). “A Hora da Estrela”, com Macabéa, e “Laços de Família”.",
"- **Guimarães Rosa:** regionalismo universal, com linguagem inventiva e neologismos. “Grande Sertão: Veredas”, com Riobaldo e Diadorim, e “Sagarana”.",
"- **João Cabral de Melo Neto:** poesia objetiva e “engenheira”. “Morte e Vida Severina”, o retirante Severino rumo ao Recife.",
"> Clarice olha para dentro das personagens; Graciliano mostra a miséria de fora; Guimarães Rosa recria a própria língua."
],
q:[
["Um romance sobre uma família de retirantes que foge da seca, com a cachorra Baleia e linguagem enxuta, é",["“O Quinze”","“Vidas Secas”","“Capitães da Areia”","“A Hora da Estrela”","“Menino de Engenho”"],1,"Fabiano, Sinhá Vitória e a cachorra Baleia são personagens de “Vidas Secas”, de Graciliano Ramos."],
["Em contos de Clarice Lispector, personagens comuns vivem um momento súbito de revelação diante de um fato banal. Esse recurso é chamado de",["epifania","determinismo","bucolismo","metalinguagem","ufanismo"],0,"A epifania é a revelação interior súbita, marca da obra de Clarice."],
["“Grande Sertão: Veredas”, de Guimarães Rosa, destaca-se",["pela linguagem inventiva, com neologismos e recriação da fala sertaneja.","pela rigidez formal parnasiana.","pelo indianismo romântico.","pelo uso de vocabulário científico.","pela crítica à Semana de 22."],0,"Guimarães Rosa recria a linguagem e cria palavras novas a partir da fala do sertão."],
["“Morte e Vida Severina”, de João Cabral de Melo Neto, acompanha",["um retirante que migra do sertão para o Recife.","a Guerra de Canudos.","a vida da elite carioca.","meninos de rua em Salvador.","uma família de imigrantes italianos."],0,"O poema dramático acompanha Severino, que desce do sertão rumo ao litoral e encontra a morte por toda parte."]
]},
{t:"Literatura contemporânea e vozes periféricas", inc:"M", r:"Autoras negras, indígenas e periféricas que o ENEM valoriza cada vez mais.", v:"conceição evaristo carolina maria de jesus literatura contemporânea enem",
c:[
"## Por que cai tanto",
"O ENEM valoriza a literatura como espaço de **representatividade** e denúncia. Textos de mulheres negras, indígenas e moradores de periferia mostram pontos de vista historicamente silenciados.",
"## Nomes que você precisa conhecer",
"- **Carolina Maria de Jesus**, “Quarto de Despejo” (1960): diário de uma mulher negra, catadora de papel, na favela do Canindé (SP). Fome, racismo e desigualdade. “A fome é a escravatura atual.”",
"- **Conceição Evaristo:** criou o conceito de **escrevivência**, a escrita que nasce da vivência, especialmente de mulheres negras. Obras: “Ponciá Vicêncio”, “Olhos d’Água”, “Becos da Memória”.",
"- **Ailton Krenak:** pensador indígena, autor de “Ideias para adiar o fim do mundo”. Critica a separação entre humanidade e natureza.",
"- **Daniel Munduruku e Eliane Potiguara:** literatura indígena escrita pelos próprios indígenas.",
"- **Ferreira Gullar:** “Poema Sujo” (1976), escrito no exílio durante a ditadura.",
"- **Poesia marginal (anos 1970):** Cacaso, Chacal, Ana Cristina Cesar. Poemas curtos, irônicos, distribuídos em folhetos mimeografados.",
"- **Literatura periférica e slam:** Ferréz (“Capão Pecado”) e as batalhas de poesia falada nas periferias.",
"- **Paulo Leminski:** poemas curtos, trocadilhos e influência do haicai.",
"> Em questões sobre esses textos, a resposta costuma valorizar a identidade, a memória coletiva e a denúncia de desigualdades."
],
q:[
["O conceito de “escrevivência”, criado por Conceição Evaristo, refere-se à",["escrita baseada em regras gramaticais rígidas.","escrita que nasce das vivências, especialmente de mulheres negras.","tradução de obras estrangeiras.","literatura produzida para crianças.","poesia feita apenas com imagens."],1,"Escrevivência une escrita e vivência, dando voz a experiências coletivas de mulheres negras."],
["“Quarto de Despejo”, de Carolina Maria de Jesus, é importante porque",["narra a vida da elite paulistana.","retrata a favela a partir do olhar de quem vive nela.","é um romance indianista.","inaugurou o Parnasianismo.","foi escrito por um imigrante europeu."],1,"O diário mostra a fome e o racismo da favela do Canindé pela voz da própria moradora."],
["Para Ailton Krenak, um dos problemas da sociedade moderna é",["o excesso de contato com a natureza.","a separação entre humanidade e natureza.","a falta de indústrias na Amazônia.","o uso de línguas indígenas.","a pouca urbanização."],1,"Krenak critica a ideia de uma humanidade separada da Terra, que justifica a destruição ambiental."],
["Poemas curtos e irônicos, distribuídos em folhetos mimeografados nos anos 1970, pertencem à",["poesia marginal","geração de 45","poesia parnasiana","poesia árcade","literatura de catequese"],0,"A “geração mimeógrafo” produzia fora das grandes editoras, com linguagem coloquial e irônica."]
]}
]});

DATA.push({id:"artes", a:"lin", nome:"Artes", lessons:[
{t:"Movimentos artísticos", inc:"M", r:"Reconhecer os estilos pela imagem: do Renascimento às vanguardas do século XX.", v:"vanguardas europeias impressionismo cubismo enem aula",
c:[
"## Como o ENEM cobra",
"A questão mostra uma imagem (pintura, escultura, cartaz) e pede o movimento, a técnica ou o efeito de sentido. Você precisa associar características visuais a cada estilo.",
"## Antes das vanguardas",
"- **Renascimento (séc. XV–XVI):** perspectiva, proporção, equilíbrio, antropocentrismo. Leonardo da Vinci, Michelangelo.",
"- **Barroco:** dramaticidade, contraste de luz e sombra, movimento. No Brasil, Aleijadinho, com as esculturas de Congonhas (MG).",
"- **Impressionismo (final do séc. XIX):** pintura ao ar livre, captação da luz em cada momento, pinceladas curtas e soltas. Monet, Renoir.",
"## As vanguardas europeias (início do séc. XX)",
"- **Expressionismo:** emoções intensas, angústia, cores fortes e formas distorcidas. Munch, “O Grito”.",
"- **Cubismo:** formas geométricas e o objeto visto de vários ângulos ao mesmo tempo. Picasso (“Guernica”), Braque.",
"- **Futurismo:** velocidade, máquinas, tecnologia e a vida urbana moderna.",
"- **Dadaísmo:** antiarte, deboche, acaso, crítica à guerra. Duchamp e o **ready-made** “A Fonte” (um mictório exposto como arte).",
"- **Surrealismo:** sonhos, inconsciente, imagens absurdas, influência de Freud. Salvador Dalí, “A persistência da memória”.",
"- **Abstracionismo:** abandono da figura. Só cores, linhas e formas. Kandinsky, Mondrian.",
"## Arte pop e contemporânea",
"- **Pop Art (anos 1960):** imagens da cultura de massa e da publicidade. Andy Warhol (latas de sopa, Marilyn Monroe).",
"- **Arte conceitual, instalação e performance:** a ideia importa mais que o objeto. O público muitas vezes participa.",
"> Ligação com Psicologia: o Surrealismo foi fortemente influenciado pela psicanálise de Freud e pelo estudo dos sonhos."
],
q:[
["Uma pintura mostra uma figura humana distorcida, com cores fortes e expressão de angústia. Essas características pertencem ao",["Impressionismo","Expressionismo","Renascimento","Arcadismo","Realismo"],1,"Distorção e cores intensas para expressar emoções como angústia caracterizam o Expressionismo, como em “O Grito”."],
["Ao expor um mictório com o título “A Fonte”, Marcel Duchamp questionou",["a técnica da pintura a óleo.","o próprio conceito do que é arte.","a arte indígena.","a perspectiva renascentista.","o uso da cor na pintura."],1,"O ready-made desloca um objeto comum para o museu e questiona o que define uma obra de arte."],
["O Surrealismo, que explorou sonhos e imagens absurdas, sofreu forte influência",["da psicanálise de Freud.","do Iluminismo.","da Revolução Industrial.","do Arcadismo.","do positivismo de Comte."],0,"Os surrealistas buscavam expressar o inconsciente, conceito central da psicanálise freudiana."],
["Uma obra que representa um objeto em formas geométricas, mostrando vários ângulos ao mesmo tempo, pertence ao",["Cubismo","Impressionismo","Barroco","Pop Art","Romantismo"],0,"A fragmentação geométrica e a simultaneidade de pontos de vista definem o Cubismo."]
]},
{t:"Arte brasileira, música e cultura popular", inc:"M", r:"Modernismo nas artes plásticas, arte participativa, música de resistência e patrimônio imaterial.", v:"arte brasileira tarsila portinari tropicália enem aula",
c:[
"## Modernismo nas artes plásticas",
"- **Anita Malfatti:** pintura expressionista (“A Boba”). Sua exposição de 1917 foi duramente criticada por Monteiro Lobato e ajudou a provocar a Semana de 22.",
"- **Tarsila do Amaral:** “Abaporu” (1928), que inspirou a Antropofagia; “Operários” (1933), com temática social.",
"- **Di Cavalcanti:** mulatas, festas populares e cenas urbanas.",
"- **Candido Portinari:** “Retirantes” (1944) e “Café”, com denúncia social da seca e do trabalho no campo.",
"## Arte participativa e contemporânea",
"- **Hélio Oiticica:** os Parangolés, capas para vestir e dançar, com o público como parte da obra.",
"- **Lygia Clark:** os “Bichos”, esculturas articuladas manipuladas pelo público.",
"- **Arte urbana:** grafite como ocupação do espaço público e crítica social. Os Gêmeos e Eduardo Kobra.",
"## Música",
"- **Bossa Nova (fim dos anos 1950):** João Gilberto, Tom Jobim, com harmonias sofisticadas e canto suave.",
"- **Tropicália (1967–68):** Caetano Veloso, Gilberto Gil, Os Mutantes. Mistura do popular e do erudito, do nacional e do estrangeiro, guitarra elétrica e antropofagia musical.",
"- **Canção de protesto na ditadura:** Chico Buarque (“Cálice”, “Apesar de você”) e Geraldo Vandré (“Pra não dizer que não falei das flores”), driblando a censura com metáforas.",
"## Teatro e cultura popular",
"- **Augusto Boal:** Teatro do Oprimido, em que a plateia intervém na cena para discutir opressões sociais.",
"- **Patrimônio imaterial (Iphan):** frevo, samba de roda do Recôncavo Baiano, capoeira, jongo, ofício das baianas de acarajé, bumba meu boi.",
"> O ENEM vê a arte como expressão de identidade e resistência. Ligue sempre a obra ao contexto histórico."
],
q:[
["A pintura “Abaporu” (1928), de Tarsila do Amaral, está diretamente ligada ao",["Movimento Antropofágico","Barroco mineiro","Parnasianismo","Impressionismo francês","Arcadismo"],0,"O quadro, presente de Tarsila para Oswald de Andrade, inspirou o Manifesto Antropófago."],
["Os Parangolés de Hélio Oiticica propunham que",["o público apenas observasse a obra de longe.","o espectador vestisse e movimentasse a obra, participando dela.","a arte fosse exposta só em museus europeus.","a pintura voltasse às regras acadêmicas.","as obras fossem feitas apenas de mármore."],1,"Os Parangolés são capas para vestir e dançar: a obra só se completa com a participação do público."],
["Durante a ditadura militar, compositores como Chico Buarque usavam metáforas e duplo sentido para",["divulgar o governo.","driblar a censura e criticar o regime.","promover a Jovem Guarda.","ensinar gramática.","vender produtos."],1,"As metáforas permitiam criticar a repressão sem que a censura percebesse de imediato. “Cálice” soa como “cale-se”."],
["O Teatro do Oprimido, de Augusto Boal, caracteriza-se por",["a plateia intervir na cena para discutir opressões sociais.","peças encenadas apenas para a elite.","ausência total de diálogo.","textos gregos antigos sem adaptação.","o uso exclusivo de máscaras."],0,"Boal criou técnicas em que o espectador vira “espect-ator” e propõe soluções para conflitos sociais."]
]}
]});

DATA.push({id:"edf", a:"lin", nome:"Educação Física", lessons:[
{t:"Cultura corporal, saúde e sociedade", inc:"M", r:"Jogo, esporte, dança, luta e ginástica como cultura; padrões de beleza, mídia e saúde.", v:"educação física enem cultura corporal aula",
c:[
"## O corpo como cultura",
"No ENEM, a Educação Física não cobra regras de esportes. Ela trata as **práticas corporais** (jogos, esportes, danças, lutas, ginásticas) como produções culturais, com história e significados sociais.",
"## Jogo x esporte",
"- **Jogo:** regras flexíveis, combinadas entre os participantes, foco no prazer e na participação.",
"- **Esporte:** regras oficiais e universais, instituições (federações), competição, busca de rendimento e recordes.",
"- **Esporte-espetáculo:** transformado em produto pela mídia e pelo mercado, com patrocínio e audiência.",
"## Padrões de beleza e mídia",
"A mídia e as redes sociais divulgam um corpo “ideal” magro ou musculoso, muitas vezes inalcançável. Isso pode gerar insatisfação corporal, transtornos alimentares (anorexia, bulimia), uso de anabolizantes e dietas perigosas. O ENEM valoriza a crítica a esses padrões e a diversidade dos corpos.",
"## Saúde e atividade física",
"- **Sedentarismo:** fator de risco para obesidade, diabetes, hipertensão e doenças cardiovasculares.",
"- **Capacidades físicas:** força, resistência, velocidade, flexibilidade, agilidade e coordenação.",
"- **Aeróbico** (longa duração, usa oxigênio: corrida leve, natação) x **anaeróbico** (curto e intenso: musculação, tiro de 100 m).",
"- **Doping:** uso de substâncias proibidas para melhorar o desempenho, com riscos à saúde e à ética esportiva.",
"## Inclusão",
"Esporte paralímpico, adaptações de regras, acessibilidade e o direito de todos ao lazer e às práticas corporais.",
"> Ligação com Psicologia: imagem corporal, autoestima e transtornos alimentares são temas estudados pela psicologia e aparecem na prova."
],
q:[
["Crianças jogam futebol na rua, combinando que o gol só vale de dentro da área e que o time que perder sai. Essa prática é um exemplo de",["esporte de alto rendimento","jogo, com regras flexíveis combinadas entre os participantes","esporte oficial regulado por federação","ginástica competitiva","luta institucionalizada"],1,"As regras são criadas e adaptadas pelos próprios participantes: é jogo, e não esporte institucionalizado."],
["A exposição constante a corpos “perfeitos” nas redes sociais pode contribuir para",["a diminuição dos casos de transtornos alimentares.","a insatisfação corporal e comportamentos de risco à saúde.","o fim do sedentarismo.","a valorização da diversidade corporal.","a melhora automática da autoestima."],1,"Padrões irreais podem gerar insatisfação com o corpo e comportamentos de risco, como dietas extremas e anabolizantes."],
["Uma corrida leve de 40 minutos, que usa predominantemente o oxigênio como fonte de energia, é uma atividade",["anaeróbica","aeróbica","isométrica","de força máxima","de velocidade pura"],1,"Atividades longas e de intensidade moderada são aeróbicas."],
["A transformação do futebol em produto, com transmissões, patrocínios e grandes salários, é chamada de",["esporte-espetáculo","jogo popular","ginástica laboral","esporte de participação","luta tradicional"],0,"A espetacularização transforma o esporte em mercadoria da indústria do entretenimento."]
]}
]});

DATA.push({id:"lem", a:"lin", nome:"Língua Estrangeira", lessons:[
{t:"Inglês para o ENEM", inc:"A", r:"Cinco questões de interpretação. Estratégias para entender o texto sem saber todas as palavras.", v:"inglês enem estratégias de leitura aula",
c:[
"## Como é a prova",
"São **5 questões** de inglês (ou de espanhol, conforme sua escolha na inscrição). Elas não cobram gramática decorada: cobram **interpretação**. Os textos são letras de música, cartuns, anúncios, poemas, trechos de notícias e posts.",
"## Estratégias",
"- **Leia o enunciado em português primeiro.** Ele já dá o tema e o que procurar.",
"- **Skimming:** leitura rápida para captar a ideia geral (título, imagens, primeiras frases).",
"- **Scanning:** procurar uma informação específica (nome, data, número).",
"- **Use os cognatos:** palavras parecidas com o português e de mesmo sentido (important, family, education).",
"- **Não traduza tudo.** Entenda o sentido global e a intenção do texto.",
"## Falsos cognatos: cuidado!",
"- **actually** = na verdade (e não “atualmente”, que é currently)",
"- **pretend** = fingir · **intend** = pretender",
"- **eventually** = finalmente, por fim",
"- **library** = biblioteca · **bookstore** = livraria",
"- **push** = empurrar · **pull** = puxar",
"- **college** = faculdade · **parents** = pais · **relatives** = parentes",
"- **exquisite** = requintado · **sensible** = sensato · **sensitive** = sensível",
"## Palavras que mudam o sentido",
"- **but, however, although** = oposição.",
"- **because, since** = causa. **so, therefore** = conclusão.",
"- **not, never, no longer** = negação. Uma palavra dessas pode inverter a resposta!",
"> Com base em cognatos, título e imagem, você acerta a maioria das questões mesmo sem vocabulário avançado."
],
q:[
["Em “Actually, I don’t like coffee”, a palavra “actually” significa",["atualmente","na verdade","eventualmente","raramente","sempre"],1,"Actually é falso cognato: significa “na verdade”."],
["Um anúncio diz: “Don’t text and drive. That message can wait.” A mensagem principal é",["compre um celular novo.","não envie mensagens enquanto dirige.","dirija mais rápido.","responda mensagens no trânsito.","use aplicativos de mapas."],1,"“Text” como verbo é enviar mensagem de texto: a campanha alerta contra o uso do celular ao volante."],
["“She pretended to be asleep when her mother came in.” A personagem",["pretendia dormir mais tarde.","fingiu estar dormindo.","dormiu profundamente.","acordou a mãe.","pediu para dormir."],1,"Pretend = fingir. A personagem fingiu estar dormindo."],
["Na frase “The book was expensive; however, it was worth it”, a palavra “however” indica",["causa","adição","oposição","tempo","finalidade"],2,"However equivale a “no entanto”: o livro era caro, mas valeu a pena."]
]},
{t:"Espanhol para o ENEM", inc:"A", r:"Cinco questões de interpretação. Atenção aos falsos amigos, os heterossemânticos.", v:"espanhol enem falsos amigos heterossemânticos aula",
c:[
"## Como é a prova",
"Quem escolhe espanhol faz **5 questões** de interpretação. A semelhança com o português ajuda, mas também engana: muitas palavras parecem iguais e têm sentido diferente.",
"## Heterossemânticos (falsos amigos)",
"- **exquisito** = delicioso, requintado",
"- **embarazada** = grávida",
"- **polvo** = poeira, pó (polvo em português é pulpo)",
"- **rato** = momento, instante (rato é ratón)",
"- **oficina** = escritório (oficina é taller)",
"- **borrar** = apagar",
"- **largo** = comprido (largo é ancho)",
"- **apellido** = sobrenome",
"- **cena** = jantar",
"- **pelo** = cabelo",
"- **zurdo** = canhoto",
"- **presunto** = suposto (presunto é jamón)",
"- **salsa** = molho · **vaso** = copo · **aceite** = azeite, óleo",
"## Estruturas úteis",
"- **sin embargo** = no entanto · **aunque** = embora · **además** = além disso",
"- **todavía** = ainda · **ya** = já · **luego** = depois",
"- **muy** antes de adjetivo (muy bueno) e **mucho** antes de substantivo (mucho dinero)",
"> Mesmo parecido com o português, leia com atenção. As questões gostam de explorar justamente os falsos amigos."
],
q:[
["Em “Mi hermana está embarazada de tres meses”, a palavra “embarazada” significa",["envergonhada","grávida","cansada","atrasada","doente"],1,"Embarazada é falso amigo: significa grávida."],
["“La casa estaba llena de polvo.” A casa estava cheia de",["polvos","poeira","pessoas","móveis","flores"],1,"Polvo, em espanhol, é poeira ou pó."],
["Em “Voy a la oficina a las ocho”, a pessoa vai",["à oficina mecânica","ao escritório","à escola","ao hospital","à igreja"],1,"Oficina, em espanhol, significa escritório. Oficina mecânica é “taller”."],
["“Estudió mucho; sin embargo, no aprobó el examen.” A expressão “sin embargo” indica",["causa","adição","oposição","conclusão","tempo"],2,"Sin embargo equivale a “no entanto”: estudou, mas não passou."]
]},
{t:"Tecnologias da comunicação e informação", inc:"M", r:"Linguagem na internet, fake news, algoritmos, memes e letramento digital.", v:"tecnologias da informação e comunicação enem linguagens aula",
c:[
"## Linguagem na era digital",
"As TICs (Tecnologias da Informação e Comunicação) mudaram a forma de ler e escrever. O ENEM cobra gêneros digitais e seus efeitos sociais.",
"- **Hipertexto:** texto com links que permitem uma leitura não linear.",
"- **Multimodalidade:** textos que combinam palavra, imagem, som e vídeo.",
"- **Internetês:** abreviações (vc, tb, blz), emojis, memes. É uma variedade adequada ao contexto informal digital, e não um erro.",
"## Desinformação",
"- **Fake news:** notícias falsas feitas para parecer verdadeiras. Exploram emoções, como medo e indignação, para viralizar.",
"- **Como checar:** veja a fonte, a data e o autor; compare com outros veículos; desconfie de títulos sensacionalistas; use agências de checagem.",
"- **Pós-verdade:** situação em que emoções e crenças pessoais pesam mais que fatos objetivos.",
"## Algoritmos e bolhas",
"As redes sociais usam algoritmos que mostram conteúdos parecidos com o que o usuário já curte. Isso cria **bolhas** (câmaras de eco): a pessoa vê só opiniões que confirmam as suas, o que aumenta a polarização.",
"## Letramento digital",
"É a capacidade de usar a tecnologia de forma crítica: pesquisar, avaliar fontes, proteger dados e se comunicar com responsabilidade. A **LGPD** (Lei Geral de Proteção de Dados, 2018) regula o uso de dados pessoais no Brasil.",
"> Ligação com Psicologia: uso excessivo de redes, ansiedade, comparação social e dependência digital são temas atuais da psicologia e possíveis temas de redação."
],
q:[
["O fenômeno em que o usuário recebe nas redes apenas conteúdos que confirmam suas opiniões é chamado de",["hipertexto","bolha informacional ou câmara de eco","letramento digital","multimodalidade","navegação anônima"],1,"Algoritmos que mostram conteúdos semelhantes criam bolhas que reforçam as crenças do usuário."],
["Uma estratégia eficaz para evitar compartilhar fake news é",["compartilhar logo para avisar os amigos.","confiar em títulos chamativos.","verificar a fonte e comparar com outros veículos confiáveis.","ler apenas o título da matéria.","acreditar em mensagens encaminhadas muitas vezes."],2,"Checar a fonte, a data e o autor e comparar com outros veículos é a forma de verificar uma informação."],
["Um texto on-line com links que levam a outros textos, permitindo uma leitura não linear, é um",["hipertexto","soneto","editorial impresso","telegrama","verbete de papel"],0,"O hipertexto se organiza por links, e o leitor escolhe o próprio caminho de leitura."],
["O uso de abreviações como “vc” e “tb” em conversas por aplicativo deve ser entendido como",["erro grave que prejudica a língua.","variedade adequada ao contexto digital informal.","sinal de analfabetismo.","linguagem proibida por lei.","forma exclusiva da norma-padrão."],1,"O internetês é adequado ao contexto informal. Na redação do ENEM, porém, deve ser evitado."]
]}
]});
